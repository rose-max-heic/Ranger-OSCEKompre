i", "DOKTER: Keluhannya apa, Bu?\nPASIEN: Sudut dalam mata kiri bengkak merah dan nyeri sejak 3 hari, Dok."], ["Berair lama, nanah, demam", "DOKTER: Sebelumnya mata kiri sering berair? Keluar nanah? Demam?\nPASIEN: Sudah berbulan-bulan sering berair. Ada nanah sedikit, demam ringan."], ["Red flag orbita: mata menonjol, sulit digerakkan, kabur", "DOKTER: Mata menonjol, sulit melirik, atau kabur?\nPASIEN: Tidak."], ["Riwayat trauma/sinusitis, DM", "DOKTER: Pernah patah tulang hidung, sinusitis, atau kencing manis?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata dan sudut dalam mata Ibu, termasuk menekan pelan kantung air mata. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus ODS 6/6."], ["Inspeksi kantus medial & kelopak", "→ KE PENGUJI: OS tampak massa hiperemis edema di kantus medial di bawah tendon kantus, ±1,5 cm."], ["Palpasi & tes regurgitasi (tekan sakus lakrimal)", "(Sarung tangan.)\n→ KE PENGUJI: Nyeri tekan (+), hangat; penekanan sakus → keluar sekret purulen dari punctum (regurgitasi +)."], ["Gerak bola mata & proptosis", "→ KE PENGUJI: Gerak bola mata bebas, proptosis (−), konjungtiva bulbi tenang."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Kultur sekret bila ada; CT orbita bila curiga selulitis orbita (di rujukan)."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OS dakriosistitis akut. DD: selulitis preseptal, dakrioadenitis, hordeolum."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Saluran air mata kiri Ibu tersumbat lalu kantungnya terinfeksi. Perlu antibiotik minum, lalu dirujuk ke dokter mata untuk membuka salurannya."], ["Kompres hangat, jangan dipencet keras", "DOKTER: Kompres hangat 3–4 kali sehari."], ["Menulis resep & menyerahkan (antibiotik sistemik)", "→ KE PENGUJI: Amoksisilin-klavulanat 3 × 500 mg 7 hari + analgesik; ini resepnya, dok."], ["Rujuk Sp.M (drainase/DCR) & tanda bahaya", "DOKTER: Ibu saya rujuk ke dokter mata. Kalau bengkak menyebar, mata menonjol, atau kabur, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Amoksisilin-klavulanat tab 500/125 mg No. XXI", "   S 3 dd tab I (habiskan)", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri/demam", "   ———————————— paraf", "Pro: Ny. U., 55 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: AAO/EyeWiki Dacryocystitis] Akut: antibiotik sistemik spektrum S. aureus/streptokokus 7–10 hari + kompres hangat; probing/irigasi dikontraindikasikan saat akut. Definitif DCR oleh Sp.M. Bayi (obstruksi kongenital): pijat Crigler.", "jebakan": ["Hanya antibiotik topikal.", "Melakukan irigasi/probing saat akut.", "Tidak menyingkirkan selulitis orbita."], "soal": [{"station": "Indra-11", "skenario": "Ny. U., 55 tahun, sudut dalam mata kiri bengkak nyeri 3 hari, sudah lama sering berair.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep & rujukan"], "kunci": ["Epifora lama, red flag orbita", "Massa kantus medial, regurgitasi pus", "Dakriosistitis akut", "Amoks-klav + kompres hangat, rujuk DCR"]}, {"station": "Indra-11b", "skenario": "An. Y., 7 tahun, kelopak atas kanan bagian luar bengkak nyeri berbentuk huruf S setelah gondongan.", "tugas": ["**Sebutkan** diagnosis", "**Sebutkan** tatalaksana"], "kunci": ["Dakrioadenitis akut", "Kompres hangat, analgesik, antibiotik bila bakteri, rujuk"]}]}, {"id": "katarak", "no": 12, "nama": "Katarak Senilis (+ Pterigium)", "skdi": "2/3A", "ringkas": {"kunci": "Lansia, kabur PERLAHAN seperti berasap/berkabut, silau, mata tenang tidak nyeri, kadang bisa membaca tanpa kacamata (second sight); DM, steroid. Pterigium: pekerja luar ruang, 'selaput' segitiga dari nasal.", "khas": "Lensa keruh, refleks fundus menurun, PINHOLE TIDAK membaik, SHADOW TEST: imatur (+), matur (−), hipermatur pseudo(+). Pterigium: jaringan fibrovaskular segitiga melewati limbus.", "dd": "Kelainan refraksi (pinhole membaik) • Glaukoma kronis • Retinopati diabetik • Pinguekula (tidak melewati limbus)", "flag": "Nyeri + mata merah + TIO ↑ (katarak fakomorfik/fakolitik) → rujuk segera; pterigium derajat III–IV → rujuk operasi."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. W., 68 tahun, Sukoharjo, petani."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & sifat kabur", "DOKTER: Ada keluhan apa, Pak?\nPASIEN: Mata kanan kabur pelan-pelan setahun ini, Dok, seperti melihat asap."], ["Silau, second sight, nyeri/merah", "DOKTER: Silau kalau kena lampu? Nyeri atau merah?\nPASIEN: Silau, tidak nyeri, tidak merah."], ["Faktor risiko: DM, steroid, trauma, sinar matahari", "DOKTER: Ada gula, minum obat steroid lama, atau pernah terbentur? Sering di bawah terik matahari?\nPASIEN: Ada gula, Dok. Kerja di sawah."], ["Dampak aktivitas", "DOKTER: Mengganggu aktivitas?\nPASIEN: Iya, sulit mengenali wajah orang."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Bapak dengan kartu huruf dan senter. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS + pinhole", "→ KE PENGUJI: Visus OD 2/60, pinhole tidak membaik; OS 6/12, pinhole 6/9."], ["Segmen anterior & lensa", "→ KE PENGUJI: OD lensa keruh keabuan, COA normal, pupil normal. OS lensa keruh sebagian. Konjungtiva tenang."], ["Shadow test (iris shadow) dengan senter 45°", "(Senter disorot dari samping ±45°.)\n→ KE PENGUJI: Shadow test OD (+) → katarak imatur."], ["Refleks fundus (oftalmoskop jarak 30 cm) & TIO palpasi", "→ KE PENGUJI: Refleks fundus OD menurun. TIO ODS N."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: GDS/HbA1c; biometri & USG di Sp.M."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis ODS katarak senilis imatur. DD: kelainan refraksi, retinopati diabetik, glaukoma kronis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan (lensa keruh, terapi operasi)", "DOKTER: Lensa mata Bapak keruh karena usia dan gula darah. Obatnya bukan tetes, tapi operasi mengganti lensa. Operasi aman dan ditanggung BPJS."], ["Rujuk Sp.M & kontrol DM", "DOKTER: Bapak saya rujuk ke dokter mata. Gula darah dikontrol agar operasi aman."], ["Proteksi: kacamata/topi saat di sawah", "DOKTER: Pakai topi lebar dan kacamata hitam saat di sawah."], ["Tanda bahaya: nyeri merah mendadak", "DOKTER: Kalau mata mendadak nyeri dan merah, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["Surat rujukan ke Sp.M: Tn. W., 68 th — ODS katarak senilis imatur, DM tipe 2; mohon evaluasi & tindakan operatif.", "", "— Pterigium (Tn. N., 40 th, nelayan, derajat II) —", "R/ Air mata buatan tetes mata fl. No. I", "   S 4 dd gtt I OD", "   ———————————— paraf"], "catatanObat": "[TAMBAHAN — sumber: PNPK Katarak; Ilyas] Katarak: tidak ada obat tetes yang terbukti, terapi definitif fakoemulsifikasi/SICS + IOL. Pterigium derajat I–IV; meradang → steroid topikal ringan singkat; rujuk bila III–IV/ganggu visus.", "jebakan": ["Lupa pinhole & shadow test.", "Memberi obat tetes 'pelarut katarak'.", "Tidak menanyakan DM."], "soal": [{"station": "Indra-12", "skenario": "Tn. W., 68 tahun, mata kanan kabur perlahan setahun seperti berasap, silau, tidak nyeri, DM.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** visus, pinhole, shadow test", "**Sampaikan** diagnosis", "**Edukasi** & rujuk"], "kunci": ["Kabur perlahan, silau, DM", "Pinhole tidak membaik, shadow +", "Katarak senilis imatur", "Operasi, rujuk Sp.M"]}, {"station": "Indra-12b", "skenario": "Tn. N., 40 tahun, nelayan, 'selaput' merah di sisi hidung mata kanan, sudah melewati limbus 1,5 mm.", "tugas": ["**Sebutkan** diagnosis & derajat", "**Sebutkan** terapi"], "kunci": ["Pterigium derajat II", "Kacamata UV, air mata buatan; rujuk bila III–IV"]}]}, {"id": "oe", "no": 13, "nama": "Otitis Eksterna (+ Otomikosis)", "skdi": "4A", "ringkas": {"kunci": "Nyeri telinga 1–3 hari, sering mengorek telinga/berenang, nyeri saat mengunyah/daun telinga disentuh.", "khas": "NYERI TEKAN TRAGUS & NYERI TARIK AURIKULA (+), MT normal. Sirkumskripta = furunkel 1/3 luar MAE (S. aureus); difusa = MAE edema hiperemis difus (Pseudomonas); otomikosis = gatal, hifa/spora (A. niger hitam, Candida putih).", "dd": "OE difusa vs sirkumskripta • OE maligna (DM, lansia, paresis N VII) • OMA (nyeri tarik −, MT bulging) • Otomikosis • Herpes zoster otikus", "flag": "Pasien DM/lansia dengan nyeri hebat, granulasi, paresis N VII (OE maligna), bengkak meluas ke pipi/leher → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. X., 25 tahun, Solo, ojek daring."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama, telinga mana, onset", "DOKTER: Ada keluhan apa, Mas?\nPASIEN: Telinga kanan nyeri sejak 2 hari, Dok."], ["Karakter nyeri (mengunyah, disentuh), gatal, cairan, pendengaran", "DOKTER: Nyeri bertambah saat mengunyah atau daun telinga disentuh? Gatal? Keluar cairan? Pendengaran turun?\nPASIEN: Iya, sakit kalau kuping dipegang dan saat mengunyah. Tidak keluar cairan, pendengaran agak penuh."], ["Faktor risiko: mengorek, berenang, cotton bud", "DOKTER: Sering mengorek telinga atau berenang?\nPASIEN: Sering korek pakai cotton bud, Dok."], ["Demam, batuk-pilek (OMA), riwayat telinga berair (OMSK)", "DOKTER: Demam? Batuk pilek? Pernah telinga berair?\nPASIEN: Tidak."], ["DM & wajah mencong (OE maligna)", "DOKTER: Ada kencing manis? Wajah terasa mencong?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa telinga Mas memakai lampu kepala dan otoskop. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Lampu kepala, posisi duduk berhadapan", "(Lampu kepala fokus ±30 cm; lutut pemeriksa di samping lutut pasien.)"], ["Inspeksi aurikula, preaurikula, retroaurikula", "→ KE PENGUJI: Aurikula dekstra tidak ada deformitas, retroaurikula tenang."], ["Nyeri tekan tragus & nyeri tarik aurikula", "→ KE PENGUJI: Nyeri tekan tragus (+), nyeri tarik aurikula (+) dekstra."], ["Otoskopi (aurikula ditarik ke atas-belakang; kelingking bertumpu di pipi)", "→ KE PENGUJI: MAE dekstra tampak furunkel di 1/3 luar, hiperemis, lumen menyempit; MT intak, refleks cahaya (+) arah jam 5. Telinga kiri normal."], ["Tes garpu tala 512 Hz (Rinne, Weber, Schwabach)", "→ KE PENGUJI: Rinne AD (+), Weber tidak ada lateralisasi, Schwabach sama dengan pemeriksa."], ["Palpasi KGB preaurikular/retroaurikular", "→ KE PENGUJI: KGB preaurikular dekstra teraba kecil, nyeri."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan; GDS bila curiga OE maligna; KOH bila curiga otomikosis."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis otitis eksterna sirkumskripta (furunkel) aurikula dekstra. DD: otitis eksterna difusa, otitis eksterna maligna, otitis media akut."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ini bisul di liang telinga, Mas, karena luka kecil akibat cotton bud lalu terinfeksi kuman."], ["Nonfarmako: stop mengorek, jaga kering, kompres hangat", "DOKTER: Jangan korek telinga lagi. Saat mandi tutup telinga dengan kapas berlapis vaselin, jangan berenang dulu."], ["Menulis resep & mengajarkan cara tetes telinga", "DOKTER: Tetes telinga 5 tetes 2 kali sehari: hangatkan botol di genggaman, berbaring miring telinga kanan di atas, tarik daun telinga ke atas-belakang, teteskan, tahan 5 menit.\n→ KE PENGUJI: Ini resepnya, dok."], ["Tanda bahaya & kontrol 1 minggu", "DOKTER: Kontrol 1 minggu. Bila bengkak meluas ke pipi, demam, atau wajah mencong, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Ofloksasin 0,3% tetes telinga fl. 5 mL No. I", "   S 2 dd gtt V AD (7 hari)", "   ———————————— paraf", "R/ Ibuprofen tab 400 mg No. X", "   S 3 dd tab I p.c. p.r.n. nyeri", "   ———————————— paraf", "Pro: Tn. X., 25 tahun", "Alamat: ……"], "catatanObat": "Ofloksasin aman walau MT tidak intak. Furunkel matang → insisi. Otomikosis: ear toilet + klotrimazol 1% 2–3×/hari ±2 minggu. [UPDATE GUIDELINE] Tetes ototoksik (aminoglikosida, polimiksin B) jangan dipakai bila MT dicurigai tidak intak.", "jebakan": ["Tidak memeriksa nyeri tekan tragus/tarik aurikula.", "Arah tarikan aurikula salah.", "Tetes ototoksik tanpa memastikan MT intak.", "Lupa tanya DM/paresis N VII."], "soal": [{"station": "Indra-13", "skenario": "Laki-laki 25 tahun, nyeri telinga kanan sejak 2 hari, sering mengorek telinga.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik telinga", "**Sampaikan** diagnosis & DD kepada penguji", "**Tuliskan** resep"], "kunci": ["Nyeri tarik, cotton bud, DM", "Tragus/tarik +, otoskopi furunkel, garpu tala", "OE sirkumskripta; DD difusa, maligna, OMA", "Ofloksasin ED + ibuprofen"]}, {"station": "Indra-13b", "skenario": "Ny. O., 30 tahun, telinga kiri gatal dan penuh setelah sering berenang; otoskopi tampak massa putih seperti kapas dengan bintik hitam.", "tugas": ["**Sebutkan** diagnosis", "**Tuliskan** terapi"], "kunci": ["Otomikosis (Aspergillus niger)", "Ear toilet + klotrimazol 1% tetes 3 dd ±2 minggu, jaga kering"]}]}, {"id": "oma", "no": 14, "nama": "Otitis Media Akut — kasus anak", "skdi": "4A", "ringkas": {"kunci": "Anak, didahului batuk-pilek, nyeri telinga, rewel, menarik-narik telinga, demam; keluar cairan lalu nyeri berkurang (perforasi).", "khas": "Stadium dari MT: oklusi (retraksi) → hiperemis → supurasi (BULGING) → perforasi (sekret) → resolusi. Nyeri tarik aurikula (−).", "dd": "Otitis eksterna (tarik +) • Otitis media efusi • Miringitis bulosa • Nyeri alih (gigi, faring)", "flag": "Bengkak/nyeri belakang telinga (mastoiditis), wajah mencong, pusing berputar, kaku kuduk/kejang, demam tinggi menetap → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya adik? Boleh saya tahu nama, usia, dan alamat adik?\nPENGHANTAR: Saya ibunya, Dok. Namanya An. K., umur 3 tahun, BB 14 kg, alamat Kartasura."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan adik lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: telinga mana, nyeri, rewel/menarik telinga", "DOKTER: Adik kenapa, Bu?\nPENGHANTAR: Sejak 2 hari rewel, sering pegang-pegang telinga kanan, Dok, menangis terus."], ["Demam & riwayat batuk-pilek sebelumnya", "DOKTER: Demam? Sebelumnya batuk pilek?\nPENGHANTAR: Demam 38,5 °C. Seminggu ini pilek."], ["Keluar cairan dari telinga (stadium perforasi)", "DOKTER: Ada cairan keluar dari telinga?\nPENGHANTAR: Belum ada, Dok."], ["Red flag: bengkak belakang telinga, wajah mencong, kejang, muntah", "DOKTER: Ada bengkak di belakang telinga, wajah mencong, kejang, atau muntah?\nPENGHANTAR: Tidak ada."], ["Faktor risiko: minum susu botol berbaring, asap rokok, OMA berulang, alergi obat, imunisasi", "DOKTER: Minum susu botol sambil tiduran? Ada yang merokok di rumah? Sering sakit telinga? Alergi obat? Imunisasi lengkap?\nPENGHANTAR: Iya, susu botol sambil tiduran. Ayahnya merokok. Baru sekali ini. Tidak alergi. Imunisasi lengkap."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa telinga adik memakai lampu kepala dan otoskop; Ibu bantu memangku adik ya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Posisi anak dipangku ibu, kepala difiksasi", "DOKTER: Ibu pangku adik menyamping, satu tangan memeluk badan, satu tangan menahan kepalanya."], ["Suhu & inspeksi aurikula serta mastoid", "→ KE PENGUJI: Suhu 38,4 °C. Aurikula normal, retroaurikula tidak bengkak, nyeri tekan mastoid (−)."], ["Nyeri tarik aurikula/tekan tragus", "→ KE PENGUJI: Nyeri tarik aurikula & tekan tragus (−)."], ["Otoskopi (anak: aurikula ditarik ke BAWAH-belakang)", "→ KE PENGUJI: MAE dekstra lapang, MT hiperemis dan bulging, refleks cahaya (−), perforasi (−). MT kiri normal."], ["Rinoskopi anterior & faring", "→ KE PENGUJI: Mukosa hidung hiperemis dengan sekret mukoid; faring hiperemis ringan."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OMA aurikula dekstra stadium supurasi, dengan rinitis akut. DD: otitis media efusi, otitis eksterna, miringitis bulosa."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Adik mengalami infeksi telinga tengah, Bu, akibat pilek yang menjalar lewat saluran di belakang hidung."], ["Nonfarmako: atasi pilek, posisi menyusu kepala lebih tinggi, hindari asap rokok", "DOKTER: Kalau minum susu, kepala adik lebih tinggi, jangan sambil telentang. Jauhkan dari asap rokok. Jangan masukkan air atau cotton bud ke telinga."], ["Menulis resep anak (dosis per BB) & menyerahkan", "DOKTER: Antibiotik sirup diminum 2 kali sehari dan harus dihabiskan 10 hari. Obat demam bila demam.\n→ KE PENGUJI: Amoksisilin 80–90 mg/kgBB/hari dibagi 2 (BB 14 kg ≈ 600 mg 2×/hari) 10 hari + parasetamol 15 mg/kg; ini resepnya, dok."], ["Tanda bahaya & kontrol 2–3 hari", "DOKTER: Kontrol 2–3 hari lagi. Kalau ada bengkak belakang telinga, wajah mencong, kejang, atau demam tidak turun, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Amoksisilin sirup kering 250 mg/5 mL fl. 60 mL No. IV", "   S 2 dd cth II ½ (12 mL = 600 mg), habiskan 10 hari", "   ———————————— paraf", "R/ Parasetamol sirup 120 mg/5 mL fl. 60 mL No. I", "   S 3–4 dd cth I ½ (7,5 mL = 180 mg) p.r.n. demam/nyeri", "   ———————————— paraf", "Pro: An. K., 3 tahun (BB 14 kg)", "Alamat: ……", "", "— Contoh hitung (PPK/les 25–50 mg/kg/hari ÷ 3) —", "BB 10 kg: 40 mg/kg × 10 = 400 mg/hari → ±135 mg 3×/hari → puyer: R/ Amoksisilin 125 mg m.f. pulv. dtd No. XXX, S 3 dd pulv I", "BB 20 kg: 40 mg/kg × 20 = 800 mg/hari → ±270 mg 3×/hari → sirup 250 mg/5 mL cth I (250 mg) 3×/hari", "Parasetamol: BB 10 kg 100–150 mg/kali; BB 20 kg 200–300 mg/kali"], "catatanObat": "[UPDATE GUIDELINE — AAP 2013] Amoksisilin dosis tinggi 80–90 mg/kgBB/hari dibagi 2, 10 hari untuk usia <2 th/berat; 6–12 tahun ringan boleh 5–7 hari. PPK FKTP/les: 25–50 mg/kg/hari ÷3 — sebutkan bahwa daerah resistensi tinggi memakai dosis tinggi. Hitungan 60 mL × 4 botol: 12 mL × 2 × 10 hari = 240 mL. Dekongestan oral tidak dianjurkan untuk anak <6 tahun; cukup NaCl tetes hidung. Perforasi: ear toilet H₂O₂ 3% + ofloksasin tetes.", "jebakan": ["Tarik aurikula ke atas pada anak (seharusnya ke bawah-belakang).", "Tidak menentukan stadium dari MT.", "Dosis dewasa/tidak menimbang BB.", "Lupa periksa mastoid."], "soal": [{"station": "Indra-14", "skenario": "An. K., 3 tahun (BB 14 kg), dibawa ibunya karena rewel dan memegang telinga kanan 2 hari setelah pilek, demam.", "tugas": ["**Lakukan** alloanamnesis", "**Lakukan** pemeriksaan otoskopi pada anak", "**Sampaikan** diagnosis & stadium", "**Tuliskan** resep sesuai BB"], "kunci": ["ISPA, susu botol, rokok, red flag", "Fiksasi anak, tarik bawah-belakang, MT bulging", "OMA AD stadium supurasi", "Amoksisilin dosis BB 10 hari + parasetamol sirup"]}, {"station": "Indra-14b", "skenario": "An. P., 6 tahun, telinga kiri keluar cairan kuning sejak kemarin setelah sebelumnya nyeri hebat; kini nyeri berkurang.", "tugas": ["**Sebutkan** stadium", "**Tuliskan** terapi"], "kunci": ["OMA stadium perforasi", "Ear toilet H₂O₂ 3% 3–5 hari + ofloksasin tetes + amoksisilin oral, jaga kering"]}]}, {"id": "omsk", "no": 15, "nama": "Otitis Media Supuratif Kronik (OMSK)", "skdi": "3A", "ringkas": {"kunci": "Telinga berair hilang-timbul/terus-menerus >2 bulan, riwayat OMA tidak tuntas, pendengaran turun.", "khas": "Perforasi MT + otore >2 bulan (PNPK: 6 minggu–3 bulan). BENIGNA: perforasi SENTRAL, sekret mukopurulen tidak berbau. MALIGNA: perforasi ATIK/MARGINAL, sekret berbau busuk, KOLESTEATOMA/granulasi.", "dd": "OMA stadium perforasi • Otitis eksterna difusa • Otomikosis • Karsinoma telinga tengah", "flag": "Nyeri kepala hebat, demam, muntah, kaku kuduk, penurunan kesadaran, wajah mencong, vertigo, bengkak retroaurikula → rujuk segera (komplikasi intrakranial/intratemporal)."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. I., 19 tahun, Sragen, mahasiswi."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: cairan telinga, lama, hilang timbul", "DOKTER: Ada keluhan apa?\nPASIEN: Telinga kiri sering keluar cairan sejak 4 bulan, Dok, hilang timbul, terutama kalau pilek."], ["Karakter sekret: warna, bau, darah", "DOKTER: Cairannya seperti apa? Bau? Ada darah?\nPASIEN: Kental kekuningan, tidak bau, tidak berdarah."], ["Pendengaran, tinnitus, riwayat OMA masa kecil", "DOKTER: Pendengaran turun? Berdenging? Waktu kecil sering sakit telinga?\nPASIEN: Agak turun, Dok. Kecil sering sakit telinga."], ["Red flag komplikasi: sakit kepala hebat, demam, muntah, pusing berputar, wajah mencong, bengkak belakang telinga", "DOKTER: Ada sakit kepala hebat, demam, muntah, pusing berputar, wajah mencong, atau bengkak di belakang telinga?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa telinga Mbak dengan lampu kepala, otoskop, dan garpu tala. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Inspeksi aurikula & retroaurikula, palpasi mastoid", "→ KE PENGUJI: Retroaurikula sinistra tenang, nyeri tekan mastoid (−), fistula (−)."], ["Otoskopi", "→ KE PENGUJI: MAE sinistra terdapat sekret mukopurulen tidak berbau; setelah dibersihkan, MT perforasi sentral, kolesteatoma (−), granulasi (−)."], ["Garpu tala 512 Hz", "→ KE PENGUJI: Rinne AS (−), Weber lateralisasi ke kiri, Schwabach memanjang → tuli konduktif AS."], ["Tes fistula & fungsi N VII", "→ KE PENGUJI: Tes fistula (−), N VII baik."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Kultur & resistensi sekret; audiometri; foto mastoid/CT temporal bila curiga maligna (di rujukan)."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OMSK aurikula sinistra tipe benigna (tubotimpani) fase aktif. DD: OMSK tipe maligna, OMA stadium perforasi, otitis eksterna difusa."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ada lubang di gendang telinga kiri sejak lama sehingga mudah terinfeksi saat pilek."], ["Ear toilet H₂O₂ 3% & jaga kering", "DOKTER: Bersihkan telinga dengan obat cuci 3–5 hari, keringkan pakai kapas lidi pelan. Telinga jangan kemasukan air, tutup kapas vaselin saat mandi, jangan membuang ingus terlalu keras."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: H₂O₂ 3%, lalu ofloksasin tetes telinga 2 minggu, amoksisilin oral; ini resepnya, dok."], ["Rujuk Sp.THT (timpanoplasti) & tanda bahaya", "DOKTER: Setelah kering, Mbak saya rujuk ke dokter THT untuk menambal gendang telinga. Bila sakit kepala hebat, muntah, atau wajah mencong, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ H₂O₂ 3% tetes telinga fl. 10 mL No. I", "   S 2 dd gtt V AS (cuci, 3–5 hari)", "   ———————————— paraf", "R/ Ofloksasin 0,3% tetes telinga fl. 5 mL No. I", "   S 2 dd gtt V AS (setelah dicuci, 14 hari)", "   ———————————— paraf", "R/ Amoksisilin tab 500 mg No. XXI", "   S 3 dd tab I (habiskan)", "   ———————————— paraf", "Pro: Nn. I., 19 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: PNPK Tata Laksana OMSK; Buku Ajar THT-KL FKUI] Benigna aktif: ear toilet + kuinolon topikal (non-ototoksik) ±2 minggu ± AB oral; tenang → rujuk timpanoplasti. Maligna: rujuk mastoidektomi. SKDI 2026: awal & rujuk.", "jebakan": ["Tidak membersihkan sekret sebelum menilai MT.", "Tetes ototoksik pada perforasi.", "Tidak menanyakan tanda komplikasi.", "Tidak membedakan benigna vs maligna."], "soal": [{"station": "Indra-15", "skenario": "Nn. I., 19 tahun, telinga kiri berair hilang-timbul 4 bulan, tidak berbau, pendengaran turun.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan telinga & garpu tala", "**Sampaikan** diagnosis & tipe", "**Tuliskan** resep & rencana rujukan"], "kunci": ["Lama, karakter, red flag", "Perforasi sentral, tuli konduktif", "OMSK benigna aktif", "H₂O₂ → ofloksasin, rujuk timpanoplasti"]}, {"station": "Indra-15b", "skenario": "Tn. V., 30 tahun, otore berbau busuk terus-menerus, MT perforasi atik dengan massa putih seperti mutiara, sakit kepala dan demam sejak 2 hari.", "tugas": ["**Sebutkan** diagnosis", "**Sebutkan** tindakan"], "kunci": ["OMSK maligna dengan kolesteatoma + curiga komplikasi intrakranial", "Stabilisasi, AB parenteral, rujuk segera Sp.THT"]}]}, {"id": "serumen", "no": 16, "nama": "Serumen Prop (+ Prosedur Ekstraksi/Irigasi)", "skdi": "4A", "ringkas": {"kunci": "Telinga tersumbat/budek mendadak setelah mandi/berenang, rasa penuh, sering memakai cotton bud.", "khas": "MAE tertutup massa cokelat-hitam; garpu tala tuli konduktif ringan. Lunak → ekstraksi kait/irigasi (MT intak); keras → pelunak karbogliserin 10% 3 hari dulu.", "dd": "Benda asing telinga • Otitis eksterna • Otomikosis • OME", "flag": "Riwayat perforasi/OMSK/operasi telinga (KI irigasi), nyeri hebat, vertigo saat irigasi, gagal ekstraksi → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. S., 40 tahun, Boyolali, sopir."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & onset", "DOKTER: Ada keluhan apa, Pak?\nPASIEN: Telinga kanan tiba-tiba budek dan penuh setelah mandi kemarin, Dok."], ["Nyeri, gatal, cairan, berdenging, pusing", "DOKTER: Nyeri, keluar cairan, berdenging, atau pusing berputar?\nPASIEN: Tidak nyeri, hanya penuh dan sedikit berdenging."], ["Kebiasaan cotton bud", "DOKTER: Sering pakai cotton bud?\nPASIEN: Hampir tiap hari, Dok."], ["Riwayat telinga berair/perforasi/operasi telinga (KI irigasi), DM", "DOKTER: Pernah telinga berair, gendang telinga berlubang, atau operasi telinga?\nPASIEN: Tidak pernah."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa telinga Bapak lalu membersihkan kotorannya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Otoskopi", "→ KE PENGUJI: MAE dekstra tertutup massa serumen cokelat kehitaman, lunak, MT tidak tampak. Telinga kiri normal, MT intak."], ["Garpu tala", "→ KE PENGUJI: Rinne AD (−), Weber lateralisasi ke kanan → tuli konduktif AD."], ["Persiapan alat & posisi: lampu kepala, kait serumen, spuit 20–50 cc, air hangat suhu tubuh (37 °C), nierbekken, handuk", "(Pasien duduk, handuk di bahu, pasien memegang nierbekken di bawah telinga.)"], ["Ekstraksi dengan kait/kuret di bawah lampu kepala", "DOKTER: Saya ambil pelan-pelan, bila sakit bilang ya.\n(Kait dimasukkan menyusuri dinding superior melewati serumen, lalu ditarik keluar.)"], ["Atau irigasi: aurikula ditarik ke atas-belakang, semprot air hangat ke dinding posterosuperior MAE", "(Air 37 °C disemprot ke dinding posterosuperior, bukan langsung ke MT; cek berkala.)"], ["Keringkan MAE & otoskopi ulang", "→ KE PENGUJI: Serumen bersih, MAE dan MT dekstra intak, refleks cahaya (+)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis serumen prop aurikula dekstra. DD: benda asing telinga, otitis eksterna, otomikosis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Kotoran telinga Bapak terdorong ke dalam dan menyumbat, lalu mengembang setelah kena air."], ["Edukasi: berhenti memakai cotton bud", "DOKTER: Telinga bisa membersihkan diri sendiri. Cotton bud cukup di daun telinga saja, jangan dimasukkan."], ["Resep (bila serumen keras: pelunak dulu)", "→ KE PENGUJI: Bila serumen keras, karbogliserin 10% 3 × 5 tetes 3 hari lalu kontrol untuk ekstraksi; ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau nyeri, keluar cairan, atau pusing berputar, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Karbogliserin 10% tetes telinga fl. 10 mL No. I", "   S 3 dd gtt V AD (3 hari, lalu kontrol)", "   ———————————— paraf", "Pro: Tn. S., 40 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: AAO-HNS Cerumen Impaction 2017; PPK FKTP 2022] Irigasi KI: perforasi/riwayat operasi telinga, OMSK, DM-imunokompromais (risiko OE maligna). Air harus suhu tubuh (air dingin/panas → vertigo kalorik).", "jebakan": ["Irigasi tanpa memastikan MT intak.", "Air tidak suhu tubuh / semprot langsung ke MT.", "Tidak otoskopi ulang.", "Tidak edukasi cotton bud."], "soal": [{"station": "Indra-16", "skenario": "Tn. S., 40 tahun, telinga kanan tersumbat setelah mandi, sering memakai cotton bud.", "tugas": ["**Lakukan** anamnesis singkat", "**Lakukan** pemeriksaan dan **ekstraksi serumen** pada manekin", "**Sampaikan** diagnosis", "**Edukasi** pasien"], "kunci": ["Cotton bud, riwayat perforasi", "Otoskopi → kait/irigasi 37 °C ke posterosuperior → otoskopi ulang", "Serumen prop AD", "Stop cotton bud"]}, {"station": "Indra-16b", "skenario": "Ny. D., 50 tahun, serumen keras menutup MAE kiri, riwayat OMSK kiri.", "tugas": ["**Sebutkan** tindakan yang tepat & yang dihindari"], "kunci": ["Pelunak lalu ekstraksi dengan kait/suction; irigasi dikontraindikasikan (riwayat perforasi)"]}]}, {"id": "bat", "no": 17, "nama": "Benda Asing Telinga & Hidung — kasus anak", "skdi": "3A/4A", "ringkas": {"kunci": "Anak memasukkan manik/kacang/kertas ke hidung atau telinga; pilek SATU SISI berbau busuk kadang berdarah (hidung lama); serangga masuk telinga (berdengung, nyeri).", "khas": "Benda asing terlihat di MAE/rongga hidung dengan lampu kepala. Benda BULAT → KAIT dari belakang benda (jangan pinset). Serangga hidup → dimatikan dulu. Organik → jangan irigasi.", "dd": "Rinosinusitis • Rinitis • Tumor hidung (sekret berdarah satu sisi) • Serumen prop", "flag": "BATERAI KANCING (gawat: nekrosis dalam jam), benda di posterior/risiko aspirasi, anak tidak kooperatif, gagal 1–2 kali, dekat MT → rujuk Sp.THT."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya adik? Boleh saya tahu nama, usia, dan alamat adik?\nPENGHANTAR: Saya ibunya, Dok. Namanya An. M., 4 tahun, BB 16 kg, alamat Solo."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan adik lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & kapan benda masuk", "DOKTER: Adik kenapa, Bu?\nPENGHANTAR: Tadi siang memasukkan manik-manik ke lubang hidung kanan, Dok."], ["Jenis benda (baterai kancing? organik?)", "DOKTER: Benda apa persisnya? Ada baterai kecil, kacang, atau mainan?\nPENGHANTAR: Manik plastik bulat."], ["Sesak, batuk, tersedak (aspirasi), mimisan, nyeri", "DOKTER: Adik sesak, batuk-batuk, atau tersedak? Mimisan?\nPENGHANTAR: Tidak sesak, tidak batuk, tidak mimisan."], ["Usaha mengeluarkan sebelumnya", "DOKTER: Sudah dicoba dikeluarkan di rumah?\nPENGHANTAR: Sudah dicoba pakai jepit rambut tapi malah masuk."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa hidung adik dengan lampu kepala lalu mengambil manik-maniknya; Ibu bantu memangku adik ya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Fiksasi anak: dipangku, kaki dijepit, tangan & kepala dipegang", "DOKTER: Ibu pangku adik, kakinya dijepit dengan kaki Ibu, tangan memeluk badan; perawat memegang kepala."], ["Rinoskopi anterior dengan lampu kepala", "→ KE PENGUJI: Kavum nasi dekstra tampak benda asing bulat warna merah di vestibulum-meatus inferior; mukosa sedikit edema. Kavum nasi sinistra normal."], ["Ekstraksi: kait dimasukkan melewati sisi atas benda, diputar ke belakang benda, ditarik ke depan (bukan pinset)", "DOKTER: Adik diam sebentar ya, cuma sebentar.\n(Kait melewati atas benda → diputar ke belakang → ditarik keluar.)\n→ KE PENGUJI: Benda asing berhasil dikeluarkan utuh."], ["Alternatif: teknik tekanan positif (mother's kiss)", "→ KE PENGUJI: Alternatif bila kooperatif: tutup lubang hidung sehat, ibu meniup mulut anak."], ["Periksa ulang kedua kavum nasi, telinga, & faring", "→ KE PENGUJI: Tidak ada benda asing tersisa di kedua kavum nasi dan kedua telinga; perdarahan (−)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak perlu; foto bila curiga logam/baterai atau benda tidak terlihat."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis benda asing (manik plastik) kavum nasi dekstra. DD: rinosinusitis, rinolit."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan tindakan selesai", "DOKTER: Manik-maniknya sudah keluar utuh, Bu."], ["Edukasi pencegahan: jauhkan benda kecil & baterai kancing", "DOKTER: Simpan manik, kacang, dan terutama baterai kancing jauh dari jangkauan adik. Kalau masuk lagi, jangan dicoba dengan jepit rambut, langsung bawa ke dokter."], ["Resep bila perlu & menyerahkan", "→ KE PENGUJI: Tidak perlu antibiotik pada kasus ini; bila benda lama dengan sekret purulen, beri amoksisilin sesuai BB. Saya hanya meresepkan NaCl 0,9% semprot bila mukosa iritasi."], ["Tanda bahaya", "DOKTER: Bila mimisan tidak berhenti, sesak, atau batuk tiba-tiba, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ NaCl 0,9% semprot hidung fl. No. I", "   S 3 dd 1 semprot cavum nasi dekstra p.r.n.", "   ———————————— paraf", "Pro: An. M., 4 tahun (BB 16 kg)", "Alamat: ……", "", "— Bila benda lama + sekret purulen (BB 16 kg; amoksisilin 25 mg/kg/kali 2×/hari) —", "R/ Amoksisilin sirup 250 mg/5 mL fl. 60 mL No. II", "   S 2 dd cth II (400 mg) 7 hari", "   ———————————— paraf", "BB 10 kg → 250 mg 2×/hari (cth I); BB 20 kg → 500 mg 2×/hari (cth II)"], "catatanObat": "[TAMBAHAN — sumber: Buku Ajar THT-KL FKUI; Dhingra; AAP] Serangga hidup di telinga: matikan dengan minyak mineral/lidokain 2% lalu ekstraksi. Baterai kancing di hidung/telinga: jangan diirigasi, keluarkan segera/rujuk. Benda organik (kacang, biji) jangan diirigasi karena mengembang.", "jebakan": ["Memakai pinset untuk benda bulat.", "Mengirigasi benda organik/baterai.", "Tidak memfiksasi anak.", "Tidak memeriksa ulang sisi kontralateral & telinga."], "soal": [{"station": "Indra-17", "skenario": "An. M., 4 tahun, dibawa ibunya karena memasukkan manik-manik ke hidung kanan siang tadi.", "tugas": ["**Lakukan** alloanamnesis", "**Lakukan** rinoskopi dan **ekstraksi benda asing** pada manekin", "**Sampaikan** diagnosis", "**Edukasi** ibu"], "kunci": ["Jenis benda (baterai?), aspirasi", "Fiksasi, lampu kepala, kait dari belakang benda, cek ulang", "Benda asing kavum nasi dekstra", "Jauhkan benda kecil & baterai"]}, {"station": "Indra-17b", "skenario": "Tn. F., 22 tahun, terbangun karena telinga kiri berdengung keras dan nyeri, terasa ada yang bergerak.", "tugas": ["**Sebutkan** diagnosis", "**Sebutkan** langkah tindakan"], "kunci": ["Benda asing hidup (serangga) MAE sinistra", "Matikan dengan minyak/lidokain → ekstraksi pinset/irigasi bila MT intak → otoskopi ulang"]}]}, {"id": "rinitis", "no": 18, "nama": "Rinitis (Akut, Alergi, Vasomotor, Medikamentosa)", "skdi": "4A", "ringkas": {"kunci": "Hidung tersumbat + pilek + demam ringan (akut); BERSIN >5×/pagi, gatal hidung-mata, pilek encer, atopi (alergi); tersumbat bergantian dipicu suhu/bau (vasomotor); semprot dekongestan lama (medikamentosa).", "khas": "Rinoskopi: akut = mukosa hiperemis, sekret mukoid-mukopurulen; alergi = konka edema PUCAT/LIVID, sekret encer, allergic shiner/salute/crease; medikamentosa = konka hipertrofi merah (beefy red).", "dd": "Rinitis akut vs alergi vs vasomotor vs medikamentosa • Rinosinusitis • Benda asing • Tumor nasofaring", "flag": "Sumbatan & mimisan SATU SISI, sekret berdarah, benjolan leher (KNF), nyeri wajah hebat, bengkak periorbita, gangguan penglihatan → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. X., 36 tahun, Sukoharjo, pegawai toko."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: sisi tersumbat, onset", "DOKTER: Ada keluhan apa, Bu?\nPASIEN: Hidung tersumbat sejak 2 hari, Dok, kedua sisi."], ["Sekret: encer/kental, warna, bau, darah", "DOKTER: Ingusnya bagaimana? Bau atau ada darah?\nPASIEN: Kental kekuningan, tidak bau, tidak berdarah."], ["Bersin, gatal, demam, nyeri tenggorok, nyeri wajah, penciuman", "DOKTER: Banyak bersin atau gatal? Demam? Nyeri tenggorok? Nyeri di pipi/dahi?\nPASIEN: Demam sumer, tenggorok agak sakit. Tidak banyak bersin, pipi tidak nyeri."], ["Riwayat atopi, pencetus, lingkungan, hewan, kapuk", "DOKTER: Ada alergi, asma, sering bersin pagi atau kena debu?\nPASIEN: Tidak ada, Dok. Anak saya baru pilek juga."], ["Obat semprot hidung & lamanya; HT/jantung (KI pseudoefedrin)", "DOKTER: Pernah pakai semprot hidung? Ada darah tinggi atau sakit jantung?\nPASIEN: Belum pakai obat. Tidak ada darah tinggi."], ["Red flag: satu sisi + mimisan, benjolan leher", "DOKTER: Pernah mimisan dari satu sisi atau ada benjolan di leher?\nPASIEN: Tidak."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa hidung, tenggorok, dan leher Ibu memakai lampu kepala. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Inspeksi wajah (allergic shiner, salute, crease) & nyeri tekan sinus", "→ KE PENGUJI: Tidak tampak allergic shiner/crease. Nyeri tekan sinus maksila & frontal (−)."], ["Rinoskopi anterior: spekulum dibuka dalam kavum nasi, nilai vestibulum, mukosa, sekret, konka, septum", "→ KE PENGUJI: Kavum nasi dextra et sinistra: mukosa hiperemis, sekret mukopurulen, konka inferior eutrofi hiperemis, septum di tengah, massa (−)."], ["Pemeriksaan faring dengan spatel", "→ KE PENGUJI: Faring hiperemis ringan, tonsil T1–T1 tenang."], ["Palpasi KGB leher", "→ KE PENGUJI: KGB leher tidak membesar."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan. Bila alergi: eosinofil sekret, skin prick test/IgE (rujuk)."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis rinitis akut (common cold). DD: rinitis alergi, rinitis vasomotor, rinosinusitis akut."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ini pilek karena virus, Bu, biasanya sembuh 7–10 hari. Tidak perlu antibiotik."], ["Nonfarmako: istirahat, minum air, cuci hidung NaCl, uap hangat", "DOKTER: Istirahat cukup, banyak minum, cuci hidung dengan cairan garam, hirup uap air hangat, pakai masker agar tidak menular."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Pseudoefedrin 3 × 60 mg (tekanan darah normal), parasetamol, NaCl semprot; tanpa antibiotik karena viral; ini resepnya, dok."], ["Tanda bahaya & kapan kembali", "DOKTER: Kalau lebih dari 10 hari tidak membaik, nyeri pipi hebat, bengkak sekitar mata, atau demam tinggi, kembali lagi."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Pseudoefedrin HCl tab 60 mg No. XV", "   S 3 dd tab I (maks 5 hari)", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. demam", "   ———————————— paraf", "R/ NaCl 0,9% semprot hidung fl. No. I", "   S 3 dd 2 semprot tiap lubang hidung", "   ———————————— paraf", "Pro: Ny. X., 36 tahun", "Alamat: ……", "", "— Rinitis alergi persisten sedang-berat —", "R/ Flutikason propionat 50 mcg/semprot fl. No. I", "   S 1 dd 2 semprot tiap lubang hidung (pagi)", "   ———————————— paraf", "R/ Loratadin tab 10 mg No. X", "   S 1 dd tab I", "   ———————————— paraf"], "catatanObat": "[UPDATE GUIDELINE] Rinitis akut umumnya virus → antibiotik hanya bila tanda bakteri (purulen >10 hari, double sickening, demam tinggi + purulen); bila diberi amoksisilin, cukupkan 5–7 hari (les No. X kurang). Rinitis alergi (ARIA 2019/AAFP): steroid intranasal paling efektif + antihistamin generasi II; teknik semprot diarahkan ke lateral (tangan kanan → lubang kiri). Dekongestan topikal maks 5 hari.", "jebakan": ["Tidak menanyakan atopi & semprot dekongestan.", "Rinoskopi tanpa lampu kepala/tidak menilai warna konka.", "Antibiotik rutin untuk viral.", "Pseudoefedrin pada hipertensi."], "soal": [{"station": "Indra-18", "skenario": "Wanita 36 tahun, hidung tersumbat sejak 2 hari.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik yang relevan", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep"], "kunci": ["Sekret, atopi, dekongestan, red flag", "Rinoskopi anterior: mukosa hiperemis", "Rinitis akut; DD alergi, vasomotor, sinusitis", "Pseudoefedrin + parasetamol + NaCl, tanpa AB"]}, {"station": "Indra-18b", "skenario": "Tn. A., 22 tahun, bersin >10×/pagi, hidung gatal dan berair encer setiap hari sejak 2 bulan, tidur terganggu. Kakak asma.", "tugas": ["**Tentukan** klasifikasi ARIA", "**Sebutkan** temuan rinoskopi khas", "**Tuliskan** resep & cara pakai"], "kunci": ["Persisten sedang-berat", "Konka edema pucat/livid, sekret encer", "Flutikason 2 semprot 1×/hari arah lateral + loratadin 10 mg, kontrol alergen"]}]}, {"id": "sinus", "no": 19, "nama": "Rinosinusitis Akut", "skdi": "4A", "ringkas": {"kunci": "Pilek & tersumbat >10 hari atau memburuk lagi setelah membaik, nyeri/rasa tertekan di pipi/dahi memberat saat menunduk, ingus kental kuning-hijau, post-nasal drip, penciuman turun, sakit gigi atas.", "khas": "EPOS 2020: <12 minggu, ≥2 gejala (salah satunya sumbatan atau sekret) ± nyeri wajah ± hiposmia. Bakterial bila ≥3: sekret purulen (satu sisi), nyeri lokal hebat, demam >38 °C, CRP/LED ↑, double sickening.", "dd": "Rinitis akut (viral <10 hari) • Rinitis alergi • Nyeri gigi • Migren/nyeri kepala tegang", "flag": "Edema/eritema periorbita, proptosis, diplopia, visus turun, nyeri kepala hebat, kaku kuduk, defisit neurologis → rujuk segera."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. L., 30 tahun, Solo, guru."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & lama", "DOKTER: Ada keluhan apa, Mas?\nPASIEN: Pilek dan hidung tersumbat sudah 12 hari, Dok, sekarang pipi kanan nyeri."], ["Pola: membaik lalu memburuk lagi (double sickening)", "DOKTER: Sempat membaik lalu memburuk lagi?\nPASIEN: Iya, sempat membaik, 3 hari ini malah parah."], ["Sekret, post-nasal drip, penciuman, demam, nyeri saat menunduk", "DOKTER: Ingusnya warna apa? Terasa mengalir ke tenggorok? Penciuman turun? Nyeri bertambah saat menunduk? Demam?\nPASIEN: Kuning kehijauan, dari kanan, terasa mengalir ke tenggorok, penciuman berkurang, nyeri saat menunduk, demam 38,5 °C."], ["Sakit gigi geraham atas (dentogen), atopi", "DOKTER: Ada sakit gigi atas? Riwayat alergi?\nPASIEN: Tidak ada."], ["Red flag orbita/intrakranial", "DOKTER: Bengkak di sekitar mata, pandangan ganda, sakit kepala hebat, leher kaku?\nPASIEN: Tidak."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa wajah, hidung, dan tenggorok Mas memakai lampu kepala. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Inspeksi wajah & periorbita", "→ KE PENGUJI: Wajah simetris, edema periorbita (−)."], ["Palpasi/perkusi nyeri tekan sinus maksila, frontal, etmoid", "→ KE PENGUJI: Nyeri tekan sinus maksila dekstra (+)."], ["Rinoskopi anterior", "→ KE PENGUJI: Mukosa kavum nasi dekstra hiperemis edema, sekret mukopurulen di meatus medius dekstra, konka edema."], ["Faring (post-nasal drip) & gigi atas", "→ KE PENGUJI: Post-nasal drip mukopurulen (+), gigi molar atas baik."], ["Transiluminasi sinus (ruangan gelap)", "→ KE PENGUJI: Transiluminasi sinus maksila dekstra suram."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak rutin; foto Waters bila meragukan; CT bila curiga komplikasi (rujuk)."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis rinosinusitis akut bakterial maksila dekstra. DD: rinosinusitis pasca-viral, sinusitis dentogen, rinitis alergi."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ini radang rongga sinus di pipi kanan, Mas, kemungkinan karena bakteri setelah pilek."], ["Nonfarmako: cuci hidung NaCl, uap hangat, istirahat", "DOKTER: Cuci hidung dengan cairan garam 2–3 kali sehari, hirup uap hangat, cukup minum."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Amoksisilin 3 × 500 mg 10 hari, steroid intranasal, dekongestan singkat, analgesik; ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau ada bengkak di sekitar mata, pandangan ganda/turun, sakit kepala hebat, atau leher kaku, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Amoksisilin tab 500 mg No. XXX", "   S 3 dd tab I (habiskan 10 hari)", "   ———————————— paraf", "R/ Mometason furoat 50 mcg/semprot fl. No. I", "   S 1 dd 2 semprot tiap lubang hidung", "   ———————————— paraf", "R/ Pseudoefedrin HCl tab 60 mg No. X", "   S 2 dd tab I (maks 5 hari)", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri/demam", "   ———————————— paraf", "R/ NaCl 0,9% cuci hidung fl. No. I", "   S 2–3 dd irigasi hidung", "   ———————————— paraf", "Pro: Tn. L., 30 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: EPOS 2020; IDSA 2012; PPK FKTP 2022] Viral (<10 hari) & pasca-viral: tanpa antibiotik (NaCl + steroid intranasal). Bakterial: amoksisilin ± klavulanat 5–10 hari (IDSA dewasa 5–7 hari). Alergi penisilin: doksisiklin. Sinusitis dentogen → rujuk dokter gigi.", "jebakan": ["Antibiotik untuk rinosinusitis viral <10 hari.", "Lupa red flag orbita.", "Lupa memeriksa gigi atas (dentogen)."], "soal": [{"station": "Indra-19", "skenario": "Tn. L., 30 tahun, pilek 12 hari, sempat membaik lalu memburuk, nyeri pipi kanan saat menunduk, demam.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan hidung & sinus", "**Sampaikan** diagnosis berdasarkan kriteria", "**Tuliskan** resep"], "kunci": ["Double sickening, PND, red flag", "Nyeri tekan maksila, sekret meatus medius, transiluminasi", "RSA bakterial (EPOS)", "Amoksisilin 10 hari + steroid intranasal + NaCl"]}, {"station": "Indra-19b", "skenario": "An. Q., 9 tahun, pilek 7 hari lalu kelopak mata kanan bengkak merah dan demam tinggi.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** tindakan"], "kunci": ["Rinosinusitis dengan komplikasi orbita (selulitis preseptal/orbita)", "Rujuk segera untuk AB IV & CT"]}]}, {"id": "epistaksis", "no": 20, "nama": "Epistaksis Anterior (+ Prosedur Tampon Anterior)", "skdi": "4A", "ringkas": {"kunci": "Anak/dewasa muda mimisan setelah mengorek hidung/trauma/cuaca kering (anterior); lansia hipertensi, darah banyak mengalir ke tenggorok (posterior); antikoagulan.", "khas": "Anterior: sumber pleksus KIESSELBACH (Little's area) septum anterior. Algoritma: TROTTER (pencet cuping hidung 10–15 menit, duduk condong ke depan) → tampon adrenalin → kaustik AgNO₃ → TAMPON ANTERIOR 24–48 jam + antibiotik.", "dd": "Epistaksis posterior (pleksus Woodruff) • Hipertensi • Koagulopati/DBD • Angiofibroma nasofaring juvenil • KNF", "flag": "Perdarahan tidak berhenti, tanda syok, mengalir ke tenggorok (posterior), berulang, sumbatan + mimisan satu sisi/benjolan leher → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. G., 20 tahun, Solo, mahasiswa."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["(Sambil menangani) onset, sisi, banyak darah, mengalir ke depan/tenggorok", "DOKTER: Mas, duduk condong ke depan dulu, pencet cuping hidung. Sejak kapan, dari lubang mana, dan banyak?\nPASIEN: 20 menit lalu dari lubang kanan, Dok, menetes ke depan, tidak ke tenggorok."], ["Pencetus: mengorek, trauma, cuaca kering", "DOKTER: Habis mengorek hidung atau terbentur?\nPASIEN: Habis mengorek, Dok."], ["Riwayat berulang, hipertensi, obat pengencer darah, perdarahan lain, demam (DBD)", "DOKTER: Sering mimisan? Darah tinggi? Minum obat pengencer darah? Gusi berdarah, mudah memar, atau demam?\nPASIEN: Baru sekali ini. Tidak ada semua, Dok."], ["Sumbatan satu sisi & benjolan leher (tumor)", "DOKTER: Hidung sering tersumbat satu sisi atau ada benjolan di leher?\nPASIEN: Tidak."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa hidung Mas dan menghentikan perdarahannya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["APD: sarung tangan, masker, celemek, kacamata", "(Memakai sarung tangan, masker, celemek.)"], ["ABC & TTV (TD, nadi, tanda syok)", "→ KE PENGUJI: Jalan napas paten, TD 120/80, nadi 88, akral hangat, tidak ada tanda syok."], ["Metode Trotter: duduk condong ke depan, pencet ala nasi 10–15 menit, napas lewat mulut, ludahkan darah", "DOKTER: Mas duduk tegak, badan sedikit maju, saya pencet cuping hidung 10–15 menit, napas lewat mulut, darah di mulut diludahkan, jangan ditelan."], ["Rinoskopi anterior dengan lampu kepala setelah hisap bekuan: cari sumber", "→ KE PENGUJI: Setelah bekuan dibersihkan, tampak sumber perdarahan aktif di septum anterior dekstra (Little's area)."], ["Tampon sementara kapas adrenalin-lidokain 10–15 menit", "(Kapas dibasahi adrenalin 1:10.000 + lidokain 2% dimasukkan 10–15 menit lalu diangkat.)"], ["Tampon anterior: kasa pita berlapis salep antibiotik/vaselin, disusun berlapis dari dasar kavum nasi ke atas, dengan pinset bayonet", "(Kasa pita bersalep dimasukkan berlapis seperti akordeon dari dasar ke atas sampai padat; ujung ditinggal di luar.)\n→ KE PENGUJI: Tampon anterior terpasang di kavum nasi dekstra, perdarahan berhenti."], ["Cek faring: tidak ada darah mengalir ke posterior", "→ KE PENGUJI: Faring tidak ada darah mengalir dari posterior."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Pada kasus ini tidak rutin; bila berulang/berat: darah lengkap, trombosit, PT/APTT, golongan darah; NS1 bila demam."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis epistaksis anterior kavum nasi dekstra e.c. trauma digital. DD: epistaksis posterior, epistaksis e.c. kelainan hematologi."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Pembuluh darah kecil di sekat hidung depan pecah karena dikorek. Sudah berhenti dan saya pasang tampon."], ["Edukasi tampon: dilepas 2×24 jam, jangan dicabut sendiri", "DOKTER: Tampon dilepas 2 hari lagi di klinik, jangan dicabut sendiri."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Amoksisilin selama tampon terpasang dan parasetamol (hindari NSAID/aspirin); ini resepnya, dok."], ["Edukasi: jangan mengorek/membuang ingus keras/mengangkat berat 1–2 minggu; P3K di rumah; tanda bahaya", "DOKTER: Jangan mengorek, membuang ingus keras, atau mengangkat berat 1–2 minggu. Kalau mimisan lagi: duduk condong ke depan dan pencet cuping hidung 10–15 menit, bukan menengadah. Bila tidak berhenti atau mengalir ke tenggorok, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Amoksisilin tab 500 mg No. XV", "   S 3 dd tab I (selama tampon terpasang)", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri", "   ———————————— paraf", "Pro: Tn. G., 20 tahun", "Alamat: ……"], "catatanObat": "[UPDATE GUIDELINE] Coretan les 'epinefrin 1 ampul + 10 cc NaCl' ≈ 1:10.000, bukan 1:100.000. Hati-hati adrenalin topikal pada HT/jantung. Tampon anterior 24–48 jam (les 24–36 jam). Gagal/posterior → tampon Bellocq/kateter balon, rawat inap/rujuk. Hindari aspirin/NSAID.", "jebakan": ["Menyuruh menengadah / menekan pangkal tulang hidung.", "Tidak cek TD & tanda syok, tanpa APD.", "Tampon tanpa salep/tanpa jadwal lepas.", "Tidak memikirkan sumber posterior/tumor."], "soal": [{"station": "Indra-20", "skenario": "Tn. G., 20 tahun, mimisan dari lubang hidung kanan sejak 20 menit setelah mengorek hidung, belum berhenti.", "tugas": ["**Lakukan** tatalaksana awal & anamnesis singkat", "**Lakukan** pemasangan tampon anterior pada manekin", "**Sampaikan** diagnosis", "**Tuliskan** resep & edukasi"], "kunci": ["APD, TTV, Trotter, riwayat obat/HT", "Lampu kepala, kapas adrenalin, kasa pita bersalep berlapis dari dasar", "Epistaksis anterior e.c. trauma digital", "Amoksisilin + parasetamol, lepas 2×24 jam, P3K"]}, {"station": "Indra-20b", "skenario": "Tn. H., 65 tahun, hipertensi tidak terkontrol, mimisan banyak dari kedua lubang hidung, darah mengalir ke tenggorok, TD 190/110.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** tatalaksana"], "kunci": ["Epistaksis posterior e.c. hipertensi", "ABC, posisi duduk, akses IV, turunkan TD bertahap, tampon posterior/kateter balon, rujuk Sp.THT"]}]}, {"id": "tonsil", "no": 21, "nama": "Tonsilofaringitis Akut — kasus anak", "skdi": "4A", "ringkas": {"kunci": "Anak usia sekolah nyeri telan 2–3 hari, demam, lemas, bau mulut; tanpa batuk-pilek mengarah streptokokus.", "khas": "Tonsil membesar (T0–T4), HIPEREMIS, DETRITUS, KGB servikal anterior nyeri. Skor Centor/McIsaac ≥4 → antibiotik. Kronis = kripte melebar.", "dd": "Abses peritonsil (trismus, hot potato voice, uvula terdorong) • Difteri (pseudomembran mudah berdarah, bull neck) • Mononukleosis • Tonsilitis kronis eksaserbasi akut", "flag": "Trismus, ngiler tidak bisa menelan, suara berubah, sesak/stridor, bull neck, selaput putih keabuan, dehidrasi → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya adik? Boleh saya tahu nama, usia, dan alamat adik?\nPENGHANTAR: Saya ibunya, Dok. Namanya An. B., 5 tahun, BB 18 kg, alamat Solo."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan adik lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & onset", "DOKTER: Adik kenapa, Bu?\nPENGHANTAR: Nyeri menelan sejak 3 hari, Dok, tidak mau makan."], ["Demam, batuk-pilek, suara, sulit membuka mulut, ngiler, ngorok", "DOKTER: Demam? Ada batuk pilek? Suaranya berubah? Sulit buka mulut atau ngiler? Ngorok saat tidur?\nPENGHANTAR: Demam 39 °C. Tidak batuk pilek. Suara biasa, bisa buka mulut, tidak ngiler."], ["Riwayat berulang (frekuensi/tahun)", "DOKTER: Sudah berapa kali seperti ini dalam setahun?\nPENGHANTAR: Baru dua kali tahun ini."], ["Imunisasi DPT & kontak difteri", "DOKTER: Imunisasinya lengkap? Ada tetangga yang sakit difteri?\nPENGHANTAR: Lengkap, Dok. Tidak ada."], ["Makan-minum (dehidrasi), BAK, alergi penisilin", "DOKTER: Masih mau minum? Pipisnya seperti biasa? Alergi obat?\nPENGHANTAR: Minum masih mau sedikit, pipis biasa. Tidak alergi."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mulut dan tenggorok adik dengan lampu kepala dan spatel; Ibu bantu memangku adik ya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Menimbang BB & suhu, tanda dehidrasi", "→ KE PENGUJI: BB 18 kg, suhu 38,8 °C, tanda dehidrasi (−)."], ["Inspeksi mulut: trismus, julurkan lidah", "DOKTER: Adik buka mulut lebar, \"aaa\".\n→ KE PENGUJI: Trismus (−)."], ["Spatel di 2/3 anterior lidah: faring, tonsil (ukuran, warna, detritus, kripte, membran), uvula", "→ KE PENGUJI: Faring hiperemis. Tonsil T3–T2, hiperemis, detritus (+), kripte tidak melebar, membran (−). Uvula di tengah, peritonsil tidak menonjol."], ["Palpasi KGB leher (pemeriksa di belakang pasien)", "→ KE PENGUJI: KGB servikal anterior bilateral membesar, nyeri tekan."], ["Otoskopi (OMA penyerta)", "→ KE PENGUJI: MT ADS intak, tenang."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Skor Centor/McIsaac & penunjang", "→ KE PENGUJI: McIsaac 5 (demam, tanpa batuk, KGB nyeri, eksudat, usia 3–14). Penunjang tidak rutin; rapid antigen/kultur usap tenggorok bila ada."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis tonsilofaringitis akut e.c. suspek streptokokus β-hemolitikus grup A. DD: abses peritonsil, tonsilitis difteri, tonsilitis kronis eksaserbasi akut."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Amandel adik radang karena kuman, Bu. Perlu antibiotik yang harus dihabiskan 10 hari agar tidak menimbulkan komplikasi ke jantung dan ginjal."], ["Nonfarmako: istirahat, minum banyak, makanan lunak, higiene mulut", "DOKTER: Banyak minum, makanan lunak tidak pedas, istirahat. Sikat gigi teratur."], ["Menulis resep anak (dosis per BB) & menyerahkan", "→ KE PENGUJI: Amoksisilin 50 mg/kgBB/hari = 900 mg/hari → puyer 300 mg 3×/hari 10 hari; parasetamol sirup 10–15 mg/kg; ini resepnya, dok."], ["Tanda bahaya & indikasi tonsilektomi", "DOKTER: Bila sulit buka mulut, ngiler, sesak, leher bengkak, atau ada selaput putih, segera kembali. Bila sering kambuh atau ngorok berat, nanti dikonsulkan operasi amandel."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Amoksisilin 300 mg", "   m.f. pulv. dtd No. XXX", "   S 3 dd pulv I (habiskan 10 hari)", "   ———————————— paraf", "R/ Parasetamol sirup 120 mg/5 mL fl. 60 mL No. I", "   S 3 dd cth II (240 mg) p.r.n. demam/nyeri", "   ———————————— paraf", "Pro: An. B., 5 tahun (BB 18 kg)", "Alamat: ……", "", "— Contoh hitung BB 10 kg: amoksisilin 50 mg × 10 = 500 mg/hari → ±170 mg 3×/hari (puyer 170 mg No. XXX); parasetamol 100–150 mg = sirup 120 mg/5 mL cth I –", "— Contoh hitung BB 20 kg: 1000 mg/hari → ±330 mg 3×/hari; parasetamol 200–300 mg = cth II ½ –", "— Alternatif dosis tunggal: Benzatin penisilin G 600.000 U IM (BB <27 kg) / 1,2 juta U (≥27 kg) –"], "catatanObat": "[UPDATE GUIDELINE — IDSA/CDC] Lama antibiotik 10 hari (les No. X = 3 hari, kurang). Resep les memakai tablet dewasa 500 mg untuk anak 5 th — wajib per BB (puyer/sirup). Alternatif IDSA: amoksisilin 50 mg/kg 1×/hari (maks 1000 mg). Alergi penisilin: eritromisin/sefaleksin. Indikasi tonsilektomi (Paradise): ≥7 episode/1 th, ≥5/th selama 2 th, ≥3/th selama 3 th.", "jebakan": ["Dosis dewasa / tidak menimbang BB.", "Antibiotik <10 hari.", "Tidak memeriksa trismus, uvula, membran.", "Spatel terlalu ke belakang (muntah)."], "soal": [{"station": "Indra-21", "skenario": "Anak laki-laki 5 tahun (BB 18 kg) dibawa ibunya ke Puskesmas karena nyeri telan 3 hari dan demam.", "tugas": ["**Lakukan** alloanamnesis", "**Lakukan** pemeriksaan fisik relevan", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep sesuai BB"], "kunci": ["Batuk-pilek, trismus, imunisasi, dehidrasi", "BB, spatel 2/3 anterior, T3–T2 detritus, KGB", "Tonsilofaringitis akut GABHS; DD abses peritonsil, difteri", "Puyer amoksisilin 300 mg No. XXX 10 hari + parasetamol sirup"]}, {"station": "Indra-21b", "skenario": "An. C., 8 tahun (BB 25 kg), nyeri telan, ditemukan selaput putih keabuan meluas ke luar tonsil, berdarah saat disentuh spatel, leher bengkak. Imunisasi tidak lengkap.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** langkah tatalaksana di FKTP"], "kunci": ["Tonsilitis difteri", "Isolasi, swab tenggorok, lapor dinas kesehatan, rujuk untuk ADS + antibiotik, profilaksis eritromisin kontak"]}]}, {"id": "apt", "no": 22, "nama": "Abses Peritonsil (+ Difteri)", "skdi": "3A/3B", "ringkas": {"kunci": "Dewasa muda dengan riwayat tonsilitis, nyeri telan hebat satu sisi, TRISMUS, suara seperti mulut berisi makanan panas (HOT POTATO VOICE), ngiler, nyeri telinga sisi sama.", "khas": "Pembengkakan peritonsil unilateral, UVULA TERDORONG ke sisi sehat, trismus; aspirasi: pus = abses, darah = infiltrat.", "dd": "Infiltrat peritonsil • Abses parafaring/retrofaring • Tonsilitis difteri • Tonsilitis akut", "flag": "Sesak/stridor, tidak bisa menelan ludah, bengkak leher meluas (angina Ludwig), sepsis → stabilisasi ABC & rujuk segera."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. N., 24 tahun, Klaten, karyawan pabrik."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & sisi", "DOKTER: Ada keluhan apa, Mas?\nPASIEN: (suara seperti mulut berisi) Sakit menelan sebelah kiri 4 hari, Dok, makin parah, susah buka mulut."], ["Riwayat radang amandel & antibiotik sebelumnya", "DOKTER: Sebelumnya radang amandel? Sudah minum obat?\nPASIEN: Seminggu lalu radang amandel, obatnya tidak dihabiskan."], ["Ngiler, tidak bisa menelan ludah, nyeri telinga, demam", "DOKTER: Ludah sampai menetes? Nyeri menjalar ke telinga? Demam?\nPASIEN: Iya ngiler, telinga kiri ikut nyeri, demam."], ["Sesak/suara ngorok (airway), bengkak leher", "DOKTER: Sesak napas? Leher bengkak?\nPASIEN: Tidak sesak, leher kiri agak bengkak."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa tenggorok dan leher Mas dengan lampu kepala dan spatel. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["TTV & jalan napas (stridor)", "→ KE PENGUJI: Suhu 38,9 °C, nadi 104, RR 20, stridor (−), SpO₂ 98%."], ["Inspeksi mulut: trismus", "→ KE PENGUJI: Trismus (+), buka mulut ±2 jari."], ["Spatel: peritonsil, uvula, tonsil", "→ KE PENGUJI: Peritonsil sinistra membengkak, hiperemis, menonjol; uvula terdorong ke kanan; tonsil sinistra terdorong ke medial; membran (−)."], ["Palpasi KGB leher", "→ KE PENGUJI: KGB jugulodigastrik sinistra membesar nyeri."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Aspirasi jarum di titik paling fluktuatif (oleh Sp.THT/terlatih): pus = abses; darah lengkap; CT leher bila curiga abses leher dalam."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis abses peritonsil sinistra. DD: infiltrat peritonsil, abses parafaring, tonsilitis difteri."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan & rawat inap/rujuk", "DOKTER: Ada kumpulan nanah di samping amandel kiri, Mas. Perlu dikeluarkan dan antibiotik lewat infus, jadi saya rujuk ke dokter THT."], ["Stabilisasi: jaga jalan napas, infus, antibiotik parenteral pertama, analgesik", "→ KE PENGUJI: Pasang infus, seftriakson 2 g IV + metronidazol 500 mg IV, parasetamol IV, lalu rujuk Sp.THT untuk insisi drainase."], ["Surat rujukan & resep", "→ KE PENGUJI: Ini surat rujukan dan catatan obat yang sudah diberikan, dok."], ["Edukasi: habiskan antibiotik, tonsilektomi setelah tenang", "DOKTER: Ke depan, antibiotik harus dihabiskan. Setelah sembuh biasanya dianjurkan operasi amandel agar tidak berulang."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["Tindakan sebelum rujuk:", "R/ Seftriakson inj 1 g vial No. II", "   S 2 g IV (pemberian pertama, skin test sesuai SOP)", "   ———————————— paraf", "R/ Metronidazol infus 500 mg/100 mL fl. No. I", "   S 500 mg IV drip", "   ———————————— paraf", "Pro: Tn. N., 24 tahun", "Alamat: ……", "", "— Rawat jalan pasca-drainase (dewasa) —", "R/ Amoksisilin-klavulanat tab 875/125 mg No. XX", "   S 2 dd tab I (10 hari)", "   ———————————— paraf"], "catatanObat": "[TAMBAHAN — sumber: Buku Ajar THT-KL FKUI; PERHATI-KL; AAFP  if(tab=='materi')h+=materi(d);
