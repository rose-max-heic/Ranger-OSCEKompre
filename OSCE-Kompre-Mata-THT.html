<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCE Kompre Mata & THT</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3ded3;--blue:#1f4e79;--wine:#7b2c3b;--green:#4a6b2a;--red:#b03a2e;--yel:#fff4cc}
body.dark{--bg:#14161b;--card:#1d2028;--ink:#e7e9ee;--mute:#9aa3b2;--line:#2e333d;--yel:#3a3420}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;color:var(--wine);text-decoration:none}#crumb{flex:1;color:var(--mute);font-size:14px}#crumb a{color:var(--blue);text-decoration:none}
.hero{text-align:center;padding:40px 10px 24px}.hero h1{font-size:40px;margin:0;color:var(--blue)}.hero h1 span{color:var(--wine)}.hero p{color:var(--mute);max-width:640px;margin:10px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--blue)}
.card .num{font:800 28px system-ui;color:var(--wine);opacity:.85}.card h3{margin:4px 0 6px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:13px}
.card .tag{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(31,78,121,.12);color:var(--blue)}
.card.big{padding:24px;text-align:center}.card.big .ic{font-size:40px}.card.big h3{font-size:19px}
.prog{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:#2e7d32}
.secnav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.secnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}.secnav a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
nav{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 6px 2px;color:var(--wine)}nav p{margin:0 6px 14px;color:var(--mute);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--blue);color:#fff}
nav .sk{float:right;font-size:11px;opacity:.75}
main{padding:24px 32px 80px;max-width:1150px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;flex:1;min-width:260px;color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.timer{font:600 20px ui-monospace,monospace;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--red)}
.tabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.box .row{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line)}
.box .row b{padding:10px 12px}.box .row div{padding:10px 12px}
.k1{background:var(--yel)}.k2{background:rgba(31,78,121,.12)}.k3{background:rgba(120,120,120,.1)}.k4{background:rgba(176,58,46,.13)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--blue);color:#fff;font-size:13px}td.no{width:38px;text-align:center;color:var(--mute)}
tr.sec td{background:rgba(31,78,121,.12);font-weight:700}
.sc{white-space:nowrap;width:120px}.sc button{width:32px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin-right:2px}
.sc button.s0.on{background:#c0392b;color:#fff}.sc button.s1.on{background:#d4a017;color:#fff}.sc button.s2.on{background:#2e7d32;color:#fff}
.say p{margin:0 0 4px}.r-D{color:#2b6cb0;font-weight:700}.r-P{color:var(--green);font-weight:700}.r-U{color:var(--red);font-weight:700}
.hidden-say .say{filter:blur(6px);cursor:pointer}.hidden-say .say.peek{filter:none}
.score{font-weight:700;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.resep{font:14px ui-monospace,monospace;white-space:pre-wrap;background:rgba(74,107,42,.1);border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;margin-bottom:10px}
.note{font-size:13px;color:var(--mute);margin-bottom:16px}
.trap{background:rgba(176,58,46,.08);border-left:4px solid var(--red);padding:10px 14px;border-radius:8px}
.soal{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 18px;margin-bottom:8px}
.soal h4{margin:-14px -18px 10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px}
.kunci{background:rgba(120,120,120,.12);border-radius:8px;padding:10px 14px;margin-bottom:22px}
.kunci.closed ul{display:none}.kunci summary{cursor:pointer;font-weight:700}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static}main{padding:16px}.box .row{grid-template-columns:1fr}}
.secnav a.dl{background:var(--green);color:#fff;border-color:var(--green);margin-left:auto}a.btn.dl{background:var(--green);color:#fff;text-decoration:none}
.phead{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
 body,body.dark{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#aaa;--yel:#fff4cc;background:#fff!important;color:#000;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar,.secnav,.top,.score button{display:none!important}
 main{padding:0!important;max-width:none!important;margin:0!important}
 .phead{display:block;font-weight:700;font-size:13pt;color:#1f4e79;border-bottom:2px solid #7b2c3b;padding-bottom:4px;margin-bottom:10px}
 table{border:1px solid #aaa;border-radius:0}
 thead{display:table-header-group}
 tr,.box .row,.soal,.kunci,.resep,.trap,li{break-inside:avoid;page-break-inside:avoid}
 tr.sec{break-after:avoid;page-break-after:avoid}
 th,td{padding:4px 6px}
 .hidden-say .say{filter:none!important}
 .kunci summary{list-style:none}.kunci summary::-webkit-details-marker{display:none}
 h3{break-after:avoid}
 .sc button{display:inline-block;width:24px;height:20px;font-size:9pt;border:1px solid #666;background:#fff}
}

.tw{overflow-x:auto}
td.pe{width:24%}td.dk{width:26%}td.ps{width:22%}td.pj{width:24%;background:#fff3b0;border-left:4px solid #ff8f00}
body.dark td.pj{background:#4a3a00;border-left-color:#ffb300}
th.thD{background:#2b6cb0}th.thP{background:#4a6b2a}th.thU{background:#e65100}
td.dk p,td.ps p,td.pj p{margin:0 0 5px}
.act{font-style:italic;color:var(--mute)}
.pj p{font-weight:700;color:#7a2e00}body.dark .pj p{color:#ffd180}
.who{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;margin-right:4px;background:rgba(74,107,42,.15);color:var(--green)}
.hidden-say td.dk,.hidden-say td.ps,.hidden-say td.pj{filter:blur(6px);cursor:pointer}.hidden-say tr.peek td{filter:none}
.badgeU{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;background:#ff8f00;color:#fff;white-space:nowrap}
tr.rowU td{background:rgba(255,143,0,.09)}tr.rowU td:nth-child(2){border-left:4px solid #ff8f00}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:-4px 0 12px}.legend span{padding:3px 10px;border-radius:20px;font-weight:700}
.kilat{font-size:18px;font-weight:800;line-height:1.45;padding:16px 18px;border-radius:12px;background:linear-gradient(90deg,#7b2c3b,#1f4e79);color:#fff;margin-bottom:16px}
.kilat small{display:block;font-size:11px;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:5px solid var(--blue)}
.mcard h3{margin:0 0 10px;font-size:16px}.mcard ul{margin:0;padding-left:20px}.mcard li{margin-bottom:5px}
.mcard.c-key{border-top-color:#d4a017}.mcard.c-crit{border-top-color:var(--blue)}.mcard.c-tx{border-top-color:var(--green)}.mcard.c-ff{border-top-color:var(--red);background:rgba(176,58,46,.05)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--yel);border:1px solid #e5c75a;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
ul.chk{list-style:none;padding-left:0!important}ul.chk li{padding-left:26px;position:relative}ul.chk li:before{content:"☑";position:absolute;left:0;color:var(--blue);font-size:17px;line-height:1.2}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin-bottom:16px}.fig img{max-width:100%;max-height:340px}.fig p{margin:6px 0 0;color:#555;font-size:13px}
.mcard table{margin:0}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.kilat{font-size:16px}}
@media print{.mgrid{grid-template-columns:1fr 1fr}.mcard,.kilat,.fig{break-inside:avoid}td.pj{background:#fff3b0!important}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}.fgrid.one{grid-template-columns:minmax(0,760px);justify-content:center}.fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in}.fig img{width:100%;border-radius:8px;display:block}.fig figcaption{font-size:12.5px;opacity:.8;padding:6px 4px 2px}.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}.lb img{max-width:96vw;max-height:86vh;border-radius:8px}.lb p{color:#fff;font-size:13px}@media(max-width:700px){.fgrid{grid-template-columns:1fr}}@media print{.fgrid{grid-template-columns:1fr 1fr}.fig{break-inside:avoid}}</style></head><body>

a jernih**, pupil normal", "**Visus normal**", "Eversi kelopak: papil/folikel/cobblestone"]}, "tabel": [{"judul": "Jenis konjungtivitis", "h": ["", "Bakteri", "Virus", "Alergi/vernal", "Gonore"], "rows": [["Sekret", "Purulen", "Serosa", "Mukus berserabut", "Hiperpurulen"], ["Tanda", "Papil", "Folikel + KGB preaurikular", "Cobblestone, Trantas dot", "Kemosis, neonatus 2–5 hari"], ["Etiologi", "S. aureus, S. pneumoniae, H. influenzae", "Adenovirus", "Hipersensitivitas", "N. gonorrhoeae"], ["Terapi", "Kloramfenikol ED", "Kompres dingin, air mata buatan", "Antihistamin/Na-kromoglikat", "Seftriakson + rujuk"]]}], "terapi": ["Bersihkan sekret dalam → luar", "Kloramfenikol 0,5% 6 dd gtt I (bakteri)", "Kompres dingin (virus/alergi)", "Higiene tangan, alat pribadi terpisah"], "flaws": ["Lupa visus", "Lupa eversi", "Steroid topikal sembarangan", "Lupa edukasi penularan"]}, "hord": {"kilat": "Benjolan kelopak MERAH + NYERI TEKAN = HORDEOLUM. Tidak nyeri, lama = KALAZION. KOMPRES HANGAT + kloramfenikol, JANGAN dipencet, cek sisi OD/OS.", "kunci": ["Benjolan kelopak", "Nyeri", "Sering mengucek", "Tanpa helm/kacamata", "Berulang"], "kriteria": {"judul": "Hordeolum", "items": ["Infeksi akut **S. aureus** kelenjar kelopak", "Eksterna: **Zeis/Moll** → kulit", "Interna: **Meibom** → konjungtiva tarsal", "Visus normal"]}, "tabel": [{"judul": "DD benjolan kelopak", "h": ["", "Hordeolum", "Kalazion", "Selulitis preseptal"], "rows": [["Nyeri", "+", "−", "+"], ["Onset", "Akut (hari)", "Kronik (minggu)", "Akut + demam"], ["Lesi", "Benjolan hiperemis", "Benjolan keras tenang", "Bengkak difus seluruh kelopak"], ["Terapi", "Kompres hangat + AB topikal", "Kompres + rujuk insisi-kuretase", "AB sistemik, rujuk bila orbita"]]}], "terapi": ["Kompres hangat 10–15 mnt 4–6×", "Kloramfenikol ED tiap 2 jam / salep tiap 8 jam", "Higiene kelopak", "Insisi bila abses/menetap"], "flaws": ["Salah sisi", "Tidak eversi", "Menyuruh memencet"]}, "glak": {"kilat": "Lansia + NYERI MENDADAK + HALO + MUAL + mata ME const S={"diseases": [{"id": "refraksi", "no": 1, "nama": "Kelainan Refraksi & Presbiopia (+ Resep Kacamata)", "skdi": "4A", "ringkas": {"kunci": "Anak sekolah/mahasiswa tidak jelas melihat papan tulis, menyipitkan mata (miopia); mata cepat lelah saat membaca (hipermetropia); berbayang di semua jarak (astigmatisme); usia ≥40 th menjauhkan koran (presbiopia).", "khas": "Visus <6/6 yang MEMBAIK dengan pinhole. Miopia: S− TERKECIL yang memberi 6/6; hipermetropia: S+ TERBESAR yang memberi 6/6; presbiopia: adisi sesuai usia (40 th +1,00 … 60 th +3,00).", "dd": "Katarak (pinhole tidak membaik, lensa keruh) • Ambliopia • Glaukoma kronis (lapang pandang menyempit) • Kelainan retina/saraf optik", "flag": "Kabur MENDADAK, kilatan cahaya/bayangan tirai (ablasio), mata merah nyeri, pinhole tidak membaik → rujuk Sp.M."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Dik. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: An. D., 15 tahun, Kartasura, pelajar SMP."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: kabur jauh/dekat, sejak kapan, progresif", "DOKTER: Keluhannya apa, Dik?\nPASIEN: Kalau lihat tulisan di papan tulis kabur, Dok, sejak 3 bulan. Makin lama makin kabur.\nDOKTER: Kalau baca buku dekat jelas?\nPASIEN: Jelas, Dok."], ["Keluhan penyerta: lelah, sakit kepala, menyipitkan mata, berbayang", "DOKTER: Matanya sering lelah, pusing, atau suka menyipit kalau melihat jauh?\nPASIEN: Iya, sering menyipit, kadang pusing."], ["Red flag: kabur mendadak, kilatan cahaya, tirai, mata merah nyeri", "DOKTER: Pernah tiba-tiba gelap, ada kilatan cahaya, atau mata merah nyeri?\nPASIEN: Tidak pernah, Dok."], ["Riwayat kacamata, kebiasaan membaca/gawai, keluarga berkacamata", "DOKTER: Sudah pernah pakai kacamata? Sering main HP dekat-dekat? Orang tua berkacamata?\nPASIEN: Belum pernah. Main HP lama, Dok. Ayah saya minus."], ["Riwayat penyakit sistemik (DM, HT) & trauma mata", "DOKTER: Ada kencing manis, darah tinggi, atau pernah terbentur di mata?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa tajam penglihatan Adik dengan kartu huruf ini lalu mencoba beberapa lensa. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Menyiapkan Snellen jarak 6 m, pencahayaan cukup", "(Pasien duduk 6 m dari kartu Snellen.)"], ["Visus mata kanan dulu, mata kiri ditutup tanpa ditekan", "DOKTER: Tutup mata kiri dengan telapak tangan, jangan ditekan. Baca huruf dari yang besar ke kecil.\n→ KE PENGUJI: Visus OD 6/30."], ["Visus mata kiri", "→ KE PENGUJI: Visus OS 6/20."], ["Pinhole tiap mata", "(Pasang pinhole di depan mata yang diperiksa.)\n→ KE PENGUJI: Dengan pinhole visus ODS membaik menjadi 6/6 → kelainan refraksi."], ["Koreksi subjektif trial lens: mulai S −0,25, naik bertahap, pilih minus TERKECIL yang memberi 6/6", "DOKTER: Lebih jelas dengan lensa ini atau yang tadi?\n→ KE PENGUJI: OD dikoreksi S −1,50 → 6/6; OS S −1,00 → 6/6. Dipilih minus terkecil yang memberi visus terbaik."], ["Uji binokular & kenyamanan", "DOKTER: Coba lihat dengan kedua mata, nyaman?\nPASIEN: Nyaman, Dok."], ["Mengukur jarak pupil (PD) dengan penggaris", "(Pemeriksa di depan pasien setinggi mata, penggaris di pangkal hidung.)\n→ KE PENGUJI: PD 62 mm."], ["Segmen anterior singkat (senter) & refleks fundus", "→ KE PENGUJI: Segmen anterior ODS tenang, lensa jernih, refleks fundus (+)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan; bila tersedia autorefraktometer."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis ODS miopia ringan (OD S −1,50, OS S −1,00, visus koreksi 6/6). DD: astigmatisme miopia, ambliopia."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan diagnosis (bukan penyakit berbahaya)", "DOKTER: Adik mengalami rabun jauh atau mata minus. Bola mata sedikit lebih panjang sehingga bayangan jatuh di depan saraf mata. Tidak berbahaya dan bisa dikoreksi kacamata."], ["Nonfarmako: aturan 20-20-20, jarak baca 30 cm, aktivitas luar ruang", "DOKTER: Tiap 20 menit melihat layar, lihat jauh ±6 meter selama 20 detik. Baca jarak 30 cm, cahaya cukup, kurangi HP, perbanyak main di luar rumah."], ["Menulis resep kacamata & menyerahkan ke penguji", "→ KE PENGUJI: Ini resep kacamata dengan OD/OS, sferis, PD, dan keperluan melihat jauh, dok."], ["Edukasi: kacamata tidak membuat minus bertambah, kontrol 6–12 bulan, red flag", "DOKTER: Kacamata dipakai terus, tidak membuat minus bertambah. Kontrol tiap 6–12 bulan. Kalau tiba-tiba gelap atau ada kilatan cahaya, segera periksa."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["RESEP KACAMATA", "Nama: An. D.            Umur: 15 tahun", "        Sferis   Silinder   Aksis   Prisma   Basis", "OD      −1,50      —          —       —        —", "OS      −1,00      —          —       —        —", "Add: —      PD: 62 mm      Keperluan: melihat jauh", "                                   (tanda tangan dokter)", "", "— Presbiopia murni (Tn. S., 50 th, visus jauh 6/6) —", "OD/OS: S +2,00 (add)   PD dekat 60 mm (PD jauh − 2 mm)   Keperluan: membaca"], "catatanObat": "Transposisi silinder: S baru = S + C; tanda C dibalik; aksis ±90°. Contoh S −1,00 C −1,00 × 180° = S −2,00 C +1,00 × 90°. Anisometropia dewasa: mata buruk diberi selisih maks S− 3 D / S+ 1,5 D / C 2 D; anak dikoreksi penuh. [UPDATE GUIDELINE] Pada anak, aktivitas luar ruang ≥2 jam/hari terbukti memperlambat progresi miopia (WHO/IMI); atropin dosis rendah 0,01% ranah Sp.M.", "jebakan": ["Menekan bola mata saat menutup / tidak memeriksa bergantian (kanan dulu).", "Memilih minus terbesar (overkoreksi) atau plus terkecil pada hipermetropia.", "Lupa pinhole.", "Resep kacamata tanpa PD atau tanpa keperluan."], "soal": [{"station": "Indra-1", "skenario": "An. D., 15 tahun, mengeluh tidak bisa melihat tulisan di papan tulis sejak 3 bulan. Sering bermain HP dekat.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan visus, pinhole, dan koreksi dengan trial lens", "**Laporkan** hasil & diagnosis", "**Tuliskan** resep kacamata"], "kunci": ["Kabur jauh, dekat jelas, red flag negatif", "OD/OS bergantian, pinhole membaik, S− terkecil 6/6", "ODS miopia ringan", "Resep: OD/OS, S, PD, keperluan jauh"]}, {"station": "Indra-1b", "skenario": "Ny. S., 48 tahun, mengeluh harus menjauhkan HP/koran saat membaca. Penglihatan jauh baik.", "tugas": ["**Periksa** visus jauh dan dekat (Jaeger)", "**Tentukan** adisi", "**Tuliskan** resep kacamata baca"], "kunci": ["Visus jauh 6/6, Jaeger 30–33 cm", "Usia 48 → add ±+1,50 sampai +2,00", "Resep add + PD dekat + keperluan membaca"]}]}, {"id": "konj", "no": 2, "nama": "Konjungtivitis (Bakteri, Virus, Alergi)", "skdi": "4A", "ringkas": {"kunci": "Mata merah, belekan/berair, gatal/mengganjal, VISUS NORMAL, kontak dengan orang sakit serupa; alergi: atopi, gatal hebat musiman.", "khas": "Injeksi konjungtiva (merah di forniks, memudar ke limbus), sekret (+), kornea jernih, visus normal. Bakteri = purulen lengket pagi; virus = serosa + folikel + KGB preaurikular; alergi = gatal + cobblestone/Trantas dot.", "dd": "Keratitis (visus turun, infiltrat) • Uveitis anterior (injeksi siliar, miosis) • Glaukoma akut • Episkleritis (sektoral, tanpa sekret) • Perdarahan subkonjungtiva", "flag": "Visus turun, nyeri hebat, fotofobia berat, injeksi siliar, neonatus sekret hiperpurulen (gonore), tidak membaik 3–5 hari → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. W., 25 tahun, Sukoharjo, karyawan."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama, mata mana, onset", "DOKTER: Apa yang dikeluhkan?\nPASIEN: Mata kanan merah sejak 2 hari, Dok.\nDOKTER: Satu mata atau dua?\nPASIEN: Kanan saja."], ["Sekret: warna, banyak, lengket saat bangun", "DOKTER: Ada kotoran mata? Warnanya? Lengket saat bangun pagi?\nPASIEN: Ada belek kuning kental, pagi sampai lengket susah dibuka."], ["Gatal vs nyeri, silau, penglihatan turun (red flag)", "DOKTER: Gatal atau nyeri? Silau? Penglihatan kabur?\nPASIEN: Mengganjal saja, tidak nyeri, tidak kabur."], ["Kontak, ISPA, atopi, lensa kontak, trauma/benda asing", "DOKTER: Ada orang di rumah/kantor yang matanya merah juga? Batuk pilek? Riwayat alergi? Pakai lensa kontak? Kelilipan?\nPASIEN: Teman kantor ada yang merah juga. Tidak pakai softlens, tidak kelilipan."], ["Pengobatan sebelumnya", "DOKTER: Sudah pakai obat tetes apa?\nPASIEN: Belum, Dok."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Mbak dengan kartu huruf dan senter. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS (kanan dulu)", "→ KE PENGUJI: Visus OD 6/6, OS 6/6."], ["Memakai sarung tangan", "(Memakai sarung tangan — konjungtivitis menular.)"], ["Inspeksi segmen anterior dengan senter dari luar ke dalam", "→ KE PENGUJI: OD palpebra edema ringan, injeksi konjungtiva (+), sekret mukopurulen, kornea jernih, COA dalam, pupil bulat isokor refleks (+), lensa jernih. OS tenang."], ["Eversi palpebra superior", "DOKTER: Lihat ke bawah ya, kelopak saya balik sebentar.\n→ KE PENGUJI: Konjungtiva tarsal hiperemis, papil (+), folikel (−), cobblestone (−), benda asing (−)."], ["Palpasi KGB preaurikular & TIO palpasi", "→ KE PENGUJI: KGB preaurikular tidak teraba. TIO palpasi ODS N."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang (bila perlu)", "→ KE PENGUJI: Umumnya tidak perlu. Bila hiperpurulen/neonatus/tidak membaik: pewarnaan Gram & Giemsa sekret."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OD konjungtivitis bakterial akut. DD: konjungtivitis viral, konjungtivitis alergi, keratitis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan penyakit & penularan", "DOKTER: Ini radang selaput mata karena kuman, Mbak. Menular lewat tangan dan handuk."], ["Nonfarmako: bersihkan sekret, cuci tangan, alat pribadi terpisah, jangan mengucek", "DOKTER: Bersihkan belek dengan kapas dan air matang dari sudut dalam ke luar, kapas sekali pakai. Sering cuci tangan, handuk dan bantal jangan dipakai bersama, jangan dikucek."], ["Menulis resep & mengajarkan cara tetes mata", "DOKTER: Teteskan 1 tetes tiap 4 jam di kelopak bawah, ujung botol jangan menyentuh mata, lalu tutup mata dan tekan sudut dalam 1 menit.\n→ KE PENGUJI: Ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau jadi kabur, nyeri hebat, silau, atau 3–5 hari tidak membaik, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Kloramfenikol 0,5% tetes mata fl. 5 mL No. I", "   S 6 dd gtt I OD", "   ———————————— paraf", "R/ Kloramfenikol 1% salep mata tube 3,5 g No. I", "   S 1 dd ue OD malam hari", "   ———————————— paraf", "Pro: Nn. W., 25 tahun", "Alamat: ……"], "catatanObat": "Bakteri: kloramfenikol 0,5% 4–6×/hari 5–7 hari (alternatif levofloksasin 0,5%, gentamisin 0,3%). Virus: kompres dingin + air mata buatan, tanpa antibiotik. Alergi: antihistamin topikal/Na-kromoglikat 2% 4×/hari. Gonore dewasa: seftriakson 1 g IM dosis tunggal; neonatus 25–50 mg/kgBB (maks 125 mg) + rujuk. [UPDATE GUIDELINE] Etiologi virus tersering adenovirus, bukan H. influenzae (bakteri).", "jebakan": ["Tidak memeriksa visus.", "Tidak eversi kelopak.", "Memberi steroid topikal tanpa diagnosis pasti.", "Lupa edukasi penularan."], "soal": [{"station": "Indra-2", "skenario": "Nn. W., 25 tahun, mata kanan merah dan belekan kuning sejak 2 hari, teman sekantor sakit serupa.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan mata yang relevan", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep dan **ajarkan** cara memakai obat"], "kunci": ["Sekret purulen lengket pagi, visus tidak turun", "Visus 6/6, injeksi konjungtiva, eversi papil", "Konjungtivitis bakterial; DD viral, alergi, keratitis", "Kloramfenikol ED + teknik tetes + KIE penularan"]}, {"station": "Indra-2b", "skenario": "An. R., 12 tahun, kedua mata sangat gatal tiap musim panas, riwayat asma. Eversi: papil besar seperti batu bulat.", "tugas": ["**Sebutkan** diagnosis & tanda khasnya", "**Tuliskan** terapi"], "kunci": ["Konjungtivitis vernal; cobblestone, Trantas dot, sekret mukus berserabut", "Kompres dingin, Na-kromoglikat/antihistamin topikal, hindari pencetus; steroid oleh Sp.M"]}]}, {"id": "hord", "no": 3, "nama": "Hordeolum (DD Kalazion)", "skdi": "4A", "ringkas": {"kunci": "Dewasa muda, benjolan kelopak merah-nyeri-mengganjal 2–3 hari, sering mengucek, jarang memakai helm/kacamata, bisa berulang.", "khas": "Benjolan hiperemis, edema, NYERI TEKAN di kelopak; eksterna (Zeis/Moll) menonjol ke kulit, interna (Meibom) menonjol ke konjungtiva tarsal. Visus normal.", "dd": "Kalazion (tidak nyeri, tidak radang, berminggu) • Abses palpebra (fluktuasi) • Selulitis preseptal (bengkak difus, demam) • Kista Moll", "flag": "Bengkak meluas seluruh kelopak, demam, proptosis/gerak bola mata terbatas (selulitis orbita), visus turun, tidak membaik 1–2 minggu → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. A., 20 tahun, Boyolali, mahasiswi."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: lokasi, onset, perjalanan", "DOKTER: Ada keluhan apa?\nPASIEN: Ada benjolan di kelopak atas mata kiri sejak 3 hari, Dok. Awalnya gatal, lalu merah, membesar, dan nyeri."], ["Nyeri, nanah, gangguan penglihatan, demam", "DOKTER: Keluar nanah? Penglihatan kabur? Demam?\nPASIEN: Tidak keluar nanah, tidak kabur, tidak demam."], ["Riwayat serupa & faktor risiko (mengucek, kosmetik, helm/kacamata)", "DOKTER: Pernah seperti ini? Sering mengucek mata? Pakai make-up mata? Naik motor pakai helm berkaca?\nPASIEN: 3 bulan lalu pernah, Dok. Sering kucek, jarang pakai helm tertutup."], ["Komorbid: DM, blefaritis", "DOKTER: Ada kencing manis atau kelopak sering bersisik?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa kelopak mata Mbak dengan senter. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus OD 6/6, OS 6/6."], ["Inspeksi kelopak: lokasi, ukuran, warna, letak terhadap bulu mata", "→ KE PENGUJI: OS palpebra superior tampak benjolan ±0,5 cm di dekat pangkal bulu mata, hiperemis, edema."], ["Palpasi: nyeri tekan, fluktuasi", "(Memakai sarung tangan, palpasi lembut.)\n→ KE PENGUJI: Nyeri tekan (+), fluktuasi (−), hangat."], ["Eversi kelopak (interna/eksterna) & segmen anterior", "→ KE PENGUJI: Konjungtiva tarsal tenang → hordeolum eksterna. Konjungtiva bulbi tenang, kornea jernih, pupil normal, gerak bola mata bebas."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan; berulang → cek GDS."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OS hordeolum eksterna palpebra superior. DD: kalazion, abses palpebra, selulitis preseptal."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ini bintitan, infeksi kelenjar di kelopak mata, Mbak. Bisa sembuh dengan obat dan kompres."], ["Nonfarmako: kompres hangat 10–15 menit 4–6×/hari, jangan dipencet", "DOKTER: Kompres air hangat 10–15 menit 4–6 kali sehari. Jangan dipencet atau ditusuk, jangan dikucek, sementara stop make-up mata, pakai helm berkaca."], ["Menulis resep & menyerahkan", "DOKTER: Obat tetes tiap 2 jam saat siang, salep sebelum tidur di mata kiri.\n→ KE PENGUJI: Ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau bengkak seluruh kelopak, demam, mata menonjol atau sulit digerakkan, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Kloramfenikol 0,5% tetes mata fl. 5 mL No. I", "   S tiap 2 jam gtt I OS (siang hari)", "   ———————————— paraf", "R/ Kloramfenikol 1% salep mata tube 3,5 g No. I", "   S 1 dd ue OS malam hari", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri", "   ———————————— paraf", "Pro: Nn. A., 20 tahun", "Alamat: ……"], "catatanObat": "PPK FKTP: kloramfenikol tetes tiap 2 jam atau salep tiap 8 jam; antibiotik sistemik (eritromisin 4 × 250–500 mg) hanya bila berat/tanda selulitis. [UPDATE GUIDELINE] Resep les menulis OD padahal lesi di OS dan S 4 dd — perbaiki sisi & frekuensi. Insisi bila tidak membaik/abses.", "jebakan": ["Salah sisi OD/OS.", "Tidak eversi kelopak.", "Menganjurkan memencet.", "Lupa kompres hangat."], "soal": [{"station": "Indra-3", "skenario": "Nn. A., 20 tahun, benjolan kelopak atas mata kiri 3 hari, awalnya gatal lalu merah, nyeri, mengganjal. Riwayat serupa 3 bulan lalu.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik mata", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep"], "kunci": ["Faktor risiko kucek/helm, berulang", "Benjolan nyeri tekan, eversi → eksterna", "OS hordeolum eksterna; DD kalazion, selulitis preseptal", "Kloramfenikol OS + kompres hangat"]}, {"station": "Indra-3b", "skenario": "Tn. K., 35 tahun, benjolan kelopak bawah kanan 6 minggu, tidak nyeri, tidak merah.", "tugas": ["**Sebutkan** diagnosis & pembeda dengan hordeolum", "**Sebutkan** tatalaksana"], "kunci": ["Kalazion: granulomatosa kronis Meibom, tidak nyeri/radang", "Kompres hangat + pijat; menetap → rujuk insisi-kuretase; berulang pada lansia curigai keganasan"]}]}, {"id": "glak", "no": 4, "nama": "Glaukoma Akut (Sudut Tertutup Primer)", "skdi": "3B", "ringkas": {"kunci": "Lansia (perempuan, hipermetropia), mata NYERI mendadak + kabur mendadak + merah + melihat PELANGI/halo + sakit kepala, mual-muntah; pencetus gelap/obat pelebar pupil.", "khas": "Visus turun, injeksi siliar, kornea EDEMA/suram, COA DANGKAL, pupil MID-DILATASI refleks (−), TIO sangat tinggi (N+3). Trias glaukoma: TIO >21, C/D >0,5, defek lapang pandang.", "dd": "Uveitis anterior (miosis, TIO normal/rendah) • Keratitis/ulkus kornea (infiltrat) • Endoftalmitis (hipopion) • Konjungtivitis (visus normal) • Migren (mata tenang)", "flag": "Kegawatan — kebutaan permanen dalam jam–hari: turunkan TIO lalu RUJUK SEGERA Sp.M (iridotomi laser)."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. Y., 65 tahun, Klaten, pensiunan."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: mata mana, onset, nyeri", "DOKTER: Apa yang dirasakan, Pak?\nPASIEN: Mata kiri sakit sekali sejak 2 jam, Dok, tiba-tiba kabur dan merah."], ["Halo/pelangi, sakit kepala, mual-muntah", "DOKTER: Melihat lampu ada pelanginya? Kepala pusing, mual?\nPASIEN: Iya, lampu seperti ada pelanginya, pusing, mual."], ["Pencetus: ruangan gelap, obat tetes pelebar pupil/flu", "DOKTER: Sebelumnya di ruangan gelap atau habis pakai obat tetes/obat flu?\nPASIEN: Habis nonton bioskop, Dok."], ["Riwayat serupa ringan, kacamata plus, operasi/trauma mata", "DOKTER: Pernah keluhan ringan seperti ini? Pakai kacamata plus?\nPASIEN: Pakai kacamata plus untuk jauh."], ["Kontraindikasi obat: asma/PPOK, bradikardia, alergi sulfa, batu/gagal ginjal; DM, HT", "DOKTER: Ada asma, sakit jantung, alergi obat sulfa, batu atau sakit ginjal? Gula, darah tinggi?\nPASIEN: Tidak asma, Dok. Ada kencing manis dan darah tinggi."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Bapak; saya akan menekan kelopak mata pelan untuk menilai tekanan bola mata. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus OD 6/9, OS lambaian tangan (1/300)."], ["Segmen anterior OS: injeksi, kornea", "→ KE PENGUJI: OS injeksi konjungtiva + injeksi siliar, kornea edema suram."], ["COA dengan senter dari temporal", "(Senter disorot dari temporal sejajar iris.)\n→ KE PENGUJI: COA dangkal — bayangan iris di sisi nasal (shadow sign +)."], ["Pupil & refleks cahaya", "→ KE PENGUJI: Pupil OS mid-dilatasi ±5 mm, refleks cahaya langsung & tidak langsung (−)."], ["TIO palpasi bandingkan kanan-kiri (pasien melirik ke bawah)", "DOKTER: Lirik ke bawah, mata jangan dipejamkan.\n→ KE PENGUJI: TIO palpasi OD N, OS N+3 (keras seperti batu)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tonometri Schiötz bila ada; gonioskopi & perimetri di Sp.M; GDS dan elektrolit."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OS glaukoma akut sudut tertutup primer. DD: uveitis anterior, keratitis, endoftalmitis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan kegawatan & rujukan segera", "DOKTER: Pak, tekanan bola mata kiri sangat tinggi. Ini gawat darurat mata; kalau terlambat bisa buta permanen. Saya beri obat penurun tekanan lalu Bapak saya rujuk hari ini ke dokter spesialis mata."], ["Nonfarmako: berbaring terlentang, ruangan terang, hindari obat pelebar pupil", "DOKTER: Berbaring telentang dulu di ruangan terang, jangan menekan atau mengucek mata."], ["Menulis resep penurun TIO & menyerahkan", "→ KE PENGUJI: Asetazolamid loading 500 mg lalu 4 × 250 mg, KCl, timolol 0,5%, steroid-antibiotik topikal; ini resepnya, dok."], ["Edukasi: mata sebelah juga berisiko, kontrol DM-HT", "DOKTER: Mata kanan juga berisiko, nanti dokter mata biasanya melakukan laser pencegahan. Gula dan tensi tetap dikontrol."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Asetazolamid tab 250 mg No. VI", "   S tab II sekali minum (segera), lalu 4 dd tab I", "   ———————————— paraf", "R/ KCl tab 500 mg No. II", "   S 2 dd tab I", "   ———————————— paraf", "R/ Timolol maleat 0,5% tetes mata fl. 5 mL No. I", "   S 2 dd gtt I OS", "   ———————————— paraf", "R/ Deksametason–neomisin–polimiksin B tetes mata fl. 5 mL No. I", "   S 4 dd gtt I OS", "   ———————————— paraf", "Pro: Tn. Y., 65 tahun", "Alamat: ……"], "catatanObat": "PPK FKTP: asetazolamid 500 mg lalu 4 × 250 mg + KCl 0,25 g 2×/hari; timolol 0,5% 2 × 1 tetes (KI asma, PPOK, bradikardia, blok AV); steroid–antibiotik topikal 4–6×; analgesik, antiemetik. Pilokarpin 2% efektif setelah TIO mulai turun. Asetazolamid hati-hati pada alergi sulfa & gagal ginjal. [UPDATE GUIDELINE] Resep les asetazolamid 250 mg No. II hanya dosis loading — tambahkan lanjutan 4 × 250 mg.", "jebakan": ["Tidak merujuk segera.", "Tidak memeriksa COA, pupil, TIO.", "Timolol pada asma; asetazolamid tanpa tanya alergi sulfa/ginjal.", "Memberi tetes midriatik."], "soal": [{"station": "Indra-4", "skenario": "Tn. Y., 65 tahun, mata kiri nyeri mendadak 2 jam, kabur, merah, melihat pelangi, mual. Riwayat DM & HT.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan mata termasuk TIO palpasi", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep dan **jelaskan** rencana rujukan"], "kunci": ["Halo, pencetus gelap, KI obat", "Visus 1/300, injeksi siliar, kornea edema, COA dangkal, pupil mid-dilatasi, N+3", "Glaukoma akut sudut tertutup; DD uveitis, keratitis", "Asetazolamid loading + lanjutan + KCl, timolol, rujuk segera"]}, {"station": "Indra-4b", "skenario": "Ny. M., 58 tahun, sering menabrak benda di sisi kiri-kanan, mata tenang, tidak nyeri. Ibunya buta karena glaukoma.", "tugas": ["**Lakukan** pemeriksaan lapang pandang konfrontasi", "**Sebutkan** diagnosis & tatalaksana"], "kunci": ["Konfrontasi menyempit (tunnel vision)", "Glaukoma kronis sudut terbuka; timolol 2×/latanoprost malam, rujuk Sp.M perimetri"]}]}, {"id": "epis", "no": 5, "nama": "Episkleritis (DD Skleritis)", "skdi": "4A", "ringkas": {"kunci": "Dewasa muda perempuan, mata merah SEKTORAL, nyeri ringan/mengganjal, kering, tanpa sekret, visus normal; memberat di lingkungan berdebu; bisa kambuh, terkait reumatik.", "khas": "Hiperemis sektoral episklera merah terang–salmon, sekret (−), visus normal, nyeri tekan ringan; tes FENILEFRIN 2,5% → MEMUCAT (skleritis tidak).", "dd": "Skleritis (nyeri hebat, keunguan, tidak memucat) • Perdarahan subkonjungtiva • Konjungtivitis (sekret, difus) • Mata kering", "flag": "Nyeri hebat membangunkan tidur, warna keunguan, visus turun → curiga skleritis, rujuk Sp.M."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. B., 23 tahun, Solo, kurir paket."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama: lokasi kemerahan, onset", "DOKTER: Apa keluhannya?\nPASIEN: Mata kanan merah sebagian di sisi luar sejak 4 hari, Dok."], ["Nyeri (ringan vs hebat), sekret, gatal, silau, penglihatan", "DOKTER: Nyerinya seberapa? Sampai terbangun malam? Ada belek? Kabur?\nPASIEN: Nyeri ringan, mengganjal dan kering. Tidak belekan, tidak kabur."], ["Pencetus & pekerjaan (debu)", "DOKTER: Kerjanya di mana? Memberat kalau kena apa?\nPASIEN: Di jalan, Dok, memberat kalau berdebu."], ["Riwayat kambuh & penyakit reumatik/autoimun", "DOKTER: Pernah seperti ini? Ada nyeri sendi, ruam, atau penyakit autoimun?\nPASIEN: Pernah sekali tahun lalu. Tidak ada nyeri sendi."], ["Obat yang sudah dipakai", "DOKTER: Sudah pakai obat?\nPASIEN: Tetes air mata buatan dari apotek, belum membaik."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Mbak dengan senter. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus OD 6/6, OS 6/6."], ["Inspeksi segmen anterior", "→ KE PENGUJI: OD tampak injeksi episklera sektoral di bagian temporal bulbi, merah terang, sekret (−). Konjungtiva tarsal tenang, kornea jernih, COA normal, pupil normal, lensa jernih."], ["Nyeri tekan ringan & TIO palpasi", "→ KE PENGUJI: Nyeri tekan ringan pada area merah. TIO ODS N."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang: tes fenilefrin 2,5%", "→ KE PENGUJI: Saya usulkan tes tetes fenilefrin 2,5%: bila kemerahan memucat → episkleritis; tidak memucat → skleritis."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OD episkleritis simpel sektoral. DD: skleritis, perdarahan subkonjungtiva, konjungtivitis, mata kering."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan (dapat sembuh sendiri)", "DOKTER: Ini radang ringan di lapisan putih mata bagian luar. Tidak menular dan biasanya sembuh 1–3 minggu."], ["Nonfarmako: kompres dingin, kacamata pelindung, hindari debu", "DOKTER: Kompres dingin, pakai kacamata saat di jalan, jangan dikucek."], ["Menulis resep & menyerahkan", "DOKTER: Karena sudah kambuh dan belum membaik, saya beri tetes antiradang ringan 4 kali sehari dan obat nyeri.\n→ KE PENGUJI: Ini resepnya, dok."], ["Tanda bahaya & kontrol 1 minggu (pantau TIO)", "DOKTER: Kontrol 1 minggu. Bila nyeri hebat, warna keunguan, atau kabur, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Fluorometolon 0,1% tetes mata fl. 5 mL No. I", "   S 4 dd gtt I OD", "   ———————————— paraf", "R/ Ibuprofen tab 400 mg No. X", "   S 3 dd tab I p.c.", "   ———————————— paraf", "Pro: Nn. B., 23 tahun", "Alamat: ……", "", "— Episode pertama: R/ Air mata buatan fl. No. I, S 6 dd gtt I OD —"], "catatanObat": "Lini pertama air mata buatan + kompres dingin; kambuh/tidak respons → fluorometolon 0,1% 4×/hari singkat lalu tapering (pantau TIO, maks 1–2 minggu tanpa Sp.M); NSAID oral bila noduler/nyeri.", "jebakan": ["Tidak membedakan dari skleritis.", "Steroid lama tanpa kontrol TIO.", "Lupa memeriksa visus."], "soal": [{"station": "Indra-5", "skenario": "Nn. B., 23 tahun, mata kanan merah 4 hari, nyeri ringan, kering, tanpa sekret. Bekerja di luar ruangan.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan mata", "**Usulkan** penunjang pembeda", "**Sampaikan** diagnosis & **tuliskan** resep"], "kunci": ["Nyeri ringan, sekret −, reumatik", "Injeksi episklera sektoral, visus normal", "Fenilefrin 2,5% memucat", "Episkleritis; air mata buatan/fluorometolon + ibuprofen"]}, {"station": "Indra-5b", "skenario": "Ny. L., 45 tahun, penderita artritis reumatoid, mata kiri merah keunguan dan nyeri hebat sampai terbangun malam.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** pembeda & tindakan"], "kunci": ["Skleritis", "Nyeri hebat, keunguan, tidak memucat fenilefrin → rujuk Sp.M"]}]}, {"id": "bam", "no": 6, "nama": "Benda Asing Konjungtiva (+ Prosedur Ekstraksi)", "skdi": "4A", "ringkas": {"kunci": "Pekerja gerinda/las/keramik 'kelilipan', nyeri, merah, berair, mengganjal, silau.", "khas": "Benda asing tampak di konjungtiva bulbi/tarsal (cari dengan EVERSI kelopak atas), kornea jernih. Di KORNEA → rujuk.", "dd": "Benda asing kornea/rust ring • Abrasi kornea • Trauma tembus (palu-logam kecepatan tinggi) • Konjungtivitis", "flag": "Benda asing di kornea, dugaan trauma tembus (COA dangkal, pupil lonjong, TIO rendah), nyeri/kabur menetap → rujuk Sp.M."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. H., 30 tahun, Sragen, tukang las."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & mekanisme", "DOKTER: Ada keluhan apa?\nPASIEN: Mata kanan kelilipan serpihan besi waktu menggerinda tadi pagi, Dok, perih dan berair."], ["Kecepatan benda (palu-logam), pelindung mata", "DOKTER: Waktu itu pakai kacamata pelindung? Memalu logam atau menggerinda?\nPASIEN: Menggerinda, tidak pakai kacamata."], ["Penglihatan, nyeri, silau, sudah dikucek/dicuci", "DOKTER: Penglihatan kabur? Silau? Sudah dikucek atau dicuci?\nPASIEN: Tidak kabur, silau sedikit, sudah dicuci air tapi masih mengganjal."], ["Riwayat tetanus & alergi obat", "DOKTER: Ada alergi obat, terutama obat bius tetes?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Bapak lalu mengambil benda asingnya setelah diberi tetes bius. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus OD 6/6, OS 6/6."], ["Inspeksi dengan senter + lup, eversi kelopak", "DOKTER: Lirik ke bawah, kelopak saya balik.\n→ KE PENGUJI: OD injeksi konjungtiva (+), tampak benda asing kecil kehitaman di konjungtiva tarsal superior; kornea jernih, COA dalam, pupil bulat."], ["Persiapan alat & sarung tangan, posisi pasien berbaring, penerangan baik", "(Siapkan pantokain 2%, lidi kapas steril + NaCl, jarum 23–25 G, lup, povidone iodine, salep antibiotik, kasa. Pakai sarung tangan.)"], ["Anestesi topikal pantokain 2% 1–2 tetes, tunggu 1–2 menit", "DOKTER: Saya tetes obat bius dulu, sedikit perih lalu kebas."], ["Ekstraksi dengan lidi kapas basah / jarum 23–25 G, bevel ke atas, gerak menjauhi kornea", "DOKTER: Lihat ke arah sana dan tahan ya.\n(Benda asing diangkat dengan lidi kapas basah; bila melekat dengan jarum, bevel menghadap pemeriksa, gerak menjauhi kornea.)\n→ KE PENGUJI: Benda asing berhasil diangkat utuh."], ["Povidone iodine pada bekas lesi, salep antibiotik ± bebat, cek ulang visus", "(Oles povidone iodine dengan lidi kapas, beri salep kloramfenikol.)\n→ KE PENGUJI: Visus ulang OD 6/6."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak perlu; fluoresein bila curiga abrasi kornea."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OD benda asing konjungtiva tarsal superior. DD: benda asing kornea, abrasi kornea, trauma tembus."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan tindakan selesai", "DOKTER: Serpihan besinya sudah saya ambil, Pak."], ["Edukasi: jangan mengucek (masih kebas), tidak membawa pulang tetes bius", "DOKTER: Mata masih kebas 15–20 menit, jangan dikucek. Obat bius tidak boleh dibawa pulang karena merusak kornea."], ["Menulis resep & menyerahkan", "DOKTER: Salep dioles 3 kali sehari di mata kanan 5 hari.\n→ KE PENGUJI: Ini resepnya, dok."], ["APD kerja & tanda bahaya, kontrol besok", "DOKTER: Selalu pakai kacamata pelindung saat menggerinda. Kontrol besok; kalau nyeri atau kabur, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Kloramfenikol 1% salep mata tube 3,5 g No. I", "   S 3 dd ue OD", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri", "   ———————————— paraf", "Pro: Tn. H., 30 tahun", "Alamat: ……"], "catatanObat": "Benda asing konjungtiva Tuntas (SKDI 2026); kornea → awal & rujuk. Cek status tetanus bila luka. Jangan berikan anestesi topikal untuk dibawa pulang.", "jebakan": ["Tanpa anestesi topikal/sarung tangan.", "Tidak eversi kelopak.", "Mengambil benda asing kornea atau pada dugaan trauma tembus.", "Memberi tetes anestesi untuk dibawa pulang."], "soal": [{"station": "Indra-6", "skenario": "Tn. H., 30 tahun, tukang las, kelilipan serpihan besi saat menggerinda tanpa kacamata, perih dan berair.", "tugas": ["**Lakukan** anamnesis singkat", "**Lakukan** pemeriksaan dan **ekstraksi benda asing** pada manekin", "**Tuliskan** resep", "**Edukasi** pasien"], "kunci": ["Mekanisme, APD, penglihatan", "Visus → eversi → pantokain → lidi kapas/jarum → povidone iodine → salep → visus ulang", "Kloramfenikol salep", "Jangan kucek, APD, tidak membawa anestesi"]}, {"station": "Indra-6b", "skenario": "Tn. J., 40 tahun, memalu paku besi lalu mata kiri sakit dan kabur. Pupil lonjong, COA dangkal.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** tindakan di FKTP"], "kunci": ["Trauma tembus bola mata", "No drops no ointment, eye shield tanpa menekan, jangan cabut benda, puasakan, antiemetik, profilaksis tetanus, rujuk segera"]}]}, {"id": "tkimia", "no": 7, "nama": "Trauma Kimia Mata (+ Prosedur Irigasi)", "skdi": "3B", "ringkas": {"kunci": "Mata tersiram cairan pembersih lantai/kapur/semen/aki; nyeri, merah, berair, silau.", "khas": "Kegawatan: IRIGASI SEGERA (sebelum anamnesis lengkap & visus) dengan NaCl 0,9% ±2 L/15–30 menit sampai pH 7–7,5; BASA (kapur, semen) lebih destruktif dari ASAM.", "dd": "Trauma asam vs basa • Trauma termal • Benda asing • Konjungtivitis kimia ringan", "flag": "Kornea keruh, iskemia limbus (putih pucat), visus turun → stabilisasi & rujuk segera Sp.M."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. T., 38 tahun, Wonogiri, ibu rumah tangga."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Identifikasi cepat: bahan apa, kapan, mata mana (sambil menyiapkan irigasi)", "DOKTER: Bu, kena cairan apa, kapan, dan mata yang mana?\nPASIEN: Cairan pembersih lantai, 10 menit lalu, mata kiri, Dok. Perih sekali!"], ["Pertolongan pertama yang sudah dilakukan", "DOKTER: Sudah dibilas air?\nPASIEN: Sudah dibilas air kran sebentar."], ["(Setelah irigasi) penglihatan, nyeri, riwayat alergi", "DOKTER: Sekarang penglihatannya bagaimana? Ada alergi obat?\nPASIEN: Masih agak kabur, tidak ada alergi."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Ibu dan membilasnya dengan cairan infus cukup lama. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Memakai APD (sarung tangan, celemek)", "(Memakai sarung tangan dan celemek.)"], ["Tetes anestesi pantokain 2% bila tersedia", "DOKTER: Saya beri tetes bius dulu supaya bisa dibuka."], ["Cek pH awal dengan kertas lakmus di forniks", "→ KE PENGUJI: pH awal 10 (basa)."], ["Irigasi NaCl 0,9% via selang infus, kepala miring ke sisi sakit, kelopak dibuka, pasien melirik ke segala arah, eversi & sapu forniks", "DOKTER: Ibu miring ke kiri, mata dibuka, lirik ke atas, bawah, kanan, kiri.\n(Irigasi ±2 L/15–30 menit; eversi kelopak, partikel di forniks disapu lidi kapas basah.)"], ["Cek pH ulang 5–10 menit setelah irigasi", "→ KE PENGUJI: pH ulang 7,2 → irigasi dihentikan."], ["Visus & segmen anterior setelah irigasi", "→ KE PENGUJI: Visus OS 6/12. Injeksi konjungtiva, kornea erosi ringan tanpa kekeruhan, iskemia limbus (−), COA dalam."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Kertas pH; fluoresein untuk defek epitel."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OS trauma kimia basa derajat ringan (pascairigasi). DD: trauma asam, trauma termal."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan & rujukan", "DOKTER: Cairan basa bisa merusak kornea lebih dalam, Bu. Mata sudah dibilas; Ibu saya rujuk ke dokter mata hari ini untuk pemeriksaan lanjut."], ["Terapi awal: antibiotik topikal, sikloplegik/analgesik, bebat longgar", "→ KE PENGUJI: Saya berikan salep antibiotik dan analgesik oral, lalu rujuk Sp.M. Steroid topikal dan vitamin C diputuskan Sp.M."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Ini resepnya, dok."], ["Edukasi pencegahan: simpan bahan kimia aman, kacamata saat bersih-bersih, bilas segera bila terkena", "DOKTER: Kalau terkena lagi, segera bilas air mengalir minimal 15 menit sebelum ke klinik. Pakai kacamata saat memakai bahan kimia."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Kloramfenikol 1% salep mata tube 3,5 g No. I", "   S 4 dd ue OS", "   ———————————— paraf", "R/ Parasetamol tab 500 mg No. X", "   S 3 dd tab I p.r.n. nyeri", "   ———————————— paraf", "Pro: Ny. T., 38 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: AAO/EyeWiki Chemical Burns] Irigasi lebih dulu daripada anamnesis lengkap & visus; target pH 7–7,5; ulang cek pH 5–10 menit kemudian. Basa → saponifikasi, penetrasi dalam (prognosis lebih buruk); asam → koagulasi protein, superfisial. Steroid topikal, sikloplegik, vitamin C, doksisiklin oral → wewenang Sp.M.", "jebakan": ["Menunda irigasi untuk anamnesis/visus.", "Irigasi <15 menit tanpa cek pH.", "Tidak eversi & sapu forniks.", "Tidak merujuk trauma basa."], "soal": [{"station": "Indra-7", "skenario": "Ny. T., 38 tahun, mata kiri tersiram cairan pembersih lantai 10 menit lalu, perih sekali.", "tugas": ["**Lakukan** tatalaksana awal pada manekin", "**Lakukan** pemeriksaan setelah tindakan", "**Sampaikan** diagnosis", "**Tuliskan** resep & rencana rujukan"], "kunci": ["Irigasi segera NaCl 2 L dengan cek pH awal-akhir, eversi", "Visus, kornea, limbus", "Trauma kimia basa", "Salep AB + analgesik, rujuk Sp.M"]}, {"station": "Indra-7b", "skenario": "Tn. G., 28 tahun, mata kanan terkena air aki (asam).", "tugas": ["**Sebutkan** perbedaan trauma asam vs basa", "**Sebutkan** prinsip tatalaksana"], "kunci": ["Asam koagulasi superfisial; basa saponifikasi dalam", "Irigasi sampai pH normal, sama untuk keduanya, rujuk"]}]}, {"id": "psk", "no": 8, "nama": "Perdarahan Subkonjungtiva", "skdi": "4A", "ringkas": {"kunci": "Bercak merah terang di putih mata, TANPA nyeri, visus normal, setelah batuk keras/mengejan/muntah; hipertensi, antikoagulan.", "khas": "Bercak merah homogen batas tegas di bawah konjungtiva bulbi, tidak ada sekret, kornea jernih, visus normal; diserap spontan 1–2 minggu.", "dd": "Konjungtivitis hemoragik (sekret, nyeri) • Episkleritis • Trauma bola mata (ruptur) • Kelainan darah", "flag": "Berulang, perdarahan di tempat lain (gusi, memar), pemakai warfarin, trauma berat/perdarahan 360° dengan kemosis → periksa lanjut/rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. P., 55 tahun, Karanganyar, pedagang."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & onset", "DOKTER: Ada apa, Pak?\nPASIEN: Bangun tidur mata kanan ada merah darah, Dok. Tidak sakit."], ["Pencetus: batuk, mengejan, muntah, trauma", "DOKTER: Sebelumnya batuk keras, mengejan, muntah, atau terbentur?\nPASIEN: Semalam batuk terus, Dok."], ["Nyeri, kabur, belek", "DOKTER: Ada nyeri, kabur, belek?\nPASIEN: Tidak ada."], ["Hipertensi, obat pengencer darah, perdarahan lain", "DOKTER: Ada darah tinggi? Minum obat pengencer darah? Gusi mudah berdarah atau mudah memar?\nPASIEN: Darah tinggi, Dok, obatnya kadang lupa. Tidak minum pengencer darah."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Bapak dan tekanan darahnya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Tekanan darah (penting)", "→ KE PENGUJI: TD 160/100 mmHg."], ["Visus ODS", "→ KE PENGUJI: Visus OD 6/6, OS 6/6."], ["Inspeksi segmen anterior", "→ KE PENGUJI: OD tampak bercak merah terang homogen batas tegas di konjungtiva bulbi temporal, kemosis (−), sekret (−), kornea jernih, COA dalam, pupil normal."], ["Inspeksi tanda perdarahan lain (petekie, memar)", "→ KE PENGUJI: Petekie dan memar tidak ditemukan."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang (bila berulang/curiga koagulopati)", "→ KE PENGUJI: Bila berulang: darah lengkap, trombosit, PT/APTT."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis OD perdarahan subkonjungtiva e.c. batuk, hipertensi grade 2. DD: konjungtivitis hemoragik, episkleritis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan (tidak berbahaya, hilang sendiri)", "DOKTER: Ini pembuluh darah kecil di selaput mata pecah karena batuk keras dan tensi tinggi, Pak. Tidak merusak penglihatan dan akan hilang sendiri 1–2 minggu, warnanya bisa berubah kekuningan."], ["Kompres dingin 24 jam pertama, jangan mengucek", "DOKTER: Kompres dingin hari ini, jangan dikucek."], ["Atasi pencetus: batuk & hipertensi; resep", "DOKTER: Obat darah tinggi diminum rutin.\n→ KE PENGUJI: Saya beri air mata buatan bila iritasi dan obat batuk, serta kontrol hipertensi; ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau sering berulang, ada perdarahan di tempat lain, mata nyeri atau kabur, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Air mata buatan (hidroksipropil metilselulosa) tetes mata fl. No. I", "   S 4 dd gtt I OD p.r.n. iritasi", "   ———————————— paraf", "R/ Amlodipin tab 5 mg No. XXX", "   S 1 dd tab I", "   ———————————— paraf", "Pro: Tn. P., 55 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — sumber: PPK FKTP 2022, AAO] Tidak perlu obat khusus; air mata buatan bila iritasi. Hindari menambah aspirin. Penyebab sistemik dicari bila berulang.", "jebakan": ["Tidak mengukur tekanan darah.", "Tidak menanyakan antikoagulan.", "Memberi antibiotik/steroid tanpa indikasi."], "soal": [{"station": "Indra-8", "skenario": "Tn. P., 55 tahun, bangun tidur mendapati bercak merah di mata kanan setelah batuk semalaman, tidak nyeri.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik yang relevan", "**Sampaikan** diagnosis", "**Edukasi** pasien"], "kunci": ["Batuk, HT, antikoagulan", "TD + visus + segmen anterior", "Perdarahan subkonjungtiva", "Hilang sendiri 1–2 minggu, kontrol TD"]}, {"station": "Indra-8b", "skenario": "Ny. N., 60 tahun, minum warfarin, sudah 3× perdarahan subkonjungtiva bulan ini disertai gusi berdarah.", "tugas": ["**Sebutkan** pemeriksaan penunjang", "**Sebutkan** sikap dokter"], "kunci": ["PT/INR, darah lengkap, trombosit", "Rujuk/konsul dokter pemberi warfarin, jangan stop sendiri"]}]}, {"id": "mk", "no": 9, "nama": "Sindrom Mata Kering", "skdi": "4A", "ringkas": {"kunci": "Mata kering, seperti berpasir, perih, silau, memberat saat lama di depan komputer/AC; usia >40, menopause, lensa kontak, Sjögren.", "khas": "Kedua mata, injeksi ringan, foamy tears; tes Schirmer <10 mm/5 menit, TBUT memendek (<10 detik); visus normal.", "dd": "Konjungtivitis (sekret) • Blefaritis (sisik kelopak) • Episkleritis • Keratitis", "flag": "Visus turun, nyeri hebat, defek kornea, mulut juga sangat kering + nyeri sendi (Sjögren) → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. C., 28 tahun, Solo, desainer grafis."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & onset", "DOKTER: Ada keluhan apa?\nPASIEN: Kedua mata kering dan seperti berpasir sejak 2 bulan, Dok."], ["Pencetus: layar, AC, lensa kontak", "DOKTER: Memberat kapan? Kerja di depan komputer? Ruangan ber-AC? Pakai softlens?\nPASIEN: Seharian depan komputer di ruangan AC, sore makin parah. Kadang pakai softlens."], ["Silau, kabur hilang setelah berkedip, sekret", "DOKTER: Silau? Penglihatan kabur yang membaik setelah berkedip? Ada belek?\nPASIEN: Silau sedikit, kabur hilang kalau kedip. Tidak belekan."], ["Mulut kering, nyeri sendi, obat (antihistamin, isotretinoin)", "DOKTER: Mulut juga kering? Nyeri sendi? Minum obat rutin?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata Mbak, termasuk tes kertas kecil di kelopak bawah selama 5 menit. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus ODS 6/6."], ["Inspeksi segmen anterior & kelopak", "→ KE PENGUJI: ODS injeksi konjungtiva ringan, foamy tears di tepi kelopak, kornea jernih, kelopak tanpa sisik."], ["Tes Schirmer: kertas di 1/3 lateral palpebra inferior 5 menit", "(Kertas Schirmer dilipat, diselipkan di 1/3 lateral forniks inferior, mata ditutup 5 menit.)\n→ KE PENGUJI: Schirmer ODS 7 mm/5 menit (menurun)."], ["TBUT (bila ada fluoresein)", "→ KE PENGUJI: TBUT 6 detik (memendek)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Schirmer & TBUT sudah; curiga Sjögren → rujuk serologi."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis ODS sindrom mata kering (computer vision syndrome). DD: konjungtivitis, blefaritis, alergi."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Air mata Mbak kurang dan cepat menguap karena jarang berkedip saat menatap layar."], ["Nonfarmako: aturan 20-20-20, kedip sadar, posisi layar, humidifier, kurangi softlens", "DOKTER: Tiap 20 menit lihat jauh 20 detik, sengaja berkedip, layar sedikit di bawah mata, arah AC jangan ke wajah, kurangi softlens."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Air mata buatan 4–6 kali sehari; ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau jadi nyeri hebat atau kabur menetap, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Air mata buatan (sodium hialuronat 0,1%) tetes mata fl. No. I", "   S 6 dd gtt I ODS", "   ———————————— paraf", "Pro: Nn. C., 28 tahun", "Alamat: ……"], "catatanObat": "PPK FKTP 2022: air mata buatan 4–6×/hari; pakai sediaan bebas pengawet bila >6×/hari. Keratokonjungtivitis sika berat → awal & rujuk.", "jebakan": ["Tidak memeriksa visus/kornea.", "Lupa Schirmer.", "Hanya obat tanpa edukasi ergonomi."], "soal": [{"station": "Indra-9", "skenario": "Nn. C., 28 tahun, desainer, kedua mata kering berpasir 2 bulan, memberat sore hari.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** tes Schirmer", "**Sampaikan** diagnosis", "**Tuliskan** resep & edukasi"], "kunci": ["Layar, AC, softlens, Sjögren", "Kertas di 1/3 lateral forniks inferior 5 menit; <10 mm", "Sindrom mata kering", "Air mata buatan + 20-20-20"]}, {"station": "Indra-9b", "skenario": "Ny. E., 50 tahun, mata dan mulut kering, nyeri sendi jari.", "tugas": ["**Sebutkan** kecurigaan & tindak lanjut"], "kunci": ["Sindrom Sjögren; air mata buatan + rujuk Sp.PD/Sp.M untuk serologi"]}]}, {"id": "blef", "no": 10, "nama": "Blefaritis (+ Herpes Zoster Oftalmikus)", "skdi": "4A", "ringkas": {"kunci": "Kelopak gatal, panas, bersisik, merah di tepi, bulu mata rontok; HZO: lansia, nyeri + vesikel dahi–kelopak satu sisi.", "khas": "Stafilokok: sisik kering, ulkus tepi kelopak, madarosis. Seboroik: sisik berminyak, tanpa ulkus. HZO: vesikel dermatom V1 unilateral; tanda HUTCHINSON (vesikel ujung hidung) = risiko mata terlibat.", "dd": "Hordeolum • Dermatitis kontak kelopak • Konjungtivitis • Demodex • HZO", "flag": "Visus turun, mata merah nyeri, tanda Hutchinson, imunokompromais → rujuk Sp.M."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. K., 45 tahun, Solo, guru."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & onset", "DOKTER: Ada keluhan apa, Bu?\nPASIEN: Tepi kelopak kedua mata gatal, panas, dan bersisik sejak sebulan, Dok."], ["Sisik, bulu mata rontok, belek, kabur", "DOKTER: Bulu mata rontok? Ada belek atau kabur?\nPASIEN: Rontok sedikit. Tidak kabur."], ["Kulit kepala/wajah berketombe (seboroik), rosasea, kosmetik", "DOKTER: Ada ketombe atau kulit wajah berminyak? Pakai maskara?\nPASIEN: Ketombean, Dok. Jarang pakai maskara."], ["Riwayat cacar & lenting nyeri di dahi (HZO)", "DOKTER: Ada lenting yang nyeri di dahi atau hidung?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa kelopak dan mata Ibu dengan senter dan lup. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Visus ODS", "→ KE PENGUJI: Visus ODS 6/6."], ["Inspeksi tepi kelopak & bulu mata dengan lup", "(Memakai sarung tangan, lup.)\n→ KE PENGUJI: Margo palpebra ODS hiperemis ringan dengan sisik berminyak kekuningan, ulkus (−), madarosis ringan, trikiasis (−)."], ["Segmen anterior & kulit wajah", "→ KE PENGUJI: Konjungtiva hiperemis ringan, kornea jernih. Skuama berminyak di alis dan kulit kepala; vesikel (−)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak perlu; bila tidak membaik: pemeriksaan bulu mata untuk Demodex."], ["Diagnosis & DD", "→ KE PENGUJI: Diagnosis ODS blefaritis seboroik. DD: blefaritis stafilokok, dermatitis kontak, demodikosis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan (kronis, perlu higiene rutin)", "DOKTER: Ini radang tepi kelopak yang berhubungan dengan ketombe, Bu. Sering kambuh, kuncinya kebersihan kelopak setiap hari."], ["Higiene kelopak: kompres hangat lalu bersihkan dengan sampo bayi encer", "DOKTER: Kompres hangat 5–10 menit, lalu gosok tepi kelopak dengan kapas yang dibasahi sampo bayi encer, 2 kali sehari. Sampo antiketombe untuk rambut."], ["Menulis resep & menyerahkan", "→ KE PENGUJI: Salep antibiotik di tepi kelopak 2 minggu; ini resepnya, dok."], ["Tanda bahaya", "DOKTER: Kalau mata merah nyeri atau kabur, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Kloramfenikol 1% salep mata tube 3,5 g No. I", "   S 2 dd ue margo palpebra ODS", "   ———————————— paraf", "R/ Ketokonazol 2% sampo fl. No. I", "   S 2×/minggu untuk kulit kepala", "   ———————————— paraf", "Pro: Ny. K., 45 tahun", "Alamat: ……", "", "— HZO (Tn. Z., 68 th, dalam 72 jam) —", "R/ Asiklovir tab 400 mg No. LXX", "   S 5 dd tab II (800 mg) selama 7 hari", "   ———————————— paraf"], "catatanObat": "[UPDATE GUIDELINE] Les menulis 'HZO: steroid' — terapi baku antivirus oral ≤72 jam: asiklovir 5 × 800 mg 7–10 hari (atau valasiklovir 3 × 1 g); steroid topikal hanya oleh Sp.M untuk keratitis/uveitis. Hitung: 2 tab × 5 × 7 = 70 → LXX. Blefaritis stafilokok: higiene + salep antibiotik; seboroik: higiene + sampo.", "jebakan": ["Hanya obat tanpa higiene kelopak.", "HZO diberi steroid tanpa antivirus.", "Tidak memeriksa tanda Hutchinson & visus pada HZO."], "soal": [{"station": "Indra-10", "skenario": "Ny. K., 45 tahun, tepi kelopak kedua mata gatal, panas, bersisik sebulan, berketombe.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan kelopak", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep & **ajarkan** higiene kelopak"], "kunci": ["Ketombe, kosmetik, vesikel", "Sisik berminyak, ulkus −", "Blefaritis seboroik", "Kompres hangat + sampo bayi, salep AB, sampo antiketombe"]}, {"station": "Indra-10b", "skenario": "Tn. Z., 68 tahun, nyeri dan lenting berkelompok di dahi kiri sampai kelopak sejak 2 hari, ada lenting di ujung hidung.", "tugas": ["**Sebutkan** diagnosis & tanda penting", "**Tuliskan** resep", "**Sebutkan** indikasi rujuk"], "kunci": ["HZO, tanda Hutchinson (+)", "Asiklovir 5 × 800 mg 7 hari (No. LXX tab 400)", "Hutchinson + → rujuk Sp.M"]}]}, {"id": "dakrio", "no": 11, "nama": "Dakriosistitis (DD Dakrioadenitis)", "skdi": "3A", "ringkas": {"kunci": "Perempuan pascamenopause/bayi; bengkak, merah, NYERI di SUDUT DALAM mata (kantus medial) di bawah tendon kantus, berair (epifora), bisa keluar nanah dari punctum saat ditekan.", "khas": "Akut: massa hiperemis nyeri di area sakus lakrimal; regurgitasi pus dari punctum saat sakus ditekan. Kronis: epifora. Dakrioadenitis = bengkak 1/3 LATERAL kelopak atas (bentuk S).", "dd": "Selulitis preseptal/orbita • Dakrioadenitis • Hordeolum • Sinusitis etmoid", "flag": "Demam, bengkak meluas, proptosis, gerak bola mata terbatas, visus turun → selulitis orbita, rujuk segera."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. U., 55 tahun, Klaten, petani."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan utama & lokas
