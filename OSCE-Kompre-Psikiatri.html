<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCE Kompre Psikiatri</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3ded3;--blue:#1f4e79;--wine:#7b2c3b;--green:#4a6b2a;--red:#b03a2e;--yel:#fff4cc}
body.dark{--bg:#14161b;--card:#1d2028;--ink:#e7e9ee;--mute:#9aa3b2;--line:#2e333d;--yel:#3a3420}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;color:var(--wine);text-decoration:none}#crumb{flex:1;color:var(--mute);font-size:14px}#crumb a{color:var(--blue);text-decoration:none}
.hero{text-align:center;padding:40px 10px 24px}.hero h1{font-size:40px;margin:0;color:var(--blue)}.hero h1 span{color:var(--wine)}.hero p{color:var(--mute);max-width:640px;margin:10px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--blue)}
.card .num{font:800 28px system-ui;color:var(--wine);opacity:.85}.card h3{margin:4px 0 6px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:13px}
.card .tag{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(31,78,121,.12);color:var(--blue)}
.card.big{padding:24px;text-align:center}.card.big .ic{font-size:40px}.card.big h3{font-size:19px}
.prog{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:#2e7d32}
.secnav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.secnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}.secnav a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
nav{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 6px 2px;color:var(--wine)}nav p{margin:0 6px 14px;color:var(--mute);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--blue);color:#fff}
nav .sk{float:right;font-size:11px;opacity:.75}
main{padding:24px 32px 80px;max-width:1150px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;flex:1;min-width:260px;color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.timer{font:600 20px ui-monospace,monospace;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--red)}
.tabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.box .row{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line)}
.box .row b{padding:10px 12px}.box .row div{padding:10px 12px}
.k1{background:var(--yel)}.k2{background:rgba(31,78,121,.12)}.k3{background:rgba(120,120,120,.1)}.k4{background:rgba(176,58,46,.13)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--blue);color:#fff;font-size:13px}td.no{width:38px;text-align:center;color:var(--mute)}
tr.sec td{background:rgba(31,78,121,.12);font-weight:700}
.sc{white-space:nowrap;width:120px}.sc button{width:32px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin-right:2px}
.sc button.s0.on{background:#c0392b;color:#fff}.sc button.s1.on{background:#d4a017;color:#fff}.sc button.s2.on{background:#2e7d32;color:#fff}
.say p{margin:0 0 4px}.r-D{color:#2b6cb0;font-weight:700}.r-P{color:var(--green);font-weight:700}.r-U{color:var(--red);font-weight:700}
.hidden-say .say{filter:blur(6px);cursor:pointer}.hidden-say .say.peek{filter:none}
.score{font-weight:700;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.resep{font:14px ui-monospace,monospace;white-space:pre-wrap;background:rgba(74,107,42,.1);border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;margin-bottom:10px}
.note{font-size:13px;color:var(--mute);margin-bottom:16px}
.trap{background:rgba(176,58,46,.08);border-left:4px solid var(--red);padding:10px 14px;border-radius:8px}
.soal{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 18px;margin-bottom:8px}
.soal h4{margin:-14px -18px 10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px}
.kunci{background:rgba(120,120,120,.12);border-radius:8px;padding:10px 14px;margin-bottom:22px}
.kunci.closed ul{display:none}.kunci summary{cursor:pointer;font-weight:700}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static}main{padding:16px}.box .row{grid-template-columns:1fr}}
.secnav a.dl{background:var(--green);color:#fff;border-color:var(--green);margin-left:auto}a.btn.dl{background:var(--green);color:#fff;text-decoration:none}
.phead{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
 body,body.dark{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#aaa;--yel:#fff4cc;background:#fff!important;color:#000;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar,.secnav,.top,.score button{display:none!important}
 main{padding:0!important;max-width:none!important;margin:0!important}
 .phead{display:block;font-weight:700;font-size:13pt;color:#1f4e79;border-bottom:2px solid #7b2c3b;padding-bottom:4px;margin-bottom:10px}
 table{border:1px solid #aaa;border-radius:0}
 thead{display:table-header-group}
 tr,.box .row,.soal,.kunci,.resep,.trap,li{break-inside:avoid;page-break-inside:avoid}
 tr.sec{break-after:avoid;page-break-after:avoid}
 th,td{padding:4px 6px}
 .hidden-say .say{filter:none!important}
 .kunci summary{list-style:none}.kunci summary::-webkit-details-marker{display:none}
 h3{break-after:avoid}
 .sc button{display:inline-block;width:24px;height:20px;font-size:9pt;border:1px solid #666;background:#fff}
}

.tw{overflow-x:auto}
td.pe{width:24%}td.dk{width:26%}td.ps{width:22%}td.pj{width:24%;background:#fff3b0;border-left:4px solid #ff8f00}
body.dark td.pj{background:#4a3a00;border-left-color:#ffb300}
th.thD{background:#2b6cb0}th.thP{background:#4a6b2a}th.thU{background:#e65100}
td.dk p,td.ps p,td.pj p{margin:0 0 5px}
.act{font-style:italic;color:var(--mute)}
.pj p{font-weight:700;color:#7a2e00}body.dark .pj p{color:#ffd180}
.who{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;margin-right:4px;background:rgba(74,107,42,.15);color:var(--green)}
.hidden-say td.dk,.hidden-say td.ps,.hidden-say td.pj{filter:blur(6px);cursor:pointer}.hidden-say tr.peek td{filter:none}
.badgeU{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;background:#ff8f00;color:#fff;white-space:nowrap}
tr.rowU td{background:rgba(255,143,0,.09)}tr.rowU td:nth-child(2){border-left:4px solid #ff8f00}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:-4px 0 12px}.legend span{padding:3px 10px;border-radius:20px;font-weight:700}
.kilat{font-size:18px;font-weight:800;line-height:1.45;padding:16px 18px;border-radius:12px;background:linear-gradient(90deg,#7b2c3b,#1f4e79);color:#fff;margin-bottom:16px}
.kilat small{display:block;font-size:11px;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:5px solid var(--blue)}
.mcard h3{margin:0 0 10px;font-size:16px}.mcard ul{margin:0;padding-left:20px}.mcard li{margin-bottom:5px}
.mcard.c-key{border-top-color:#d4a017}.mcard.c-crit{border-top-color:var(--blue)}.mcard.c-tx{border-top-color:var(--green)}.mcard.c-ff{border-top-color:var(--red);background:rgba(176,58,46,.05)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--yel);border:1px solid #e5c75a;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
ul.chk{list-style:none;padding-left:0!important}ul.chk li{padding-left:26px;position:relative}ul.chk li:before{content:"☑";position:absolute;left:0;color:var(--blue);font-size:17px;line-height:1.2}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin-bottom:16px}.fig img{max-width:100%;max-height:340px}.fig p{margin:6px 0 0;color:#555;font-size:13px}
.mcard table{margin:0}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.kilat{font-size:16px}}
@media print{.mgrid{grid-template-columns:1fr 1fr}.mcard,.kilat,.fig{break-inside:avoid}td.pj{background:#fff3b0!important}}
</style></head><body>
<header class="bar"><a href="#" class="brand">🧠 OSCE Kompre Psikiatri</a><span id="crumb"></span><button class="btn" onclick="document.body.classList.toggle('dark')">🌓</button></header>
<main id="main"></main>
<script>
const M={
skizo:{
 kilat:"Psikotik ≥1 BULAN + waham/halusinasi menonjol → F20.0. Tanya PISAU & BUNUH DIRI, jangan bantah waham.",
 kunci:["Dewasa muda 15–35 th","Dibawa keluarga (istri)","Bicara / tertawa sendiri","Merasa diikuti / diracun orang jahat","Membawa pisau","Onset >1 bulan","Kurang merawat diri","Putus obat"],
 kriteria:{judul:"PPDGJ III F20 — Skizofrenia",items:[
  "**≥1 gejala amat jelas** (atau ≥2 bila kurang jelas) dari: (a) thought echo / insertion / withdrawal / broadcasting",
  "(b) delusion of **control / influence / passivity**, persepsi delusional",
  "(c) **halusinasi auditorik** yang mengomentari / mendiskusikan pasien / dari bagian tubuh",
  "(d) waham menetap lain yang tidak wajar / mustahil secara budaya",
  "ATAU **≥2** dari: (e) halusinasi menetap + waham tiap hari • (f) arus pikir terputus → inkoherensi, neologisme • (g) katatonik • (h) gejala negatif (apatis, afek tumpul, menarik diri)",
  "**Durasi ≥1 bulan** + perubahan perilaku pribadi bermakna",
  "Tipe **paranoid (F20.0)**: halusinasi/waham (kejar, curiga, rujukan) menonjol; afek, kehendak, bicara, katatonia tidak menonjol"]},
 tabel:[{judul:"Diagnosis banding psikotik",h:["","Skizofrenia","Psikotik akut","Gangguan waham","Skizoafektif"],rows:[
  ["**Waktu**","**≥1 bulan**","**Onset ≤2 minggu**","**≥3 bulan**","Gejala skizo & mood bersamaan"],
  ["**Ciri**","Persepsi & proses pikir; gejala negatif ±","Mendadak, berubah-ubah, ada stresor","HANYA waham; fungsi relatif baik","Skizo + mania/depresi sama menonjol"]]}],
 terapi:["Risperidon 1–2 mg malam (2–6 mg/hari) **atau** haloperidol 5–15 mg/hari","EPS → triheksifenidil 2 mg 2–3×/hari","Psikoedukasi keluarga: PMO (pengawas minum obat), tanda kambuh","Rujuk Sp.KJ bila ada penyulit / berisiko"],
 flaws:["Tidak tanya risiko kekerasan (pisau) & ide bunuh diri","Membantah waham (\"Itu tidak benar, Pak\") atau membenarkannya","Tidak sebut durasi ≥1 bulan sebagai pembeda dari psikotik akut","Haloperidol tanpa antisipasi EPS & edukasi efek samping"]},
depresi:{
 kilat:"≥2 dari 3 gejala UTAMA (afek depresif, anhedonia, anergia) ≥2 MINGGU. Wajib tanya IDE BUNUH DIRI & riwayat MANIA.",
 kunci:["Perempuan / ibu rumah tangga","Mengurung diri di kamar","Murung, tidak bersemangat","Mudah lelah","Tidak mau makan, sulit tidur","Merasa tidak berguna / bersalah","Ada stresor (kehilangan)","Bisikan menyuruh bunuh diri"],
 kriteria:{judul:"PPDGJ III F32 — Episode depresif (≥2 minggu)",items:[
  "**3 gejala utama:** (1) afek depresif (2) anhedonia — hilang minat (3) anergia — mudah lelah",
  "**7 gejala lain:** konsentrasi ↓ • harga diri ↓ • rasa bersalah/tak berguna • pesimis • ide/tindakan bunuh diri • tidur terganggu • nafsu makan ↓",
  "Durasi **≥2 minggu** (boleh lebih singkat bila sangat berat & onset cepat)"]},
 tabel:[{judul:"Derajat (hitung gejala!)",h:["Derajat","Utama + lain","Fungsi"],rows:[
  ["**Ringan F32.0**","≥2 + ≥2","Sedikit kesulitan"],["**Sedang F32.1**","≥2 + ≥3 (sebaiknya 4)","Kesulitan nyata"],["**Berat F32.2**","3 + ≥4","Hampir tidak mampu"],["**Berat + psikotik F32.3**","Berat + waham/halusinasi/stupor","→ **awal & RUJUK**"]]},
  {judul:"Diagnosis banding",h:["DD","Pembeda"],rows:[["Bipolar episode kini depresif","Ada riwayat **mania/hipomania**"],["Skizoafektif tipe depresif","Gejala skizofrenia sama menonjol"],["Akibat medis/zat","Hipotiroid, anemia, steroid, alkohol → cek TSH, DL"],["Duka cita / penyesuaian","Terkait jelas kehilangan, tidak memenuhi kriteria"]]}],
 terapi:["Fluoksetin 20 mg **1× pagi** (bukan 2×!) — efek 2–4 minggu","Psikotik → + antipsikotik dosis rendah, **rujuk**","Amitriptilin hindari bila risiko bunuh diri (overdosis fatal); batasi jumlah obat","Rencana keselamatan, keluarga mendampingi"],
 flaws:["Tidak tanya ide/rencana bunuh diri — FATAL","Tidak singkirkan riwayat mania (antidepresan tunggal → picu mania)","Menyebut halusinasi sebagai \"waham auditorik\"; derajat tidak dihitung","TCA jumlah besar pada pasien berisiko; tidak merujuk depresi berat psikotik"]},
bipolar:{
 kilat:"Episode MANIK sekarang + RIWAYAT DEPRESI dulu → F31.1. Tulis sesuai EPISODE KINI. JANGAN beri antidepresan.",
 kunci:["Dewasa muda","Tidak mau tidur tapi tidak lelah","Bernyanyi / bicara keras malam hari","Banyak bicara","Dandan menor, pakaian mencolok","Boros, merasa hebat","Mudah tersinggung","Riwayat menyendiri, menangis, coba bunuh diri"],
 kriteria:{judul:"PPDGJ III F31 — Bipolar",items:[
  "**≥2 episode berulang**: suatu waktu mania/hipomania, waktu lain depresi",
  "Episode manik 2 minggu – 4/5 bulan; depresi rata-rata ±6 bulan",
  "**Sembuh sempurna antarepisode**; dapat dicetuskan stres",
  "**Episode manik:** mood ↑/iritabel + energi ↑ **≥1 minggu**: hiperaktif, logorea, kebutuhan tidur ↓, ide kebesaran, flight of ideas, distraktibilitas, boros/nekat",
  "Kode sesuai **episode kini**: F31.1 manik tanpa psikotik • F31.2 manik dengan psikotik • F31.3–F31.5 kini depresif ringan/sedang/berat"]},
 gambar:"bipolar",
 tabel:[{judul:"Diagnosis banding",h:["DD","Pembeda"],rows:[["Episode manik tunggal (F30)","**Belum ada** riwayat episode sebelumnya"],["Skizoafektif tipe manik","Gejala skizofrenia sama menonjol & bersamaan"],["Mania akibat zat/medis","Amfetamin, steroid, hipertiroid → urin NAPZA, TSH"],["Skizofrenia","Afek tidak hipertimik; waham ≥1 bulan dominan"]]}],
 terapi:["Litium karbonat: dosis terapeutik ±900–1200 mg/hari, kadar 0,8–1,2 mEq/L","Pantau: kadar litium, **ginjal, tiroid, tes hamil**","Divalproat 500–1000 mg/hari — **teratogenik**, hindari wanita usia subur tanpa KB","Agitasi → antipsikotik; **rujuk** (SKDI 2026: awal & rujuk)"],
 flaws:["Tidak gali riwayat depresi → salah dx (manik tunggal vs bipolar)","Memberi antidepresan pada riwayat mania","Diagnosis tidak sesuai episode kini","Litium/valproat tanpa menyebut pemantauan"]},
gad:{
 kilat:"Cemas MENGAMBANG (free-floating) hampir tiap hari berminggu–bulan + 3 unsur: KHAWATIR, TEGANG MOTORIK, OTONOM.",
 kunci:["Khawatir berlebihan soal keluarga/pekerjaan","Padahal keadaan baik-baik saja","Sulit tidur & konsentrasi","Tegang, berdebar, berkeringat","Berminggu – berbulan"],
 kriteria:{judul:"PPDGJ III F41.1 — GAD",items:[
  "Ansietas **primer**, hampir setiap hari, **beberapa minggu – bulan**",
  "**Free floating** — tidak terbatas situasi tertentu",
  "(1) **Kecemasan**: khawatir nasib buruk, sulit konsentrasi",
  "(2) **Ketegangan motorik**: gelisah, gemetar, sakit kepala tegang, tidak bisa santai",
  "(3) **Overaktivitas otonom**: berdebar, keringat, sesak, pusing, mulut kering",
  "Catatan: DSM-5 butuh ≥6 bulan; di OSCE Indonesia pakai **PPDGJ III**"]},
 tabel:[{judul:"Diagnosis banding",h:["DD","Pembeda"],rows:[["Gangguan panik","**Serangan episodik mendadak** (GAD = terus-menerus)"],["Depresi / campuran","Afek depresif, anhedonia dominan"],["Hipertiroid","BB turun, tremor halus, struma → **TSH**"],["Jantung (aritmia/SKA)","**EKG wajib** pada berdebar/nyeri dada"],["Zat","Kafein, alkohol, putus sedatif"]]}],
 terapi:["**SSRI lini pertama** (fluoksetin 20 mg pagi; NICE: sertralin)","Benzodiazepin (diazepam 2 mg 2×) hanya jembatan **≤2–4 minggu**","Psikoterapi / relaksasi, kurangi kafein"],
 flaws:["Tidak singkirkan organik (TSH, EKG)","Benzodiazepin jangka panjang tanpa edukasi ketergantungan","Tidak membedakan GAD vs panik","Lupa skrining depresi & bunuh diri"]},
panik:{
 kilat:"SERANGAN mendadak (puncak ±10 menit, ≤30 menit), beberapa kali dalam ±1 BULAN, bebas gejala di antaranya. SINGKIRKAN JANTUNG (EKG)!",
 kunci:["Tiba-tiba berdebar kencang","Sesak, gemetar, keringat dingin","Takut mati / gila","Bolak-balik IGD","EKG normal","Takut serangan berikutnya"],
 kriteria:{judul:"PPDGJ III F41.0 — Gangguan panik",items:[
  "**Beberapa serangan** ansietas berat dalam **±1 bulan**",
  "Pada keadaan **tanpa bahaya objektif**",
  "Tidak terbatas situasi yang dapat diduga",
  "**Relatif bebas ansietas di antara serangan**",
  "Serangan: muncul tiba-tiba, beberapa menit – ±30 menit"]},
 tabel:[{judul:"Diagnosis banding",h:["DD","Pembeda"],rows:[["**SKA / aritmia**","Nyeri dada tipikal, faktor risiko → **EKG wajib**"],["Hipoglikemia","GDS saat serangan"],["Hipertiroid","TSH"],["GAD","Cemas terus-menerus, bukan serangan"],["Agorafobia","Takut tempat sulit kabur"]]}],
 terapi:["SSRI dosis rendah (fluoksetin 10 mg pagi)","Alprazolam 0,5 mg prn saat serangan, jangka pendek","Edukasi: serangan tidak mematikan, teknik napas"],
 flaws:["Tidak cek EKG / TSH","Benzodiazepin jangka panjang","Tidak bedakan dengan GAD","Lupa skrining depresi"]},
insomnia:{
 kilat:"Sulit tidur ≥3×/MINGGU selama ≥1 BULAN + mengganggu fungsi. SLEEP HYGIENE dulu, baru obat jangka pendek.",
 kunci:["Mahasiswa / pekerja muda","Sulit memulai tidur","Sering terbangun","Bangun terlalu pagi","Ngantuk & lelah siang","Begadang, gawai, kopi","Stres","≥1 bulan"],
 kriteria:{judul:"PPDGJ III F51.0 — Insomnia non-organik",items:[
  "Sulit masuk tidur / mempertahankan tidur / kualitas buruk",
  "**≥3 kali per minggu selama ≥1 bulan**",
  "**Preokupasi** dengan tidak bisa tidur",

const S={"diseases":[{"id":"skizo","no":1,"nama":"Skizofrenia Paranoid (F20.0)","skdi":"3A","ringkas":{"kunci":"Dewasa muda 15–35 th, dibawa keluarga, \"bicara/tertawa sendiri\", \"merasa diikuti/diracun\", membawa pisau, ≥1 bulan, pasien merasa tidak sakit.","khas":"PPDGJ III: ≥1 gejala sangat jelas (thought echo/insertion/withdrawal/broadcasting; waham kendali/pasivitas; halusinasi auditorik komentar; waham menetap tak wajar) ATAU ≥2 gejala (halusinasi menetap lain, arus pikir terputus/inkoherensi, katatonik, gejala negatif) selama ≥1 BULAN.","dd":"Psikotik akut & sementara (≤2 minggu) • Gangguan waham menetap (≥3 bulan, HANYA waham) • Skizoafektif (gejala skizofrenia & mood muncul bersamaan dan sama menonjol) • Psikotik organik/NAPZA","flag":"Membawa senjata/ancaman, halusinasi perintah menyakiti, ide bunuh diri, menolak makan, katatonia, demam + kaku + kesadaran turun (NMS) → stabilisasi & rujuk Sp.KJ."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Bapak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Bapak. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Bapak bersedia? Saya juga akan bertanya kepada Ibu (istri) yang mengantar.\nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: B., 27 tahun, montir bengkel, SMK, Laweyan Solo, menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai","(Kontak mata wajar; duduk dekat pintu, jarak aman.)"],["Keluhan utama & RPS — sacred seven: onset, lokasi/bentuk, kualitas, kuantitas, kronologi, faktor pemberat/peringan, keluhan lain","DOKTER: Bu, apa yang membuat Ibu membawa Pak B. ke sini?\nPENGHANTAR: Sudah 2 bulan sering bicara sendiri, katanya ada orang jahat yang mengikuti. Dia bawa pisau ke mana-mana.\nDOKTER: Pak, suara yang Bapak dengar seperti apa? Apa isinya? Pernah menyuruh menyakiti orang atau diri sendiri?\nPASIEN: Suara laki-laki, mengomentari saya. Nyuruh jaga-jaga bawa pisau, belum pernah nyuruh nyakitin.\nDOKTER: Pernah merasa pikiran Bapak dikendalikan, disedot, atau disiarkan?\nPASIEN: Tidak.\nDOKTER: Bagaimana kerja, makan, mandi, tidur selama 2 bulan ini? Ada kejadian berat sebelumnya?\nPENGHANTAR: Berhenti kerja, jarang mandi. Bengkelnya bangkrut 3 bulan lalu.\nDOKTER: Pernah sangat sedih berlarut atau sangat bersemangat tanpa tidur?\nPASIEN: Tidak."],["Riwayat penyakit dahulu: psikiatri sebelumnya, obat/NAPZA, penyakit sebelumnya, riwayat keluarga, tumbuh kembang","DOKTER: Sebelumnya pernah seperti ini atau berobat ke psikiater? Pakai alkohol, sabu, ganja? Pernah demam tinggi, kejang, benturan kepala? Ada keluarga dengan gangguan jiwa? Tumbuh kembang waktu kecil normal?\nPENGHANTAR: Belum pernah. Tidak pakai obat, hanya rokok. Tidak pernah kejang. Pamannya pernah dirawat di RSJ. Tumbuh kembang normal."],["Riwayat pribadi & sosial: prenatal-perinatal, kanak, remaja, dewasa (kerja, nikah, pendidikan, sosial-keagamaan), seksual, nilai","DOKTER: Waktu kecil dan remaja Bapak seperti apa? Bagaimana hubungan dengan istri dan tetangga?\nPENGHANTAR: Lahir normal. Dari kecil pendiam, tertutup, temannya sedikit. Menikah 3 tahun, belum punya anak."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi selama 2 bulan Bapak mendengar suara yang mengomentari dan merasa diikuti orang jahat, sampai membawa pisau, setelah bengkel bangkrut. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: Kesadaran compos mentis; laki-laki sesuai usia, kurang terawat; kontak mata ada tapi curiga, verbal cukup; psikomotor tenang; bicara spontan, volume & kecepatan cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Bapak hari ini?\nPASIEN: Biasa saja, tapi waspada.\n→ KE PENGUJI: Mood eutimik, afek tumpul, appropriate, stabil."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Ada suara laki-laki yang mengomentari saya.\n→ KE PENGUJI: Halusinasi auditorik tipe komentar (+). Ilusi (-)."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Bentuk pikir non-realistik; arus pikir koheren; isi pikir waham kejar/paranoid."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Bapak, apakah Bapak sedang sakit dan butuh bantuan?\nPASIEN: Di Puskesmas, Selasa, dokter… 93… Saya tidak sakit, orang-orang itu yang jahat.\n→ KE PENGUJI: Orientasi baik, daya ingat baik, konsentrasi cukup, abstrak baik; tilikan derajat 1; reliabilitas dapat dipercaya."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TD 120/80, N 84, RR 18, S 36,6. Status generalis dan neurologis dalam batas normal, tidak ada tanda ekstrapiramidal."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Usulan: darah lengkap, GDS, SGOT/SGPT, ureum/kreatinin, profil lipid (baseline antipsikotik), skrining NAPZA urin, EKG."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F20.0 Skizofrenia paranoid; Aksis II ciri kepribadian skizoid; Aksis III tidak ada; Aksis IV masalah ekonomi/pekerjaan; Aksis V GAF 30–21."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Gangguan psikotik akut dan sementara; gangguan waham menetap; skizoafektif."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Pak, Bu, Pak B. mengalami skizofrenia: ada ketidakseimbangan zat kimia di otak sehingga mendengar suara dan merasa diikuti padahal tidak nyata. Ini bisa diobati."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Pilihan obatnya risperidon atau haloperidol. Saya sarankan risperidon karena efek kakunya lebih ringan. Bagaimana, setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: risperidon 2 mg sekali malam, dan triheksifenidil 2 mg bila muncul kaku/gemetar."],["Edukasi cara minum obat & efek samping","DOKTER: Diminum 1 tablet malam setelah makan setiap hari, jangka panjang (minimal 1–2 tahun). Jangan berhenti sendiri walau sudah membaik. Bisa mengantuk atau berat badan naik; kalau kaku/gemetar, minum tablet kedua."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Bu, mohon pisau di rumah disimpan, Ibu yang mengawasi minum obat, hindari memarahi atau mengkritik Bapak, ajak beraktivitas rutin."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Kalau Bapak mengamuk, mengancam, suara menyuruh menyakiti, tidak mau makan, atau demam dengan badan kaku, segera bawa ke IGD."],["Rujukan & jadwal kontrol","DOKTER: Saya buatkan rujukan ke dokter spesialis kedokteran jiwa, dan kontrol ke sini 2 minggu lagi."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Risperidon tab 2 mg   No. XXX","    S 1 dd tab I h.s. p.c.","                      ____ (paraf)","R/ Triheksifenidil tab 2 mg   No. XX","    S 2 dd tab I p.c. (bila kaku/gemetar)","                      ____ (paraf)","Pro: Tn. B., 27 tahun","Alt: R/ Haloperidol tab 5 mg No. XLV  S 3 dd tab I p.c."],"catatanObat":"Risperidon 2–6 mg/hari atau haloperidol 5–15 mg/hari dibagi 2–3 dosis (sesuai les). [UPDATE GUIDELINE] THP tidak rutin sebagai profilaksis, beri bila ada EPS (PNPK Skizofrenia). Anak: skizofrenia onset anak jarang → rujuk Sp.KJ anak.","jebakan":["Membantah atau mengiyakan waham.","Lupa menanyakan perintah halusinasi & senjata padahal skenario menyebut pisau.","Tidak menanyakan durasi & NAPZA → tidak bisa membedakan dari psikotik akut/organik.","Laporan status mental berisi opini, tidak runut."],"soal":[{"station":9,"skenario":"Seorang laki-laki berusia 27 tahun diantar istrinya ke praktik dokter umum karena sering berbicara sendiri dan merasa diikuti orang jahat sejak 2 bulan yang lalu.","tugas":["Lakukan **wawancara psikiatri** dan **laporkan status mental** kepada penguji!","**Tegakkan diagnosis multiaksial** dan **2 diagnosis banding**!","**Berikan farmakoterapi, tulis resep** dan serahkan kepada penguji!","**Lakukan psikoedukasi** kepada pasien dan keluarga!"],"kunci":["Dx: F20.0 Skizofrenia paranoid. DD: psikotik akut & sementara, gangguan waham menetap.","Skrip PS: halusinasi auditorik komentar, waham kejar, bawa pisau, stresor bengkel bangkrut; NAPZA/demam/kejang/gejala mood (-); paman dirawat RSJ; premorbid tertutup; insight 1.","PF: TTV & neurologis normal.","Poin: tanya perintah halusinasi & senjata, multiaksial lengkap, resep antipsikotik, edukasi kepatuhan + simpan senjata + rujuk.","Jebakan: lupa durasi."]},{"station":10,"skenario":"Seorang perempuan berusia 22 tahun diantar ibunya ke Puskesmas karena sejak 5 hari lalu tiba-tiba gelisah, mengaku diguna-guna, dan mendengar bisikan, setelah putus dengan tunangannya.","tugas":["**Lakukan anamnesis** dan **pemeriksaan status mental**!","**Tetapkan diagnosis** yang sesuai dan sampaikan kepada penguji!","**Lakukan komunikasi dan edukasi** kepada keluarga!"],"kunci":["Dx: F23 Gangguan psikotik akut dan sementara (dengan stresor akut).","Skrip: onset mendadak 5 hari, sebelumnya normal; waham berganti-ganti; NAPZA/demam (-).","PF: TTV normal, orientasi baik (bukan delirium).","Jebakan: menulis skizofrenia padahal baru 5 hari."]}]},{"id":"depresi","no":2,"nama":"Episode Depresif (F32)","skdi":"3A","ringkas":{"kunci":"Perempuan dewasa, \"murung, mengurung diri, mudah lelah, tak mau makan, sulit tidur/bangun dini\", ≥2 minggu, stresor kehilangan.","khas":"3 gejala utama (afek depresif, anhedonia, anergia) + 7 gejala lain (konsentrasi↓, harga diri↓, rasa bersalah, pesimis, ide bunuh diri, tidur terganggu, makan↓) ≥2 minggu. Ringan 2+2 • Sedang 2+3–4 • Berat 3+≥4 (± psikotik).","dd":"Bipolar episode kini depresi (riwayat mania) • Campuran ansietas-depresi • Distimia (≥2 th) • Hipotiroid","flag":"IDE/RENCANA/PERCOBAAN BUNUH DIRI, gejala psikotik, menolak makan-minum, depresi pascapersalinan → rujuk segera, jangan dibiarkan sendiri."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Ibu. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Ibu. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Ibu bersedia? Saya juga akan bertanya kepada Bapak (suami) yang mengantar.\nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: S., 43 tahun, ibu rumah tangga, SMA, Kartasura, menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai","(Bicara pelan, beri waktu menjawab, siapkan tisu.)"],["Keluhan utama & RPS — sacred seven (hitung 3 gejala utama + 7 gejala lain)","DOKTER: Apa yang paling Ibu rasakan akhir-akhir ini? Sejak kapan?\nPASIEN: Capek, nggak semangat. Sebulan ini, sejak suami di-PHK.\nDOKTER: Apakah Ibu sedih hampir sepanjang hari? Hal yang dulu disukai masih dinikmati? Mudah lelah?\nPASIEN: Sedih terus, nggak pengin apa-apa, gampang capek.\nDOKTER: Bagaimana tidur, makan, konsentrasi? Merasa bersalah atau tidak berguna? Masa depan?\nPASIEN: Bangun jam 2 nggak bisa tidur lagi, nggak nafsu makan, merasa jadi beban, rasanya nggak ada harapan.\nDOKTER: Ketika seberat itu, pernah terpikir hidup tidak berarti atau ingin mengakhiri hidup? Sudah ada rencana atau pernah mencoba? Apa yang membuat Ibu bertahan?\nPASIEN: Ada bisikan yang nyuruh saya mati. Belum pernah mencoba. Saya bertahan karena anak-anak.\nDOKTER: Pernah sangat gembira berlebihan, tidak tidur tapi tidak lelah?\nPASIEN: Tidak pernah."],["Riwayat penyakit dahulu: psikiatri, obat/NAPZA, penyakit fisik (tiroid), keluarga, tumbuh kembang","DOKTER: Pernah seperti ini sebelumnya? Minum obat tertentu, alkohol? Sering kedinginan, kulit kering, berat badan naik? Ada keluarga yang depresi atau bunuh diri?\nPASIEN: Belum pernah. Tidak. Tidak ada."],["Riwayat pribadi & sosial","DOKTER: Bagaimana dukungan keluarga? Masih bisa mengurus rumah dan anak?\nPASIEN: Suami baik, tapi saya sudah tidak masak lagi. Anak diurus kakak saya."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi sebulan ini Ibu sedih terus, tidak bersemangat, mudah lelah, sulit tidur, tidak nafsu makan, merasa jadi beban, dan ada bisikan menyuruh mati. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; perempuan sesuai usia, kurang terawat; kontak mata kurang; psikomotor lambat; bicara sedikit, lirih, lambat."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Ibu hari ini?\nPASIEN: Sedih, Dok…\n→ KE PENGUJI: Mood hipotimik/depresif, afek depresif, appropriate/selaras."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Ada suara perempuan yang menyuruh saya mati.\n→ KE PENGUJI: Halusinasi auditorik berisi perintah bunuh diri (BUKAN 'waham auditorik')."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Bentuk realistik; arus lambat, koheren; isi pikir rasa tidak berguna, ide bunuh diri tanpa rencana."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Ibu, apakah Ibu sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar, hitungan lambat tapi benar.) Saya tahu saya sakit karena kepikiran suami, tapi nggak tahu harus bagaimana.\n→ KE PENGUJI: Orientasi baik, memori baik, konsentrasi menurun; tilikan derajat 4–5; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TTV normal, tidak ada tanda hipotiroid, tidak ada bekas luka sayatan di pergelangan tangan."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Usulan: darah lengkap, GDS, TSH/FT4; skrining PHQ-9 bila tersedia."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F32.3 Episode depresif berat dengan gejala psikotik; Aksis II tidak ada; Aksis III tidak ada; Aksis IV masalah ekonomi (suami PHK); Aksis V GAF 30–21."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Gangguan afektif bipolar episode kini depresi berat; skizoafektif tipe depresif."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Bu, yang Ibu alami adalah depresi berat—penyakit, bukan karena Ibu lemah iman. Ini bisa diobati dengan obat dan konseling."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Karena ada suara yang menyuruh mati, saya ingin Ibu segera ditangani dokter spesialis jiwa hari ini. Sambil menunggu, saya mulai obat antidepresan. Ibu setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resepnya, Dok: fluoxetin 20 mg sekali pagi (jumlah dibatasi 1 minggu), ditambah risperidon 1 mg malam karena ada gejala psikotik, dan dirujuk segera."],["Edukasi cara minum obat & efek samping","DOKTER: Obat diminum pagi setelah makan, efeknya baru terasa 2–4 minggu, jangan dihentikan sendiri. Bisa mual atau pusing ringan di awal. Obat ini tidak membuat ketagihan."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Pak, mohon Ibu ditemani terus, obat dan benda tajam disimpan Bapak. Ajak Ibu melakukan kegiatan ringan yang dulu disukai, olahraga jalan pagi, dan nanti konseling dengan psikolog."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Bila keinginan mengakhiri hidup makin kuat, ada rencana, atau tidak mau makan sama sekali, segera ke IGD."],["Rujukan & jadwal kontrol","DOKTER: Saya buatkan surat rujukan segera ke dokter spesialis kedokteran jiwa hari ini."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Fluoxetin caps 20 mg   No. VII","    S 1 dd caps I mane p.c.","                      ____","R/ Risperidon tab 1 mg   No. VII","    S 1 dd tab I h.s.","                      ____","Pro: Ny. S., 43 tahun"],"catatanObat":"[UPDATE GUIDELINE] Les menulis fluoxetin '2 kali' → yang benar 1× pagi, 20–60 mg/hari (PNPK Depresi). Amitriptilin 75–150 mg bukan lini pertama: toksik bila overdosis, jadi berbahaya pada pasien dengan ide bunuh diri. Batasi jumlah obat. Anak/remaja: rujuk; fluoxetin ≥8 th mulai 10 mg (bukan berbasis kgBB).","jebakan":["TIDAK menanyakan ide bunuh diri = fatal flaw.","Tidak menghitung gejala → derajat salah.","Tidak menanyakan riwayat mania → memberi SSRI pada bipolar.","Menyebut 'waham auditorik' (yang benar halusinasi)."],"soal":[{"station":11,"skenario":"Seorang perempuan berusia 43 tahun, ibu rumah tangga, diantar suaminya ke Puskesmas karena mengurung diri di kamar dan tidak mau makan sejak 1 bulan yang lalu.","tugas":["**Lakukan anamnesis dan pemeriksaan status mental**!","**Usulkan diagnosis multiaksial**!","**Berikan edukasi dan tatalaksana** yang sesuai!"],"kunci":["Dx: F32.3 Episode depresif berat dengan gejala psikotik.","Skrip: 3 utama (+), bangun dini, makan↓, rasa bersalah, halusinasi perintah bunuh diri, belum ada rencana; mania (-), hipotiroid (-).","Poin: skrining bunuh diri berjenjang, hitung gejala, rujuk segera.","Jebakan: tidak bertanya bunuh diri."]},{"station":12,"skenario":"Seorang laki-laki berusia 35 tahun datang ke klinik dengan keluhan sulit tidur dan tidak bersemangat bekerja sejak 3 minggu setelah gagal promosi.","tugas":["**Lakukan anamnesis**!","**Tegakkan diagnosis dan 2 diagnosis banding**, sampaikan kepada penguji!","**Berikan farmakoterapi, tulis resep** dan serahkan kepada penguji!"],"kunci":["Dx: F32.0 Episode depresif ringan (2 utama + 2 lain, masih bisa bekerja).","DD: campuran ansietas-depresi, gangguan penyesuaian.","Resep fluoxetin 20 mg 1× pagi No. XIV; kontrol 2 minggu.","Jebakan: memberi benzodiazepin saja."]}]},{"id":"bipolar","no":3,"nama":"Gangguan Afektif Bipolar, Episode Kini Manik (F31.1)","skdi":"3A","ringkas":{"kunci":"\"Tidak tidur tapi tetap segar\", \"bernyanyi/bicara keras malam hari\", \"dandan menor, pakaian berlapis\", boros + RIWAYAT menangis/mencoba bunuh diri beberapa bulan lalu.","khas":"≥2 episode mood (salah satunya mania/hipomania) dengan penyembuhan sempurna antar episode; diagnosis ditulis sesuai EPISODE KINI. Mania ≥1 minggu: mood↑, tidur↓, flight of ideas, grandiositas, perilaku berisiko.","dd":"Episode manik tunggal F30 (baru 1 episode) • Skizoafektif tipe manik • Intoksikasi stimulan • Hipertiroid","flag":"Gaduh gelisah, perilaku finansial/seksual berisiko, gejala psikotik, risiko bunuh diri → rujuk Sp.KJ (mood stabilizer perlu pemantauan kadar)."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Mbak. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Mbak bersedia? Saya juga akan bertanya kepada Ibu (ibu kandung) yang mengantar.\nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: D., 31 tahun, karyawan toko, S1, Colomadu, belum menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; mengarahkan pembicaraan dengan sopan","DOKTER: Mbak, ceritanya menarik sekali. Supaya saya bisa membantu, kita bahas satu per satu ya."],["Keluhan utama & RPS — sacred seven (episode kini)","DOKTER: Sejak kapan Mbak jarang tidur? Apakah merasa lelah?\nPASIEN: Dua minggu! Nggak perlu tidur, energi penuh, saya mau bikin butik, konser!\nDOKTER: Selama dua minggu ini apakah banyak membeli barang atau meminjam uang?\nPASIEN: Beli baju 10 potong pakai kartu kredit Mama.\nDOKTER: Apakah Mbak merasa punya kemampuan atau kedudukan istimewa?\nPASIEN: Saya pasti jadi artis terkenal!"],["Riwayat penyakit dahulu: episode mood sebelumnya, NAPZA, tiroid, keluarga","DOKTER: (ke ibu) Bu, sebelum ini Mbak pernah sangat sedih?\nPENGHANTAR: 3 bulan lalu menangis terus, menyendiri, sempat mau minum obat nyamuk. Lalu sembuh, kerja normal sebulan, terus jadi begini.\nDOKTER: Pakai sabu, minuman energi, alkohol? Berdebar, berat badan turun, gemetar? Ada keluarga dengan gangguan mood?\nPENGHANTAR: Tidak ada. Tantenya sering naik-turun moodnya."],["Riwayat pribadi & sosial","DOKTER: Bagaimana pekerjaan dan hubungan sosial Mbak saat ini?\nPENGHANTAR: Dia bolos kerja, sering bertengkar dengan teman."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi 2 minggu ini Mbak tidak tidur tapi tidak lelah, banyak rencana, boros; dan 3 bulan lalu sempat sangat sedih lalu sembuh. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; perempuan sesuai usia, penampilan berlebihan, dandanan menor, pakaian berlapis; kontak mata berlebih; psikomotor hiperaktif; bicara banyak, keras, sangat cepat."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Mbak hari ini?\nPASIEN: Bahagia sekali, Dok!\n→ KE PENGUJI: Mood hipertimik/euforia, afek luas, appropriate, labil."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak ada.\n→ KE PENGUJI: Tidak ada gangguan persepsi."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Bentuk realistik; arus FLIGHT OF IDEAS, logorea; isi pikir ide kebesaran."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Mbak, apakah Mbak sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar, mudah teralih.) Saya nggak sakit, saya cuma bahagia!\n→ KE PENGUJI: Orientasi baik, memori baik, konsentrasi mudah teralih (distraktibel); tilikan derajat 1; reliabilitas kurang."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TD 120/80, N 90. Tidak ada tremor, struma, maupun tanda intoksikasi."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Usulan: TSH/FT4, skrining NAPZA urin, fungsi ginjal & hati, tes kehamilan (sebelum valproat), EKG."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F31.1 Gangguan afektif bipolar, episode kini manik tanpa gejala psikotik; Aksis II tidak ada; Aksis III tidak ada; Aksis IV masalah pekerjaan & keuangan; Aksis V GAF 40–31."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Episode manik (F30.1); skizoafektif tipe manik; intoksikasi stimulan."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Bu, Mbak, kondisi ini disebut gangguan bipolar—suasana hati bisa naik sangat tinggi atau turun sangat dalam. Saat ini sedang fase naik."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Saya berikan obat penenang suasana hati sekarang, dan Mbak saya rujuk ke dokter spesialis jiwa untuk obat penstabil mood jangka panjang. Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: haloperidol 5 mg 3× sehari dan triheksifenidil bila EPS; mood stabilizer (litium/valproat) setelah evaluasi Sp.KJ."],["Edukasi cara minum obat & efek samping","DOKTER: Obat diminum 3 kali sehari setelah makan, setiap hari. Bisa mengantuk; kalau kaku atau gemetar minum tablet kedua."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Bu, bantu agar tidurnya teratur, kartu kredit disimpan dulu, kurangi kopi dan keramaian, catat perubahan suasana hati setiap hari."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Bila Mbak mengamuk, tidak tidur berhari-hari, atau sebaliknya sangat sedih dan ingin bunuh diri, segera ke IGD."],["Rujukan & jadwal kontrol","DOKTER: Saya buatkan rujukan ke Sp.KJ, dan kontrol 1 minggu lagi."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Haloperidol tab 5 mg   No. XXI","    S 3 dd tab I p.c.","                      ____","R/ Triheksifenidil tab 2 mg   No. X","    S 2 dd tab I p.c. (bila kaku/gemetar)","                      ____","Pro: Nn. D., 31 tahun"],"catatanObat":"[UPDATE GUIDELINE] Litium: les menulis 250–500 mg/hari → subterapeutik. Yang benar 600–1.200 mg/hari dibagi 2–3, target kadar 0,6–1,2 mEq/L. Divalproat 500–750 → 1.000–2.000 mg/hari (teratogenik; hindari pada perempuan usia subur tanpa kontrasepsi). JANGAN antidepresan tunggal. Anak: rujuk; valproat anak 10–15 mg/kgBB/hari (BB 10 kg = 100–150 mg; BB 20 kg = 200–300 mg), bukan inisiasi FKTP.","jebakan":["Tidak menggali episode depresi sebelumnya → salah diagnosis menjadi mania saja.","Memberi fluoxetin karena ada riwayat depresi.","Tidak menyebut flight of ideas/logorea di laporan.","Tidak mampu mengendalikan wawancara."],"soal":[{"station":13,"skenario":"Seorang perempuan berusia 31 tahun diantar ibunya ke praktik dokter umum karena tidak mau tidur dan bernyanyi keras di malam hari sejak 2 minggu yang lalu.","tugas":["**Lakukan wawancara psikiatri dan laporkan status mental**!","**Tegakkan diagnosis multiaksial dan diagnosis banding**!","**Berikan tatalaksana dan rujukan**!"],"kunci":["Dx: F31.1.","Skrip: dandan menor, boros, ide kebesaran, riwayat depresi + percobaan bunuh diri 3 bulan lalu lalu sembuh; NAPZA/hipertiroid (-).","Jebakan: diagnosis 'episode manik' saja; memberi antidepresan."]},{"station":14,"skenario":"Seorang laki-laki berusia 25 tahun dibawa temannya ke IGD Puskesmas karena 5 hari tidak tidur, marah-marah, dan mengaku sebagai utusan Tuhan.","tugas":["**Lakukan anamnesis**!","**Usulkan pemeriksaan penunjang** yang relevan!","**Tetapkan diagnosis**!"],"kunci":["Dx: F30.2 Mania dengan gejala psikotik (episode pertama).","Penguji membacakan: urin NAPZA negatif, TSH normal.","Jebakan: lupa skrining NAPZA; menulis bipolar padahal baru 1 episode."]}]},{"id":"gad","no":4,"nama":"Gangguan Cemas Menyeluruh / GAD (F41.1)","skdi":"3A","ringkas":{"kunci":"\"Khawatir berlebihan tentang keluarga/pekerjaan walau sebenarnya baik-baik saja\", sulit tidur & konsentrasi, tegang, berdebar, berminggu–berbulan.","khas":"Ansietas primer, hampir setiap hari beberapa minggu–bulan, free-floating (tidak terbatas situasi), 3 unsur: kecemasan, ketegangan motorik, overaktivitas otonom.","dd":"Gangguan panik (serangan episodik) • Campuran ansietas-depresi • Hipertiroid • Kafein/obat","flag":"Komorbid depresi berat/ide bunuh diri, ketergantungan benzodiazepin, tidak membaik dalam 4–6 minggu → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Bapak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Bapak. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Bapak bersedia? \nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: A., 36 tahun, pegawai bank, S1, Sukoharjo, menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; validasi kekhawatiran","DOKTER: Saya bisa memahami kekhawatiran Bapak."],["Keluhan utama & RPS — sacred seven","DOKTER: Apa yang membuat Bapak datang hari ini?\nPASIEN: Susah tidur, kerja nggak fokus. Kepikiran istri-anak di Kalimantan terus.\nDOKTER: Sejak kapan? Hampir setiap hari? Bisa dihentikan? Apa lagi yang dikhawatirkan?\nPASIEN: 2 bulan, hampir tiap hari, sulit dihentikan. Kerjaan dan kesehatan juga.\nDOKTER: Apakah badan tegang, gemetar, berdebar, berkeringat, sakit kepala?\nPASIEN: Iya, tegang dan deg-degan.\nDOKTER: Pernahkah tiba-tiba serangan takut sangat hebat lalu reda dalam beberapa menit?\nPASIEN: Tidak, rasanya terus-terusan.\nDOKTER: Merasa sedih, kehilangan minat? Pernah terpikir mengakhiri hidup?\nPASIEN: Tidak."],["Riwayat penyakit dahulu: psikiatri, obat/NAPZA/kafein, penyakit fisik (tiroid), keluarga","DOKTER: Pernah seperti ini? Berat badan turun, tidak tahan panas? Kopi berapa gelas? Rokok, alkohol? Ada keluarga yang pencemas?\nPASIEN: Tidak. Kopi 1 gelas. Ibu saya juga pencemas."],["Riwayat pribadi & sosial","DOKTER: Bagaimana situasi keluarga dan pekerjaan sekarang?\nPASIEN: Istri dan anak pindah ke Kalimantan ikut mertua, saya sendiri di sini."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi 2 bulan ini Bapak hampir setiap hari khawatir tentang keluarga, pekerjaan, dan kesehatan, disertai tegang dan berdebar, sampai sulit tidur. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; laki-laki sesuai usia, terawat; kontak baik; tampak tegang, gelisah; bicara cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Bapak hari ini?\nPASIEN: Cemas, Dok, nggak tenang.\n→ KE PENGUJI: Mood cemas/hipotimik, afek cemas, selaras, stabil."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak.\n→ KE PENGUJI: Tidak ada gangguan persepsi."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Bentuk realistik, arus koheren, isi pikir preokupasi kekhawatiran keluarga."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Bapak, apakah Bapak sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar.) Saya sadar terlalu khawatir dan mau dibantu.\n→ KE PENGUJI: Orientasi & memori baik, konsentrasi menurun; tilikan derajat 6; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TD 125/80, N 96, RR 18. Tiroid tidak membesar, tremor halus (-), jantung-paru normal."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Usulan: TSH/FT4, GDS, EKG bila berdebar."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F41.1 Gangguan cemas menyeluruh; Aksis II tidak ada; Aksis III tidak ada; Aksis IV berpisah dengan keluarga; Aksis V GAF 70–61."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Gangguan panik; campuran ansietas-depresi; hipertiroid."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Pak, kecemasan Bapak nyata dan membuat tubuh ikut tegang. Ini disebut gangguan cemas menyeluruh, bukan penyakit jantung, dan bisa diatasi."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Ada dua cara: latihan relaksasi/konseling dan obat. Saya sarankan keduanya: fluoxetin tiap pagi untuk jangka panjang, dan diazepam hanya bila cemas berat, paling lama 2 minggu. Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: fluoxetin 20 mg 1× pagi, diazepam 2 mg 2× sehari jangka pendek."],["Edukasi cara minum obat & efek samping","DOKTER: Fluoxetin efeknya terasa 2–4 minggu. Diazepam bisa membuat mengantuk: jangan menyetir, jangan dengan alkohol, jangan berhenti mendadak, dan paling lama 2 minggu karena bisa membuat ketergantungan."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Kita latihan napas: tarik 4 hitungan, tahan 4, buang 6. Kurangi kopi, olahraga 30 menit, jadwalkan video call dengan keluarga, dan konseling dengan psikolog."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Kalau muncul sedih berat, ingin mengakhiri hidup, atau nyeri dada, segera ke IGD."],["Rujukan & jadwal kontrol","DOKTER: Kontrol 2 minggu lagi; bila tidak membaik, saya rujuk ke Sp.KJ."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Fluoxetin caps 20 mg   No. XIV","    S 1 dd caps I mane p.c.","                      ____","R/ Diazepam tab 2 mg   No. XIV","    S 2 dd tab I (maks 2 minggu)","                      ____","Pro: Tn. A., 36 tahun"],"catatanObat":"[UPDATE GUIDELINE] Les memposisikan diazepam (10–30 mg/hari) & alprazolam (0,75–1,5 mg/hari) sebagai obat utama → menurut PPK FKTP 2022/NICE, SSRI lini pertama; benzodiazepin hanya jembatan ≤2–4 minggu. Anak: CBT dahulu, rujuk; diazepam anak 0,12–0,8 mg/kgBB/hari (BB 10 kg = 1,2–8 mg; BB 20 kg = 2,4–16 mg/hari), jarang dipakai.","jebakan":["Tidak menyingkirkan hipertiroid.","Benzodiazepin jangka panjang tanpa edukasi ketergantungan.","Tidak membedakan dari panik (terus-menerus vs serangan).","Melewatkan skrining depresi."],"soal":[{"station":15,"skenario":"Seorang laki-laki berusia 36 tahun datang ke klinik dengan keluhan sulit tidur dan tidak dapat berkonsentrasi saat bekerja sejak 2 bulan yang lalu.","tugas":["**Lakukan anamnesis dan pemeriksaan status mental**!","**Tegakkan diagnosis dan 2 diagnosis banding**!","**Lakukan edukasi**!"],"kunci":["Dx: F41.1. DD: panik, hipertiroid/campuran ansietas-depresi.","Skrip seperti naskah.","Poin: kekhawatiran multipel, 3 kelompok gejala, penyingkiran."]},{"station":16,"skenario":"Seorang perempuan berusia 40 tahun, guru, datang ke Puskesmas dengan keluhan sering berdebar dan gelisah sejak 3 bulan.","tugas":["**Lakukan pemeriksaan fisik** yang relevan!","**Berikan farmakoterapi, tulis resep** dan serahkan kepada penguji!"],"kunci":["PF dibacakan: TD 120/80, N 98, tiroid tidak teraba, tremor (-), jantung normal.","Dx GAD; resep SSRI + benzodiazepin jangka pendek.","Jebakan: tidak memeriksa tiroid."]}]},{"id":"panik","no":5,"nama":"Gangguan Panik (F41.0)","skdi":"3A","ringkas":{"kunci":"\"Tiba-tiba berdebar kencang, sesak, keringat dingin, takut mati\", sudah ke IGD berkali-kali, EKG normal, takut serangan berikutnya.","khas":"Beberapa serangan ansietas berat dalam ±1 bulan, tanpa bahaya objektif, tidak terbatas situasi tertentu, bebas gejala di antara serangan. Puncak ±10 menit, berlangsung beberapa menit–30 menit.","dd":"Sindrom koroner akut/aritmia (WAJIB disingkirkan) • Hipoglikemia • Hipertiroid • Agorafobia • GAD","flag":"Nyeri dada tipikal, faktor risiko kardiovaskular, sinkop, EKG abnormal → tatalaksana jantung & rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Mbak. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Mbak bersedia? \nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: P., 25 tahun, admin kantor, D3, Kartasura, belum menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; empati","DOKTER: Serangan itu pasti sangat menakutkan ya, Mbak."],["Keluhan utama & RPS — sacred seven (kronologi serangan)","DOKTER: Ceritakan serangannya: kapan, sedang apa, apa yang dirasakan, berapa lama?\nPASIEN: Tiba-tiba jantung berdebar kencang, sesak, keringat dingin, kesemutan, rasanya mau mati. Sekitar 15 menit, lalu reda.\nDOKTER: Sudah berapa kali sebulan ini? Di antara serangan, bagaimana?\nPASIEN: 4 kali. Di antaranya baik, tapi takut serangan lagi.\nDOKTER: Apakah Mbak menghindari tempat ramai atau bepergian sendiri?\nPASIEN: Sekarang takut naik bus sendirian.\nDOKTER: Merasa sedih, ingin mengakhiri hidup?\nPASIEN: Tidak."],["Riwayat penyakit dahulu: jantung, DM, tiroid, kafein/NAPZA, keluarga","DOKTER: Ada sakit jantung, gula, tiroid? Kopi, minuman energi, obat-obatan? Keluarga dengan penyakit jantung?\nPASIEN: Tidak ada semua."],["Riwayat pribadi & sosial","DOKTER: Ada tekanan di pekerjaan atau keluarga?\nPASIEN: Kerjaan sedang banyak target."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi sebulan ini Mbak 4 kali mengalami serangan berdebar, sesak, dan takut mati yang reda dalam 15 menit, dan di antara serangan Mbak baik. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; perempuan sesuai usia, terawat; kontak baik; psikomotor tenang; bicara cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Mbak hari ini?\nPASIEN: Agak takut, Dok.\n→ KE PENGUJI: Mood cemas, afek cemas, selaras."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak.\n→ KE PENGUJI: Tidak ada gangguan persepsi (saat serangan bisa ada derealisasi)."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Realistik, koheren; isi pikir takut serangan berulang (anticipatory anxiety)."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Mbak, apakah Mbak sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar.) Saya takut sakit jantung, Dok.\n→ KE PENGUJI: Orientasi, memori, konsentrasi baik; tilikan derajat 4; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TD 120/70, N 98, RR 18, S 36,5. Jantung S1-S2 reguler tanpa murmur, paru vesikuler, tiroid tidak membesar."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: DILAKUKAN EKG 12 sadapan: irama sinus 98×/menit, aksis normal, PR 0,16 s, QRS sempit, tanpa elevasi/depresi ST dan T inversi → sinus takikardia ringan, tidak ada iskemia. GDS 102 mg/dL (normal)."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F41.0 Gangguan panik (dengan kecenderungan agorafobia); Aksis II tidak ada; Aksis III tidak ada; Aksis IV tekanan pekerjaan; Aksis V GAF 70–61."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Sindrom koroner akut (tersingkir dengan EKG); hipertiroid; GAD."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Mbak, kabar baiknya jantung Mbak sehat. Yang Mbak alami adalah serangan panik: alarm tubuh yang menyala terlalu kencang padahal tidak ada bahaya. Menakutkan, tapi tidak membahayakan nyawa dan akan reda sendiri."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Saya berikan obat pagi hari untuk mencegah serangan, dan obat cadangan bila serangan berat—maksimal 2 minggu. Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: fluoxetin 10 mg 1× pagi (naik ke 20 mg setelah 1 minggu) dan alprazolam 0,5 mg bila serangan, maksimal 2 minggu."],["Edukasi cara minum obat & efek samping","DOKTER: Fluoxetin diminum pagi, awalnya mungkin sedikit gelisah, efek 2–4 minggu. Alprazolam hanya saat serangan berat, bisa mengantuk, jangan menyetir."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Saat serangan, tarik napas lewat hidung 4 hitungan, tahan 2, keluarkan lewat mulut 6 hitungan. Sebutkan 5 benda yang Mbak lihat di sekitar. Kurangi kafein. Pelan-pelan latih naik bus ditemani dulu."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Kalau nyeri dada lebih dari 20 menit, pingsan, atau keluhan berbeda dari biasanya, segera ke IGD."],["Rujukan & jadwal kontrol","DOKTER: Kontrol 2 minggu; bila tidak membaik, rujuk Sp.KJ untuk terapi kognitif-perilaku."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Fluoxetin caps 10 mg   No. XIV","    S 1 dd caps I mane p.c.","                      ____","R/ Alprazolam tab 0,5 mg   No. X","    S prn 1 tab saat serangan, maks 2 dd","                      ____","Pro: Nn. P., 25 tahun"],"catatanObat":"[UPDATE GUIDELINE] NICE CG113: benzodiazepin tidak direkomendasikan jangka panjang untuk panik; SSRI lini pertama dimulai dosis rendah. Langkah EKG: elektroda ekstremitas merah-tangan kanan, kuning-tangan kiri, hijau-kaki kiri, hitam-kaki kanan; V1 ICS4 parasternal kanan, V2 ICS4 parasternal kiri, V4 ICS5 midklavikula kiri, V3 di antaranya, V5 aksila anterior, V6 midaksila. Anak: jarang, rujuk.","jebakan":["Mendiagnosis panik tanpa EKG/GDS.","Hanya MENGUSULKAN EKG padahal soal meminta MELAKUKAN.","Tidak menanyakan bebas gejala di antara serangan.","Menyepelekan: 'itu cuma pikiran Mbak'."],"soal":[{"station":17,"skenario":"Seorang perempuan berusia 25 tahun datang ke IGD Puskesmas dengan keluhan tiba-tiba berdebar, sesak, dan takut mati sejak 15 menit yang lalu. Keluhan serupa sudah 4 kali dalam sebulan.","tugas":["**Lakukan anamnesis**!","**Lakukan prosedur pemeriksaan penunjang yang relevan dan interpretasikan hasilnya**!","**Tetapkan diagnosis**!"],"kunci":["Lakukan EKG + GDS: sinus takikardia tanpa iskemia; GDS 102.","Dx: F41.0.","Jebakan: hanya mengusulkan EKG."]},{"station":18,"skenario":"Seorang laki-laki berusia 30 tahun datang ke klinik karena sering mendadak berdebar dan berkeringat dingin, hingga takut naik bus sendirian sejak 2 bulan.","tugas":["**Tegakkan diagnosis dan 2 diagnosis banding**!","**Berikan farmakoterapi, tulis resep**!","**Lakukan edukasi**!"],"kunci":["Dx: F40.01 Agorafobia dengan gangguan panik. DD: GAD, hipertiroid.","Resep SSRI dosis rendah + benzodiazepin prn jangka pendek; edukasi paparan bertahap."]}]},{"id":"insomnia","no":6,"nama":"Insomnia Non-Organik (F51.0)","skdi":"4A","ringkas":{"kunci":"\"Sulit memulai tidur\" / \"terbangun tengah malam\" / \"bangun terlalu pagi\", mengantuk siang hari, ≥1 bulan.","khas":"Sulit masuk/mempertahankan tidur atau kualitas buruk ≥3×/minggu selama ≥1 bulan, preokupasi tidak bisa tidur, mengganggu fungsi. Early (cemas) • Middle • Late/bangun dini (curiga depresi).","dd":"Insomnia akibat depresi/GAD • Obstructive sleep apnea (mendengkur) • Gangguan ritme sirkadian/shift • Kafein/obat","flag":"Komorbid depresi berat/ide bunuh diri, penyalahgunaan hipnotik, tertidur saat menyetir."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Mas. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Mas bersedia? \nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: R., 21 tahun, mahasiswa, SMA, Pabelan, belum menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai","(Wajar.)"],["Keluhan utama & RPS — sacred seven (pola tidur rinci)","DOKTER: Coba ceritakan malam yang biasa: jam berapa ke kasur, berapa lama sampai tertidur, bangun jam berapa?\nPASIEN: Jam 11, cepat terlelap, tapi 30–40 menit kebangun, lalu melek 3 jam baru bisa tidur lagi.\nDOKTER: Seminggu berapa kali? Sudah berapa lama? Siangnya bagaimana?\nPASIEN: Hampir tiap malam, 2 bulan. Siang mengantuk, kuliah nggak fokus.\nDOKTER: Sebelum tidur biasanya melakukan apa? Kopi? Tidur siang?\nPASIEN: Main HP di kasur. Kopi sore 2 gelas.\nDOKTER: Apa yang sedang dipikirkan? Merasa sedih, kehilangan minat? Mendengkur keras atau tersedak saat tidur?\nPASIEN: Kepikiran skripsi. Tidak sedih. Tidak ngorok."],["Riwayat penyakit dahulu: psikiatri, obat/NAPZA, penyakit fisik (nyeri, sesak, nokturia), keluarga","DOKTER: Pernah minum obat tidur? Ada sakit yang membuat terbangun, sering kencing malam? Alkohol, rokok?\nPASIEN: Tidak ada."],["Riwayat pribadi & sosial","DOKTER: Kerja shift atau sering begadang?\nPASIEN: Begadang kalau ada tugas."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi 2 bulan ini hampir tiap malam Mas terbangun setelah 30–40 menit tidur dan baru bisa tidur 3 jam kemudian, sehingga siang mengantuk. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; laki-laki sesuai usia, terawat; kontak baik; psikomotor tenang; bicara cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Mas hari ini?\nPASIEN: Agak khawatir soal skripsi.\n→ KE PENGUJI: Mood hipotimik ringan, afek sesuai, tampak khawatir."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak.\n→ KE PENGUJI: Tidak ada gangguan persepsi."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Realistik, koheren, isi pikir preokupasi sulit tidur & skripsi."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Mas, apakah Mas sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar.) Saya tahu karena kebiasaan saya, mau dibantu.\n→ KE PENGUJI: Orientasi, memori baik, konsentrasi sedikit menurun; tilikan derajat 6; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TTV normal, IMT 22, lingkar leher normal, status generalis normal."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Tidak perlu penunjang rutin; minta pasien mengisi sleep diary 1–2 minggu."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F51.0 Insomnia non-organik tipe middle insomnia; Aksis II tidak ada; Aksis III tidak ada; Aksis IV tekanan akademik; Aksis V GAF 80–71."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Insomnia terkait ansietas; gangguan ritme sirkadian; OSA."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Mas mengalami insomnia, yaitu gangguan tidur yang sebagian besar dipicu kebiasaan sebelum tidur dan pikiran tentang skripsi."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Yang utama kita ubah kebiasaan tidur dulu; obat tidur hanya pembantu sementara paling lama 1 minggu. Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: diazepam 5 mg malam hari, 7 tablet saja; terapi utama sleep hygiene & kontrol stimulus."],["Edukasi cara minum obat & efek samping","DOKTER: Obat diminum setengah jam sebelum tidur, jangan dengan alkohol, jangan menyetir besok paginya, maksimal 1 minggu."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Tidur dan bangun di jam yang sama setiap hari, kasur hanya untuk tidur, HP disimpan 1 jam sebelum tidur, kopi paling lambat jam 12 siang, tidak tidur siang lebih dari 30 menit, olahraga pagi. Kalau 20 menit tidak bisa tidur lagi, keluar kamar dan baca buku yang membosankan, kembali kalau mengantuk. Catat jam tidur di buku harian tidur."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Kalau muncul sedih berat atau keinginan mengakhiri hidup, atau tertidur saat menyetir, segera kontrol."],["Rujukan & jadwal kontrol","DOKTER: Kontrol 2 minggu dengan membawa catatan tidur. (SKDI 4A: dituntaskan di FKTP.)"]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menj
