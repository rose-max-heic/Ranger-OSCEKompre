awab, tidak memotong kasar.)"]]}],"resep":["R/ Diazepam tab 5 mg   No. VII","    S 1 dd tab I h.s. (½ jam sebelum tidur)","                      ____","Pro: Sdr. R., 21 tahun"],"catatanObat":"Les: early → benzodiazepin kerja pendek; middle → kerja panjang; late → antidepresan trisiklik. [UPDATE GUIDELINE] AASM 2017/ESRS 2023/PPK FKTP: CBT-I & sleep hygiene adalah lini pertama; untuk insomnia diazepam cukup 2–5 mg dosis tunggal malam (10–30 mg di les adalah dosis ansietas). Anak: non-farmako (rutinitas tidur); hipnotik tidak dianjurkan, jadi tidak ada contoh hitung.","jebakan":["Langsung memberi obat tanpa sleep hygiene (4A = wajib edukasi).","Tidak menentukan tipe insomnia.","Tidak menyingkirkan depresi/OSA.","Benzodiazepin jumlah banyak."],"soal":[{"station":19,"skenario":"Seorang laki-laki berusia 21 tahun, mahasiswa, datang ke klinik dengan keluhan sulit mempertahankan tidur di malam hari sejak 2 bulan yang lalu.","tugas":["**Lakukan anamnesis dan pemeriksaan status mental**!","**Tegakkan diagnosis**!","**Lakukan komunikasi dan edukasi**!"],"kunci":["Dx: F51.0 middle insomnia.","Poin: pola tidur rinci, sleep hygiene & kontrol stimulus lengkap.","Jebakan: hanya memberi obat."]},{"station":20,"skenario":"Seorang perempuan berusia 50 tahun datang ke Puskesmas dengan keluhan selalu terbangun pukul 3 pagi dan tidak bisa tidur lagi sejak 1 bulan.","tugas":["**Lakukan anamnesis**!","**Tegakkan diagnosis dan 2 diagnosis banding**!","**Berikan farmakoterapi, tulis resep**!"],"kunci":["Late insomnia → gali depresi: anhedonia, afek depresif, anergia, makan↓, bunuh diri (-).","Dx: F32.1 Episode depresif sedang; DD insomnia non-organik, GAD.","Jebakan: diagnosis insomnia saja."]}]},{"id":"somatoform","no":7,"nama":"Gangguan Somatoform – Hipokondrik (F45.2)","skdi":"3A","ringkas":{"kunci":"\"Sudah berobat berkali-kali\", \"semua hasil normal\", \"tetap yakin punya penyakit serius (tumor, jantung)\".","khas":"Keluhan fisik berulang + permintaan pemeriksaan terus walau hasil negatif + menolak penjelasan dokter. Somatisasi = banyak gejala berganti ≥2 th • Hipokondrik = yakin ≥1 penyakit serius • Nyeri somatoform = nyeri menetap • Dismorfik = yakin bagian tubuh cacat • Psikosomatis = ada kelainan tapi tidak sebanding.","dd":"Cemas/depresi dengan gejala somatik • Waham somatik (psikotik) • Penyakit organik yang belum terdeteksi","flag":"Tanda organik baru (defisit neurologis, muntah proyektil, BB turun, demam), komorbid depresi + ide bunuh diri."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Mbak. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Mbak bersedia? \nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: W., 29 tahun, pegawai swasta, S1, Banyuanyar, menikah, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; validasi keluhan","DOKTER: Saya percaya pusing yang Mbak rasakan benar-benar nyata."],["Keluhan utama & RPS — sacred seven","PASIEN: Dok, saya yakin kena tumor otak. Pusing terus 2 bulan, sudah 17 kali berobat, nggak ada yang bisa menemukan!\nDOKTER: Pusingnya seperti apa, di mana, seberapa berat? Apa yang membuat Mbak yakin itu tumor?\nPASIEN: Kencang di kepala, hilang timbul. Tetangga saya meninggal karena tumor otak, gejalanya sama.\nDOKTER: Pernah muntah menyemprot, kejang, lemah sebelah badan, pandangan ganda, demam, berat badan turun?\nPASIEN: Tidak pernah.\nDOKTER: Ketika dokter menjelaskan CT-scan normal, bagaimana perasaan Mbak?\nPASIEN: Lega sebentar, besoknya khawatir lagi.\nDOKTER: Merasa sedih terus, ingin mengakhiri hidup?\nPASIEN: Tidak."],["Riwayat penyakit dahulu: psikiatri, obat, penyakit fisik, keluarga","DOKTER: Pernah seperti ini sebelumnya? Minum obat apa saja? Keluarga?\nPASIEN: Tidak. Obat sakit kepala dari dokter-dokter itu."],["Riwayat pribadi & sosial","DOKTER: Bagaimana pekerjaan dan keluarga sekarang?\nPASIEN: Sering izin kerja karena berobat, suami mulai kesal."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi 2 bulan ini Mbak pusing dan yakin ada tumor otak, sudah 17 kali berobat dan CT-scan normal, tapi kekhawatiran muncul lagi. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; perempuan sesuai usia, terawat; kontak baik; psikomotor tenang; bicara cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Mbak hari ini?\nPASIEN: Khawatir, Dok.\n→ KE PENGUJI: Mood hipotimik, afek cemas, selaras."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak.\n→ KE PENGUJI: Tidak ada gangguan persepsi."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Realistik, koheren; isi pikir preokupasi menderita tumor otak (masih bisa digoyahkan → bukan waham)."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Mbak, apakah Mbak sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar.) Dokter-dokter itu yang salah, saya pasti sakit.\n→ KE PENGUJI: Orientasi, memori, konsentrasi baik; tilikan derajat 3; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TTV normal. GCS 15, nervus kranial normal, motorik 5/5, refleks fisiologis normal, patologis (-), meningeal (-)."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Review hasil sebelumnya: CT-scan kepala normal. Tidak perlu pemeriksaan berulang tanpa indikasi."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F45.2 Gangguan hipokondrik; Aksis II tidak ada; Aksis III tidak ada; Aksis IV kematian tetangga, masalah pekerjaan; Aksis V GAF 70–61."],["Menyampaikan diagnosis banding","→ KE PENGUJI: GAD; depresi dengan gejala somatik; waham somatik."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Mbak, pemeriksaan saraf hari ini dan CT-scan tidak menunjukkan tanda tumor. Pusing Mbak nyata, dan sering dipicu stres serta kecemasan yang membuat otot kepala tegang."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Daripada berpindah-pindah dokter, bagaimana kalau Mbak kontrol rutin ke saya tiap 2 minggu, ditambah obat untuk meredakan kecemasan dan konseling? Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: fluoxetin 20 mg 1× pagi; rencana psikoterapi."],["Edukasi cara minum obat & efek samping","DOKTER: Obat diminum pagi, efeknya 2–4 minggu, bukan obat penenang yang membuat ketagihan."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Kontrol ke satu dokter tetap, latihan relaksasi otot, kembali beraktivitas normal walau masih ada pusing, dan konseling dengan psikolog."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Kalau muncul muntah menyemprot, kejang, lemah sebelah badan, pandangan ganda, atau pusing makin berat, segera kembali."],["Rujukan & jadwal kontrol","DOKTER: Kontrol 2 minggu; bila keluhan menetap, rujuk Sp.KJ/psikolog."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Fluoxetin caps 20 mg   No. XIV","    S 1 dd caps I mane p.c.","                      ____","Pro: Ny. W., 29 tahun"],"catatanObat":"[UPDATE GUIDELINE] Les memberi anti-cemas (diazepam/alprazolam) → bukti terbaik SSRI; amitriptilin 10–25 mg malam untuk nyeri somatoform; benzodiazepin hanya jangka pendek. Anak: rujuk, non-farmako.","jebakan":["Mengatakan 'itu cuma pikiran Mbak'.","Tidak melakukan pemeriksaan neurologis.","Meminta CT-scan ulang.","Tertukar subtipe (hipokondrik vs somatisasi vs psikosomatis)."],"soal":[{"station":21,"skenario":"Seorang perempuan berusia 29 tahun datang ke IGD menyatakan dirinya memiliki tumor otak karena sering pusing sejak 2 bulan. Ia sudah berobat 17 kali dan CT-scan normal.","tugas":["**Lakukan anamnesis dan pemeriksaan status mental**!","**Usulkan diagnosis multiaksial**!","**Berikan edukasi dan tatalaksana**!"],"kunci":["Dx: F45.2.","Poin: empati, red flag organik (-), edukasi satu dokter tetap.","Jebakan: meminta CT ulang."]},{"station":22,"skenario":"Seorang laki-laki berusia 45 tahun datang ke klinik dengan keluhan nyeri berpindah-pindah di perut, dada, dan punggung sejak 3 tahun. Berbagai pemeriksaan normal.","tugas":["**Lakukan pemeriksaan fisik** yang relevan!","**Tegakkan diagnosis dan 2 diagnosis banding**!"],"kunci":["PF abdomen, toraks, vertebra normal.","Dx: F45.0 Gangguan somatisasi. DD: hipokondrik, depresi dengan gejala somatik.","Jebakan: menulis hipokondrik."]}]},{"id":"ptsd","no":8,"nama":"Gangguan Stres Pascatrauma / PTSD (F43.1)","skdi":"3A","ringkas":{"kunci":"Kejadian traumatik/katastrofik, \"teringat terus, mimpi buruk\", \"tidak tahan mendengar sirene\", menghindari pemicu.","khas":"Onset DALAM 6 bulan setelah trauma berat + re-experiencing (flashback, mimpi buruk) + penghindaran + hyperarousal (mudah kaget, insomnia) ± numbing.","dd":"Reaksi stres akut (<1 bulan) • Gangguan penyesuaian (stresor tidak katastrofik) • Depresi/duka cita berkepanjangan","flag":"Ide bunuh diri, penyalahgunaan alkohol/NAPZA, disosiasi berat → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan Mas. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Mas bersedia? \nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: H., 23 tahun, ojek online, SMA, Gonilan, duda, Jawa."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; ruang aman, tidak memaksa detail trauma","DOKTER: Mas boleh bercerita sejauh yang nyaman, dan kita bisa berhenti kapan saja."],["Keluhan utama & RPS — sacred seven (3 kelompok gejala)","PASIEN: (menangis) Setiap dengar sirene ambulans, saya ingat istri saya meninggal di ambulans waktu dirujuk. Sudah 2 tahun.\nDOKTER: Saya turut berduka, Mas. Kapan mulai muncul ingatan itu setelah kejadian? Terasa terulang di depan mata atau dalam mimpi?\nPASIEN: Sebulan setelah kejadian. Sering mimpi juga.\nDOKTER: Apakah Mas menghindari tempat atau suara yang mengingatkan? Mudah kaget, sulit tidur?\nPASIEN: Tidak mau lewat RS itu. Gampang kaget.\nDOKTER: Pernah merasa ingin menyusul istri atau mengakhiri hidup? Minum alkohol untuk melupakan?\nPASIEN: Tidak, saya masih punya anak."],["Riwayat penyakit dahulu: psikiatri, obat/alkohol/NAPZA, penyakit, keluarga","DOKTER: Sebelum kejadian itu pernah ada gangguan serupa? Keluarga?\nPASIEN: Tidak."],["Riwayat pribadi & sosial","DOKTER: Siapa yang mendukung Mas sekarang? Pekerjaan bagaimana?\nPASIEN: Ibu saya yang mengurus anak. Kerja masih bisa tapi menghindari jalan ke RS."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi sejak istri meninggal 2 tahun lalu, Mas sering teringat dan bermimpi tentang kejadian itu, menghindari RS dan sirene, serta mudah kaget. Betul?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: CM; laki-laki sesuai usia, terawat; kontak baik; menangis saat bercerita; bicara cukup."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Mas hari ini?\nPASIEN: Sedih, Dok.\n→ KE PENGUJI: Mood hipotimik, afek sesuai/selaras."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: Tidak.\n→ KE PENGUJI: Tidak ada halusinasi; flashback (bukan halusinasi)."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Realistik, koheren, isi pikir preokupasi kejadian traumatik."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Mas, apakah Mas sedang sakit dan butuh bantuan?\nPASIEN: (Orientasi benar.) Saya tahu ini karena kejadian itu, saya mau sembuh.\n→ KE PENGUJI: Orientasi, memori, konsentrasi baik; tilikan derajat 6; reliabel."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: TTV normal, status generalis normal."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Tidak spesifik; skrining PCL-5 bila tersedia."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F43.1 Gangguan stres pascatrauma; Aksis II tidak ada; Aksis III tidak ada; Aksis IV kematian istri; Aksis V GAF 60–51."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Episode depresif; duka cita berkepanjangan; gangguan penyesuaian."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Mas, yang Mas alami disebut gangguan stres pascatrauma—reaksi wajar terhadap kejadian yang sangat tidak wajar. Ini bisa pulih dengan terapi."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Terapi utamanya konseling khusus trauma dengan psikolog/psikiater, ditambah obat untuk membantu suasana hati dan tidur. Setuju?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Ini resep saya, Dok: fluoxetin 20 mg 1× pagi, dan rujuk untuk psikoterapi berfokus trauma."],["Edukasi cara minum obat & efek samping","DOKTER: Obat diminum pagi, efek 2–4 minggu, jangan berhenti sendiri."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Latihan napas dan relaksasi saat teringat, tetap beraktivitas, ceritakan kepada orang yang dipercaya, hindari alkohol."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Bila muncul keinginan mengakhiri hidup atau mulai minum alkohol untuk melupakan, segera kembali."],["Rujukan & jadwal kontrol","DOKTER: Saya rujuk ke psikolog/Sp.KJ untuk terapi trauma; kontrol 2 minggu."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["R/ Fluoxetin caps 20 mg   No. XIV","    S 1 dd caps I mane p.c.","                      ____","Pro: Tn. H., 23 tahun"],"catatanObat":"[UPDATE GUIDELINE] Les menulis '>6 bulan' → PPDGJ III: onset dalam 6 bulan pascatrauma (DSM-5: gejala >1 bulan). Psikoterapi berfokus trauma (TF-CBT/EMDR) adalah lini pertama; SSRI sesuai les; benzodiazepin tidak dianjurkan. Anak: TF-CBT, rujuk.","jebakan":["Memaksa pasien menceritakan detail trauma.","Salah kriteria waktu.","Memberi benzodiazepin.","Lupa skrining bunuh diri & alkohol."],"soal":[{"station":23,"skenario":"Seorang laki-laki berusia 23 tahun datang ke klinik karena tidak bisa berhenti menangis setiap mendengar sirene ambulans sejak istrinya meninggal 2 tahun lalu.","tugas":["**Lakukan anamnesis dan pemeriksaan status mental**!","**Usulkan diagnosis multiaksial**!","**Berikan edukasi dan tatalaksana**!"],"kunci":["Dx: F43.1.","Poin: tiga kelompok gejala, onset, bunuh diri/alkohol.","Jebakan: memaksa detail."]},{"station":24,"skenario":"Seorang perempuan berusia 19 tahun datang ke Puskesmas 2 minggu setelah selamat dari banjir bandang, mengeluh sering mimpi buruk dan mudah terkejut.","tugas":["**Tegakkan diagnosis dan 2 diagnosis banding**!","**Lakukan komunikasi dan edukasi**!"],"kunci":["Dx: F43.0 Reaksi stres akut (belum 1 bulan).","DD: PTSD bila menetap; gangguan penyesuaian.","Jebakan: langsung menulis PTSD."]}]},{"id":"agitasi","no":9,"nama":"Gaduh Gelisah / Agitasi Akut — KASUS PROSEDUR","skdi":"3B","ringkas":{"kunci":"\"Mengamuk\", \"mengancam dengan parang\", dibawa warga ke IGD Puskesmas, tidak bisa diajak bicara.","khas":"Agitasi psikomotor berat yang membahayakan diri/orang lain. Penyebab: skizofrenia/psikotik akut, mania, intoksikasi/putus zat, DELIRIUM (organik).","dd":"Psikotik • Mania • Intoksikasi/withdrawal alkohol-NAPZA • Delirium (demam, hipoglikemia, cedera kepala)","flag":"Kesadaran menurun, demam, kejang, hipoglikemia, cedera kepala, TTV tidak stabil → kegawatan medis. Setelah tenang → rujuk RSJ."},"tabel":[{"name":"Pembukaan & Keamanan","rows":[["Memastikan keamanan: meminta bantuan tim (≥5 orang), menyingkirkan benda berbahaya, posisi dekat pintu","DOKTER: (ke petugas) Pak, tolong panggil 4 petugas lagi dan singkirkan barang tajam."],["Memberikan salam & memperkenalkan diri dengan tenang; de-eskalasi verbal","DOKTER: (ke pasien) Mas J., saya dr. R.. Saya di sini untuk membantu. Mas aman di sini. Bagaimana kalau duduk dulu dan minum air?\nPASIEN: (berteriak) Pergi! Semua mau bunuh saya!"],["Informed consent kepada keluarga untuk fiksasi & injeksi","DOKTER: (ke ibu) Bu, Mas J. sangat gelisah dan bisa melukai diri maupun orang lain. Untuk keselamatan, kami akan mengikat sementara tangan-kakinya dengan pengikat lembut dan memberi suntikan penenang. Hanya sementara dan dipantau tiap 15 menit. Ibu setuju?\nPENGHANTAR: Iya, Dok."]]},{"name":"Alloanamnesis Singkat","rows":[["Menanyakan onset, pemicu, riwayat gangguan jiwa & putus obat","DOKTER: Sejak kapan seperti ini? Pernah sakit jiwa atau minum obat?\nPENGHANTAR: Sejak tadi pagi. Dulu didiagnosis skizofrenia, berhenti obat 2 bulan."],["Menyingkirkan organik: NAPZA/alkohol, demam, kejang, trauma kepala, DM","DOKTER: Minum alkohol, pakai obat? Demam, jatuh, kejang, sakit gula?\nPENGHANTAR: Tidak ada."]]},{"name":"Prosedur Fiksasi (Restrain) Fisik","rows":[["Menentukan indikasi (membahayakan, de-eskalasi gagal) dan membagi tim: 1 pemimpin (kepala) + 4 orang ekstremitas","DOKTER: (ke tim) Saya pegang kepala. Pak A dan B lengan kanan-kiri, Pak C dan D tungkai."],["Mendekat serentak dengan aba-aba, memegang sendi besar (bahu-siku, panggul-lutut), tidak menekan dada/leher","DOKTER: Pada hitungan tiga, pegang bahu-siku dan panggul-lutut. Satu, dua, tiga."],["Membaringkan TERLENTANG (bukan telungkup), kepala sedikit ditinggikan","DOKTER: Baringkan terlentang, kepala sedikit tinggi."],["Fiksasi 4 titik di rangka tempat tidur, longgar 2 jari","DOKTER: Ikat pergelangan tangan dan kaki, sisakan longgar dua jari."],["Memantau sirkulasi distal & TTV tiap 15 menit; mendokumentasikan jam & alasan","→ KE PENGUJI: Fiksasi 4 titik pukul 10.00, dipantau tiap 15 menit."]]},{"name":"Prosedur Injeksi IM Haloperidol","rows":[["Memeriksa obat (5 tepat): haloperidol 5 mg/mL, dosis 5 mg IM","DOKTER: Haloperidol 5 mg/mL, satu ampul, 5 mg intramuskular."],["Cuci tangan, sarung tangan; menyiapkan spuit 3 mL, menarik obat, membuang udara","(Patahkan ampul, aspirasi 1 mL, keluarkan udara.)"],["Memberi tahu pasien, memilih lokasi (deltoid / gluteus kuadran lateral atas / vastus lateralis), desinfeksi sirkuler","DOKTER: Mas J., saya akan menyuntikkan obat penenang di lengan, akan terasa sedikit sakit."],["Menusuk 90°, ASPIRASI (tidak ada darah), menyuntik perlahan, mencabut & menekan kapas","(Tusuk 90°, aspirasi, injeksi pelan, cabut, tekan.)"],["Membuang jarum ke safety box, cuci tangan","(Jarum ke safety box, lepas sarung tangan, cuci tangan.)"],["Observasi 15–30 menit: sedasi, TTV, distonia akut; ulang bila perlu tiap 30 menit (maks 3×)","→ KE PENGUJI: Haloperidol 5 mg IM di deltoid kanan pukul 10.05. Bila 30 menit belum tenang dapat diulang, maksimal 3 kali. Siapkan difenhidramin bila distonia akut."]]},{"name":"Pemeriksaan setelah Tenang & Diagnosis","rows":[["Memeriksa TTV, GCS, GDS, tanda cedera kepala, pupil, bau alkohol","→ KE PENGUJI: TD 130/80, N 100, RR 20, S 36,7; GCS 15; GDS 110 mg/dL; tanda cedera kepala (-)."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Gaduh gelisah ec. eksaserbasi skizofrenia paranoid akibat putus obat. DD: episode manik, intoksikasi zat, delirium."]]},{"name":"Penutupan & Rujukan","rows":[["Menyerahkan resep ke penguji","→ KE PENGUJI: Ini resep saya, Dok: haloperidol injeksi 5 mg IM, diazepam injeksi 10 mg IV pelan bila diperlukan (tidak dicampur dalam 1 spuit)."],["Menjelaskan kepada keluarga alasan tindakan & kondisi saat ini","DOKTER: Bu, Mas J. sekarang lebih tenang. Ikatan tadi untuk keselamatan, bukan hukuman. Kambuhnya kemungkinan karena berhenti obat."],["Menyampaikan rujukan (RSJ, didampingi petugas, surat berisi kronologi & obat)","DOKTER: Kami rujuk ke RSJ hari ini didampingi petugas. Surat rujukan dan catatan obat sudah saya siapkan. Ke depan obat harus diminum rutin. Ada yang ingin ditanyakan?"]]},{"name":"Profesionalisme","rows":[["Melakukan tindakan dengan sikap profesional, aman, dan menghormati martabat pasien","(Tenang, tidak membentak, tim terkoordinasi.)"]]}],"resep":["R/ Haloperidol inj 5 mg/mL   amp No. I","    S imm 5 mg i.m.","                      ____","R/ Diazepam inj 10 mg/2 mL   amp No. I","    S imm 10 mg i.v. pelan","                      ____","Pro: Tn. J., 30 tahun"],"catatanObat":"PPK FKTP 2022: haloperidol 5 mg IM, ulang tiap 30 menit, maks 3× (≤20 mg/24 jam). [UPDATE GUIDELINE] Diazepam jangan IM (absorpsi tidak menentu) → IV pelan ≤5 mg/menit atau per rektal; benzodiazepin lebih dipilih bila karena putus alkohol/stimulan. Lansia/delirium: haloperidol 0,5–2 mg. Anak: de-eskalasi utama; diazepam 0,2–0,3 mg/kgBB IV/rektal → BB 10 kg = 2–3 mg; BB 20 kg = 4–6 mg; haloperidol 0,025–0,075 mg/kgBB IM (≥3 th) → BB 10 kg = 0,25–0,75 mg; BB 20 kg = 0,5–1,5 mg; lalu rujuk.","jebakan":["Mendekati pasien sendirian / tanpa tim.","Fiksasi telungkup atau menekan dada/leher.","Tidak aspirasi saat IM; diazepam diberikan IM.","Tidak menyingkirkan organik (GDS, demam, cedera kepala) setelah tenang."],"soal":[{"station":25,"skenario":"Seorang laki-laki berusia 30 tahun dibawa keluarga dan warga ke IGD Puskesmas karena mengamuk dan mengancam warga dengan parang sejak pagi tadi.","tugas":["**Lakukan tatalaksana kegawatdaruratan** (tindakan) pada pasien!","**Berikan farmakoterapi** yang sesuai dan tuliskan resep!","**Sampaikan rencana rujukan** kepada keluarga!"],"kunci":["Manekin/PS. Dinilai: keamanan & tim, de-eskalasi, IC keluarga, fiksasi benar, injeksi IM lege artis, observasi, cek organik, rujukan.","Jebakan: fiksasi telungkup, tidak aspirasi, sendirian."]},{"station":26,"skenario":"Seorang laki-laki berusia 45 tahun dibawa ke IGD karena gelisah, bicara kacau, berkeringat, dan gemetar 2 hari setelah berhenti minum alkohol.","tugas":["**Lakukan anamnesis singkat** dan **pemeriksaan fisik**!","**Tetapkan diagnosis**!","**Berikan tatalaksana awal**!"],"kunci":["Penguji membacakan: TD 160/100, N 120, S 38,0, tremor kasar, disorientasi, halusinasi visual.","Dx: keadaan putus alkohol dengan delirium (delirium tremens).","Tatalaksana: diazepam 10 mg IV pelan (ulang sesuai respons), tiamin 100 mg IV sebelum glukosa, cairan, rujuk RS.","Jebakan: haloperidol saja (menurunkan ambang kejang)."]}]},{"id":"adhd","no":10,"nama":"ADHD / Gangguan Hiperkinetik (F90.0) — KASUS ANAK","skdi":"3A","ringkas":{"kunci":"Anak laki-laki usia SD, \"tidak bisa diam\", \"tidak menyelesaikan tugas\", \"menyela\", keluhan dari guru DAN orang tua, ≥6 bulan.","khas":"Gangguan perhatian + hiperaktivitas (± impulsivitas), onset <7 th (DSM-5 <12 th), ≥6 bulan, di ≥2 situasi (rumah & sekolah), mengganggu fungsi.","dd":"Gangguan tingkah laku (agresif, melanggar aturan) • Retardasi mental/kesulitan belajar • Gangguan pendengaran/penglihatan • Autisme","flag":"Perilaku membahayakan (lari ke jalan), agresif berat, komorbid → rujuk Sp.KJ anak/Sp.A tumbuh kembang; stimulan hanya oleh spesialis."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam kepada pasien","DOKTER: Selamat pagi, Ibu. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menjelaskan tujuan wawancara","DOKTER: Hari ini saya ingin berbincang sekitar 10 menit untuk memahami keluhan F.. Semua yang diceritakan akan saya jaga kerahasiaannya."],["Menanyakan kesediaan pasien atau keluarga untuk wawancara (autoanamnesis / alloanamnesis)","DOKTER: Apakah Ibu bersedia? Saya juga akan bertanya kepada Ibu (ibu kandung) yang mengantar.\nPASIEN: Iya, Dok."],["Menanyakan identitas: nama, usia, pekerjaan, pendidikan terakhir, alamat, status perkawinan, suku","DOKTER: Boleh saya tahu nama lengkap, usia, pekerjaan, pendidikan terakhir, alamat, status pernikahan, dan suku?\nPASIEN: Anak F., 8 tahun, kelas 2 SD, Kartasura, belum menikah, Jawa. Ibu: Rina, 35 tahun, IRT."]]},{"name":"Persiapan","rows":[["Mempersiapkan perlengkapan: catatan dan bolpoin (tulis contekan status mental saat 30 detik baca soal)","(Tulis di kertas: SADAR-PENAMPILAN-KONTAK-PSIKOMOTOR-AFEK-BICARA-RELIABILITAS | PERSEPSI-BENTUK-ISI-ARUS-MOOD-INGATAN-KOGNITIF-ORIENTASI-INSIGHT)"]]},{"name":"Wawancara Psikiatri","rows":[["Melakukan kontak mata yang sesuai; menyapa anak dengan bahasa anak","DOKTER: Halo, adik namanya siapa? Kelas berapa? Ini ada kertas dan krayon, boleh menggambar ya."],["Keluhan utama & RPS — sacred seven (perhatian, hiperaktif, impulsif; onset; ≥2 setting)","DOKTER: Bu, apa yang dikeluhkan?\nPENGHANTAR: Kata guru, F. nggak bisa diam di kelas, jalan-jalan, ganggu teman.\nDOKTER: Di rumah bagaimana? Sejak usia berapa?\nPENGHANTAR: Di rumah juga, dari TK. PR nggak pernah selesai, barang sering hilang, suka memotong omongan, nggak sabar antre.\nDOKTER: Apakah F. memukul, merusak, mencuri, berbohong? Mau bermain dengan teman, menatap mata saat diajak bicara?\nPENGHANTAR: Tidak pernah memukul. Main sama teman mau, lihat mata bisa."],["Riwayat penyakit dahulu & tumbuh kembang: kehamilan, persalinan, perkembangan, pendengaran, penglihatan, kejang, keluarga","DOKTER: Waktu hamil Ibu merokok atau sakit? Lahir cukup bulan? Bicara dan berjalan sesuai usia? Pendengaran dan penglihatan baik? Pernah kejang atau jatuh kepala? Ada keluarga seperti ini?\nPENGHANTAR: Tidak, lahir normal, perkembangan sesuai. Pendengaran dan penglihatan baik. Ayahnya dulu juga aktif sekali."],["Riwayat pribadi & sosial: pola asuh, sekolah, gawai","DOKTER: Bagaimana nilai di sekolah? Main HP berapa lama sehari? Kalau nakal biasanya bagaimana?\nPENGHANTAR: Nilainya pas-pasan karena nggak fokus. HP 4 jam. Sering saya marahi."]]},{"name":"Penutupan Wawancara Psikiatri","rows":[["Menyampaikan hasil wawancara (merangkum)","DOKTER: Jadi sejak TK F. sulit fokus, tidak bisa diam, dan suka menyela, baik di rumah maupun di sekolah, tanpa perilaku agresif. Betul, Bu?"],["Menanyakan tambahan informasi terkait keluhan","DOKTER: Apakah ada hal lain yang belum sempat diceritakan?\nPASIEN: Sudah, Dok."],["Menutup sesi wawancara dan menjelaskan pemeriksaan selanjutnya","DOKTER: Terima kasih. Selanjutnya saya akan mengajukan beberapa pertanyaan singkat dan memeriksa tekanan darah serta kondisi fisik. Boleh?"]]},{"name":"Prosedur Penilaian Status Mental Psikiatri","rows":[["Menilai kesan umum: kesadaran, penampilan, kontak verbal & visual, aktivitas psikomotor, pembicaraan","(Observasi, tidak ditanyakan.)\n→ KE PENGUJI: Anak sadar, sesuai usia, terawat; kontak mata baik; psikomotor hiperaktif (berdiri, memanjat kursi); bicara banyak."],["Menilai mood dan afek","DOKTER: Bagaimana perasaan Ibu hari ini?\nPASIEN: (Anak) Senang!\n→ KE PENGUJI: Mood eutimik, afek luas, sesuai."],["Menilai gangguan persepsi (halusinasi, ilusi)","DOKTER: Apakah pernah mendengar suara atau melihat sesuatu yang orang lain tidak dengar/lihat?\nPASIEN: (Anak) Nggak.\n→ KE PENGUJI: Tidak ada gangguan persepsi."],["Menilai proses pikir: bentuk, arus, isi pikir","→ KE PENGUJI: Sesuai usia, koheren."],["Menilai sensorium & kognisi: orientasi, daya ingat, konsentrasi, berpikir abstrak, visuospasial, informasi/intelegensia, tilikan, reliabilitas","DOKTER: Sekarang kita sedang di mana? Hari apa? Saya siapa? Tolong ingat 3 kata: apel, meja, koin. 100 dikurangi 7 berapa? Apa arti 'panjang tangan'? Siapa presiden kita? Menurut Ibu, apakah Ibu sedang sakit dan butuh bantuan?\nPASIEN: (Anak menjawab orientasi sederhana dengan benar, perhatian mudah teralih.)\n→ KE PENGUJI: Orientasi baik, perhatian & konsentrasi mudah teralih, intelegensia kesan rata-rata; reliabilitas (alloanamnesis) dapat dipercaya."]]},{"name":"Pemeriksaan Fisik & Penunjang","rows":[["Meminta izin pemeriksaan fisik, mencuci tangan 6 langkah WHO","DOKTER: Saya akan memeriksa tekanan darah, nadi, dan saraf. Boleh? (cuci tangan)"],["Memeriksa TTV, status generalis & neurologis singkat yang relevan","→ KE PENGUJI: BB 20 kg, TB 125 cm (gizi baik), TTV normal, tes bisik normal kedua telinga, visus kesan baik, neurologis normal."],["Mengusulkan / melakukan pemeriksaan penunjang dan interpretasi","→ KE PENGUJI: Kuesioner SPPAHI (diisi ibu & guru): skor 38 (≥30 → curiga ADHD). Penunjang lain hanya bila curiga organik."]]},{"name":"Diagnosis","rows":[["Menyampaikan diagnosis multiaksial (Aksis I–V)","→ KE PENGUJI: Aksis I F90.0 Gangguan aktivitas dan perhatian; Aksis II tidak ada retardasi mental; Aksis III tidak ada; Aksis IV masalah sekolah, pola asuh; Aksis V GAF 60–51."],["Menyampaikan diagnosis banding","→ KE PENGUJI: Gangguan tingkah laku; kesulitan belajar spesifik/retardasi mental; gangguan pendengaran."]]},{"name":"Tatalaksana","rows":[["Menjelaskan diagnosis kepada pasien/keluarga dengan bahasa awam","DOKTER: Bu, F. mengalami ADHD, yaitu gangguan perkembangan otak yang membuat anak sulit fokus dan sulit diam. Ini bukan karena F. nakal atau Ibu salah mendidik."],["Menawarkan pilihan terapi & meminta persetujuan (shared decision)","DOKTER: Ada dua cara yang saling melengkapi: latihan perilaku di rumah dan sekolah, serta obat bila diperlukan, yang akan diputuskan dokter spesialis jiwa anak. Bagaimana, Bu?\nPASIEN: Setuju, Dok."],["Farmakoterapi: menulis resep lengkap dan menyerahkan ke penguji","→ KE PENGUJI: Rencana: terapi perilaku dan rujuk Sp.KJ anak. Bila diresepkan metilfenidat 0,3–1 mg/kgBB/hari → BB 20 kg = 6–20 mg/hari, mulai 5 mg pagi dan siang. Ini contoh resep rujuk baliknya, Dok."],["Edukasi cara minum obat & efek samping","DOKTER: Bila nanti diberi obat, diminum pagi dan siang setelah makan, jangan sore/malam karena sulit tidur. Bisa membuat nafsu makan turun, jadi berat dan tinggi badan dipantau."],["Tatalaksana non-farmako / psikoedukasi","DOKTER: Buat jadwal harian yang tetap, beri perintah satu per satu sambil menatap mata, pujilah segera saat berhasil, gunakan sistem bintang/hadiah, kurangi HP jadi paling lama 1 jam, ajak olahraga. Mohon bicara dengan guru agar F. duduk di depan dan tugasnya dipecah kecil-kecil."],["Menjelaskan tanda bahaya (kapan segera kembali)","DOKTER: Bila F. sering lari ke jalan, menyakiti diri/teman, atau sangat sulit tidur setelah minum obat, segera kontrol."],["Rujukan & jadwal kontrol","DOKTER: Saya buatkan rujukan ke dokter spesialis jiwa anak / dokter anak tumbuh kembang."]]},{"name":"Penutupan","rows":[["Menginformasikan bahwa pemeriksaan telah selesai","DOKTER: Pemeriksaan hari ini sudah selesai."],["Menjelaskan hasil pemeriksaan & cek pemahaman","DOKTER: Supaya saya yakin penjelasan saya jelas, boleh diulang obatnya diminum kapan?\nPASIEN: (mengulang dengan benar)"],["Menanyakan apakah ada hal yang ingin ditanyakan","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok."],["Mengucapkan terima kasih (cuci tangan)","DOKTER: Terima kasih, semoga lekas membaik."]]},{"name":"Profesionalisme","rows":[["Melakukan wawancara dan pemeriksaan dengan sikap profesional (empati, tidak menghakimi, tidak membantah/mengiyakan waham)","(Sikap: kontak mata, nada tenang, beri waktu menjawab, tidak memotong kasar.)"]]}],"resep":["(Rujuk balik, sesuai resep Sp.KJ anak — psikotropika gol. II)","R/ Metilfenidat tab 10 mg   No. X (sepuluh)","    S 2 dd ½ tab (pagi & siang, p.c.)","                      ____","Pro: An. F., 8 tahun (BB 20 kg)","Alamat: ……"],"catatanObat":"[UPDATE GUIDELINE] IDAI/NICE NG87/AAP 2019: usia <6 th → parent training lini pertama; ≥6 th → terapi perilaku + obat. Metilfenidat 0,3–1 mg/kgBB/hari, maks 60 mg/hari. Contoh hitung: BB 20 kg = 6–20 mg/hari; BB 10 kg (setara ±1 tahun) → TIDAK diindikasikan. Alternatif atomoksetin 0,5 → 1,2 mg/kgBB/hari (BB 20 kg = 10 → 24 mg).","jebakan":["Tidak menanyakan situasi sekolah (syarat ≥2 setting).","Tidak menyingkirkan gangguan pendengaran/retardasi mental.","Memberi stimulan langsung di FKTP / pada anak <6 tahun.","Menyalahkan orang tua."],"soal":[{"station":27,"skenario":"Seorang anak laki-laki berusia 8 tahun diantar ibunya ke Puskesmas karena dikeluhkan guru tidak bisa diam dan sulit memperhatikan pelajaran sejak kelas 1.","tugas":["**Lakukan anamnesis** kepada ibu pasien!","**Tegakkan diagnosis dan 2 diagnosis banding**!","**Lakukan komunikasi dan edukasi**!"],"kunci":["Dx: F90.0.","Poin: onset <7 th, ≥6 bulan, 2 setting, penyingkiran tingkah laku/autisme/pendengaran, edukasi tanpa menyalahkan + rujuk."]},{"station":28,"skenario":"Seorang anak laki-laki berusia 4 tahun, BB 16 kg, dibawa ibunya karena sangat aktif, sering memanjat lemari dan berlari ke jalan.","tugas":["**Lakukan pemeriksaan fisik** yang relevan!","**Berikan tatalaksana** dan sampaikan kepada penguji!"],"kunci":["PF tumbuh kembang (BB/TB, lingkar kepala), pendengaran, penglihatan, KPSP normal.","Tatalaksana: parent training & keamanan rumah, TIDAK memberi metilfenidat (usia <6 th), rujuk tumbuh kembang.","Jebakan: menulis resep stimulan."]}]}],"daftar":[["1","Skizofrenia paranoid","3A","bicara sendiri, merasa diikuti, ≥1 bln","Wawancara + status mental","Ya (Sp.KJ)"],["2","Episode depresif","3A","murung, mengurung diri, ≥2 mgg","Skrining bunuh diri","Ya bila berat/psikotik"],["3","Bipolar episode kini manik","3A","tidak tidur tapi segar, dandan menor, riwayat depresi","Status mental","Ya"],["4","Gangguan cemas menyeluruh","3A","khawatir berlebihan banyak hal","Palpasi tiroid","Bila tak respons"],["5","Gangguan panik","3A","serangan mendadak berdebar, takut mati","EKG + GDS (DILAKUKAN)","Bila tak respons"],["6","Insomnia non-organik","4A","sulit memulai/mempertahankan tidur ≥1 bln","Sleep diary, sleep hygiene","Tidak"],["7","Somatoform/hipokondrik","3A","berobat berkali-kali, hasil normal","PF neurologis","Bila menetap"],["8","PTSD","3A","trauma, flashback, menghindari","Status mental","Ya"],["9","Gaduh gelisah","3B","mengamuk, membawa senjata","Fiksasi + injeksi IM haloperidol","Ya (RSJ)"],["10","ADHD (anak)","3A","anak SD tidak bisa diam & tidak fokus","Tes bisik, SPPAHI","Ya (Sp.KJ anak)"]],"keluhan":[["Bicara sendiri, curiga, merasa dikejar","Skizofrenia / psikotik akut / waham menetap","Durasi: ≤2 mgg akut; ≥1 bln skizofrenia; ≥3 bln hanya waham"],["Halusinasi + murung berat","Depresi berat psikotik / skizoafektif","Mood dulu lalu psikotik vs muncul bersamaan"],["Murung, tak semangat, mudah lelah","Depresi / campuran ansietas-depresi / hipotiroid","Hitung gejala utama & lain"],["Banyak bicara, tidak tidur, boros","Mania / bipolar / intoksikasi stimulan","Riwayat depresi → bipolar; NAPZA"],["Khawatir terus-menerus","GAD / hipertiroid / depresi","Mengambang, bukan serangan"],["Serangan mendadak berdebar, takut mati","Panik / SKA / hipoglikemia","Puncak <10 menit; EKG & GDS normal"],["Sulit tidur","Insomnia / depresi / cemas","Early = cemas; late = depresi"],["Berobat berkali-kali, hasil normal","Somatisasi / hipokondrik / nyeri somatoform","Banyak gejala vs 1 penyakit serius vs nyeri"],["Teringat kejadian traumatis","PTSD / reaksi stres akut / penyesuaian","<1 bln = stres akut"],["Mengamuk, membawa senjata","Gaduh gelisah (psikotik, mania, zat, delirium)","Stabilisasi dulu"],["Anak tidak bisa diam & tak fokus","ADHD / gangguan tingkah laku / RM / tuli","Onset <7 th, ≥2 setting"],["Lupa, bingung, lansia","Demensia / delirium / pseudodemensia","Delirium akut & fluktuatif"]],"waktu":[["Sambung rasa + IC + identitas","0:30","0:30"],["Wawancara (sacred seven + RPD + R. pribadi)","4:00","5:30"],["Status mental subjektif","2:30","3:30"],["PF singkat","1:00","—"],["Lapor status mental","1:00","1:30"],["Diagnosis multiaksial + DD","1:00","1:00"],["Farmako + resep","1:00","—"],["Psikoedukasi + rujukan + penutup","1:00","—"]],"template":[["OBJEKTIF (diamati)","\"Sadar Penampilan Kok PrinceSs Anna BIsa Dipercaya\" → keSadaran, Penampilan, Kontak, Psikomotor, Afek, Bicara, Reliabilitas. OBJEKTIF, jangan ngoceh!"],["SUBJEKTIF (ditanya)","\"Persepsi B-I-Ar Moodyar, Ingat K-O-It\" → Persepsi, Bentuk, Isi, Arus pikir, Mood, Ingatan, Kognitif, Orientasi, Insight."],["Afek","Luas/sempit/tumpul/datar • appropriate/inappropriate • stabil/labil"],["Mood","Eutim / hipertim / hipotim — tanya: \"Bagaimana perasaan hari ini?\""],["Arus pikir","Koheren • logorea • sirkumstansial • blocking • asosiasi longgar • inkoherensi • flight of ideas"],["Insight 1–6","1 menyangkal total • 2 ambivalen • 3 sadar tapi menyalahkan luar • 4 sadar, tak tahu sebab • 5 tahu sebab tapi tak menerapkan • 6 sadar & mau patuh"],["Multiaksial","I klinis • II kepribadian/RM • III medik umum • IV psikososial • V GAF. [UPDATE] DSM-5 sudah menghapus multiaksial, tapi PPDGJ III & soal OSCE masih memakai."],["PF & penunjang wajib","TTV, neuro singkat, tanda intoksikasi/EPS, bekas luka • DL, GDS, fungsi hati-ginjal, TSH, NAPZA urin, EKG"]],"obatTabel":[["Haloperidol","tab 0,5/1,5/5 mg; inj 5 mg/mL","5–15 mg/hr dibagi 2–3; IM 5 mg ulang 30', maks 3×","+THP bila EPS"],["Risperidon","tab 1/2/3 mg","2–6 mg/hr 1–2×","Pantau BB, gula, lipid"],["Fluoxetin","caps 10/20 mg","20–60 mg/hr 1× PAGI","Les: '2×' → 1× pagi"],["Amitriptilin","tab 25 mg","75–150 mg/hr; insomnia/nyeri 10–25 mg malam","Bukan lini 1; toksik overdosis"],["Litium karbonat","tab 200/300/400 mg","600–1.200 mg/hr dibagi 2–3","Les '250–500' subterapeutik"],["Divalproat Na","tab 250/500 mg","500–750 → 1.000–2.000 mg/hr","Teratogenik"],["Diazepam","tab 2/5 mg; inj 10 mg/2 mL","Cemas 2–10 mg 2–3×; insomnia 2–5 mg malam; agitasi 10 mg IV","≤2–4 mgg; jangan IM"],["Alprazolam","tab 0,25/0,5/1 mg","0,25–0,5 mg 2–3×/hr","Jangka pendek"],["Triheksifenidil","tab 2 mg","2 mg 2–3×/hr","Untuk EPS"],["Metilfenidat (anak)","tab 10 mg","0,3–1 mg/kgBB/hr","Psikotropika gol. II"]],"tips":["Skrining bunuh diri = tiket wajib hampir di semua station. Hafalkan: \"Ketika merasa seberat itu, pernah terpikir hidup tidak berarti atau ingin mengakhiri hidup?\"","Laporan status mental selalu dengan urutan yang sama — kerapian laporan dinilai sama berat dengan isinya.","Selalu singkirkan organik & NAPZA minimal dengan satu kalimat: pembeda lulus vs superior.","Koreksi catatan les: 'waham auditorik' → halusinasi auditorik; PTSD '>6 bulan' → onset dalam 6 bulan; fluoxetin '2×' → 1× pagi; dosis litium.","Latihan berpasangan dengan PS 'mania (bicara terus)' dan 'depresi berat (diam)' — dua tipe paling menghabiskan waktu."],"funfact":"Haloperidol ditemukan Paul Janssen tahun 1958 saat sebenarnya mencari analgesik turunan petidin — salah satu molekulnya justru membuat tikus sangat tenang. Obat 'kecelakaan' ini masih ada di Daftar Obat Esensial WHO sampai sekarang!"};

function split(t){const o={D:'',P:'',U:''};let last='D';t.split('\n').forEach(l=>{let m;

 else if(l.trim())o[last]+='<p>'+md(l)+'</p>'});
