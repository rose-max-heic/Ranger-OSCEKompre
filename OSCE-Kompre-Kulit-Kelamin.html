keratolitik; resep ke penguji","DOKTER: Salep pertama untuk mengangkat sisik dioles malam, krim steroid dioles tipis 2 kali sehari pada bercak saja, maksimal 4 minggu lalu kontrol.\n→ KE PENGUJI: Ini resepnya, dok."],["Edukasi hindari steroid minum & tanda rujuk","DOKTER: Jangan minum obat steroid/jamu sembarangan karena saat berhenti bisa kambuh parah. Bila bercak meluas, kulit merah seluruh tubuh, muncul bintil nanah, atau sendi nyeri, segera kembali."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Asam salisilat 3% dalam vaselin album ad 30 g No. I","   m.f. ungt.","   S 1 dd ue malam pada lesi berskuama tebal","   ———————————— paraf","R/ Betametason valerat 0,1% krim, tube 30 g No. I","   S 2 dd ue, oles tipis pada plak (badan & ekstremitas)","   ———————————— paraf","R/ Urea 10% krim, tube 40 g No. I","   S 2 dd ue pelembap seluruh kulit","   ———————————— paraf","Pro: Tn. S., 42 tahun","Alamat: ……"],"catatanObat":"Psoriasis ringan (<10% LPB): emolien + kortikosteroid topikal potensi sedang–tinggi (kulit kepala: losion/solusio; wajah/lipatan: potensi rendah) ± asam salisilat 3–5% / analog vitamin D (kalsipotriol). HINDARI kortikosteroid sistemik (rebound, psoriasis pustulosa/eritroderma). Sedang–berat (>10% LPB), artritis, kuku berat → rujuk Sp.DVE (fototerapi, metotreksat, siklosporin, biologik). Sumber: PPK PERDOSKI 2017; AAD–NPF Guidelines of Care for Psoriasis 2019–2021.","jebakan":["Tidak memeriksa tetesan lilin & Auspitz.","Memberi steroid sistemik.","Tidak menanyakan sendi & obat pencetus (beta-bloker, litium).","Tidak menghitung luas lesi (% LPB) untuk derajat."],"soal":[{"station":"Kulit-9","skenario":"Tn. S., 42 tahun, bercak merah bersisik tebal di siku, lutut, dan kulit kepala, hilang-timbul sejak 2 tahun, kambuh saat stres. Ayahnya mengalami hal serupa.","tugas":["**Lakukan** anamnesis (sacred seven + fundamental four)","**Lakukan** pemeriksaan dermatologis termasuk **uji goresan** dan tanda Auspitz","**Tegakkan** diagnosis dan derajat","**Tuliskan** resep dan **edukasi**"],"kunci":["Pencetus stres/obat, sendi, keluarga","Plak eritematosa batas tegas skuama perak; tetesan lilin, Auspitz, Köbner, pitting","Psoriasis vulgaris ringan (<10% LPB); DD seboroik, tinea","Salisilat 3% + betametason valerat 0,1% + emolien; hindari steroid sistemik"]},{"station":"Kulit-9b","skenario":"Tn. P., 50 tahun, riwayat psoriasis, berhenti minum obat \"penghilang gatal\" dari warung 3 hari lalu, kini seluruh kulit merah, bersisik, menggigil.","tugas":["**Sebutkan** kondisi yang terjadi","**Tentukan** tindakan awal"],"kunci":["Psoriasis eritroderma (pencetus: penghentian steroid sistemik)","Stabilisasi cairan & suhu, emolien, jangan beri steroid sistemik, rujuk segera"]}]},{"id":"kondiloma","no":10,"nama":"Kondiloma Akuminata","skdi":"3A","ringkas":{"kunci":"\"Kutil di kemaluan\", riwayat seksual berisiko.","khas":"HPV 6 & 11; vegetasi seperti jengger ayam/bunga kol, bertangkai, genital/perianal; acetowhite (+).","dd":"Kondiloma lata • Moluskum kontagiosum • Papul mutiara penis","flag":"Lesi besar, hamil, imunokompromais → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. E., 26 tahun, Solo, karyawan swasta."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya akan menanyakan beberapa hal pribadi termasuk riwayat seksual — ini rahasia dan penting untuk pengobatan. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis — Sacred Seven","rows":[["Onset","DOKTER: Apa keluhannya dan sejak kapan?\nPASIEN: Ada kutil di kemaluan, Dok, sejak 1 bulan."],["Lokasi","DOKTER: Tepatnya di mana? Ada juga di dubur, lubang kencing, atau mulut?\nPASIEN: Di batang dan kepala penis. Di dubur tidak ada."],["Kualitas","DOKTER: Gatal, nyeri, atau berdarah?\nPASIEN: Tidak nyeri, kadang gatal, berdarah kalau tergesek."],["Kuantitas","DOKTER: Ada berapa, ukurannya sebesar apa?\nPASIEN: Sekitar 5 buah, sebesar biji jagung."],["Kronologi","DOKTER: Awalnya seperti apa, lalu bagaimana?\nPASIEN: Awalnya satu kecil, lalu tambah banyak dan membesar."],["Faktor pemberat/peringan","DOKTER: Ada yang membuat membesar atau mengecil? Sudah dikasih apa?\nPASIEN: Tidak ada, belum diobati."],["Keluhan penyerta","DOKTER: Ada keluar nanah, luka, benjolan di selangkangan, atau ruam di telapak tangan?\nPASIEN: Tidak ada, Dok."]]},{"name":"Anamnesis — Fundamental Four","rows":[["RPS — riwayat seksual (tidak menghakimi)","DOKTER: Mohon maaf, kapan terakhir berhubungan seksual? Dengan pasangan tetap atau tidak? Berapa pasangan? Pakai kondom? Vaginal, oral, anal?\nPASIEN: 3 bulan lalu dengan beberapa pasangan tidak tetap, tanpa kondom, vaginal."],["RPD — IMS sebelumnya, HIV, imunokompromais","DOKTER: Pernah sakit kelamin sebelumnya? Pernah tes HIV? Ada penyakit yang menurunkan daya tahan tubuh?\nPASIEN: Belum pernah tes HIV."],["RPK / pasangan","DOKTER: Pasangan sekarang ada keluhan serupa? Pasangannya sedang hamil?\nPASIEN: Pacar saya belum diperiksa, tidak hamil."],["RSos — vaksin HPV, merokok","DOKTER: Pernah vaksin HPV? Merokok?\nPASIEN: Belum vaksin. Merokok."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di kelamin. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai APD tambahan sesuai station","(Memakai goggle + apron, lalu sarung tangan.)"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian kelaminnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio genitalia eksterna (korpus dan glans penis) tampak papul hingga vegetasi verukosa multipel (5 buah), warna seperti kulit hingga merah muda, permukaan bertonjolan seperti jengger ayam/bunga kol, sebagian bertangkai, Ø 0,3–0,8 cm, batas tegas."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Lesi lunak, tidak nyeri tekan, mudah berdarah bila digesek; KGB inguinal tidak membesar."],["Tes asam asetat 5% (acetowhite)","(Kompres kasa berisi asam asetat 5% ±3–5 menit.)\n→ KE PENGUJI: Lesi berubah putih (acetowhite +); tidak ditemukan lesi subklinis lain. Perianal bersih."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan penunjang & skrining IMS","→ KE PENGUJI: Diagnosis klinis; histopatologi bila atipikal (berpigmen, indurasi, ulkus, tidak respons). Skrining IMS lain: VDRL/TPHA (singkirkan kondiloma lata), tes HIV."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis kondiloma akuminata. DD: kondiloma lata, moluskum kontagiosum, papul mutiara penis."]]},{"name":"Tatalaksana & Edukasi","rows":[["Tindakan: aplikasi TCA 80–90% oleh dokter","(Lindungi kulit sekitar dengan vaselin → oles TCA 80–90% tipis dengan lidi kapas tepat di lesi sampai memutih (frosting) → biarkan kering → bila berlebih netralkan dengan bedak/natrium bikarbonat.)\nDOKTER: Saya oles obat di kutilnya, akan terasa perih sebentar.\n→ KE PENGUJI: Tindakan TCA 80% diulang tiap minggu sampai lesi hilang."],["Nonfarmako: pasangan, kondom, vaksin","DOKTER: Ini kutil kelamin karena virus HPV yang menular lewat hubungan seksual. Pasangan perlu diperiksa, selama terapi jangan berhubungan dulu, selanjutnya pakai kondom. Vaksin HPV bisa mencegah tipe lainnya. Saya sarankan tes HIV dan sifilis."],["Edukasi kekambuhan & kontrol; resep ke penguji","DOKTER: Kutil bisa kambuh walau sudah diobati, jadi kontrol tiap minggu. Bila luka melebar, berdarah terus, atau nyeri hebat, segera kembali.\n→ KE PENGUJI: Ini resepnya, dok (tindakan oleh dokter)."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Asam trikloroasetat (TCA) 80% sol. fl. 10 mL No. I","   S imm (dioles dokter pada lesi, ulang tiap minggu)","   ———————————— paraf","R/ Vaselin album 10 g No. I","   S imm, pelindung kulit sekitar lesi","   ———————————— paraf","Pro: Tn. E., 26 tahun","Alamat: ……","","— Alternatif dioles pasien (tidak hamil): podofilotoksin 0,5% / imiquimod 5% krim 3×/minggu malam, cuci 6–10 jam, maks 16 minggu —"],"catatanObat":"CDC STI 2021: dioles pasien — imiquimod 5% (3×/minggu malam, ≤16 minggu) / 3,75% (tiap malam ≤8 minggu), podofilotoksin 0,5%, sinekatekin 15%; oleh tenaga medis — krioterapi, bedah, TCA/BCA 80–90%. Hamil: krioterapi/TCA/eksisi; podofilin, podofilotoksin, sinekatekin KONTRAINDIKASI, imiquimod dihindari. [UPDATE GUIDELINE] Podofilin resin 10–25% (catatan les) tidak lagi masuk regimen anjuran CDC 2021 karena toksisitas sistemik.","jebakan":["Tidak menyingkirkan kondiloma lata (VDRL).","Podofilin/podofilotoksin pada ibu hamil.","Mengoles TCA tanpa melindungi kulit sekitar.","Lupa skrining HIV & notifikasi pasangan."],"soal":[{"station":"Kulit-10","skenario":"Tn. E., 26 tahun, mengeluh kutil di kemaluan sejak 1 bulan, makin banyak, berdarah bila tergesek. Riwayat berganti pasangan tanpa kondom.","tugas":["**Lakukan** anamnesis (sacred seven + fundamental four, termasuk riwayat seksual)","**Lakukan** pemeriksaan genital dan **tes asam asetat**","**Tegakkan** diagnosis dan DD","**Lakukan** tindakan terapi pada manekin dan **edukasi**"],"kunci":["Riwayat seksual lengkap, HIV, pasangan","Vegetasi jengger ayam, acetowhite (+)","Kondiloma akuminata; DD kondiloma lata, moluskum, papul mutiara","TCA 80–90% dengan proteksi vaselin; pasangan, kondom, vaksin HPV, HIV/VDRL"]},{"station":"Kulit-10b","skenario":"Ny. D., 24 tahun, hamil 20 minggu, kutil kelamin multipel di vulva.","tugas":["**Tentukan** pilihan terapi yang aman","**Sebutkan** obat yang kontraindikasi"],"kunci":["TCA 80–90%, krioterapi, atau eksisi","Podofilin, podofilotoksin, sinekatekin; imiquimod dihindari"]}]},{"id":"kusta","no":11,"nama":"Kusta (Morbus Hansen)","skdi":"4A","ringkas":{"kunci":"Bercak putih/merah mati rasa, tidak gatal, tidak berkeringat; kesemutan/lemah tangan-kaki; kontak serumah.","khas":"≥1 tanda kardinal: bercak mati rasa • penebalan saraf + gangguan fungsi • BTA (+) slit skin smear.","dd":"Pitiriasis versikolor • Pitiriasis alba • Vitiligo • Tinea korporis","flag":"Reaksi kusta (bercak merah-bengkak, nyeri saraf, nodul + demam) → prednison & rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Bapak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. M., 38 tahun, Pati, petani."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Bapak lalu memeriksa kulit dan saraf. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis — Sacred Seven","rows":[["Onset","DOKTER: Keluhannya apa dan sejak kapan?\nPASIEN: Ada bercak putih di lengan dan punggung, Dok, sejak 8 bulan."],["Lokasi","DOKTER: Di mana saja bercaknya?\nPASIEN: Lengan kanan, punggung, dan paha."],["Kualitas: rasa, gatal, keringat","DOKTER: Bercaknya gatal? Kalau disentuh atau kena panas terasa? Berkeringat?\nPASIEN: Tidak gatal, malah kebas, tidak terasa kalau kena knalpot. Tidak berkeringat."],["Kuantitas","DOKTER: Ada berapa bercak? Ukurannya?\nPASIEN: Sekitar 7, ada yang sebesar telapak tangan."],["Kronologi","DOKTER: Awalnya bagaimana lalu berkembang seperti apa?\nPASIEN: Awalnya 1 di lengan, lama-lama bertambah."],["Faktor pemberat/peringan","DOKTER: Pernah tiba-tiba bercaknya merah, bengkak, nyeri, disertai demam?\nPASIEN: Belum pernah."],["Keluhan penyerta: saraf, mata","DOKTER: Ada kesemutan, tangan/kaki lemah, sulit menggenggam, luka tidak terasa, mata sulit menutup?\nPASIEN: Jari kelingking kanan kesemutan, Dok."]]},{"name":"Anamnesis — Fundamental Four","rows":[["RPS — pengobatan sebelumnya","DOKTER: Sudah diobati apa?\nPASIEN: Salep panu, tidak sembuh."],["RPD","DOKTER: Pernah minum obat kusta sebelumnya? Ada penyakit lain, alergi obat (sulfa)?\nPASIEN: Belum pernah. Tidak alergi."],["RPK — kontak serumah","DOKTER: Di rumah atau tetangga ada yang bercak serupa atau pernah berobat kusta?\nPASIEN: Paman yang dulu serumah pernah minum obat kusta."],["RSos — pekerjaan, lingkungan, stigma","DOKTER: Tinggal dengan siapa? Pekerjaan sehari-hari? Ada yang dikhawatirkan?\nPASIEN: Istri dan 2 anak. Petani. Takut dikucilkan, Dok."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di lengan, punggung, dan paha. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai APD tambahan sesuai station","(Memakai masker N95 menutup hidung & mulut, lalu sarung tangan.)"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian lengan, punggung, dan pahanya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio brachii dekstra, regio scapularis, dan regio femoris tampak makula hipopigmentasi multipel (7 lesi), numular hingga plakat, batas tegas, permukaan kering dan sebagian bersisik, tanpa rambut."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Lesi teraba kering, tidak menebal."],["Tes sensibilitas raba, nyeri, suhu (bandingkan dengan kulit normal)","(Raba dengan ujung kapas runcing, nyeri dengan jarum pentul, suhu dengan tabung air hangat/dingin; pasien menutup mata.)\n→ KE PENGUJI: Anestesi raba, nyeri, dan suhu pada lesi."],["Palpasi saraf tepi (aurikularis magnus, ulnaris, peroneus komunis, tibialis posterior)","(Palpasi bilateral, bandingkan.)\n→ KE PENGUJI: N. ulnaris dekstra menebal dan nyeri tekan; saraf lain dalam batas normal."],["Pemeriksaan fungsi otot & mata (VMT)","(Kekuatan abduksi kelingking, ekstensi pergelangan, dorsofleksi kaki; tes menutup mata.)\n→ KE PENGUJI: Kelemahan ringan abduksi digiti V dekstra; lagoftalmus (−)."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan slit skin smear (BTA)","(Cubit kulit sampai pucat → insisi 5 mm dalam 2 mm → kerok dinding → oles → Ziehl-Neelsen; lokasi: cuping telinga + lesi aktif.)\n→ KE PENGUJI: Izin hasil BTA? Indeks bakteri & morfologi."],["Menyampaikan diagnosis, klasifikasi & DD","→ KE PENGUJI: Diagnosis kusta tipe MB (lesi >5, saraf >1/neuritis) dengan cacat tingkat 1 tangan kanan. DD: pitiriasis versikolor, pitiriasis alba, vitiligo."]]},{"name":"Tatalaksana & Edukasi","rows":[["Farmako: MDT sesuai program; resep ke penguji","DOKTER: Obatnya dari program pemerintah, gratis di Puskesmas. Satu blister untuk 1 bulan: hari pertama diminum di depan petugas, sisanya tiap hari di rumah, selama 12 bulan tanpa putus. Kencing bisa merah dan kulit kehitaman — itu efek obat, akan hilang.\n→ KE PENGUJI: Ini resepnya, dok."],["Edukasi tidak mudah menular, cegah cacat, kontak diperiksa","DOKTER: Kusta bisa sembuh dan setelah minum obat tidak menular lagi, jadi tidak perlu diasingkan. Istri dan anak perlu diperiksa. Karena tangan kurang rasa, periksa tangan-kaki tiap hari, hati-hati benda panas, pakai sarung tangan dan alas kaki."],["Tanda reaksi kusta","DOKTER: Bila bercak tiba-tiba merah bengkak, saraf nyeri, muncul benjolan merah nyeri, demam, atau tangan makin lemah, segera kembali — jangan hentikan obat."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ MDT-MB dewasa blister No. I (untuk 1 bulan)","   Rifampisin 600 mg + klofazimin 300 mg + dapson 100 mg → hari 1 di depan petugas","   Klofazimin 50 mg + dapson 100 mg → 1 dd hari 2–28","   ———————————— paraf","Pro: Tn. M., 38 tahun","Alamat: ……","","— Anak 10–14 th (blister MB anak): rifampisin 450 mg + klofazimin 150 mg + dapson 50 mg bulanan; klofazimin 50 mg selang sehari + dapson 50 mg harian —"],"catatanObat":"WHO 2018: diagnosis bila ≥1 tanda kardinal; PB 1–5 lesi BTA (−), MB >5 lesi / keterlibatan saraf / BTA (+). [UPDATE GUIDELINE] WHO 2018 menganjurkan 3 obat (rifampisin + dapson + klofazimin) untuk PB 6 bulan dan MB 12 bulan; program Kemenkes masih memakai PB 2 obat — ikuti kebijakan program bila ditanya. Anak <10 th dosis per kgBB (rifampisin 10 mg/kg, klofazimin 1 mg/kg harian + 6 mg/kg bulanan, dapson 2 mg/kg). Reaksi berat → prednison 40 mg/hari tapering & rujuk. Profilaksis kontak: rifampisin dosis tunggal (SDR-PEP).","jebakan":["Tes sensibilitas tanpa membandingkan dengan kulit normal / mata pasien tidak ditutup.","Tidak palpasi saraf & tidak periksa fungsi motorik.","Salah klasifikasi PB/MB.","Lupa periksa kontak serumah & edukasi reaksi kusta."],"soal":[{"station":"Kulit-11","skenario":"Tn. M., 38 tahun, petani, bercak putih tidak gatal di lengan, punggung, dan paha sejak 8 bulan, terasa kebas. Paman yang dulu serumah pernah minum obat kusta.","tugas":["**Lakukan** anamnesis (sacred seven + fundamental four)","**Lakukan** pemeriksaan sensibilitas, palpasi saraf, dan fungsi motorik","**Tegakkan** diagnosis dan klasifikasi","**Tuliskan** resep MDT dan **edukasi**"],"kunci":["Mati rasa, tanpa keringat, kontak serumah","Anestesi raba-nyeri-suhu; n. ulnaris menebal; kelemahan digiti V","Kusta MB (>5 lesi, neuritis), cacat tingkat 1","MDT-MB 12 blister; tidak menular setelah terapi, kontak diperiksa, rawat diri, tanda reaksi"]},{"station":"Kulit-11b","skenario":"Tn. M. bulan ke-4 MDT datang dengan bercak lama tiba-tiba merah, bengkak, nyeri saraf siku kanan, demam.","tugas":["**Sebutkan** kondisi","**Tentukan** tatalaksana"],"kunci":["Reaksi kusta tipe 1 (reversal) dengan neuritis","Lanjutkan MDT, prednison 40 mg/hari tapering, istirahatkan saraf, rujuk"]}]},{"id":"urtikaria","no":12,"nama":"Urtikaria Akut (DD Angioedema/Anafilaksis, SJS/TEN)","skdi":"4A / 3B","ringkas":{"kunci":"Biduran setelah seafood/obat; atau kulit melepuh + sariawan + mata merah setelah obat baru.","khas":"Urtika hilang <24 jam berpindah. SJS/TEN: lesi target atipikal, erosi mukosa ≥2 lokasi, Nikolsky (+); SJS <10%, TEN >30%.","dd":"Eritema multiforme • SSSS • Pemfigus","flag":"Anafilaksis → adrenalin IM; SJS/TEN → hentikan obat, stabilisasi, rujuk segera."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. W., 22 tahun, Solo, mahasiswa."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Mbak lalu memeriksanya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis — Sacred Seven","rows":[["Onset","DOKTER: Apa keluhannya dan sejak kapan?\nPASIEN: Biduran gatal sejak 3 jam lalu, Dok, setelah makan udang."],["Lokasi","DOKTER: Di mana saja? Ada bengkak di bibir, kelopak mata, atau lidah?\nPASIEN: Badan, lengan, paha. Bibir tidak bengkak."],["Kualitas","DOKTER: Gatal atau perih/terbakar?\nPASIEN: Gatal sekali."],["Kuantitas","DOKTER: Seberapa banyak dan seberapa mengganggu?\nPASIEN: Banyak, sampai tidak bisa konsentrasi."],["Kronologi: tiap bentol <24 jam & berpindah","DOKTER: Satu bentol bertahan berapa lama? Hilang lalu muncul di tempat lain? Ada bekas?\nPASIEN: Hilang dalam beberapa jam lalu muncul di tempat lain, tanpa bekas."],["Faktor pemberat/peringan (pencetus)","DOKTER: Selain udang, ada obat baru (antinyeri, antibiotik), gigitan serangga, infeksi, olahraga, dingin, atau tekanan?\nPASIEN: Tidak ada."],["Keluhan penyerta (tanda anafilaksis)","DOKTER: Ada sesak, mengi, suara serak, sulit menelan, pusing mau pingsan, mual muntah, nyeri perut?\nPASIEN: Tidak ada, Dok."]]},{"name":"Anamnesis — Fundamental Four","rows":[["RPS — pengobatan yang sudah diminum","DOKTER: Sudah minum obat apa?\nPASIEN: Belum."],["RPD — atopi, urtikaria/angioedema sebelumnya, alergi obat","DOKTER: Pernah biduran sebelumnya? Ada asma, alergi obat?\nPASIEN: Waktu kecil pernah setelah makan seafood. Tidak ada asma."],["RPK","DOKTER: Keluarga ada alergi atau bengkak tanpa sebab?\nPASIEN: Ibu alergi telur."],["RSos — makanan, pekerjaan, hewan","DOKTER: Makan di mana tadi? Ada hewan peliharaan?\nPASIEN: Makan di warung seafood. Tidak ada hewan."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di badan dan lengan. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian badan dan lengannya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio trunkus, brachii, dan femoris, generalisata, tampak urtika (wheal) eritematosa hingga putih di tengah multipel, numular hingga plakat, sebagian konfluens, batas tegas, dikelilingi halo eritema; tidak ada angioedema bibir/palpebra; mukosa mulut dan konjungtiva bersih."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Lesi edematosa, memucat dengan penekanan; tidak ada nyeri tekan."],["Menilai jalan napas, pernapasan, sirkulasi (singkirkan anafilaksis)","(Inspeksi bibir-lidah-uvula, auskultasi paru, nadi, TD.)\n→ KE PENGUJI: Jalan napas paten, tidak ada stridor/mengi, TD dan nadi normal → bukan anafilaksis."],["Dermografisme","(Gores kulit punggung dengan ujung tumpul.)\n→ KE PENGUJI: Dermografisme (−)."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Penunjang","→ KE PENGUJI: Urtikaria akut tidak memerlukan pemeriksaan rutin (EAACI 2021). Uji alergi (prick test/IgE spesifik) setelah sembuh bila pencetus perlu dipastikan."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis urtikaria akut ec. alergi makanan (udang), tanpa angioedema dan tanpa anafilaksis. DD: urtikaria vaskulitis (lesi >24 jam, bekas lebam), erupsi obat, gigitan serangga."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: hindari pencetus","DOKTER: Ini biduran karena alergi udang, Mbak. Untuk sementara hindari udang dan seafood serupa, jangan digaruk, kompres dingin boleh."],["Farmako: antihistamin generasi II; resep ke penguji","DOKTER: Tablet diminum 1 kali sehari sampai biduran hilang, lalu lanjut beberapa hari. Bila belum terkontrol, dosis bisa dinaikkan saat kontrol.\n→ KE PENGUJI: Ini resepnya, dok."],["Edukasi tanda anafilaksis","DOKTER: Bila bibir/lidah bengkak, sesak, suara serak, atau lemas mau pingsan, segera ke IGD — itu gawat darurat. Bila biduran berlangsung >6 minggu, kontrol untuk evaluasi urtikaria kronis."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Setirizin tab 10 mg No. X","   S 1 dd tab I","   ———————————— paraf","Pro: Nn. W., 22 tahun","Alamat: ……","","— Bila anafilaksis (dewasa): Adrenalin 1 mg/mL 0,5 mg (0,5 mL) IM paha anterolateral, ulang 5 menit bila perlu —","— Anak: adrenalin 0,01 mg/kgBB IM (BB 10 kg = 0,1 mL; BB 20 kg = 0,2 mL) —"],"catatanObat":"EAACI/GA²LEN/EuroGuiDerm/APAAACI 2021: lini pertama antihistamin H1 generasi II dosis standar; bila tidak terkontrol, naikkan hingga 4×; tambahan omalizumab untuk urtikaria kronis refrakter. Kortikosteroid sistemik hanya singkat (≤10 hari) untuk eksaserbasi berat — hindari jangka panjang. Setirizin anak 2–5 th 2,5 mg 2×/hari; 6–11 th 5–10 mg/hari. SJS/TEN: hentikan semua obat tersangka, cairan, rawat luka & mata, rujuk segera.","jebakan":["Tidak menyingkirkan anafilaksis (ABC, TD).","Adrenalin IV/subkutan pada anafilaksis (harus IM).","Steroid sistemik jangka panjang.","Tidak membedakan dengan urtikaria vaskulitis (lesi >24 jam, bekas)."],"soal":[{"station":"Kulit-12","skenario":"Nn. W., 22 tahun, biduran gatal d
