<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCE Kompre Kulit & Kelamin</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3ded3;--blue:#1f4e79;--wine:#7b2c3b;--green:#4a6b2a;--red:#b03a2e;--yel:#fff4cc}
body.dark{--bg:#14161b;--card:#1d2028;--ink:#e7e9ee;--mute:#9aa3b2;--line:#2e333d;--yel:#3a3420}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;color:var(--wine);text-decoration:none}#crumb{flex:1;color:var(--mute);font-size:14px}#crumb a{color:var(--blue);text-decoration:none}
.hero{text-align:center;padding:40px 10px 24px}.hero h1{font-size:40px;margin:0;color:var(--blue)}.hero h1 span{color:var(--wine)}.hero p{color:var(--mute);max-width:640px;margin:10px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--blue)}
.card .num{font:800 28px system-ui;color:var(--wine);opacity:.85}.card h3{margin:4px 0 6px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:13px}
.card .tag{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(31,78,121,.12);color:var(--blue)}
.card.big{padding:24px;text-align:center}.card.big .ic{font-size:40px}.card.big h3{font-size:19px}
.prog{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:#2e7d32}
.secnav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.secnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}.secnav a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
nav{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 6px 2px;color:var(--wine)}nav p{margin:0 6px 14px;color:var(--mute);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--blue);color:#fff}
nav .sk{float:right;font-size:11px;opacity:.75}
main{padding:24px 32px 80px;max-width:1150px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;flex:1;min-width:260px;color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.timer{font:600 20px ui-monospace,monospace;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--red)}
.tabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.box .row{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line)}
.box .row b{padding:10px 12px}.box .row div{padding:10px 12px}
.k1{background:var(--yel)}.k2{background:rgba(31,78,121,.12)}.k3{background:rgba(120,120,120,.1)}.k4{background:rgba(176,58,46,.13)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--blue);color:#fff;font-size:13px}td.no{width:38px;text-align:center;color:var(--mute)}
tr.sec td{background:rgba(31,78,121,.12);font-weight:700}
.sc{white-space:nowrap;width:120px}.sc button{width:32px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin-right:2px}
.sc button.s0.on{background:#c0392b;color:#fff}.sc button.s1.on{background:#d4a017;color:#fff}.sc button.s2.on{background:#2e7d32;color:#fff}
.say p{margin:0 0 4px}.r-D{color:#2b6cb0;font-weight:700}.r-P{color:var(--green);font-weight:700}.r-U{color:var(--red);font-weight:700}
.hidden-say .say{filter:blur(6px);cursor:pointer}.hidden-say .say.peek{filter:none}
.score{font-weight:700;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.resep{font:14px ui-monospace,monospace;white-space:pre-wrap;background:rgba(74,107,42,.1);border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;margin-bottom:10px}
.note{font-size:13px;color:var(--mute);margin-bottom:16px}
.trap{background:rgba(176,58,46,.08);border-left:4px solid var(--red);padding:10px 14px;border-radius:8px}
.soal{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 18px;margin-bottom:8px}
.soal h4{margin:-14px -18px 10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px}
.kunci{background:rgba(120,120,120,.12);border-radius:8px;padding:10px 14px;margin-bottom:22px}
.kunci.closed ul{display:none}.kunci summary{cursor:pointer;font-weight:700}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static}main{padding:16px}.box .row{grid-template-columns:1fr}}
.secnav a.dl{background:var(--green);color:#fff;border-color:var(--green);margin-left:auto}a.btn.dl{background:var(--green);color:#fff;text-decoration:none}
.phead{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
 body,body.dark{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#aaa;--yel:#fff4cc;background:#fff!important;color:#000;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar,.secnav,.top,.score button{display:none!important}
 main{padding:0!important;max-width:none!important;margin:0!important}
 .phead{display:block;font-weight:700;font-size:13pt;color:#1f4e79;border-bottom:2px solid #7b2c3b;padding-bottom:4px;margin-bottom:10px}
 table{border:1px solid #aaa;border-radius:0}
 thead{display:table-header-group}
 tr,.box .row,.soal,.kunci,.resep,.trap,li{break-inside:avoid;page-break-inside:avoid}
 tr.sec{break-after:avoid;page-break-after:avoid}
 th,td{padding:4px 6px}
 .hidden-say .say{filter:none!important}
 .kunci summary{list-style:none}.kunci summary::-webkit-details-marker{display:none}
 h3{break-after:avoid}
 .sc button{display:inline-block;width:24px;height:20px;font-size:9pt;border:1px solid #666;background:#fff}
}

.tw{overflow-x:auto}
td.pe{width:24%}td.dk{width:26%}td.ps{width:22%}td.pj{width:24%;background:#fff3b0;border-left:4px solid #ff8f00}
body.dark td.pj{background:#4a3a00;border-left-color:#ffb300}
th.thD{background:#2b6cb0}th.thP{background:#4a6b2a}th.thU{background:#e65100}
td.dk p,td.ps p,td.pj p{margin:0 0 5px}
.act{font-style:italic;color:var(--mute)}
.pj p{font-weight:700;color:#7a2e00}body.dark .pj p{color:#ffd180}
.who{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;margin-right:4px;background:rgba(74,107,42,.15);color:var(--green)}
.hidden-say td.dk,.hidden-say td.ps,.hidden-say td.pj{filter:blur(6px);cursor:pointer}.hidden-say tr.peek td{filter:none}
.badgeU{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;background:#ff8f00;color:#fff;white-space:nowrap}
tr.rowU td{background:rgba(255,143,0,.09)}tr.rowU td:nth-child(2){border-left:4px solid #ff8f00}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:-4px 0 12px}.legend span{padding:3px 10px;border-radius:20px;font-weight:700}
.kilat{font-size:18px;font-weight:800;line-height:1.45;padding:16px 18px;border-radius:12px;background:linear-gradient(90deg,#7b2c3b,#1f4e79);color:#fff;margin-bottom:16px}
.kilat small{display:block;font-size:11px;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:5px solid var(--blue)}
.mcard h3{margin:0 0 10px;font-size:16px}.mcard ul{margin:0;padding-left:20px}.mcard li{margin-bottom:5px}
.mcard.c-key{border-top-color:#d4a017}.mcard.c-crit{border-top-color:var(--blue)}.mcard.c-tx{border-top-color:var(--green)}.mcard.c-ff{border-top-color:var(--red);background:rgba(176,58,46,.05)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--yel);border:1px solid #e5c75a;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
ul.chk{list-style:none;padding-left:0!important}ul.chk li{padding-left:26px;position:relative}ul.chk li:before{content:"☑";position:absolute;left:0;color:var(--blue);font-size:17px;line-height:1.2}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin-bottom:16px}.fig img{max-width:100%;max-height:340px}.fig p{margin:6px 0 0;color:#555;font-size:13px}
.mcard table{margin:0}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.kilat{font-size:16px}}
@media print{.mgrid{grid-template-columns:1fr 1fr}.mcard,.kilat,.fig{break-inside:avoid}td.pj{background:#fff3b0!important}}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0 18px}.figs figure{margin:0;background:var(--card,#fff);border:1px solid rgba(0,0,0,.1);border-radius:12px;overflow:hidden}.figs img{width:100%;display:block;cursor:zoom-in;max-height:340px;object-fit:contain;background:#fff}.figs figcaption{padding:8px 10px;font-size:13px}#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}#lb img{max-width:95vw;max-height:92vh}@media print{.figs{grid-template-columns:1fr 1fr}.figs figure{break-inside:avoid}}</style></head><body>

<script>
const M={"da":{"kilat":"GATAL + kulit KERING + kambuhan + ATOPI pribadi/keluarga, batas lesi TIDAK TEGAS. Terapi dasar = EMOLIEN + steroid topikal sesuai lokasi.","kunci":["Remaja/anak","Gatal & merah","Kulit kering","Kambuh saat dingin/keringat/stres","Riwayat asma/rinitis","Keluarga atopi","Fleksural/tangan (dewasa)","Wajah & ekstensor (bayi)"],"kriteria":{"judul":"Hanifin–Rajka / UK Working Party","items":["**Gatal** (wajib)","Morfologi & distribusi **khas sesuai usia**","**Kronik-residif**","Riwayat **atopi** pribadi/keluarga","Xerosis, likenifikasi pada kasus kronis"]},"tabel":[{"judul":"Pembeda dermatitis","h":["","Atopik","DKI","DKA"],"rows":[["Patogenesis","Hipersensitivitas I/IV + sawar kulit","Bukan hipersensitivitas (kerusakan langsung)","Hipersensitivitas IV"],["Etiologi","Alergen non-kontak, genetik","Iritan (deterjen, sabun, asam/basa, air)","Alergen (nikel, karet, kosmetik, obat topikal)"],["Luas","Generalisata/simetris sesuai usia","Terbatas area paparan","Meluas ke sekitar kontak"],["**Batas lesi**","**Tidak tegas**","**Tegas**","Tidak tegas"],["Pemeriksaan","Prick test/IgE (+), tidak wajib","Patch test (−)","Patch test (+)"],["Terapi","Emolien + steroid topikal","Hindari iritan + steroid topikal","Hindari alergen + steroid topikal/oral"]]},{"judul":"Potensi steroid topikal","h":["Lokasi/usia","Potensi","Contoh"],"rows":[["Wajah, lipatan, genital, anak","Rendah","Hidrokortison 1–2,5%"],["Badan/ekstremitas dewasa","Sedang–tinggi","Betametason valerat 0,1%, desoksimetason 0,25%"],["Telapak, likenifikasi","Tinggi","Klobetasol 0,05% (singkat)"]]}],"terapi":["**Emolien** 2–3×/hari, segera setelah mandi","Steroid topikal sesuai lokasi, **oles tipis**, ±2 minggu lalu turunkan","Antihistamin oral malam (setirizin 10 mg / CTM 4 mg)","Mandi air hangat singkat, sabun lembut, baju katun, kuku pendek","Infeksi sekunder/luas → rujuk Sp.DVE"],"flaws":["Tanpa sarung tangan & lup / deskripsi tidak lengkap","Tidak tanya atopi & kontak bahan","Lupa emolien; steroid kuat di wajah/lipatan"],"gambar":[{"k":"im0","cap":"Dermatitis atopik vs DKI vs DKA (slide les). Catatan: slide menulis batas DA \"tegas\" — yang benar TIDAK tegas.","at":0}]},"tinea":{"kilat":"PITAK bersisik ABU + rambut patah → tinea kapitis. WAJIB antijamur ORAL (griseofulvin 6–8 minggu) + sampo. Periksa kontak & HEWAN.","kunci":["Anak/dewasa","Pitak di kepala","Bersisik keabuan","Rambut patah","Kucing/anjing","Berbagi sisir/helm/topi","Tepi aktif + central healing (korporis)","Panu: finger-nail sign"],"kriteria":{"judul":"Pemeriksaan kunci jamur","items":["**KOH 10%** rambut, **20%** kulit, **20% + DMSO 40%** kuku","Kulit: kerok **tepi lesi** yang meluas; rambut: **cabut** rambut sakit + kerok; mukosa: usap lidi kapas 360°","Teteskan KOH di **tepi kaca penutup**","Dermatofit: **hifa bersepta & artrospora** • Candida: **pseudohifa & blastospora** • Malassezia: **spaghetti & meatballs**"]},"tabel":[{"judul":"Tipe tinea kapitis","h":["Tipe","Etiologi","Klinis","Lampu Wood"],"rows":[["**Gray patch** (ektotriks)","Microsporum","Alopesia bulat skuama abu, rambut patah dekat kulit","**Hijau kekuningan**"],["**Black dot** (endotriks)","Trichophyton","Rambut patah tepat di permukaan → titik hitam","(−)"],["**Kerion Celsi**","Microsporum zoofilik","Radang hebat, pustul, abses, sikatriks","±"],["**Favus**","T. schoenleinii","Skutula (krusta cawan), mousy odor, sikatriks","Hijau keabuan kusam"]]},{"judul":"Infeksi jamur lain","h":["Penyakit","Klinis","Pemeriksaan","Terapi"],"rows":[["Tinea korporis/kruris","Tepi aktif, central healing, gatal","KOH: hifa","**KoMeT 121**: klotrimazol 1% / mikonazol 2% / terbinafin 1% 2 dd, 2–4 minggu, lewati tepi 2 cm"],["Pitiriasis versikolor","Makula hipo/hiperpigmentasi, skuama halus, finger-nail sign","KOH spaghetti & meatballs; Wood **kuning keemasan**","Sampo ketokonazol 2% di lesi 5 menit sebelum mandi, 3 hari"],["Kandidosis kutis","Merah basah di lipatan + lesi satelit","KOH 20%: pseudohifa & blastospora","Mikonazol 2% 14–28 hari; fluko const S={"diseases":[{"id":"da","no":1,"nama":"Dermatitis Atopik (DD DKI, DKA)","skdi":"4A","ringkas":{"kunci":"Remaja/anak, gatal & merah, kulit kering, kambuh saat udara dingin/keringat/stres, riwayat asma/rinitis, keluarga atopi, lokasi fleksural/tangan.","khas":"Klinis (Hanifin–Rajka / UK Working Party): gatal + dermatitis dengan morfologi & distribusi sesuai usia + kronik-residif + atopi pribadi/keluarga; xerosis, likenifikasi bila kronis. Batas lesi TIDAK tegas.","dd":"DKA (patch test +, meluas dari area kontak) • DKI (batas tegas sesuai area paparan) • Dermatitis numularis • Dermatitis seboroik • Skabies • Tinea","flag":"Lesi basah bernanah/krusta kuning (infeksi sekunder), vesikel menyebar cepat + demam (eksema herpetikum), luas/berat, tidak membaik 2 minggu → rujuk Sp.DVE."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. F., 18 tahun, Solo, mahasiswa."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan kulit Mbak lalu memeriksanya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama, onset, lokasi awal & penyebaran","DOKTER: Apa yang dikeluhkan?\nPASIEN: Gatal dan merah di tangan dan lengan, Dok, sejak 1 minggu setelah liburan ke daerah dingin.\nDOKTER: Awalnya di mana? Menyebar?\nPASIEN: Di punggung tangan, lalu ke lengan."],["Karakter gatal, cairan, gangguan tidur","DOKTER: Gatalnya terutama kapan? Sampai mengganggu tidur? Ada cairan atau nanah?\nPASIEN: Malam lebih gatal, sampai terbangun. Tidak bernanah."],["Pencetus & kontak bahan (singkirkan DKA/DKI)","DOKTER: Ada sabun, deterjen, perhiasan, sarung tangan karet, atau kosmetik baru? Makanan tertentu?\nPASIEN: Tidak ada yang baru, Dok. Kalau dingin atau berkeringat jadi kambuh."],["Riwayat penyakit dahulu: serupa sejak kecil, atopi (asma, rinitis)","DOKTER: Pernah seperti ini sebelumnya? Ada asma, bersin pagi, alergi makanan?\nPASIEN: Sejak kecil kambuh-kambuhan. Saya punya asma."],["Riwayat keluarga & pengobatan sebelumnya","DOKTER: Keluarga ada yang serupa atau asma? Sudah pakai obat apa?\nPASIEN: Kakak saya sama, Dok. Belum diobati."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di tangan dan lengan. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian tangan dan lengannya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio manus dan antebrachii dekstra et sinistra, bilateral simetris, tampak makula–patch eritematosa multipel, sebagian konfluens, batas tidak tegas, dengan skuama halus dan ekskoriasi; kulit sekitar xerotik."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Kulit teraba kasar dan kering, tidak ada nyeri tekan, tidak ada cairan."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan pemeriksaan penunjang","→ KE PENGUJI: Diagnosis DA secara klinis. Bila perlu mencari alergen: skin prick test / IgE spesifik; patch test bila curiga DKA."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis dermatitis atopik fase remaja/dewasa. DD: dermatitis kontak alergi, dermatitis kontak iritan."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: emolien, mandi, hindari pencetus","DOKTER: Ini eksim atopik, Mbak. Tidak menular, sering kambuh, tapi bisa dikontrol. Pakai pelembap 2–3 kali sehari, paling penting segera setelah mandi. Mandi air hangat sebentar, sabun lembut. Kuku dipendekkan, jangan digaruk, pakai baju katun, saat dingin pakai sarung tangan."],["Farmako: menulis resep & menyerahkan ke penguji","DOKTER: Salep dioles tipis 2 kali sehari hanya di bagian yang merah, maksimal 2 minggu. Tablet gatal diminum malam bila gatal.\n→ KE PENGUJI: Ini resepnya, dok."],["Edukasi tanda bahaya & rujukan","DOKTER: Kalau jadi basah bernanah, muncul lenting menyebar dengan demam, atau 2 minggu tidak membaik, segera kembali."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Desoksimetason 0,25% krim, tube 15 g No. I","   S 2 dd ue, oles tipis pada lesi tangan & lengan","   ———————————— paraf","R/ Urea 10% krim, tube 40 g No. I","   S 2–3 dd ue, oles kulit kering setelah mandi","   ———————————— paraf","R/ Setirizin tab 10 mg No. X","   S 1 dd tab I malam p.r.n. gatal","   ———————————— paraf","Pro: Nn. F., 18 tahun","Alamat: ……"],"catatanObat":"Steroid topikal sesuai lokasi: tangan/lengan dewasa → potensi sedang–tinggi; wajah, lipatan, genital, anak → potensi rendah (hidrokortison 1–2,5%). 1 FTU (±0,5 g) = 2 telapak tangan. [UPDATE GUIDELINE] Emolien = terapi dasar DA (tidak ada di resep les) — PPK PERDOSKI 2017.","jebakan":["Menulis batas lesi DA \"tegas\" — yang tegas itu DKI.","Lupa emolien.","Steroid potensi tinggi untuk wajah/lipatan atau tanpa instruksi \"oles tipis\".","Mengucapkan \"VDRL/TPHA\" — sisa template slide, tidak relevan."],"soal":[{"station":"Kulit-1","skenario":"Nn. F., 18 tahun, datang dengan gatal dan kemerahan di kedua tangan dan lengan sejak 1 minggu setelah bepergian ke daerah dingin. Pasien memiliki riwayat asma, kakaknya mengalami keluhan serupa.","tugas":["**Lakukan** anamnesis terarah","**Lakukan** pemeriksaan dermatologis dan **sampaikan** deskripsi lesi","**Tentukan** diagnosis dan 2 diagnosis banding","**Tuliskan** resep dan **berikan** edukasi"],"kunci":["Atopi pribadi & keluarga, pencetus dingin, kontak bahan disingkirkan","LDR: manus & antebrachii bilateral, makula-patch eritematosa batas tidak tegas, skuama, ekskoriasi, xerosis","DA; DD DKA, DKI","Steroid topikal sedang + emolien + antihistamin malam; edukasi kronis-kambuhan"]},{"station":"Kulit-1b","skenario":"Ny. S., 35 tahun, tukang cuci, mengeluh tangan merah, perih, dan pecah-pecah sejak 2 bulan, terbatas di punggung tangan dan sela jari. Tidak ada riwayat alergi.","tugas":["**Lakukan** anamnesis untuk membedakan jenis dermatitis","**Sebutkan** pemeriksaan penunjang yang membedakan DKI dan DKA","**Jelaskan** tatalaksana nonfarmakologis"],"kunci":["Paparan deterjen/air berulang, lesi terbatas area paparan, batas tegas → DKI","Patch test: DKI (−), DKA (+)","Hindari iritan, sarung tangan katun di dalam karet, emolien, steroid topikal"]}]},{"id":"tinea","no":2,"nama":"Tinea Kapitis (+ Dermatofitosis, Pitiriasis Versikolor, Kandidosis)","skdi":"4A","ringkas":{"kunci":"Anak/dewasa, \"pitak di kepala, gatal, bersisik keabuan\", rambut patah, kontak teman/binatang peliharaan, berbagi sisir/topi.","khas":"Gray patch (Microsporum, Wood hijau kekuningan), black dot (Trichophyton, Wood −), kerion (radang, pustul), favus (skutula, mousy odor). KOH 10%: hifa & artrospora ekto/endotriks.","dd":"Tinea kapitis tipe lain • Alopesia areata (licin, exclamation mark hair) • Dermatitis seboroik • Psoriasis kulit kepala • Trikotilomania","flag":"Kerion (bengkak bernanah, nyeri) → risiko botak permanen → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. A., 27 tahun, Sukoharjo, karyawan."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Mas lalu memeriksa kulit kepala. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama, onset, jumlah pitak","DOKTER: Apa yang dikeluhkan?\nPASIEN: Ada pitak di kepala, gatal, bersisik abu-abu, sejak 3 minggu.\nDOKTER: Ada berapa? Rambutnya patah?\nPASIEN: Satu, Dok. Rambutnya patah-patah."],["Tanda radang (kerion): nanah, bengkak, nyeri","DOKTER: Ada bengkak, nanah, atau nyeri?\nPASIEN: Tidak, Dok."],["Sumber penularan: kontak, binatang, berbagi barang","DOKTER: Ada teman/keluarga yang serupa? Pelihara kucing atau anjing? Suka pinjam sisir, helm, topi?\nPASIEN: Saya pelihara kucing, Dok. Helm kadang gantian."],["Lesi di tempat lain, pengobatan sebelumnya, DM/imunokompromais","DOKTER: Ada bercak di badan atau kuku? Sudah pakai salep apa? Ada kencing manis?\nPASIEN: Tidak ada, belum pakai obat."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di kepala. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian kepalanya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio parietal dekstra tampak bercak alopesia soliter, bulat, Ø ±3 cm, berbatas tegas, dengan skuama keabu-abuan dan rambut patah dekat permukaan kulit. Lampu Wood: fluoresensi hijau kekuningan."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Tidak ada nyeri tekan, nodul, atau fluktuasi; KGB oksipital/servikal tidak membesar."],["Memeriksa kuku dan kulit badan","(Memeriksa kuku & kulit badan.)\n→ KE PENGUJI: Tidak ditemukan lesi di kuku dan badan."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Melakukan/mengusulkan KOH dengan spesimen yang benar","(Cabut rambut sakit + kerok skuama → kaca objek → tutup → tetesi KOH 10% di tepi kaca penutup.)\n→ KE PENGUJI: Izin usul KOH 10%; harapan hifa & artrospora ektotriks. Kultur Sabouraud bila ada."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis tinea kapitis tipe gray patch. DD: tinea kapitis tipe black dot, favus, alopesia areata."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: higiene, kontak & hewan diperiksa","DOKTER: Ini infeksi jamur kulit kepala yang menular, Mas. Jangan pinjam-meminjam sisir, helm, topi, handuk. Sisir dan sarung bantal direndam air panas. Kucingnya diperiksakan ke dokter hewan, keluarga yang ada keluhan juga diperiksa."],["Farmako: antijamur ORAL + sampo; resep ke penguji","DOKTER: Obat minum 1 kali sehari sesudah makan berlemak, wajib sampai 6–8 minggu walau gatal hilang. Sampo dipakai 3 kali seminggu, diamkan 5 menit.\n→ KE PENGUJI: Ini resepnya, dok."],["Efek samping & tanda bahaya","DOKTER: Obat bisa bikin pusing, mual, dan kulit sensitif matahari. Kalau kepala jadi bengkak bernanah dan nyeri, segera kembali. Kontrol 2–4 minggu."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Griseofulvin (fine-particle) tab 500 mg No. XXVIII","   S 1 dd tab I p.c. (dengan makanan berlemak)","   ———————————— paraf","R/ Ketokonazol 2% sampo fl. No. I","   S 3 × seminggu, diamkan 5 menit lalu bilas","   ———————————— paraf","Pro: Tn. A., 27 tahun","Alamat: ……","","— Contoh anak (BB 20 kg): griseofulvin 20–25 mg/kgBB/hari → 400–500 mg/hari 6–8 minggu —"],"catatanObat":"Topikal saja tidak cukup (infeksi batang rambut). Griseofulvin dewasa 500 mg/hari, anak 20–25 mg/kgBB/hari (BB 10 kg ≈ 200–250 mg; BB 20 kg ≈ 400–500 mg) selama 6–8 minggu. [UPDATE GUIDELINE] Gray patch = Microsporum → griseofulvin 6–8 minggu atau terbinafin lebih lama; resep les terbinafin 14 hari terlalu singkat. Terbinafin 250 mg 2–4 minggu tepat untuk black dot (Trichophyton).","jebakan":["Memberi antijamur topikal saja.","KOH tanpa menyebut cara ambil spesimen (rambut dicabut + kerok).","Tidak menyebut pemeriksaan kontak & hewan peliharaan.","Durasi terapi terlalu singkat."],"soal":[{"station":"Kulit-2","skenario":"Tn. A., 27 tahun, mengeluh pitak di kepala yang gatal dan bersisik keabuan sejak 3 minggu. Pasien memelihara kucing.","tugas":["**Lakukan** anamnesis","**Lakukan** pemeriksaan kulit kepala dan **sampaikan** hasil","**Lakukan** pengambilan spesimen KOH","**Tegakkan** diagnosis dan **tuliskan** resep"],"kunci":["Kontak hewan/barang, tanda kerion","Alopesia bulat skuama abu, rambut patah; Wood hijau kekuningan","Cabut rambut + kerok, KOH 10% di tepi kaca penutup","Tinea kapitis gray patch; griseofulvin 6–8 minggu + sampo ketokonazol"]},{"station":"Kulit-2b","skenario":"Tn. K., 22 tahun, santri, bercak putih bersisik halus di punggung dan dada, gatal saat berkeringat.","tugas":["**Lakukan** pemeriksaan dan **sebutkan** tanda khas","**Interpretasikan** KOH dan lampu Wood","**Tuliskan** terapi"],"kunci":["Makula hipopigmentasi skuama halus, finger-nail sign","KOH: spaghetti & meatballs; Wood kuning keemasan → pitiriasis versikolor","Sampo ketokonazol 2% dioles di lesi, diamkan 5 menit sebelum mandi, 3 hari; mudah kambuh"]}]},{"id":"hz","no":3,"nama":"Herpes Zoster (+ Varisela, Herpes Simpleks)","skdi":"4A","ringkas":{"kunci":"Dewasa/lansia/imunokompromais, prodromal demam-nyeri-terbakar, lalu lenting bergerombol di atas dasar merah, SATU sisi tubuh sesuai dermatom.","khas":"Vesikel herpetiformis di atas dasar eritema, unilateral dermatomal, tidak melewati garis tengah. Tzanck: sel datia berinti banyak.","dd":"Varisela (anak, polimorfik, sentripetal) • Herpes simpleks (rekuren, labial/genital) • Dermatitis kontak • Impetigo bulosa • Fase prodromal: nyeri dada/abdomen organik","flag":"Dahi/ujung hidung/mata (HZO), wajah mencong/gangguan dengar (Ramsay Hunt), multidermatom/diseminata, nekrotik, imunokompromais, sesak/kejang → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. D., 31 tahun, Karanganyar, pegawai."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Mas lalu memeriksa kulitnya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama & onset lesi (≤72 jam?)","DOKTER: Apa yang dikeluhkan?\nPASIEN: Gatal dan nyeri di perut kiri, Dok, muncul lenting-lenting sejak kemarin."],["Prodromal & karakter nyeri","DOKTER: Sebelum lenting muncul, ada demam atau rasa terbakar? Nyerinya berapa dari 0–10?\nPASIEN: Demam 2 hari, perut kiri terasa panas seperti terbakar. Nyeri 6."],["Riwayat cacar air & imunokompromais","DOKTER: Dulu pernah cacar air? Ada kencing manis, HIV, minum steroid, atau sedang kemoterapi?\nPASIEN: Waktu SD pernah cacar. Tidak ada penyakit lain."],["Lesi di wajah/mata/telinga, kontak rentan","DOKTER: Ada lenting di wajah, mata, atau telinga? Di rumah ada bayi atau ibu hamil?\nPASIEN: Tidak ada di wajah. Istri saya sedang hamil, Dok."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di perut. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian perutnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio abdomen sinistra setinggi dermatom Th10, unilateral, tampak vesikel multipel bergerombol (herpetiformis) di atas dasar eritema, berbatas tegas, tidak melewati garis tengah, sebagian pecah menjadi erosi dan krusta."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Nyeri tekan (+) pada lesi; KGB inguinal sinistra tidak membesar."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan Tzanck smear","(Vesikel baru utuh → buka dinding → kerok dasar → oles → fiksasi → Giemsa.)\n→ KE PENGUJI: Izin usul Tzanck; harapan sel datia berinti banyak."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis herpes zoster torakalis sinistra dermatom Th10. DD: varisela, herpes simpleks."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: lesi dijaga utuh & kering, hindari kontak rentan","DOKTER: Ini cacar ular/dompo, Mas — virus cacar air lama yang bangun lagi. Lenting jangan dipecah, pakai baju longgar. Selama masih basah bisa menularkan cacar air ke orang yang belum pernah, jadi jaga jarak dulu dengan istri yang hamil."],["Farmako: asiklovir dosis zoster; resep ke penguji","DOKTER: Obat antivirus diminum 2 tablet, 5 kali sehari, 7 hari sampai habis. Bedak ditaburkan pada lenting yang utuh.\n→ KE PENGUJI: Ini resepnya, dok."],["Edukasi NPH & tanda bahaya","DOKTER: Nyeri kadang bertahan setelah kulit sembuh. Bila lenting ke mata/wajah, wajah mencong, atau menyebar luas, segera kembali."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Asiklovir tab 400 mg No. LXX","   S 5 dd tab II p.c. (habiskan 7 hari)","   ———————————— paraf","R/ Parasetamol tab 500 mg No. X","   S 3 dd tab I p.r.n. nyeri/demam","   ———————————— paraf","R/ Bedak salisil 2% btl. No. I","   S 2 dd ue pada lesi utuh","   ———————————— paraf","Pro: Tn. D., 31 tahun","Alamat: ……"],"catatanObat":"Asiklovir zoster 5 × 800 mg 7 hari (2 tab × 5 × 7 = 70 → LXX), mulai ≤72 jam; alternatif valasiklovir 3 × 1 g 7 hari. Varisela anak 4 × 20 mg/kgBB/hari (maks 800 mg/dosis) 7 hari: BB 10 kg → 4 × 200 mg; BB 20 kg → 4 × 400 mg. HSV primer 5 × 200 mg / 3 × 400 mg 7 hari, rekuren 5 hari. [UPDATE GUIDELINE] Varisela distribusi SENTRIPETAL (slide les: sentrifugal); sisi lesi = sinistra sesuai skenario.","jebakan":["Salah sisi/dermatom (skenario perut kiri → sinistra).","Dosis zoster disamakan dengan HSV.","Tidak menanyakan onset ≤72 jam & tanda HZO.","Tidak edukasi penularan ke ibu hamil/bayi."],"soal":[{"station":"Kulit-3","skenario":"Tn. D., 31 tahun, gatal dan nyeri di sisi perut kiri, diawali demam 2 hari lalu, kemudian muncul lenting dengan dasar kemerahan.","tugas":["**Lakukan** anamnesis","**Lakukan** pemeriksaan dermatologis dan **sampaikan** efloresensi","**Usulkan** pemeriksaan penunjang","**Tuliskan** resep beserta **perhitungan** jumlah obat"],"kunci":["Prodromal, onset ≤72 jam, imunokompromais, kontak rentan","Vesikel herpetiformis dasar eritema, abdomen sinistra Th10 unilateral","Tzanck: sel datia berinti banyak","Asiklovir 400 mg No. LXX S 5 dd II"]},{"station":"Kulit-3 (Mediko)","skenario":"Perempuan 70 tahun datang dengan lenting di punggung kanan sejak 3 hari, terasa nyeri dan panas. Lima hari sebelumnya pasien demam. Pasien mengaku tidak pernah cacar air dan punya hipertensi tetapi tidak rutin berobat.","tugas":["**Lakukan** anamnesis","**Lakukan** pemeriksaan dermatologis","**Usulkan** penunjang","**Tegakkan** diagnosis + DD","**Tuliskan** tatalaksana dan **edukasi**"],"kunci":["Prodromal demam 5 hari, onset 3 hari (≤72 jam), hipertensi","Regio dorsum dekstra dermatom torakal: vesikel herpetiformis di atas eritema, unilateral, sebagian krusta","Tzanck: sel datia berinti banyak (tidak membedakan HSV/VZV)","Herpes zoster; DD varisela, DKI, impetigo bulosa","Asiklovir 400 mg No. LXX S 5 dd II (cek fungsi ginjal lansia); PARASETAMOL lebih aman dari asam mefenamat pada lansia hipertensi; kompres NaCl bila vesikel pecah","\"Tidak pernah cacar\" tidak menyingkirkan HZ (varisela subklinis); edukasi NPH risiko tinggi >50 th"]},{"station":"Kulit-3b","skenario":"An. N., 6 tahun, BB 20 kg, demam 1 hari lalu muncul bintil berair di badan yang menyebar ke wajah, berbagai stadium.","tugas":["**Sebutkan** diagnosis dan ciri distribusinya","**Hitung** dosis asiklovir dan **tuliskan** resep","**Edukasi** isolasi"],"kunci":["Varisela, polimorfik, sentripetal","20 mg/kgBB × 4 → 400 mg/dosis; asiklovir 400 mg No. XXVIII S 4 dd I 7 hari","Tidak sekolah sampai semua lesi berkrusta; jangan beri aspirin"]}]},{"id":"akne","no":4,"nama":"Akne Vulgaris","skdi":"4A (ringan) / 3A","ringkas":{"kunci":"Remaja/dewasa muda, jerawat pipi/dahi/punggung, kulit berminyak, menjelang haid, kosmetik, stres, mengganggu penampilan.","khas":"Lesi polimorfik di area seboroik: komedo, papul, pustul, nodul, kista. Derajat (satu sisi wajah): komedo <20/20–100/>100; papul-pustul <15/15–50/>50; nodul-kista 0/<5/≥5.","dd":"Rosasea (eritema, telangiektasia, tanpa komedo) • Folikulitis (monomorf) • Erupsi akneiformis (obat, monomorf) • Dermatitis perioral","flag":"Nodul-kista nyeri, skar, tidak membaik 3 bulan, curiga PCOS → rujuk Sp.DVE."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mbak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Nn. G., 20 tahun, Solo, mahasiswa."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan jerawatnya lalu memeriksa wajah Mbak. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama, onset, lokasi, nyeri","DOKTER: Apa yang dikeluhkan?\nPASIEN: Jerawat di pipi dan dahi kanan, Dok, sejak 3 bulan, bikin tidak percaya diri."],["Faktor pemicu: haid, kosmetik, obat, diet, stres, memencet","DOKTER: Memburuk menjelang haid? Pakai skincare/kosmetik apa? Minum obat steroid? Suka dipencet?\nPASIEN: Iya menjelang haid. Pakai foundation tebal tiap hari, kadang dipencet."],["Kehamilan/rencana hamil & tanda PCOS","DOKTER: Mbak sedang hamil atau berencana hamil? Haidnya teratur? Ada rambut berlebih?\nPASIEN: Tidak hamil, haid teratur."],["Riwayat keluarga & pengobatan sebelumnya","DOKTER: Keluarga ada yang berjerawat parah? Sudah diobati apa?\nPASIEN: Ibu dulu berjerawat. Belum diobati."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di wajah. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian wajahnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio frontal dan bukal dekstra tampak komedo terbuka dan tertutup ±15, papul eritematosa multipel 15 buah dan pustul 3 buah di atas dasar eritema; tidak ada nodul/kista. Total lesi inflamasi 18 → derajat SEDANG."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Tidak teraba nodul atau kista, nyeri tekan ringan pada pustul."],["Menghitung lesi per jenis","(Menghitung komedo, papul, pustul, nodul satu sisi wajah.)"],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Penunjang","→ KE PENGUJI: Tidak diperlukan; pemeriksaan hormonal bila curiga PCOS."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis akne vulgaris derajat sedang. DD: rosasea, folikulitis, erupsi akneiformis."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: cuci wajah, non-komedogenik, jangan memencet","DOKTER: Cuci wajah 2 kali sehari dengan sabun lembut, pilih kosmetik non-komedogenik, jangan dipencet supaya tidak berbekas, pakai tabir surya."],["Farmako: retinoid malam + BPO pagi ± doksisiklin; resep ke penguji","DOKTER: Gel pertama dioles tipis malam hari, gel kedua pagi hari. Kapsul diminum 1 kali sehari sesudah makan dengan air banyak, jangan langsung berbaring.\n→ KE PENGUJI: Ini resepnya, dok."],["Efek samping & ekspektasi","DOKTER: Hasilnya baru terlihat 6–8 minggu. Awalnya kulit bisa kemerahan dan kering, pakai pelembap. Kontrol 4 minggu."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Adapalen 0,1% gel, tube 15 g No. I","   S 1 dd ue malam, oles tipis area berjerawat","   ———————————— paraf","R/ Benzoil peroksida 2,5% gel, tube 15 g No. I","   S 1 dd ue pagi, oles tipis","   ———————————— paraf","R/ Doksisiklin kaps 100 mg No. XXX","   S 1 dd caps I p.c., air banyak, jangan langsung berbaring","   ———————————— paraf","Pro: Nn. G., 20 tahun","Alamat: ……"],"catatanObat":"AAD 2024: kombinasi topikal (retinoid + BPO); antibiotik topikal/oral TIDAK monoterapi; doksisiklin 3–4 bulan maksimal. Adapalen & doksisiklin kontraindikasi hamil. [UPDATE GUIDELINE] Adapalen 1 × malam (resep les: 2 dd). Kasus les 15 papul + 3 pustul = 18 lesi inflamasi → SEDANG, bukan ringan.","jebakan":["Tidak menghitung lesi → derajat salah.","Adapalen 2×/hari.","Antibiotik monoterapi.","Tidak menanyakan kehamilan sebelum retinoid/doksisiklin."],"soal":[{"station":"Kulit-4","skenario":"Nn. G., 20 tahun, mengeluh jerawat di pipi dan dahi kanan yang mengganggu penampilan sejak 3 bulan.","tugas":["**Lakukan** anamnesis","**Lakukan** pemeriksaan, **hitung** lesi, dan **tentukan** derajat","**Tuliskan** resep","**Berikan** edukasi"],"kunci":["Haid, kosmetik, obat, hamil","15 papul + 3 pustul → sedang","Adapalen malam + BPO pagi + doksisiklin","Hasil 6–8 minggu, jangan memencet, tabir surya"]},{"station":"Kulit-4b","skenario":"Ny. L., 45 tahun, kemerahan di pipi dan hidung, mudah memerah saat panas, ada bintil merah tanpa komedo.","tugas":["**Sebutkan** diagnosis kerja","**Jelaskan** pembeda dengan akne vulgaris"],"kunci":["Rosasea","Usia dewasa, eritema & telangiektasia, TANPA komedo, dipicu panas/pedas"]}]},{"id":"skabies","no":5,"nama":"Skabies (+ Pedikulosis) — kasus anak","skdi":"4A","ringkas":{"kunci":"Gatal hebat malam hari, tinggal berkelompok (pondok, asrama, panti), satu keluarga/kamar gatal, higiene kurang.","khas":"≥2 dari 4 tanda kardinal: pruritus nokturna • menyerang kelompok • terowongan/papul di predileksi (sela jari, pergelangan volar, siku, ketiak, areola, umbilikus, bokong, genital) • tungau/telur/skibala.","dd":"Prurigo/insect bite • Dermatitis atopik • Pioderma (infeksi sekunder) • Dermatitis kontak","flag":"Skabies berkrusta (Norwegia) pada imunokompromais, infeksi sekunder luas/demam → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Ibu dan Adik. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPENGHANTAR: Anak saya An. M., 10 tahun, BB 30 kg, santri pondok di Sragen."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Adik lalu memeriksa kulitnya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama, onset, waktu gatal","DOKTER: Apa yang dikeluhkan?\nPENGHANTAR: Gatal di sela jari dan ketiak sejak 2 minggu, Dok, terutama malam sampai tidak bisa tidur."],["Kontak kelompok & tempat tinggal","DOKTER: Teman sekamar atau keluarga ada yang gatal juga? Suka pinjam baju, handuk, sarung?\nPASIEN: Teman sekamar banyak yang gatal, Dok. Handuk kadang gantian."],["Infeksi sekunder & pengobatan sebelumnya","DOKTER: Ada yang bernanah atau demam? Sudah pakai salep apa, cara pakainya bagaimana?\nPENGHANTAR: Tidak bernanah. Pakai bedak gatal saja."],["Alergi obat & riwayat atopi","DOKTER: Ada alergi obat atau riwayat asma/eksim?\nPENGHANTAR: Tidak ada."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di tangan, ketiak, dan perut. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian tangan, ketiak, dan perutnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada sela jari tangan, pergelangan tangan volar, dan lipat ketiak anterior bilateral tampak papul eritematosa multipel dan kanalikuli putih keabuan berkelok, disertai ekskoriasi; tidak ada pustul."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Papul padat, tidak ada nyeri tekan, tidak ada fluktuasi."],["Melakukan kerokan kulit dengan minyak imersi","(Tetesi minyak imersi di kaca objek → kerok 8–10 kali (atau sampai bintik perdarahan) di terowongan → letakkan, tutup → mikroskop ×40–100.)\n→ KE PENGUJI: Izin, hasil kerokan? Harapan tungau, telur, atau skibala."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Interpretasi & usul penunjang","→ KE PENGUJI: Bila tidak tersedia mikroskop: burrow ink test. Pasien memenuhi ≥2 tanda kardinal."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis skabies. DD: prurigo/insect bite, dermatitis atopik, pioderma."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: obati semua kontak, cuci barang","DOKTER: Ini kudis, Bu, karena tungau yang menular lewat kontak dan barang. Teman sekamar dan keluarga yang gatal harus diobati bersamaan. Sprei, baju, handuk dicuci air panas lalu dijemur/disetrika; yang tidak bisa dicuci dimasukkan plastik tertutup 3 hari. Kuku digunting."],["Farmako: permetrin dengan instruksi benar; resep ke penguji","DOKTER: Krim dioles malam ke seluruh tubuh dari leher sampai ujung kaki, termasuk sela jari, kuku, lipatan, dan kemaluan. Diamkan minimal 8 jam lalu mandi. Ulangi 1 minggu lagi. Tablet gatal diminum malam bila gatal.\n→ KE PENGUJI: Ini resepnya, dok; kontak serumah/sekamar juga diberi permetrin."],["Edukasi gatal pasca terapi & tanda bahaya","DOKTER: Gatal bisa masih terasa 2–4 minggu walau tungaunya sudah mati, itu wajar. Bila bernanah atau demam, kembali ya."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Permetrin 5% krim, tube 30 g No. I","   S 1 dd ue malam, leher ke bawah, diamkan ≥8 jam lalu mandi; ulang 1 minggu","   ———————————— paraf","R/ Setirizin sirup 5 mg/5 mL fl. 60 mL No. I","   S 1 dd cth II (10 mg) malam p.r.n. gatal","   ———————————— paraf","Pro: An. M., 10 tahun (BB 30 kg)","Alamat: ……","","— Contoh puyer CTM (BB 20 kg, 0,35 mg/kgBB/hari ÷ 3 ≈ 2 mg/dosis) —","R/ CTM tab 4 mg ½ tab","    m.f. pulv. dtd No. X","   S 3 dd pulv I p.r.n. gatal"],"catatanObat":"Permetrin 5% aman >2 bulan; bayi/anak kecil/lansia dioles termasuk kepala-wajah (hindari mata-mulut). Alternatif: salep 2-4 tiga malam berturut-turut, krotamiton 10%. Setirizin anak 6–11 th 5–10 mg/hari; 2–5 th 2,5–5 mg/hari. CTM 0,35 mg/kgBB/hari dibagi 3–4 (BB 10 kg ≈ 1 mg/dosis; BB 20 kg ≈ 2 mg/dosis). Pedikulosis kapitis: permetrin 1% pada rambut kering 10 menit, bilas, ulang 7–10 hari + sisir serit.","jebakan":["Tidak mengobati kontak serumah/sekamar.","Permetrin hanya di lesi atau langsung dibilas.","Tidak diulang 1 minggu.","Tidak memeriksa predileksi (sela jari, pergelangan, genital)."],"soal":[{"station":"Kulit-5","skenario":"An. M., 10 tahun (BB 30 kg), santri, diantar ibunya dengan gatal di sela jari dan ketiak sejak 2 minggu, memberat malam hari. Teman sekamar mengeluh serupa.","tugas":["**Lakukan** anamnesis kepada pengantar","**Lakukan** pemeriksaan dan **kerokan kulit**","**Tegakkan** diagnosis dengan menyebut tanda kardinal","**Tuliskan** resep dan **edukasi** cara pakai"],"kunci":["Kelompok, malam, barang bersama","Papul + kanalikuli di predileksi; kerokan minyak imersi","Skabies (pruritus nokturna, kelompok, terowongan, tungau)","Permetrin 5% leher ke bawah ≥8 jam, ulang 1 minggu, semua kontak"]},{"station":"Kulit-5b","skenario":"An. S., 8 tahun, gatal kulit kepala, ditemukan bintik putih melekat erat di batang rambut, beberapa teman sekelas mengalami hal sama.","tugas":["**Sebutkan** diagnosis dan pembeda dengan ketombe","**Tuliskan** terapi"],"kunci":["Pedikulosis kapitis; nits melekat erat (ketombe mudah lepas)","Permetrin 1% 10 menit, bilas, ulang 7–10 hari + sisir serit, periksa keluarga"]}]},{"id":"impetigo","no":6,"nama":"Pioderma — Impetigo Krustosa (anak)","skdi":"4A","ringkas":{"kunci":"Anak, \"koreng kuning seperti madu di sekitar hidung dan mulut\", gatal, mudah menyebar, higiene kurang, riwayat gigitan/garukan.","khas":"Vesikel mudah pecah → krusta kuning madu (honey-coloured) di atas dasar eritema, perioral/perinasal. Gram: kokus Gram (+).","dd":"Impetigo bulosa (bula hipopion, skuama kolaret) • Ektima (ulkus berkrusta tebal di tungkai) • Herpes simpleks • Dermatitis atopik terinfeksi","flag":"Selulitis luas/wajah, demam tinggi, sepsis, GNAPS (urin seperti teh, bengkak, hipertensi) → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Ibu dan Adik. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPENGHANTAR: Anak saya An. R., 5 tahun, BB 20 kg, Boyolali."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan Adik lalu memeriksa kulitnya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama, onset, penyebaran","DOKTER: Apa yang dikeluhkan?\nPENGHANTAR: Ada koreng kuning di bawah hidung dan sekitar mulut sejak 5 hari, Dok, makin banyak."],["Awal lesi, gatal, demam","DOKTER: Awalnya seperti apa? Gatal? Demam?\nPENGHANTAR: Awalnya lenting kecil lalu pecah jadi koreng. Gatal, sering digaruk. Tidak demam."],["Penyakit dasar & kontak (skabies, eksim, teman)","DOKTER: Sebelumnya ada gatal kudis, eksim, atau digigit nyamuk? Teman/saudara ada yang sama?\nPENGHANTAR: Sering pilek dan ngupil, Dok. Adiknya belum."],["Alergi obat & BAK seperti teh/bengkak","DOKTER: Ada alergi obat? Kencingnya berwarna seperti teh atau wajah bengkak?\nPENGHANTAR: Tidak ada."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di wajah. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian wajahnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio perinasal dan perioral tampak krusta kuning kecokelatan seperti madu multipel di atas dasar eritema, sebagian erosi, batas tegas, tidak ada bula."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Krusta mudah lepas, dasar erosi basah, nyeri tekan minimal; KGB submandibula tidak membesar."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan pewarnaan Gram","(Fiksasi → kristal violet 30 dtk → lugol 30 dtk → alkohol 95% ≤30 dtk → safranin 30 dtk, bilas tiap tahap [CEKLIS INGENIO].)\n→ KE PENGUJI: Izin usul Gram; harapan kokus Gram positif berantai/bergerombol."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis impetigo krustosa. DD: impetigo bulosa, ektima, herpes simpleks."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: kompres terbuka & higiene","DOKTER: Ini infeksi bakteri kulit yang menular, Bu. Sebelum salep, koreng dikompres kasa basah air NaCl 10–15 menit supaya lepas. Kuku Adik dipotong, jangan digaruk/ngupil, handuk dan alat makan dipisah."],["Farmako: antibiotik topikal (±oral bila luas); resep ke penguji","DOKTER: Salep dioles 2–3 kali sehari setelah koreng dibersihkan, 5–7 hari.\n→ KE PENGUJI: Ini resepnya, dok. Bila lesi luas/demam → sefadroksil 30 mg/kgBB/hari dibagi 2, 7 hari."],["Edukasi tanda bahaya","DOKTER: Bila demam, bengkak, kencing berwarna seperti teh, atau makin luas, segera kembali."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Mupirosin 2% krim, tube 10 g No. I","   S 2 dd ue pada lesi setelah krusta dibersihkan","   ———————————— paraf","R/ NaCl 0,9% fl. 500 mL No. I","   S ue, kompres terbuka 3 dd 10–15 menit","   ———————————— paraf","— Bila luas (BB 20 kg: 30 mg/kgBB/hari = 600 mg/hari → 2 × 300 mg) —","R/ Sefadroksil sirup 250 mg/5 mL fl. 60 mL No. I","   S 2 dd cth I ½ (300 mg) p.c., habiskan 7 hari","   ———————————— paraf","Pro: An. R., 5 tahun (BB 20 kg)","Alamat: ……"],"catatanObat":"Topikal mupirosin 2% / asam fusidat 2% 2–3 ×/hari 5–7 hari. Sistemik: sefadroksil 30 mg/kgBB/hari dibagi 2 (BB 10 kg → 2 × 150 mg = 2 × 3 mL; BB 20 kg → 2 × 300 mg = 2 × 6 mL); alergi → eritromisin 40 mg/kgBB/hari dibagi 4. Furunkel berfluktuasi → insisi drainase. [UPDATE GUIDELINE] S. aureus kini juga penyebab tersering impetigo krustosa (les: Streptococcus).","jebakan":["Mengoles salep di atas krusta tanpa kompres.","Tidak mencari penyakit dasar (skabies, eksim).","Lupa edukasi tanda GNAPS."],"soal":[{"station":"Kulit-6","skenario":"An. R., 5 tahun (BB 20 kg), diantar ibunya dengan koreng kuning di sekitar hidung dan mulut sejak 5 hari, gatal.","tugas":["**Lakukan** anamnesis kepada ibu","**Lakukan** pemeriksaan dan **sampaikan** efloresensi","**Tegakkan** diagnosis","**Tuliskan** resep topikal dan **hitung** dosis antibiotik oral bila diperlukan"],"kunci":["Lenting → krusta, ngupil/garukan, penyakit dasar","Krusta kuning madu di atas eritema perinasal/perioral","Impetigo krustosa; DD bulosa, ektima","Mupirosin 2% + kompres NaCl; sefadroksil 2 × 300 mg"]},{"station":"Kulit-6b","skenario":"Tn. B., 50 tahun, DM, tungkai kanan merah, bengkak, panas, nyeri, batas tidak tegas, demam 38,5 °C.","tugas":["**Sebutkan** diagnosis dan pembeda dengan erisipelas","**Tentukan** tatalaksana awal"],"kunci":["Selulitis (batas tidak tegas, dermis dalam–subkutis); erisipelas batas tegas meninggi","Antibiotik sistemik (sefaleksin/amoks-klav), elevasi, kontrol gula; demam/DM/luas → rujuk"]}]},{"id":"go","no":7,"nama":"Uretritis Gonore (DD Non-Gonore)","skdi":"4A","ringkas":{"kunci":"Laki-laki muda, \"kencing nanah\", nyeri/panas BAK, riwayat PSK 2–5 hari–2 minggu sebelumnya.","khas":"Duh purulen banyak. Gram: PMN + diplokokus Gram negatif intraseluler (DGNI). NGO: duh mukoid sedikit, PMN tanpa DGNI (Chlamydia).","dd":"Uretritis non-gonore • ISK • Trikomoniasis • Prostatitis","flag":"Nyeri/bengkak buah zakar (epididimitis), demam, nyeri sendi/ruam (gonore diseminata) → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. J., 25 tahun, Klaten, sopir."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya akan menanyakan beberapa hal pribadi termasuk riwayat seksual — ini rahasia dan penting untuk pengobatan. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama: duh, warna, jumlah, nyeri BAK","DOKTER: Apa yang dikeluhkan?\nPASIEN: Keluar nanah dari kemaluan sejak 3 hari, Dok, kencing perih.\nDOKTER: Warnanya? Banyak?\nPASIEN: Kuning kental, banyak."],["Riwayat seksual lengkap (tidak menghakimi)","DOKTER: Mohon maaf, kapan terakhir berhubungan seksual? Dengan pasangan tetap atau tidak? Pakai kondom? Vaginal, oral, atau anal?\nPASIEN: 2 minggu lalu dengan PSK, tidak pakai kondom, vaginal."],["Gejala penyerta: testis, luka/kutil, demam, sendi","DOKTER: Ada nyeri atau bengkak di buah zakar, luka, kutil, demam, nyeri sendi?\nPASIEN: Tidak ada."],["Riwayat IMS, tes HIV, pasangan tetap, alergi obat","DOKTER: Pernah sakit seperti ini? Pernah tes HIV? Ada istri/pacar? Alergi obat?\nPASIEN: Belum pernah tes HIV. Belum menikah. Tidak alergi."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di kelamin. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai APD tambahan sesuai station","(Memakai goggle + apron, lalu sarung tangan.)"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian kelaminnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada orifisium uretra eksternum tampak duh tubuh purulen kekuningan jumlah banyak, meatus eritema dan edema. Tidak ada ulkus atau vegetasi pada genital."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: KGB inguinal tidak membesar; milking uretra (+) duh purulen; testis dan epididimis tidak nyeri."],["Milking uretra & swab ujung uretra untuk Gram (1 kaca objek)","(Urut dari pangkal ke ujung penis → swab duh di ujung uretra → oles tipis di kaca objek.)"],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Pewarnaan Gram & skrining IMS lain","→ KE PENGUJI: Izin hasil Gram? Harapan PMN + diplokokus Gram negatif intra & ekstraseluler. Usul NAAT bila ada, tes HIV dan VDRL/TPHA."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis uretritis gonore tanpa komplikasi. DD: uretritis non-gonore, ISK."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako: abstinensi, notifikasi pasangan, kondom, tes HIV","DOKTER: Ini kencing nanah akibat bakteri yang menular lewat hubungan seksual, Mas. Bisa sembuh. Jangan berhubungan dulu sampai 7 hari setelah obat dan pasangan diobati. Selanjutnya pakai kondom, dan saya sarankan tes HIV dan sifilis."],["Farmako: dosis tunggal diminum di depan dokter; resep ke penguji","DOKTER: Obat ini diminum sekaligus sekarang di depan saya.\n→ KE PENGUJI: Ini resepnya, dok."],["Kontrol & tanda bahaya","DOKTER: Bila 3–7 hari masih keluar nanah, kontrol. Buah zakar nyeri/bengkak, demam, atau nyeri sendi → segera kembali."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Sefiksim tab 200 mg No. II","   S 1 dd tab II (dosis tunggal, diminum di depan dokter)","   ———————————— paraf","R/ Azitromisin tab 500 mg No. II","   S 1 dd tab II (dosis tunggal)","   ———————————— paraf","Pro: Tn. J., 25 tahun","Alamat: ……"],"catatanObat":"Pedoman Nasional IMS 2015: sefiksim 400 mg + azitromisin 1 g PO dosis tunggal. [UPDATE GUIDELINE] CDC 2021: seftriakson 500 mg IM dosis tunggal (+ doksisiklin 2 × 100 mg 7 hari bila klamidia belum disingkirkan); sefiksim 800 mg bila seftriakson tidak ada. NGO: PILIH SALAH SATU — azitromisin 1 g dosis tunggal ATAU doksisiklin 2 × 100 mg 7 hari (les menulis keduanya).","jebakan":["Anamnesis seksual menghakimi/tidak lengkap.","Milking/swab tanpa sarung tangan; tidak menyebut DGNI.","Lupa ko-terapi klamidia, notifikasi pasangan, tes HIV."],"soal":[{"station":"Kulit-7","skenario":"Tn. J., 25 tahun, mengeluh keluar nanah dari kemaluan disertai nyeri saat BAK sejak 3 hari. Riwayat berhubungan dengan PSK 2 minggu lalu.","tugas":["**Lakukan** anamnesis termasuk riwayat seksual","**Lakukan** pemeriksaan genital dan **ambil** sediaan Gram","**Interpretasikan** hasil Gram","**Tuliskan** resep dan **edukasi**"],"kunci":["Kapan, dengan siapa, kondom, jenis, HIV","Duh purulen, milking, swab 1 kaca objek","PMN + DGNI → GO","Sefiksim 400 mg + azitromisin 1 g dosis tunggal; pasangan, kondom, HIV"]},{"station":"Kulit-7b","skenario":"Tn. Y., 28 tahun, duh uretra sedikit bening, nyeri BAK ringan. Gram: PMN >5/LPB tanpa diplokokus.","tugas":["**Tentukan** diagnosis","**Tuliskan** terapi"],"kunci":["Uretritis non-gonore (Chlamydia tersering)","Azitromisin 1 g dosis tunggal ATAU doksisiklin 2 × 100 mg 7 hari (salah satu)"]}]},{"id":"sifilis","no":8,"nama":"Sifilis Primer (Ulkus Durum) — prosedur injeksi IM","skdi":"4A","ringkas":{"kunci":"Laki-laki muda, \"luka di kemaluan tidak nyeri, tidak berdarah, tidak bernanah\", riwayat PSK ±3 minggu sebelumnya.","khas":"Ulkus durum: soliter, bulat, tidak nyeri, tepi landai, dasar bersih kemerahan, INDURASI (+) + bubo indolen. Lapangan gelap: spiroketa; VDRL/RPR + TPHA (+).","dd":"Ulkus mole (nyeri, multipel, tepi bergaung, kotor) • Donovanosis (beefy red, mudah berdarah) • Herpes genitalis (vesikel berkelompok, nyeri) • LGV (bubo nyeri dominan)","flag":"Ruam telapak tangan-kaki/alopesia (sekunder), gejala neurologis/mata, hamil, HIV (+) → rujuk."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Mas. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. H., 25 tahun, Solo, karyawan."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya akan menanyakan beberapa hal pribadi termasuk riwayat seksual — ini rahasia. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis","rows":[["Keluhan utama & karakter luka","DOKTER: Apa yang dikeluhkan?\nPASIEN: Ada luka di kemaluan sejak 1 minggu, Dok.\nDOKTER: Nyeri? Berdarah atau bernanah? Satu atau banyak?\nPASIEN: Tidak nyeri, tidak berdarah, tidak bernanah. Satu."],["Riwayat seksual lengkap","DOKTER: Mohon maaf, kapan terakhir berhubungan? Dengan siapa? Pakai kondom?\nPASIEN: 3 minggu lalu dengan PSK, tanpa kondom."],["Gejala sekunder, benjolan selangkangan","DOKTER: Ada ruam di telapak tangan/kaki, rambut rontok, benjolan di selangkangan?\nPASIEN: Ada benjolan kecil di selangkangan, tidak sakit."],["Riwayat sifilis, HIV, alergi penisilin, pasangan","DOKTER: Pernah disuntik untuk penyakit kelamin? Pernah tes HIV? Alergi penisilin? Ada pasangan tetap?\nPASIEN: Belum pernah. Tidak alergi. Belum menikah."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di kelamin. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai APD tambahan sesuai station","(Memakai goggle + apron, lalu sarung tangan.)"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian kelaminnya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada sulkus koronarius penis tampak ulkus soliter, bulat, Ø ±1 cm, tepi rata/landai, dasar bersih kemerahan, tanpa pus."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Ulkus teraba keras (indurasi +), nyeri tekan (−). KGB inguinal bilateral membesar, kenyal, mobil, tidak nyeri (bubo indolen)."],["Memeriksa kulit lain (roseola, kondiloma lata)","→ KE PENGUJI: Tidak ditemukan roseola maupun kondiloma lata."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan lapangan gelap, serologi, HIV","→ KE PENGUJI: Izin usul mikroskop lapangan gelap (spiroketa), VDRL/RPR + TPHA, dan tes HIV."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis sifilis primer. DD: ulkus mole, donovanosis, herpes genitalis."]]},{"name":"Tatalaksana & Edukasi","rows":[["Persiapan injeksi: uji sensitivitas sesuai kebijakan, siapkan kit anafilaksis","(Siapkan adrenalin 1:1000. Larutkan benzatin penisilin 2,4 juta IU.)\nDOKTER: Mas akan saya suntik di kedua bokong. Setelah itu tunggu 30 menit di sini ya."],["Injeksi IM: 1,2 juta IU di tiap bokong (kuadran lateral atas)","(Posisi tengkurap → antiseptik → tusuk 90° → aspirasi → injeksi pelan → cabut → tekan.)\n→ KE PENGUJI: Benzatin penisilin G 2,4 juta IU IM dosis tunggal, terbagi dua bokong."],["Edukasi Jarisch-Herxheimer, pasangan, kontrol serologi; resep ke penguji","DOKTER: Dalam 24 jam bisa demam, menggigil, pegal — itu reaksi kuman mati, bukan alergi. Jangan berhubungan sampai luka sembuh, pasangan 3 bulan terakhir diperiksa, pakai kondom, tes darah ulang 6 dan 12 bulan.\n→ KE PENGUJI: Ini resepnya, dok."]]},{"name":"Penutupan","rows":[["Memberi kesempatan bertanya","DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."],["Menjadwalkan kontrol & menutup dengan salam","DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila memburuk. Semoga lekas sembuh."]]},{"name":"Profesionalisme","rows":[["Empati, tidak menghakimi, bahasa awam","(Bahasa awam, tidak menghakimi, kontak mata baik.)"],["Menjaga privasi & keamanan pasien","(Tirai/pendamping, sarung tangan, area yang tidak diperiksa ditutup.)"],["Melakukan tindakan sesuai urutan & efisien waktu","(Urutan runut, selesai ≤12 menit.)"]]}],"resep":["R/ Benzatin benzilpenisilin 2.400.000 IU serbuk inj. vial No. I","   S imm","   ———————————— paraf","R/ Water for injection fl. 25 mL No. I","   S imm","   ———————————— paraf","R/ Spuit 10 cc No. II","   S imm, pro injeksi","   ———————————— paraf","Pro: Tn. H., 25 tahun","Alamat: ……"],"catatanObat":"Benzatin penisilin G 2,4 juta IU IM dosis tunggal (BUKAN IV). Alergi penisilin, tidak hamil: doksisiklin 2 × 100 mg 14 hari. Hamil + alergi → rujuk desensitisasi. \"S imm\" = signa in manu medici (diberikan dokter). Kondiloma akuminata: TCA 80–90% (aman hamil) / podofilin 10–25% (kontraindikasi hamil).","jebakan":["Tidak palpasi indurasi & KGB → tidak bisa bedakan dengan ulkus mole.","Benzatin penisilin IV.","Lupa HIV, notifikasi pasangan, edukasi Jarisch-Herxheimer."],"soal":[{"station":"Kulit-8","skenario":"Tn. H., 25 tahun, luka di kemaluan sejak 1 minggu, tidak nyeri, tidak berdarah, tidak bernanah. Riwayat berhubungan dengan PSK 3 minggu sebelumnya.","tugas":["**Lakukan** anamnesis","**Lakukan** pemeriksaan genital dan KGB","**Usulkan** pemeriksaan penunjang dan **tegakkan** diagnosis","**Lakukan** injeksi terapi pada manekin dan **edukasi**"],"kunci":["Riwayat seksual, gejala sekunder, alergi penisilin","Ulkus durum indurasi + bubo indolen","Lapangan gelap, VDRL/TPHA, HIV → sifilis primer","BPG 2,4 juta IU IM 2 bokong; Jarisch-Herxheimer, pasangan, serologi 6 & 12 bulan"]},{"station":"Kulit-8b","skenario":"Tn. W., 24 tahun, luka di kemaluan multipel, nyeri, tepi tidak rata, dasar kotor, benjolan selangkangan nyeri.","tugas":["**Sebutkan** diagnosis kerja","**Jelaskan** 3 pembeda dengan sifilis primer"],"kunci":["Ulkus mole (H. ducreyi)","Nyeri vs tidak; multipel vs soliter; lunak tepi bergaung dasar kotor vs indurasi dasar bersih; bubo nyeri vs indolen"]}]},{"id":"psoriasis","no":9,"nama":"Psoriasis Vulgaris","skdi":"3A","ringkas":{"kunci":"Dewasa, bercak merah bersisik tebal putih keperakan di siku, lutut, kulit kepala, sakrum; kambuh-kambuhan; stres, infeksi, obat.","khas":"Plak eritematosa batas tegas, skuama tebal berlapis; tetesan lilin, Auspitz, Köbner; pitting kuku.","dd":"Dermatitis seboroik • Tinea korporis • Pitiriasis rosea • Liken simpleks kronik","flag":">10% luas tubuh, artritis, pustulosa/eritroderma → rujuk Sp.DVE."},"tabel":[{"name":"Pembukaan","rows":[["Memberikan salam & mempersilakan duduk","DOKTER: Selamat pagi, Bapak. Silakan duduk."],["Memperkenalkan diri","DOKTER: Perkenalkan, saya dr. R., dokter umum yang bertugas hari ini."],["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)","DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. S., 42 tahun, Wonogiri, pedagang."],["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)","DOKTER: Saya ingin menanyakan keluhan kulit Bapak lalu memeriksanya. Semua yang diceritakan saya jaga kerahasiaannya. Bersedia?\nPASIEN: Iya, Dok."]]},{"name":"Anamnesis — Sacred Seven","rows":[["Onset","DOKTER: Keluhannya apa dan sejak kapan?\nPASIEN: Bercak merah bersisik di siku dan lutut, Dok, sejak 2 tahun, hilang-timbul."],["Lokasi & penyebaran","DOKTER: Di mana saja? Ada di kulit kepala, punggung bawah, atau kuku?\nPASIEN: Siku, lutut, dan kulit kepala. Kuku jempol ada bintik-bintik cekung."],["Kualitas (gatal, nyeri, sisik)","DOKTER: Gatal atau perih? Sisiknya seperti apa?\nPASIEN: Agak gatal. Sisiknya tebal putih, rontok seperti ketombe."],["Kuantitas (luas, gangguan aktivitas)","DOKTER: Seberapa luas dan seberapa mengganggu kerja/tidur?\nPASIEN: Kira-kira seluas 3 telapak tangan. Malu kalau pakai lengan pendek."],["Kronologi","DOKTER: Polanya bagaimana? Lesi baru muncul di bekas luka/garukan?\nPASIEN: Kambuh-kambuhan. Bekas garukan jadi bercak baru."],["Faktor pemberat/peringan","DOKTER: Apa yang membuat kambuh? Stres, radang tenggorok, obat darah tinggi, berhenti obat steroid? Membaik kena matahari?\nPASIEN: Kambuh kalau stres dan begadang. Kena matahari agak membaik."],["Keluhan penyerta (sendi)","DOKTER: Ada nyeri/bengkak sendi jari, kaku pagi, nyeri punggung?\nPASIEN: Tidak ada, Dok."]]},{"name":"Anamnesis — Fundamental Four","rows":[["RPS — pengobatan sebelumnya","DOKTER: Sudah pakai obat apa? Pernah minum obat steroid/jamu lalu berhenti?\nPASIEN: Salep dari apotek, tidak tahu namanya."],["RPD — penyakit & obat rutin","DOKTER: Ada darah tinggi, kencing manis, kolesterol? Minum obat rutin seperti propranolol atau litium?\nPASIEN: Tidak ada."],["RPK","DOKTER: Keluarga ada yang sakit kulit serupa?\nPASIEN: Ayah saya juga, Dok."],["RSos — merokok, alkohol, BB, stres","DOKTER: Merokok, minum alkohol? Pekerjaan sedang banyak tekanan?\nPASIEN: Merokok 1 bungkus sehari. Dagang sedang sepi, stres."]]},{"name":"Pemeriksaan Fisik Dermatologi","rows":[["Informed consent pemeriksaan fisik","DOKTER: Saya akan memeriksa kulit di siku, lutut, dan kulit kepala. Saya perlu melihat dan meraba lesinya, tidak sakit. Boleh?\nPASIEN: Boleh, Dok."],["Menyebutkan alat & bahan, cuci tangan 6 langkah WHO","(Sebut alat: senter, lup, sarung tangan, kaca objek, skalpel/lidi kapas sesuai kasus. Cuci tangan 6 langkah WHO.)"],["Memastikan tanda vital","DOKTER: Saya cek tanda vital dulu ya.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"],["Memakai sarung tangan","(Memakai sarung tangan bersih.)"],["Meminta pasien membuka area lesi, menjaga privasi (tirai/pendamping)","DOKTER: Mohon dibuka bagian siku, lutut, dan kulit kepalanya. Tirai saya tutup."],["Inspeksi dengan senter & lup + deskripsi efloresensi (LDR + Warna JuKo BaBe)","(Inspeksi dengan senter, lalu lup.)\n→ KE PENGUJI: Pada regio olekranon dan genu dekstra et sinistra serta skalp, bilateral simetris, tampak plak eritematosa multipel, numular hingga plakat, berbatas tegas, dengan skuama putih keperakan tebal berlapis. Kuku: pitting. Estimasi luas ±3% LPB."],["Palpasi lesi","(Palpasi lesi.)\n→ KE PENGUJI: Plak teraba menebal, tidak nyeri tekan."],["Uji goresan (tetesan lilin) & tanda Auspitz","(Gores skuama dengan pinggir kaca objek → skuama memutih; kerok terus → bintik perdarahan.)\n→ KE PENGUJI: Fenomena tetesan lilin (+), tanda Auspitz (+). Köbner (+) pada bekas garukan."],["Pemeriksaan sendi","(Inspeksi & palpasi sendi IP tangan.)\n→ KE PENGUJI: Tidak ada tanda artritis."],["Melepas sarung tangan & cuci tangan","(Lepas sarung tangan, buang ke sampah medis, cuci tangan.)"],["Menginformasikan pemeriksaan selesai, pasien merapikan diri","DOKTER: Pemeriksaan sudah selesai, silakan dirapikan kembali."]]},{"name":"Penunjang & Diagnosis","rows":[["Mengusulkan penunjang","→ KE PENGUJI: Diagnosis klinis. KOH bila ragu dengan tinea; histopatologi bila atipikal; gula darah & profil lipid (komorbid metabolik)."],["Menyampaikan diagnosis & DD","→ KE PENGUJI: Diagnosis psoriasis vulgaris derajat ringan (<10% LPB). DD: dermatitis seboroik, tinea korporis, liken simpleks kronik."]]},{"name":"Tatalaksana & Edukasi","rows":[["Nonfarmako","DOKTER: Ini psoriasis, Pak. Tidak menular, sifatnya kambuhan tapi bisa dikendalikan. Pakai pelembap tiap hari, jangan digaruk atau dikelupas, kelola stres, kurangi rokok dan alkohol, jaga berat badan."],["Farmako: steroid topikal ±
