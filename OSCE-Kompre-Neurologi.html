<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSCE Kompre Neurologi</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3ded3;--blue:#1f4e79;--wine:#7b2c3b;--green:#4a6b2a;--red:#b03a2e;--yel:#fff4cc}
body.dark{--bg:#14161b;--card:#1d2028;--ink:#e7e9ee;--mute:#9aa3b2;--line:#2e333d;--yel:#3a3420}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;color:var(--wine);text-decoration:none}#crumb{flex:1;color:var(--mute);font-size:14px}#crumb a{color:var(--blue);text-decoration:none}
.hero{text-align:center;padding:40px 10px 24px}.hero h1{font-size:40px;margin:0;color:var(--blue)}.hero h1 span{color:var(--wine)}.hero p{color:var(--mute);max-width:640px;margin:10px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--blue)}
.card .num{font:800 28px system-ui;color:var(--wine);opacity:.85}.card h3{margin:4px 0 6px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:13px}
.card .tag{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(31,78,121,.12);color:var(--blue)}
.card.big{padding:24px;text-align:center}.card.big .ic{font-size:40px}.card.big h3{font-size:19px}
.prog{height:6px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:#2e7d32}
.secnav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.secnav a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}.secnav a.on{background:var(--wine);color:#fff;border-color:var(--wine)}
nav{width:270px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:0 6px 2px;color:var(--wine)}nav p{margin:0 6px 14px;color:var(--mute);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--bg)}nav button.on{background:var(--blue);color:#fff}
nav .sk{float:right;font-size:11px;opacity:.75}
main{padding:24px 32px 80px;max-width:1150px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.top h2{margin:0;flex:1;min-width:260px;color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.timer{font:600 20px ui-monospace,monospace;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.timer.warn{color:var(--red)}
.tabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.box .row{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--line)}
.box .row b{padding:10px 12px}.box .row div{padding:10px 12px}
.k1{background:var(--yel)}.k2{background:rgba(31,78,121,.12)}.k3{background:rgba(120,120,120,.1)}.k4{background:rgba(176,58,46,.13)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
th{background:var(--blue);color:#fff;font-size:13px}td.no{width:38px;text-align:center;color:var(--mute)}
tr.sec td{background:rgba(31,78,121,.12);font-weight:700}
.sc{white-space:nowrap;width:120px}.sc button{width:32px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;margin-right:2px}
.sc button.s0.on{background:#c0392b;color:#fff}.sc button.s1.on{background:#d4a017;color:#fff}.sc button.s2.on{background:#2e7d32;color:#fff}
.say p{margin:0 0 4px}.r-D{color:#2b6cb0;font-weight:700}.r-P{color:var(--green);font-weight:700}.r-U{color:var(--red);font-weight:700}
.hidden-say .say{filter:blur(6px);cursor:pointer}.hidden-say .say.peek{filter:none}
.score{font-weight:700;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.resep{font:14px ui-monospace,monospace;white-space:pre-wrap;background:rgba(74,107,42,.1);border-left:4px solid var(--green);padding:12px 14px;border-radius:8px;margin-bottom:10px}
.note{font-size:13px;color:var(--mute);margin-bottom:16px}
.trap{background:rgba(176,58,46,.08);border-left:4px solid var(--red);padding:10px 14px;border-radius:8px}
.soal{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:14px 18px;margin-bottom:8px}
.soal h4{margin:-14px -18px 10px;background:var(--ink);color:var(--bg);text-align:center;padding:6px}
.kunci{background:rgba(120,120,120,.12);border-radius:8px;padding:10px 14px;margin-bottom:22px}
.kunci.closed ul{display:none}.kunci summary{cursor:pointer;font-weight:700}
@media(max-width:800px){body{display:block}nav{width:auto;height:auto;position:static}main{padding:16px}.box .row{grid-template-columns:1fr}}
.secnav a.dl{background:var(--green);color:#fff;border-color:var(--green);margin-left:auto}a.btn.dl{background:var(--green);color:#fff;text-decoration:none}
.phead{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
 body,body.dark{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#aaa;--yel:#fff4cc;background:#fff!important;color:#000;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .bar,.secnav,.top,.score button{display:none!important}
 main{padding:0!important;max-width:none!important;margin:0!important}
 .phead{display:block;font-weight:700;font-size:13pt;color:#1f4e79;border-bottom:2px solid #7b2c3b;padding-bottom:4px;margin-bottom:10px}
 table{border:1px solid #aaa;border-radius:0}
 thead{display:table-header-group}
 tr,.box .row,.soal,.kunci,.resep,.trap,li{break-inside:avoid;page-break-inside:avoid}
 tr.sec{break-after:avoid;page-break-after:avoid}
 th,td{padding:4px 6px}
 .hidden-say .say{filter:none!important}
 .kunci summary{list-style:none}.kunci summary::-webkit-details-marker{display:none}
 h3{break-after:avoid}
 .sc button{display:inline-block;width:24px;height:20px;font-size:9pt;border:1px solid #666;background:#fff}
}

.tw{overflow-x:auto}
td.pe{width:24%}td.dk{width:26%}td.ps{width:22%}td.pj{width:24%;background:#fff3b0;border-left:4px solid #ff8f00}
body.dark td.pj{background:#4a3a00;border-left-color:#ffb300}
th.thD{background:#2b6cb0}th.thP{background:#4a6b2a}th.thU{background:#e65100}
td.dk p,td.ps p,td.pj p{margin:0 0 5px}
.act{font-style:italic;color:var(--mute)}
.pj p{font-weight:700;color:#7a2e00}body.dark .pj p{color:#ffd180}
.who{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;margin-right:4px;background:rgba(74,107,42,.15);color:var(--green)}
.hidden-say td.dk,.hidden-say td.ps,.hidden-say td.pj{filter:blur(6px);cursor:pointer}.hidden-say tr.peek td{filter:none}
.badgeU{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;background:#ff8f00;color:#fff;white-space:nowrap}
tr.rowU td{background:rgba(255,143,0,.09)}tr.rowU td:nth-child(2){border-left:4px solid #ff8f00}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin:-4px 0 12px}.legend span{padding:3px 10px;border-radius:20px;font-weight:700}
.kilat{font-size:18px;font-weight:800;line-height:1.45;padding:16px 18px;border-radius:12px;background:linear-gradient(90deg,#7b2c3b,#1f4e79);color:#fff;margin-bottom:16px}
.kilat small{display:block;font-size:11px;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:5px solid var(--blue)}
.mcard h3{margin:0 0 10px;font-size:16px}.mcard ul{margin:0;padding-left:20px}.mcard li{margin-bottom:5px}
.mcard.c-key{border-top-color:#d4a017}.mcard.c-crit{border-top-color:var(--blue)}.mcard.c-tx{border-top-color:var(--green)}.mcard.c-ff{border-top-color:var(--red);background:rgba(176,58,46,.05)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--yel);border:1px solid #e5c75a;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600}
ul.chk{list-style:none;padding-left:0!important}ul.chk li{padding-left:26px;position:relative}ul.chk li:before{content:"☑";position:absolute;left:0;color:var(--blue);font-size:17px;line-height:1.2}
.fig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin-bottom:16px}.fig img{max-width:100%;max-height:340px}.fig p{margin:6px 0 0;color:#555;font-size:13px}
.mcard table{margin:0}
@media(max-width:800px){.mgrid{grid-template-columns:1fr}.kilat{font-size:16px}}
@media print{.mgrid{grid-template-columns:1fr 1fr}.mcard,.kilat,.fig{break-inside:avoid}td.pj{background:#fff3b0!important}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}.fgrid.one{grid-template-columns:minmax(0,760px);justify-content:center}.fig{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:zoom-in}.fig img{width:100%;border-radius:8px;display:block}.fig figcaption{font-size:12.5px;opacity:.8;padding:6px 4px 2px}.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}.lb img{max-width:96vw;max-height:86vh;border-radius:8px}.lb p{color:#fff;font-size:13px}@media(max-width:700px){.fgrid{grid-template-columns:1fr}}@media print{.fgrid{grid-template-columns:1fr 1fr}.fig{break-inside:avoid}}</style></head><body>

const S={"diseases": [{"id": "stroke", "no": 1, "nama": "Stroke Non-Hemoragik (DD TIA, ICH, PSA)", "skdi": "3B", "ringkas": {"kunci": "Laki-laki >50 th, MENDADAK bicara pelo, mulut mencong, lemah sesisi; hipertensi tidak rutin minum obat, DM, makanan berlemak, rokok, AF.", "khas": "Defisit neurologis fokal mendadak >24 jam (WHO). UMN: hemiparesis + parese N VII & XII SENTRAL sisi sama, refleks ↑, Babinski (+). CT tanpa kontras: HIPODENS = iskemik, HIPERDENS = perdarahan.", "dd": "TIA (pulih <24 jam) • Stroke hemoragik/ICH (nyeri kepala hebat, muntah, kesadaran ↓) • PSA (thunderclap, kaku kuduk) • Bell's palsy (dahi ikut lumpuh) • Hipoglikemia (stroke mimic) • Tumor otak", "flag": "Onset <4,5 jam (jendela trombolisis), kesadaran menurun, muntah proyektil, kejang, sulit menelan → stabilisasi + RUJUK SEGERA RS stroke."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. S., 52 tahun, Sukoharjo, pedagang."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Onset & last known well (paling penting)", "DOKTER: Kapan tepatnya keluhan mulai? Jam berapa terakhir Bapak terlihat normal?\nPASIEN: Tadi pagi jam 7, Dok, waktu bangun tidur bicara jadi pelo. Sekarang sudah 2 jam."], ["Kualitas & lokasi: pelo/afasia, mulut mencong, lemah/kesemutan sisi mana", "DOKTER: Selain pelo, mulut mencong? Tangan atau kaki lemah sebelah?\nPASIEN: Mulut mencong ke kanan, tangan dan kaki kiri lemas."], ["Perjalanan & riwayat TIA", "DOKTER: Makin berat, menetap, atau membaik? Pernah seperti ini lalu pulih sendiri?\nPASIEN: Menetap. Belum pernah."], ["Red flag TIK/perdarahan: nyeri kepala hebat, muntah menyemprot, kejang, kesadaran, pandangan ganda, trauma", "DOKTER: Ada sakit kepala hebat, muntah menyemprot, kejang, pandangan ganda, atau terbentur?\nPASIEN: Tidak ada."], ["Penyerta: tersedak, berdebar (AF)", "DOKTER: Tersedak saat minum? Dada berdebar tidak teratur?\nPASIEN: Tidak."], ["RPD/RPK: HT (kepatuhan obat), DM, kolesterol, jantung, stroke; sosial: rokok, diet, olahraga, pengencer darah", "DOKTER: Ada darah tinggi, gula, kolesterol, sakit jantung? Rutin minum obat? Merokok? Suka makanan berlemak? Minum pengencer darah?\nPASIEN: Darah tinggi, Dok, obatnya jarang diminum. Suka gorengan dan jeroan, merokok. Tidak minum pengencer darah. Ayah saya stroke."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa saraf Bapak; nanti saya ketuk dengan palu kecil, sentuh dengan kapas, dan gores telapak kaki. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Keadaan umum & GCS", "→ KE PENGUJI: Tampak sakit sedang, GCS E4V5M6 = 15. TD 160/90, nadi 84 reguler, RR 18, suhu 36,7 °C, SpO₂ 98%. GDS stik saya usulkan."], ["Status generalis singkat: pupil, jantung (irama/murmur), paru", "→ KE PENGUJI: Pupil isokor 3 mm, RC +/+; jantung reguler tanpa murmur; paru vesikuler."], ["Rangsang meningeal (tanpa bantal)", "→ KE PENGUJI: Kaku kuduk (−), Kernig (−), Brudzinski I–II (−)."], ["N VII: angkat alis, pejam, meringis", "DOKTER: Coba angkat alis, pejamkan mata kuat, lalu tunjukkan gigi.\n→ KE PENGUJI: Dahi berkerut simetris, sudut mulut kiri tertinggal → parese N VII sinistra tipe sentral."], ["N XII: lidah istirahat & dijulurkan; N IX–X menelan", "→ KE PENGUJI: Lidah deviasi ke kiri tanpa atrofi/fasikulasi → parese N XII sinistra sentral. Uvula di tengah."], ["Motorik: kekuatan, tonus, trofi 4 ekstremitas, bandingkan kanan-kiri", "→ KE PENGUJI: Kekuatan 5555 | 3333 ekstremitas atas dan bawah, tonus kiri meningkat, eutrofi → hemiparesis sinistra."], ["Refleks fisiologis BPR, TPR, KPR, APR", "→ KE PENGUJI: Refleks fisiologis ++ kanan, +++ kiri."], ["Refleks patologis: Babinski & kelompoknya, Hoffmann-Trömner", "→ KE PENGUJI: Babinski −/+, Chaddock −/+, Hoffmann-Trömner −/+."], ["Sensorik raba & nyeri kanan-kiri", "→ KE PENGUJI: Hipestesi hemisinistra."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Usul penunjang", "→ KE PENGUJI: CT scan kepala tanpa kontras segera, GDS, EKG, darah lengkap, PT/APTT/INR, elektrolit, ureum-kreatinin, profil lipid, HbA1c."], ["Interpretasi CT & Siriraj", "→ KE PENGUJI: CT: lesi hipodens lobus parietal dekstra tanpa hiperdens → infark. (Siriraj tanpa CT: 0+0+0+9−0−12 = −3 → infark.)"], ["Diagnosis & DD", "→ KE PENGUJI: Stroke non-hemoragik (infark serebri) e.c. trombosis onset 2 jam dengan hemiparesis sinistra serta parese N VII & XII sinistra sentral; FR hipertensi tidak terkontrol, dislipidemia, rokok. DD: TIA, stroke hemoragik, Bell's palsy."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Stabilisasi: ABC, head-up 0–30°, O₂ bila SpO₂ <95%, IV NaCl 0,9% (bukan dekstrosa)", "→ KE PENGUJI: Jalan napas bebas, kepala 0–30°, O₂ hanya bila SpO₂ <95%, infus NaCl 0,9%, puasakan sampai lulus skrining menelan."], ["TD tidak diturunkan agresif; rujuk SEGERA (onset <4,5 jam)", "→ KE PENGUJI: Onset 2 jam masih dalam jendela trombolisis, saya rujuk segera ke RS dengan CT dan dokter saraf, TD tidak saya turunkan agresif (target calon trombolisis <185/110)."], ["Menjelaskan diagnosis & meminta persetujuan rujukan keluarga", "DOKTER: Bapak mengalami stroke karena sumbatan pembuluh darah otak, berhubungan dengan darah tinggi yang tidak terkontrol. Masih dalam waktu emas pengobatan, jadi Bapak saya rujuk sekarang. Bapak dan keluarga setuju?\nPASIEN: Setuju, Dok."], ["Resep (setelah CT menyingkirkan perdarahan) & serahkan", "→ KE PENGUJI: Setelah CT menyingkirkan perdarahan dan bukan calon trombolisis: aspirin 160 mg/hari. Resep saya serahkan, Dok."], ["Edukasi gaya hidup, rehabilitasi, red flag", "DOKTER: Ke depan kurangi garam dan lemak, berhenti merokok, minum obat tensi rutin, fisioterapi. Kalau lemah bertambah, kesadaran turun, nyeri kepala hebat, muntah, atau kejang, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Asam asetilsalisilat tab 80 mg No. XXX", "   S 1 dd tab II p.c. (160 mg/hari)", "   ———————————— paraf", "Pro: Tn. S., 52 tahun", "Alamat: ……"], "catatanObat": "[UPDATE GUIDELINE — PNPK Stroke 2026] Aspirin fase akut 160–325 mg dalam 24–48 jam setelah CT (les: 80 mg). Trombolisis alteplase 0,9 mg/kg (maks 90; 10% bolus) atau tenecteplase 0,25 mg/kg (maks 25 mg) <4,5 jam — streptokinase TIDAK dipakai. TD iskemik tanpa reperfusi: tidak diturunkan 48–72 jam; calon trombolisis <185/110, pasca <180/105. Sitikolin/pirasetam tidak rutin; steroid tidak untuk edema stroke; antikoagulan AF oleh spesialis. ICH: TDS 150–220 → <140 aman. PSA: nimodipin 60 mg tiap 4 jam 21 hari.", "jebakan": ["Aspirin sebelum CT.", "Menurunkan TD agresif / cairan dekstrosa.", "Tidak menanyakan jam onset.", "Lupa GDS (hipoglikemia meniru stroke)."], "soal": [{"station": "Neuro-1", "skenario": "Laki-laki 52 tahun datang dengan bicara pelo sejak 2 jam setelah bangun tidur.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik umum & neurologis", "**Usulkan** penunjang dan **interpretasikan** hasil CT", "**Sampaikan** diagnosis & DD", "**Tuliskan** farmakoterapi dan **edukasi**"], "kunci": ["Last known well, FR, red flag", "GCS, N VII/XII sentral, hemiparesis, Babinski", "CT tanpa kontras: hipodens = infark", "SNH; DD TIA, ICH, Bell's palsy", "Stabilisasi, rujuk <4,5 jam, aspirin setelah CT"]}, {"station": "Neuro-1b", "skenario": "Ny. R., 48 tahun, mendadak nyeri kepala 'terhebat seumur hidup' saat mengangkat galon, muntah, kaku kuduk (+), tanpa kelemahan.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** penunjang & terapi khasnya"], "kunci": ["Perdarahan subaraknoid (ruptur aneurisma)", "CT tanpa kontras; rujuk; target TDS 140–160, nimodipin 60 mg tiap 4 jam 21 hari"]}]}, {"id": "bell", "no": 2, "nama": "Bell's Palsy (Parese N VII Perifer)", "skdi": "4A", "ringkas": {"kunci": "Dewasa, MUKA MENCONG + TIDAK BISA MENUTUP MATA sebelah, mendadak saat bangun tidur, memuncak <72 jam; kena angin malam/kipas, motor tanpa helm, lembur, baru ISPA; nyeri belakang telinga, hiperakusis, pengecapan ↓.", "khas": "Kelumpuhan SELURUH wajah sesisi TERMASUK DAHI (LMN), lagoftalmus + tanda BELL; tanpa defisit lain (motorik, Babinski normal). Diagnosis per eksklusi; House-Brackmann I–VI.", "dd": "Stroke (dahi utuh + hemiparesis) • Ramsay Hunt (vesikel telinga) • OMA/OMSK dengan parese fasial • Tumor parotis/CPA (progresif)", "flag": "Lemah lengan/tungkai, pelo, bilateral, mata merah nyeri (keratitis), vesikel telinga, tanpa perbaikan 3 minggu → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. A., 42 tahun, Klaten, sopir."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Onset (masih <72 jam?), sisi, saat bangun tidur", "DOKTER: Sejak kapan muka mencong? Mendadak?\nPASIEN: Tadi pagi waktu bangun tidur, Dok, sekitar 6 jam lalu, wajah kanan tidak bisa digerakkan."], ["Karakter: angkat alis, menutup mata, mengeces, makanan tertinggal", "DOKTER: Bisa mengangkat alis kanan? Menutup mata kanan rapat? Air minum tumpah?\nPASIEN: Alis kanan tidak bisa, mata kanan tidak bisa menutup, minum tumpah dari sudut kanan."], ["Penyerta: mata kering/berair, nyeri belakang telinga, hiperakusis, pengecapan", "DOKTER: Mata kanan kering atau berair? Nyeri di belakang telinga? Suara terasa lebih keras? Rasa makanan berkurang?\nPASIEN: Mata berair, belakang telinga agak nyeri."], ["Penyingkir DD: lemah anggota gerak, pelo, pandangan ganda (stroke); telinga berair/lenting/tuli (Ramsay Hunt/OMK); benjolan, bilateral", "DOKTER: Ada lemah tangan-kaki, bicara pelo, pandangan ganda? Telinga keluar cairan, ada lenting, pendengaran turun? Benjolan di depan telinga?\nPASIEN: Tidak ada semua, Dok."], ["Pencetus & RPD (DM, HT, maag — sebelum steroid)", "DOKTER: Kemarin kena angin malam? Ada gula, darah tinggi, maag?\nPASIEN: Semalam nyetir buka jendela. Tidak ada penyakit."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa saraf wajah Bapak; saya contohkan gerakannya, Bapak tirukan. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, GCS, TTV", "→ KE PENGUJI: Kompos mentis GCS 15, TD 130/80, nadi 80, suhu 36,6 °C."], ["Otoskopi & palpasi parotis (singkirkan OMA, Ramsay Hunt, tumor)", "→ KE PENGUJI: MAE & MT kanan normal, vesikel (−), parotis tidak membesar."], ["N VII saat istirahat", "→ KE PENGUJI: Wajah asimetris, lipatan dahi & plika nasolabialis kanan mendatar, sudut mulut kanan turun."], ["N VII gerakan (dicontohkan): angkat alis, pejam kuat, meringis, bersiul, gembung pipi", "DOKTER: Ikuti saya ya, angkat alis… pejamkan mata kuat… tunjukkan gigi… bersiul… gembungkan pipi.\n→ KE PENGUJI: Dahi kanan tidak berkerut, lagoftalmus kanan dengan tanda Bell (+), mulut tertarik ke kiri, udara bocor di kanan → parese N VII dekstra perifer, House-Brackmann IV."], ["N V (refleks kornea) & saraf kranial lain", "→ KE PENGUJI: Sensibilitas wajah normal; refleks kornea aferen intak (mata kanan tidak berkedip karena N VII). N VIII, XII normal."], ["Motorik, refleks, Babinski, koordinasi (singkirkan stroke)", "→ KE PENGUJI: Motorik 5555 | 5555, refleks fisiologis normal, Babinski (−), koordinasi baik."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Diagnosis klinis. Saya usulkan GDS sebelum steroid (hasil 126 mg/dL). CT/MRI & EMG hanya bila atipikal."], ["Diagnosis & DD", "→ KE PENGUJI: Bell's palsy dekstra (parese N VII perifer dekstra) House-Brackmann IV, onset 6 jam. DD: stroke non-hemoragik, Ramsay Hunt syndrome, parese N VII e.c. otitis media."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan (bukan stroke, prognosis baik)", "DOKTER: Bapak mengalami kelumpuhan saraf wajah kanan, namanya Bell's palsy. Ini bukan stroke, dan sebagian besar pulih sempurna dalam beberapa minggu sampai 3 bulan, apalagi obat dimulai dalam 3 hari pertama."], ["Proteksi mata (paling penting)", "DOKTER: Karena mata kanan tidak bisa menutup, siang pakai kacamata dan tetes mata, malam mata ditutup plester/kasa supaya kornea tidak luka."], ["Latihan wajah depan cermin, masase, kompres hangat, hindari angin", "DOKTER: Latihan angkat alis, pejam, senyum, bersiul di depan cermin beberapa kali sehari, pijat pipi ke atas, kompres hangat. Nyetir pakai jendela tertutup."], ["Resep steroid + antivirus + air mata buatan & serahkan; cara minum (tapering)", "DOKTER: Obat prednison diminum sesudah makan, dosisnya nanti diturunkan bertahap, jangan berhenti mendadak. Asiklovir 5 kali sehari sampai habis.\n→ KE PENGUJI: Prednison 60 mg/hari 5 hari lalu tapering, asiklovir 5 × 400 mg 10 hari, air mata buatan. Resep saya serahkan, Dok."], ["Kontrol & red flag", "DOKTER: Kontrol setelah obat habis. Kalau tangan-kaki lemah, bicara pelo, mata merah nyeri, atau 3 minggu tidak ada perbaikan, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Prednison tab 5 mg No. XC", "   S 3 dd tab IV p.c. (hari 1–5), lalu kurangi 2 tab/hari s/d habis", "   ———————————— paraf", "R/ Asiklovir tab 400 mg No. L", "   S 5 dd tab I", "   ———————————— paraf", "R/ Air mata buatan tetes mata fl. No. I", "   S 6 dd gtt I OD", "   ———————————— paraf", "R/ Salep mata pelumas (vit. A) tube No. I", "   S 1 dd ue OD malam hari", "   ———————————— paraf", "Pro: Tn. A., 42 tahun", "Alamat: ……", "", "Hitung: 12 tab × 5 hari = 60; lalu 10+8+6+4+2 = 30 → XC. Asiklovir 5 × 10 = L."], "catatanObat": "[UPDATE GUIDELINE — AAO-HNS 2013, AAFP 2023] Prednison 50–60 mg/hari 5 hari + tapering 5 hari, mulai <72 jam (les: 2 × 30 mg / 40–60 mg 6 hari disatukan). Antivirus opsional, HANYA bersama steroid: asiklovir 400 mg 5×/hari 10 hari atau valasiklovir 1 g 3×/hari 7 hari (les 2 × 500 mg 5 hari terlalu rendah). Vitamin B neurotropik hanya suportif.", "jebakan": ["Tidak memeriksa dahi (perifer vs sentral).", "Lupa proteksi mata.", "Antivirus tanpa steroid / steroid tanpa tanya DM & tapering.", "Tidak otoskopi (Ramsay Hunt terlewat)."], "soal": [{"station": "Neuro-2", "skenario": "Laki-laki 42 tahun, sopir, muka mencong dan tidak bisa menutup mata kanan sejak bangun tidur 6 jam lalu.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan N VII dan neurologis yang relevan", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep dan **edukasi**"], "kunci": ["Onset <72 jam, penyingkir stroke/Ramsay Hunt", "Dahi tidak berkerut, lagoftalmus, Bell (+), motorik normal", "Bell's palsy dekstra; DD SNH, Ramsay Hunt, OM", "Prednison tapering ± asiklovir + proteksi mata"]}, {"station": "Neuro-2b", "skenario": "Tn. H., 60 tahun, wajah kanan lumpuh, nyeri telinga hebat, vesikel di daun telinga kanan, telinga berdenging.", "tugas": ["**Sebutkan** diagnosis", "**Sebutkan** terapi"], "kunci": ["Ramsay Hunt syndrome (herpes zoster otikus)", "Asiklovir 5 × 800 mg 7–10 hari + prednison, proteksi mata, rujuk THT/saraf"]}]}, {"id": "migren", "no": 3, "nama": "Migren (Tanpa/Dengan Aura)", "skdi": "4A", "ringkas": {"kunci": "Perempuan usia produktif, nyeri kepala SEBELAH BERDENYUT + MUAL-MUNTAH, silau cahaya, terganggu suara, berulang, keluarga serupa; pencetus CHOCOLATE, menstruasi, kurang tidur.", "khas": "ICHD-3 tanpa aura: ≥5 serangan, 4–72 jam, ≥2 dari (unilateral, berdenyut, sedang-berat, diperberat aktivitas) + ≥1 dari (mual/muntah; fotofobia DAN fonofobia). Aura visual reversibel 5–60 menit.", "dd": "TTH (bilateral, diikat, tanpa mual) • Cluster (laki-laki, periorbital + otonom) • Arteritis temporalis (>50 th) • Nyeri kepala sekunder (SNOOP4 +)", "flag": "Thunderclap, demam + kaku leher, defisit fokal, kejang, aura >60 menit, pola berubah → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mbak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. D., 29 tahun, Solo, pegawai bank."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Lokasi, onset, durasi, jumlah serangan", "DOKTER: Nyerinya di mana, sejak kapan, berapa jam tiap serangan, sudah berapa kali?\nPASIEN: Kepala kiri sejak kemarin, Dok, biasanya seharian. Sudah sekitar 6 kali tahun ini."], ["Kualitas & skala", "DOKTER: Rasanya berdenyut, diikat, atau ditusuk? Skala 0–10?\nPASIEN: Berdenyut, 7."], ["Aura sebelum nyeri", "DOKTER: Sebelum nyeri, ada kilatan cahaya, kunang-kunang, garis zig-zag, kesemutan, atau sulit bicara?\nPASIEN: Tidak ada."], ["Memperberat/memperingan & penyerta: mual-muntah, foto/fonofobia", "DOKTER: Memberat saat naik tangga, lihat cahaya, dengar suara? Membaik dengan apa? Mual muntah?\nPASIEN: Silau lihat laptop, berisik bikin tambah sakit, mual sampai muntah. Membaik kalau tidur di kamar gelap."], ["Pencetus: stres, tidur, telat makan, menstruasi, pil KB, kopi, cokelat", "DOKTER: Ada pencetus? Kurang tidur, telat makan, menstruasi, pil KB, kopi, cokelat?\nPASIEN: Sering kambuh kalau kurang tidur dan menjelang haid. Tidak pakai pil KB."], ["Red flag SNOOP4: demam, kaku leher, nyeri terhebat mendadak, lemah sesisi, kejang, muntah proyektil, memburuk saat batuk/berbaring, trauma, usia >50 th baru", "DOKTER: Ada demam, leher kaku, nyeri paling hebat mendadak, lemah sebelah, kejang, muntah menyemprot, memburuk saat batuk atau berbaring, pernah terbentur?\nPASIEN: Tidak ada, Dok."], ["RPD (HT/jantung/stroke — KI triptan; asma — KI propranolol), obat yang sudah diminum (MOH), RPK", "DOKTER: Ada darah tinggi, sakit jantung, asma? Minum obat nyeri berapa kali seminggu? Keluarga ada yang serupa?\nPASIEN: Tidak ada penyakit. Obat nyeri jarang. Ibu saya juga sering sakit kepala sebelah."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa kepala dan saraf Mbak; boleh lampunya saya redupkan supaya tidak silau. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, GCS, TTV (singkirkan HT emergensi & demam)", "→ KE PENGUJI: GCS 15, TD 110/80, nadi 88, RR 19, suhu 36,7 °C."], ["Status generalis: nyeri tekan sinus, a. temporalis", "→ KE PENGUJI: Sinus tidak nyeri tekan, a. temporalis tidak menebal."], ["Status neurologis: meningeal, saraf kranial, funduskopi, motorik, refleks, koordinasi", "→ KE PENGUJI: Rangsang meningeal (−), saraf kranial normal, funduskopi tanpa papiledema, motorik 5555, refleks fisiologis normal, patologis (−), koordinasi baik → tidak ada tanda nyeri kepala sekunder."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan karena red flag (−) dan neurologis normal. CT hanya bila ada red flag."], ["Diagnosis & DD", "→ KE PENGUJI: Migren tanpa aura (common migraine). DD: tension-type headache, cluster headache, arteritis temporalis."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Mbak mengalami migren, nyeri kepala primer yang kambuh bila ada pencetus. Ini bukan tumor atau stroke."], ["Nonfarmako: ruang gelap tenang, tidur, kompres dingin, headache diary, hindari pencetus, olahraga", "DOKTER: Saat serangan istirahat di ruang gelap dan tenang, kompres dingin. Catat buku harian nyeri kepala, tidur teratur, jangan telat makan."], ["Resep abortif & serahkan; minum sedini mungkin", "DOKTER: Minum obat sedini mungkin saat nyeri mulai, obat mual bila mual. Jangan minum obat nyeri setiap hari.\n→ KE PENGUJI: Ibuprofen 400 mg + metoklopramid 10 mg p.r.n.; sumatriptan bila NSAID gagal. Resep saya serahkan."], ["Red flag & rujuk profilaksis bila ≥4 hari/bulan", "DOKTER: Kalau nyeri terhebat mendadak, demam dengan leher kaku, lemah sebelah, kejang, atau pola berubah, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Ibuprofen tab 400 mg No. X", "   S 3 dd tab I p.c. p.r.n. nyeri kepala", "   ———————————— paraf", "R/ Metoklopramid tab 10 mg No. VI", "   S 3 dd tab I a.c. p.r.n. mual", "   ———————————— paraf", "Pro: Ny. D., 29 tahun", "Alamat: ……", "", "— Bila NSAID gagal —", "R/ Sumatriptan tab 50 mg No. IV", "   S p.r.n. tab I saat serangan, ulang setelah ≥2 jam (maks 4 tab/hari)", "   ———————————— paraf"], "catatanObat": "[UPDATE GUIDELINE] Sumatriptan sediaan 25/50/100 mg (les: 30 mg), diminum p.r.n. saat serangan, BUKAN 2 dd; maks 200 mg/24 jam; KI PJK, stroke, HT tak terkontrol. ICHD-3 butuh ≥5 serangan (kasus les 3× = probable migraine). Profilaksis (≥4 hari/bulan): propranolol, amitriptilin 10–25 mg, flunarizin 5–10 mg malam. Migren dengan aura: hindari kontrasepsi estrogen.", "jebakan": ["Tidak menanyakan aura & jumlah serangan.", "Tidak skrining SNOOP4/funduskopi.", "Triptan sebagai obat rutin atau pada HT/PJK.", "Lupa antiemetik."], "soal": [{"station": "Neuro-3", "skenario": "Perempuan 29 tahun, nyeri kepala sebelah kiri sejak kemarin disertai mual dan muntah.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** TTV dan pemeriksaan neurologis", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep & **edukasi**"], "kunci": ["Aura, jumlah serangan, pencetus, SNOOP4", "Neurologis normal, funduskopi", "Migren tanpa aura; DD TTH, cluster", "Ibuprofen + metoklopramid p.r.n., headache diary"]}, {"station": "Neuro-3b", "skenario": "Nn. F., 22 tahun, 20 menit sebelum nyeri kepala berdenyut melihat garis zig-zag berkilau, lalu mual. Memakai pil KB kombinasi.", "tugas": ["**Sebutkan** diagnosis", "**Sebutkan** edukasi kontrasepsi"], "kunci": ["Migren dengan aura (klasik)", "Hindari kontrasepsi estrogen (risiko stroke) → KB non-estrogen"]}]}, {"id": "tth", "no": 4, "nama": "Tension-Type Headache", "skdi": "4A", "ringkas": {"kunci": "Pekerja kantoran/mahasiswa, stres, kurang tidur, lama depan komputer; nyeri kepala SEPERTI DIIKAT/DITEKAN sampai tengkuk, kedua sisi, TANPA mual, tetap bisa beraktivitas.", "khas": "ICHD-3: 30 menit–7 hari, ≥2 dari (bilateral, menekan/mengikat, ringan-sedang, tidak diperberat aktivitas), tanpa mual/muntah, fotofobia ATAU fonofobia paling banyak satu. PF: nyeri tekan otot perikranial.", "dd": "Migren • Cluster • Tumor otak/SOL (progresif, muntah proyektil, papiledema) • Nyeri kepala hipertensi", "flag": "Progresif, muntah menyemprot, kelemahan sesisi, kejang, demam + kaku leher, onset baru >50 th → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. B., 30 tahun, Solo, programmer."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Lokasi & karakter", "DOKTER: Nyerinya di mana dan rasanya seperti apa?\nPASIEN: Seluruh kepala sampai tengkuk, Dok, seperti diikat kencang."], ["Onset, frekuensi (hari/bulan → subtipe), durasi, intensitas", "DOKTER: Sejak kapan, berapa hari dalam sebulan, berapa lama tiap kali?\nPASIEN: Dua bulan ini, sekitar 6 hari sebulan, beberapa jam, masih bisa kerja."], ["Penyerta (singkirkan migren): mual-muntah, silau, bising", "DOKTER: Ada mual, muntah, silau, atau terganggu suara?\nPASIEN: Tidak ada."], ["Pencetus: stres, tidur, postur, layar; memperingan", "DOKTER: Memberat kapan? Membaik dengan apa?\nPASIEN: Kalau lembur dan deadline. Membaik kalau dipijat dan istirahat."], ["Red flag SNOOP4: demam, kaku leher, nyeri terhebat mendadak, lemah sesisi, kejang, muntah proyektil, memburuk saat batuk/berbaring, trauma, usia >50 th baru", "DOKTER: Ada demam, leher kaku, nyeri paling hebat mendadak, lemah sebelah, kejang, muntah menyemprot, memburuk saat batuk atau berbaring, pernah terbentur?\nPASIEN: Tidak ada, Dok."], ["Analgesik harian (MOH), kafein, hipertensi, cemas/depresi", "DOKTER: Minum obat nyeri berapa kali seminggu? Kopi? Darah tinggi? Sering cemas atau sedih?\nPASIEN: Obat 1–2 kali seminggu, kopi 3 gelas sehari. Tidak ada darah tinggi."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa kepala, leher, dan saraf Mas. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, GCS, TTV (singkirkan hipertensi)", "→ KE PENGUJI: GCS 15, TD 120/80, nadi 76, suhu normal."], ["Palpasi otot perikranial, trapezius, SCM", "→ KE PENGUJI: Nyeri tekan dan otot tegang di m. temporalis dan trapezius bilateral."], ["Status neurologis: meningeal, saraf kranial, funduskopi, motorik, refleks, koordinasi", "→ KE PENGUJI: Rangsang meningeal (−), saraf kranial normal, funduskopi tanpa papiledema, motorik 5555, refleks fisiologis normal, patologis (−), koordinasi baik → tidak ada tanda nyeri kepala sekunder."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Karena tidak ada red flag dan neurologis normal, saya tidak memerlukan penunjang."], ["Diagnosis & DD", "→ KE PENGUJI: Tension-type headache episodik frekuen. DD: migren tanpa aura, cluster headache, nyeri kepala sekunder e.c. tumor otak."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ini nyeri kepala karena ketegangan otot dan stres, bukan tumor."], ["Nonfarmako: manajemen stres, tidur teratur, ergonomi, peregangan, pijat/kompres hangat, olahraga", "DOKTER: Istirahat tiap 1 jam di depan layar, peregangan leher, kompres hangat atau pijat tengkuk, tidur teratur, olahraga, kurangi kopi."], ["Resep analgesik p.r.n. & serahkan; batasi ≤2–3 hari/minggu", "DOKTER: Obat hanya saat nyeri, jangan lebih dari 2–3 hari seminggu supaya tidak malah sakit kepala karena obat.\n→ KE PENGUJI: Parasetamol 1000 mg p.r.n. Resep saya serahkan."], ["Red flag & kontrol", "DOKTER: Kalau nyeri makin berat, muntah menyemprot, lemah sebelah, atau kejang, segera kembali."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Parasetamol tab 500 mg No. XX", "   S 3 dd tab II p.c. p.r.n. nyeri kepala", "   ———————————— paraf", "Pro: Tn. B., 30 tahun", "Alamat: ……", "", "— atau R/ Ibuprofen tab 400 mg No. X, S 3 dd tab I p.c. p.r.n. —"], "catatanObat": "[UPDATE GUIDELINE — Cochrane/EFNS] Parasetamol efektif 1000 mg/kali (les 500 mg), maks 4 g/hari; analgesik ≤2–3 hari/minggu (cegah MOH). TTH kronik/frekuen: amitriptilin 10–25 mg malam (rujuk/konsul). Subtipe: infrekuen <1 hari/bulan, frekuen 1–14, kronik ≥15 hari/bulan >3 bulan.", "jebakan": ["Tidak menanyakan mual/fotofobia (gagal menyingkirkan migren).", "Tidak cek TTV & tanda TIK.", "Analgesik rutin harian / benzodiazepin-opioid."], "soal": [{"station": "Neuro-4", "skenario": "Laki-laki 30 tahun, programmer, nyeri kepala seperti diikat sampai tengkuk 2 bulan, memberat saat deadline.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik & neurologis", "**Sampaikan** diagnosis & subtipe", "**Tuliskan** resep & **edukasi**"], "kunci": ["Frekuensi/bulan, mual (−), SNOOP4, MOH", "Nyeri tekan perikranial, neurologis normal", "TTH episodik frekuen", "Parasetamol 1 g p.r.n., ergonomi, stres"]}, {"station": "Neuro-4b", "skenario": "Ny. G., 40 tahun, nyeri kepala seperti diikat hampir setiap hari 6 bulan, minum obat nyeri setiap hari.", "tugas": ["**Sebutkan** diagnosis & masalah tambahan", "**Sebutkan** tatalaksana"], "kunci": ["TTH kronik + medication-overuse headache", "Hentikan analgesik berlebih, amitriptilin 10–25 mg malam, rujuk/konsul"]}]}, {"id": "cluster", "no": 5, "nama": "Cluster Headache", "skdi": "3A", "ringkas": {"kunci": "Laki-laki 20–40 th perokok (bisa perempuan!), nyeri SANGAT HEBAT di belakang/sekitar SATU MATA seperti ditusuk, 15–180 menit, jam yang sama tiap hari, berkelompok; mata merah berair, hidung meler sisi sama; gelisah mondar-mandir.", "khas": "ICHD-3: ≥5 serangan unilateral orbital/supraorbital/temporal 15–180 menit + ≥1 gejala otonom IPSILATERAL (injeksi konjungtiva, lakrimasi, rinore/kongesti, edema kelopak, keringat dahi, miosis/ptosis) dan/atau gelisah.", "dd": "Migren • TTH • Neuralgia trigeminal (detik) • Hemikrania paroksismal (2–30 menit, indometasin) • Glaukoma akut (visus ↓, TIO ↑) • Sinusitis", "flag": "Defisit neurologis, nyeri atipikal, onset usia lanjut, tidak respons terapi → curiga sekunder, rujuk MRI."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. C., 32 tahun, Solo, karyawan."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Lokasi, kualitas, skala", "DOKTER: Nyerinya di mana dan seperti apa?\nPASIEN: Di sekitar mata kanan sampai dahi, Dok, seperti ditusuk-tusuk, skala 9–10."], ["Durasi, frekuensi, pola waktu", "DOKTER: Berapa lama tiap serangan? Berapa kali sehari? Jam tertentu?\nPASIEN: 15 menit sampai 3 jam, 1–2 kali sehari, sering malam sampai terbangun, sejak 1 minggu."], ["Gejala otonom ipsilateral", "DOKTER: Saat nyeri, mata kanan merah, berair, hidung meler, kelopak turun, berkeringat?\nPASIEN: Iya semua, Dok, di sisi kanan."], ["Perilaku saat serangan", "DOKTER: Saat nyeri lebih nyaman diam berbaring atau mondar-mandir?\nPASIEN: Tidak bisa diam, mondar-mandir."], ["Penyingkir DD: penglihatan kabur (glaukoma), dipicu sentuhan (trigeminal), red flag", "DOKTER: Penglihatan kabur atau melihat pelangi? Nyeri dipicu sikat gigi/sentuhan wajah? Lemah sebelah?\nPASIEN: Tidak."], ["Pencetus: alkohol, rokok, stres; KI triptan: jantung, stroke, HT", "DOKTER: Minum alkohol, merokok? Sering lembur? Ada sakit jantung, stroke, darah tinggi?\nPASIEN: Sering lembur dan stres. Tidak ada penyakit."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa mata, hidung, dan saraf Ibu. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, GCS, TTV", "→ KE PENGUJI: GCS 15, TD 120/80, nadi 92."], ["Status lokalis mata & hidung saat serangan; visus/TIO singkirkan glaukoma", "→ KE PENGUJI: OD injeksi konjungtiva, lakrimasi, ptosis-miosis kanan; rinore bening kanan. Visus ODS 6/6, TIO palpasi normal."], ["Status neurologis: meningeal, saraf kranial, funduskopi, motorik, refleks, koordinasi", "→ KE PENGUJI: Rangsang meningeal (−), saraf kranial normal, funduskopi tanpa papiledema, motorik 5555, refleks fisiologis normal, patologis (−), koordinasi baik → tidak ada tanda nyeri kepala sekunder."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak rutin; serangan pertama/atipikal → rujuk MRI kepala."], ["Diagnosis & DD", "→ KE PENGUJI: Cluster headache episodik dekstra. DD: migren, tension-type headache, neuralgia trigeminal, glaukoma akut."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Tindakan akut: O₂ 100% 12–15 L/menit NRM 15–20 menit, posisi duduk condong", "→ KE PENGUJI: Saya berikan oksigen 100% 12–15 L/menit via non-rebreathing mask 15–20 menit dengan posisi duduk."], ["Penjelasan", "DOKTER: Ini nyeri kepala klaster, datang berkelompok setiap hari dalam beberapa minggu lalu menghilang. Tidak berbahaya tapi sangat nyeri."], ["Resep & serahkan", "→ KE PENGUJI: Oksigen 100% via NRM dan sumatriptan 6 mg subkutan (RS). Resep saya serahkan."], ["Edukasi: hindari alkohol, nitrat, rokok, tidur teratur; rujuk Sp.N profilaksis (verapamil)", "DOKTER: Selama periode klaster jangan minum alkohol, berhenti merokok, tidur teratur, kelola stres. Ibu saya rujuk ke dokter saraf untuk obat pencegahan."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Oksigen 100% via non-rebreathing mask 12–15 L/menit", "   S imm, selama 15–20 menit", "   ———————————— paraf", "R/ Sumatriptan inj 6 mg/0,5 mL No. I", "   S imm 6 mg subkutan (maks 2×/24 jam)", "   ———————————— paraf", "Pro: Ny. C., 32 tahun", "Alamat: ……"], "catatanObat": "[UPDATE GUIDELINE] O₂ 100% 12–15 L/menit NRM (les 10–15 L). Sumatriptan SC maks 2 injeksi/24 jam, KI PJK/stroke/HT. Profilaksis verapamil lini pertama (perlu EKG) + bridging steroid → Sp.N. Perempuan tetap didiagnosis dengan kriteria yang sama.", "jebakan": ["Menulis oksigen tanpa konsentrasi/aliran/durasi.", "Tidak memeriksa visus/TIO (glaukoma).", "Menyingkirkan cluster karena pasien perempuan."], "soal": [{"station": "Neuro-5", "skenario": "Perempuan 32 tahun, nyeri kepala hebat sekitar mata kanan 15 menit–3 jam, berulang 1 minggu; saat serangan mata kanan merah berair, hidung meler, kelopak turun.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik & neurologis", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep & **edukasi**"], "kunci": ["Durasi, otonom ipsilateral, gelisah, KI triptan", "Injeksi, lakrimasi, ptosis, rinore; visus/TIO normal", "Cluster headache; DD migren, TTH, trigeminal", "O₂ 100% NRM 12–15 L + sumatriptan 6 mg SC; hindari alkohol"]}, {"station": "Neuro-5b", "skenario": "Tn. J., 35 tahun, cluster headache kambuh tiap tahun selama 6 minggu.", "tugas": ["**Sebutkan** profilaksis & syaratnya"], "kunci": ["Verapamil (EKG dulu, risiko blok AV) + prednison jangka pendek, oleh Sp.N"]}]}, {"id": "trigem", "no": 6, "nama": "Neuralgia Trigeminal", "skdi": "3A", "ringkas": {"kunci": "Perempuan >50 th, nyeri wajah SATU SISI seperti TERSETRUM, singkat detik–2 menit, dipicu sikat gigi, bicara, makan, cukur, angin; daerah V2/V3.", "khas": "ICHD-3: nyeri paroksismal unilateral ≥1 cabang N V, detik–2 menit, sengatan listrik, dipicu rangsang ringan (trigger zone), bebas nyeri di antara serangan, SENSORIK WAJAH NORMAL (defisit → sekunder, MRI).", "dd": "Pulpitis/sakit gigi (terus-menerus) • Post-herpetic neuralgia • Sinusitis • Cluster • Gangguan TMJ", "flag": "Defisit sensorik wajah, usia muda, bilateral (curiga MS/tumor), tidak terkontrol → rujuk Sp.N."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. E., 55 tahun, Karanganyar, ibu rumah tangga."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Lokasi, kualitas, durasi", "DOKTER: Nyerinya di mana dan seperti apa?\nPASIEN: Pipi dan rahang kanan, Dok, seperti tersetrum listrik, cuma beberapa detik tapi sangat sakit."], ["Pemicu (trigger)", "DOKTER: Muncul kalau apa?\nPASIEN: Waktu sikat gigi, makan, bahkan kena angin."], ["Di antara serangan, frekuensi, sejak kapan", "DOKTER: Di luar serangan ada nyeri? Berapa kali sehari, sejak kapan?\nPASIEN: Di luar itu tidak sakit. Puluhan kali sehari, sudah 2 bulan."], ["Penyingkir DD: gigi berlubang, riwayat herpes zoster, pilek/nyeri pipi lama, baal wajah", "DOKTER: Ada gigi berlubang, pernah cacar ular di wajah, pilek lama, atau wajah terasa baal?\nPASIEN: Sudah ke dokter gigi, katanya gigi baik. Tidak ada yang lain."], ["RPD: obat, alergi obat (karbamazepin/SJS), penyakit hati", "DOKTER: Ada alergi obat atau riwayat ruam berat karena obat? Sakit liver?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa saraf wajah Ibu dengan kapas dan tangan saya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, TTV", "→ KE PENGUJI: GCS 15, TTV dalam batas normal."], ["N V sensorik V1–V3 dengan kapas, bandingkan kanan-kiri", "DOKTER: Pejamkan mata, bilang kalau terasa sentuhan.\n→ KE PENGUJI: Sensibilitas raba V1–V3 kanan-kiri simetris normal."], ["Refleks kornea (kapas dari samping)", "→ KE PENGUJI: Refleks kornea langsung & konsensual normal bilateral."], ["N V motorik: kertakkan gigi, palpasi masseter-temporalis", "→ KE PENGUJI: Kontraksi masseter & temporalis simetris kuat."], ["Pemeriksaan gigi-mulut & saraf kranial lain", "→ KE PENGUJI: Gigi tidak berlubang; saraf kranial lain normal."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Klinis; MRI bila ada defisit sensorik/usia muda/bilateral."], ["Diagnosis & DD", "→ KE PENGUJI: Neuralgia trigeminal dekstra cabang V2–V3 (klasik). DD: pulpitis, post-herpetic neuralgia, gangguan TMJ."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Ibu mengalami iritasi saraf wajah, sehingga sentuhan ringan memicu nyeri seperti tersetrum. Bisa dikontrol dengan obat saraf."], ["Resep karbamazepin dosis titrasi & serahkan", "DOKTER: Obatnya mulai setengah tablet 2 kali sehari, 3 hari kemudian satu tablet 2 kali. Diminum teratur, jangan berhenti mendadak.\n→ KE PENGUJI: Karbamazepin titrasi 100 → 200 mg 2×/hari. Resep saya serahkan."], ["Edukasi efek samping SJS/TEN & pemeriksaan darah berkala", "DOKTER: Kalau muncul ruam, kulit melepuh, atau sariawan banyak, hentikan obat dan segera kembali. Nanti cek darah dan fungsi hati berkala."], ["Rujuk bila tidak terkontrol/defisit", "DOKTER: Bila nyeri tetap tidak terkontrol, Ibu saya rujuk ke dokter saraf."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Karbamazepin tab 200 mg No. XVII", "   S 2 dd tab ½ (hari 1–3), lalu 2 dd tab I (hari 4–10)", "   ———————————— paraf", "Pro: Ny. E., 55 tahun", "Alamat: ……"], "catatanObat": "Karbamazepin lini pertama 100–200 mg 2–3×/hari, titrasi maks ±1200 mg/hari; alternatif okskarbazepin. [TAMBAHAN] Pada keturunan Asia (HLA-B*15:02) risiko SJS/TEN lebih tinggi — tanyakan riwayat ruam obat, edukasi tegas. Gabapentin/pregabalin adjuvan.", "jebakan": ["Tidak memeriksa sensorik N V & refleks kornea.", "Karbamazepin dosis penuh langsung tanpa titrasi.", "Tidak edukasi ruam/SJS."], "soal": [{"station": "Neuro-6", "skenario": "Perempuan 55 tahun, nyeri wajah kanan seperti tersetrum beberapa detik saat sikat gigi dan makan sejak 2 bulan.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan N V", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep & **edukasi**"], "kunci": ["Trigger, durasi detik, gigi, zoster", "Sensorik V1–V3, refleks kornea, motorik normal", "Neuralgia trigeminal; DD pulpitis, PHN", "Karbamazepin titrasi + edukasi SJS"]}, {"station": "Neuro-6b", "skenario": "Nn. K., 28 tahun, nyeri wajah tersetrum kedua sisi, wajah kiri terasa baal.", "tugas": ["**Sebutkan** kecurigaan & tindak lanjut"], "kunci": ["Neuralgia trigeminal sekunder (MS/tumor) → rujuk MRI Sp.N"]}]}, {"id": "hnp", "no": 7, "nama": "HNP Lumbal / Radikulopati (+ Laseque, Patrick)", "skdi": "3A", "ringkas": {"kunci": "Laki-laki 30–50 th, NYERI PINGGANG MENJALAR KE KAKI setelah angkat berat/membungkuk (bunyi 'klik'), memberat saat batuk/bersin/mengejan/duduk lama, membaik berbaring; kesemutan tungkai.", "khas": "Nyeri radikuler sampai di bawah lutut + LASEQUE/SLR (+) <70°, CROSS-LASEQUE (+) (paling spesifik), Bragard/Sicard, Naffziger, Valsalva (+); defisit sesuai radiks L4/L5/S1. Baku emas MRI.", "dd": "Spondilolistesis (step-off) • Spondilosis • LBP mekanik (Laseque −) • Sendi panggul/SI (Patrick/kontra-Patrick +) • Spondilitis TB/metastasis", "flag": "SINDROM KAUDA EKUINA: retensi/inkontinensia BAK-BAB, saddle anesthesia, gangguan ereksi, kelemahan progresif/bilateral → rujuk segera. Demam, BB turun, kanker → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Pak. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. M., 50 tahun, Wonogiri, petani."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Onset & mekanisme", "DOKTER: Sejak kapan nyeri pinggang? Habis aktivitas apa?\nPASIEN: 2 bulan, Dok, setelah mencabut pohon singkong ada bunyi klik, makin lama makin berat."], ["Lokasi & penjalaran", "DOKTER: Nyerinya menjalar ke mana?\nPASIEN: Dari pinggang ke bokong kiri, paha belakang, betis sampai punggung kaki dan jempol kiri."], ["Kualitas, skala, memperberat & memperingan", "DOKTER: Seperti apa rasanya? Memberat kapan, membaik kapan?\nPASIEN: Seperti tersetrum, skala 7. Memberat saat batuk, bersin, duduk lama, membaik kalau tiduran di lantai."], ["Penyerta: kesemutan, baal, kelemahan, kaki terseret", "DOKTER: Kaki kesemutan, baal, atau lemah?\nPASIEN: Kesemutan di punggung kaki kiri."], ["RED FLAG kauda ekuina & infeksi/keganasan", "DOKTER: BAK atau BAB lancar? Ada baal di selangkangan atau sekitar anus? Gangguan ereksi? Demam, BB turun, batuk lama, riwayat kanker, nyeri hebat malam hari?\nPASIEN: BAK BAB lancar, tidak ada semua itu."], ["RPD (ginjal, maag sebelum NSAID), sosial (pekerjaan, rokok)", "DOKTER: Ada sakit ginjal, maag, darah tinggi? Merokok?\nPASIEN: Tidak ada. Merokok sebungkus sehari."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa tulang belakang dan saraf kaki Bapak; saya akan mengangkat kaki Bapak pelan-pelan. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU & TTV", "→ KE PENGUJI: Tampak kesakitan, GCS 15, TTV dalam batas normal."], ["Inspeksi tulang belakang & cara berjalan (tumit = L5, jinjit = S1)", "→ KE PENGUJI: Skoliosis antalgik ringan, gibbus (−); berjalan dengan tumit sedikit sulit kiri."], ["Palpasi paravertebra, perkusi prosesus spinosus, ROM lumbal", "→ KE PENGUJI: Spasme paravertebra lumbal, nyeri tekan L4–L5, step-off (−), fleksi lumbal terbatas nyeri."], ["Laseque/SLR (tangan di tumit & lutut, lutut lurus, sebut sudut) kanan-kiri", "(Pasien terlentang, pemeriksa di kanan; tungkai diangkat perlahan lutut lurus.)\n→ KE PENGUJI: Laseque kiri (+) pada 45°, kanan (−)."], ["Cross-Laseque, Bragard, Sicard", "→ KE PENGUJI: Cross-Laseque (+); Bragard dan Sicard kiri (+)."], ["Naffziger & Valsalva", "→ KE PENGUJI: Naffziger (+), Valsalva (+)."], ["Patrick & kontra-Patrick (singkirkan sendi panggul/SI)", "→ KE PENGUJI: Patrick (−), kontra-Patrick (−) bilateral."], ["Motorik (dorsofleksi ibu jari/plantarfleksi), sensorik dermatom L4–S1, refleks KPR-APR, Babinski", "→ KE PENGUJI: Kekuatan 5 kecuali dorsofleksi ibu jari kiri 4; hipestesi dermatom L5 kiri; KPR & APR normal; Babinski (−)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: X-ray lumbosakral AP/lateral (singkirkan fraktur, listesis; tampak penyempitan celah L4–L5); MRI lumbosakral baku emas (rujuk)."], ["Diagnosis & DD", "→ KE PENGUJI: Nyeri radikuler (iskialgia) sinistra e.c. HNP lumbal L4–L5. DD: spondilolistesis, spondilosis lumbal, LBP mekanik."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan", "DOKTER: Bapak mengalami jepitan saraf karena bantalan ruas tulang belakang menonjol menekan saraf, jadi nyeri menjalar ke kaki."], ["Nonfarmako: tetap aktif, tirah baring singkat, kompres hangat, ergonomi angkat beban, BB, stop rokok, fisioterapi", "DOKTER: Tetap bergerak sebisanya, tiduran di alas datar paling 1–2 hari saja. Kalau mengangkat, tekuk lutut, punggung lurus, barang dekat badan. Berhenti merokok."], ["Resep NSAID jangka pendek & serahkan", "DOKTER: Obat nyeri sesudah makan, hanya saat nyeri.\n→ KE PENGUJI: Natrium diklofenak 2 × 50 mg p.r.n. Resep saya serahkan, Dok."], ["Rujuk Sp.N/fisioterapi & red flag kauda ekuina", "DOKTER: Bapak saya rujuk ke dokter saraf dan fisioterapi. Kalau tidak bisa kencing, mengompol, baal di selangkangan, atau kaki makin lemah, segera ke IGD."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Natrium diklofenak tab 50 mg No. X", "   S 2 dd tab I p.c. p.r.n. nyeri", "   ———————————— paraf", "Pro: Tn. M., 50 tahun", "Alamat: ……"], "catatanObat": "NSAID jangka pendek, hati-hati lambung/ginjal/lansia; relaksan otot singkat; adjuvan neuropatik (amitriptilin/gabapentin) oleh spesialis; opioid tidak rutin. [UPDATE GUIDELINE — NICE NG59] Tirah baring lama tidak dianjurkan; tetap aktif. Kontra-Patrick versi ceklis Ingenio: lutut di atas lutut kontralateral + fiksasi SIAS ipsilateral.", "jebakan": ["Teknik Laseque salah (lutut ditekuk, tidak sebut sudut, satu sisi).", "Lupa tanya BAB/BAK & saddle anesthesia.", "Menganjurkan tirah baring lama.", "Lupa menyerahkan resep."], "soal": [{"station": "Neuro-7", "skenario": "Laki-laki 50 tahun, petani, nyeri pinggang 2 bulan setelah mencabut pohon singkong.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik termasuk tes provokasi", "**Sampaikan** diagnosis & DD", "**Tuliskan** resep dan serahkan ke penguji", "**Edukasi** pasien"], "kunci": ["Penjalaran, Valsalva, red flag kauda ekuina", "Laseque 45°, cross-Laseque, Bragard, Patrick −, dermatom L5", "HNP L4–L5; DD listesis, spondilosis", "Na diklofenak p.r.n.", "Ergonomi, tetap aktif, rujuk"]}, {"station": "Neuro-7b", "skenario": "Tn. Q., 45 tahun, nyeri pinggang menjalar kedua kaki, sejak kemarin tidak bisa kencing dan baal di sekitar anus.", "tugas": ["**Sebutkan** diagnosis kerja", "**Sebutkan** pemeriksaan & tindakan"], "kunci": ["Sindrom kauda ekuina", "Colok dubur (tonus sfingter), sensasi perianal, kateter, rujuk segera bedah saraf (MRI emergensi)"]}]}, {"id": "tetanus", "no": 8, "nama": "Tetanus Generalisata", "skdi": "4A", "ringkas": {"kunci": "SULIT MEMBUKA MULUT, badan kaku, perut keras seperti papan, punggung melengkung; tertusuk paku/bambu beberapa hari–minggu lalu tidak dirawat; imunisasi tidak lengkap; SADAR PENUH; berkeringat, berdebar.", "khas": "Diagnosis klinis: TRISMUS + rigiditas/spasme descending + riwayat luka + KOMPOS MENTIS; risus sardonikus, opistotonus, perut papan; TES SPATULA (+) (menggigit spatula). Grading Ablett I–IV.", "dd": "Meningoensefalitis (demam tinggi, kesadaran ↓) • Rabies (gigitan, hidrofobia) • Abses peritonsil/odontogenik • Distonia akut obat (metoklopramid/antipsikotik) • Tetani hipokalsemia", "flag": "Spasme laring, sesak/apnea, disfagia berat, badai otonom (TD/nadi labil) → ICU."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Mas. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Tn. K., 20 tahun, Boyolali, buruh bangunan."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Keluhan & urutan kaku", "DOKTER: Sejak kapan sulit membuka mulut? Kaku di mana saja, mulai dari mana?\nPASIEN: 3 hari, Dok. Mulai rahang, lalu leher, punggung, perut keras seperti papan."], ["Spasme dipicu rangsang", "DOKTER: Ada kaku mendadak kalau dengar suara, kena cahaya, atau disentuh?\nPASIEN: Iya, kalau kaget langsung kaku semua."], ["Riwayat luka: apa, kapan, lokasi, dirawat", "DOKTER: Pernah luka tertusuk? Kapan, di mana, dirawat?\nPASIEN: Tertusuk bambu di telapak kaki kiri seminggu lalu, Dok, cuma dicabut sendiri."], ["Riwayat imunisasi tetanus", "DOKTER: Imunisasi waktu kecil lengkap? Pernah suntik tetanus setelahnya?\nPASIEN: Tidak tahu, Dok, sepertinya tidak lengkap."], ["Penyerta & penyingkir DD: demam, keringat, berdebar, sulit menelan, sesak, kesadaran, gigitan hewan, takut air, sakit gigi, obat antimuntah", "DOKTER: Demam, berkeringat, berdebar, sulit menelan, sesak? Pernah digigit anjing? Takut air? Sakit gigi? Minum obat anti muntah?\nPASIEN: Sumer, keringat banyak, berdebar, agak sulit menelan. Tidak ada gigitan atau obat."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa Mas dengan pelan dan tidak mengagetkan; ruangan saya buat tenang. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["KU, kesadaran (sadar penuh), TTV untuk grading", "→ KE PENGUJI: Tampak sakit sedang, kompos mentis GCS 15, TD 130/80, nadi 110, RR 24, suhu 37,8 °C."], ["Kepala-leher: ukur trismus, risus sardonikus, kaku leher", "DOKTER: Coba buka mulut selebar mungkin.\n→ KE PENGUJI: Trismus 2 cm, risus sardonikus (+), kaku leher (+)."], ["Tes spatula (hati-hati, risiko spasme laring)", "→ KE PENGUJI: Tes spatula (+): pasien menggigit spatula saat dinding posterior faring disentuh."], ["Punggung & abdomen", "→ KE PENGUJI: Opistotonus ringan, dinding perut keras seperti papan."], ["Status lokalis luka", "→ KE PENGUJI: Vulnus punctum plantar pedis sinistra ±0,5 cm, kotor, tidak terawat, pus minimal."], ["Neurologis: tonus, kekuatan, refleks, sensorik", "→ KE PENGUJI: Spastisitas keempat ekstremitas, refleks sulit dinilai karena spasme, patologis (−), sensorik normal."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Diagnosis klinis. Usul darah lengkap, elektrolit & kalsium, CK, AGD bila sesak, monitor EKG."], ["Diagnosis & DD", "→ KE PENGUJI: Tetanus generalisata grade II (Ablett) dengan port d'entrée vulnus punctum plantar pedis sinistra. DD: meningoensefalitis, rabies."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Tindakan: rawat inap/rujuk ICU, ABC, suction & alat intubasi, IV line, ruang isolasi tenang-gelap, NGT", "→ KE PENGUJI: Pasien saya rawat/rujuk ke RS dengan ICU: O₂, siapkan suction dan intubasi, IV line, ruang tenang-gelap, rangsang minimal, NGT, monitor TTV."], ["Instruksi farmako: metronidazol, HTIG, diazepam, Td & serahkan", "→ KE PENGUJI: Metronidazol 500 mg IV tiap 6 jam 7–10 hari, HTIG 3000–6000 IU IM (500 IU juga efektif), diazepam IV p.r.n. spasme, vaksin Td 0,5 mL di lengan berbeda. Instruksi saya serahkan."], ["Perawatan luka setelah antitoksin", "→ KE PENGUJI: Debridemen dan irigasi luka dilakukan setelah antitoksin diberikan."], ["Edukasi keluarga & persetujuan rujukan; pencegahan", "DOKTER: Mas terkena tetanus dari racun kuman di luka tusuk bambu. Perlu dirawat, mungkin di ruang intensif. Keluarga tolong jaga ruangan tenang. Setelah sembuh tetap harus imunisasi lengkap karena sakit tetanus tidak memberi kekebalan."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Metronidazol infus 500 mg/100 mL fls No. IV", "   S 4 dd fls I i.v. (tiap 6 jam)", "   ———————————— paraf", "R/ Human Tetanus Immunoglobulin 250 IU amp No. XII (= 3000 IU)", "   S i.m. dosis tunggal (sebagian infiltrasi sekitar luka)", "   ———————————— paraf", "R/ Diazepam inj 10 mg/2 mL amp No. III", "   S 5–10 mg i.v. pelan p.r.n. spasme", "   ———————————— paraf", "R/ Vaksin Td 0,5 mL vial No. I", "   S i.m. deltoid sisi berbeda dari HTIG", "   ———————————— paraf", "Pro: Tn. K., 20 tahun", "Alamat: ……"], "catatanObat": "[UPDATE GUIDELINE — CDC/ACIP, WHO] HTIG 500 IU IM tampak sama efektif dengan 3000–6000 IU (les). ATS (serum kuda) WAJIB skin test + siapkan adrenalin; dosis terapi ATS di les berbeda (100.000–200.000 IU vs 20.000 IU/hari) → ikuti institusi. 'Biosat 1500 IU' & 'Tetagam 250 IU' = dosis PROFILAKSIS luka. Diazepam 0,5–1 mg/kgBB/hari. Td dilanjutkan dosis ke-2 (4 mgg–2 bln) dan ke-3 (6–12 bln).", "jebakan": ["Tidak menilai kesadaran (tetanus sadar penuh).", "Debridemen sebelum antitoksin / lupa rawat luka.", "ATS tanpa skin test.", "Lupa Td aktif; memeriksa dengan berisik/kasar."], "soal": [{"station": "Neuro-8", "skenario": "Laki-laki 20 tahun, seluruh tubuh kaku, sulit membuka mulut 3 hari, perut keras. Seminggu lalu tertusuk bambu di telapak kaki kiri.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan fisik", "**Sampaikan** diagnosis dengan grading & DD", "**Tuliskan** instruksi terapi", "**Edukasi** keluarga"], "kunci": ["Urutan kaku, luka, imunisasi, DD", "Trismus 2 cm, risus, spatula +, perut papan, luka", "Tetanus generalisata Ablett II; DD meningoensefalitis, rabies", "Metronidazol + HTIG + diazepam + Td, rawat luka setelah HTIG", "Ruang tenang, rujuk ICU, imunisasi"]}, {"station": "Neuro-8b", "skenario": "Tn. P., 35 tahun, luka robek kotor terkena paku berkarat 4 jam lalu, riwayat imunisasi tidak jelas.", "tugas": ["**Tentukan** profilaksis tetanus"], "kunci": ["Luka rawan + imunisasi tidak jelas → Td + HTIG 250 IU IM (atau ATS 1500 IU dengan skin test), rawat luka"]}]}, {"id": "bppv", "no": 9, "nama": "Vertigo — BPPV (+ Dix-Hallpike & Epley)", "skdi": "4A", "ringkas": {"kunci": "Perempuan paruh baya/lansia, PUSING BERPUTAR saat BERUBAH POSISI kepala (bangun tidur, berbalik, menengadah), SINGKAT (detik), berulang, mual, tanpa gangguan dengar.", "khas": "DIX-HALLPIKE (+): latensi beberapa detik → vertigo + nistagmus torsional-upbeat ke telinga bawah, <1 menit, fatigable; telinga bawah = sisi sakit (kanal posterior). Neurologis normal.", "dd": "Meniere (menit-jam + tinitus + tuli fluktuatif) • Neuritis vestibularis (berhari-hari) • Vertigo sentral (5D) • Hipotensi ortostatik", "flag": "Diplopia, disartria, disfagia, ataksia berat, defisit motorik-sensorik, nyeri kepala hebat, tuli mendadak → vertigo sentral, rujuk segera."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien (nama, usia, alamat, pekerjaan)", "DOKTER: Boleh saya tahu nama, usia, alamat, dan pekerjaannya?\nPASIEN: Ny. V., 55 tahun, Solo, ibu rumah tangga."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPASIEN: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Jenis pusing: berputar/melayang/mau pingsan", "DOKTER: Pusingnya seperti apa, Bu?\nPASIEN: Ruangan terasa berputar, Dok."], ["Pencetus posisi & durasi tiap serangan", "DOKTER: Muncul kalau melakukan apa? Berapa lama?\nPASIEN: Kalau bangun tidur atau berbalik ke kanan, cuma sebentar, kurang dari setengah menit."], ["Penyerta: mual, telinga berdenging, pendengaran turun, rasa penuh", "DOKTER: Mual? Telinga berdenging, pendengaran turun, terasa penuh?\nPASIEN: Mual, tapi telinga baik."], ["Red flag sentral 5D, nyeri kepala, kesadaran", "DOKTER: Ada pandangan ganda, bicara pelo, sulit menelan, lemah atau baal sebelah, sempoyongan berat, sakit kepala hebat?\nPASIEN: Tidak ada."], ["RPD: trauma kepala, HT, DM, stroke, ISPA, obat; masalah leher (KI Dix-Hallpike)", "DOKTER: Pernah terbentur kepala? Darah tinggi, gula? Ada sakit leher atau saraf terjepit di leher?\nPASIEN: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa telinga dan saraf Ibu, lalu tes posisi yang mungkin memicu pusing sebentar; saya pegangi kepala Ibu. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPASIEN: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["TTV (± ortostatik)", "→ KE PENGUJI: TD 130/80 tanpa penurunan ortostatik, nadi 80."], ["Otoskopi & garpu tala", "→ KE PENGUJI: MAE & MT normal, Rinne +/+, Weber tanpa lateralisasi."], ["Nistagmus spontan & gaze, saraf kranial, motorik, koordinasi, Romberg, tandem gait", "→ KE PENGUJI: Nistagmus spontan (−), saraf kranial normal, motorik 5555, telunjuk-hidung & disdiadokokinesis baik, Romberg (−), tandem gait baik → tidak ada tanda sentral."], ["Dix-Hallpike kanan: duduk, menoleh 45°, baringkan cepat kepala menggantung ±20–30° (ceklis: 15°), amati nistagmus", "DOKTER: Tetap buka mata dan lihat dahi saya ya.\n(Kepala menoleh 45° ke kanan, baringkan cepat hingga kepala menggantung di tepi bed, amati 30–60 detik.)\n→ KE PENGUJI: Setelah latensi ±5 detik muncul vertigo dan nistagmus torsional-upbeat ke telinga kanan ±20 detik, fatigable."], ["Dudukkan kembali, amati; ulangi sisi kiri", "→ KE PENGUJI: Saat duduk nistagmus berbalik singkat. Dix-Hallpike kiri (−)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Tidak diperlukan; audiometri bila keluhan dengar; CT/MRI bila tanda sentral."], ["Diagnosis & DD", "→ KE PENGUJI: Vertigo perifer e.c. BPPV kanal posterior dekstra. DD: penyakit Meniere, neuritis vestibularis, vertigo sentral."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Manuver Epley (terapi utama)", "DOKTER: Saya lakukan gerakan untuk mengembalikan kristal di telinga dalam.\n(Dari posisi Dix-Hallpike kanan 30–60 dtk → putar kepala 90° ke kiri 30–60 dtk → gulingkan badan ke kiri, wajah ke lantai 30–60 dtk → dudukkan perlahan, kepala sedikit menunduk.)\n→ KE PENGUJI: Manuver Epley kanan selesai; Dix-Hallpike ulang bila masih positif."], ["Penjelasan", "DOKTER: Ibu mengalami vertigo karena kristal kecil di telinga dalam bergeser. Jinak dan biasanya membaik dengan gerakan tadi, tapi bisa kambuh."], ["Resep simtomatik jangka pendek & serahkan", "→ KE PENGUJI: Betahistin dan dimenhidrinat jangka pendek p.r.n. mual; terapi utama tetap manuver. Resep saya serahkan."], ["Edukasi: bangun perlahan, cegah jatuh, Brandt-Daroff, red flag, kontrol 1 minggu", "DOKTER: Bangun tidur duduk dulu 1 menit, jangan menengadah lama, pegangan saat jalan, jangan menyetir saat pusing. Latihan di rumah seperti yang saya contohkan. Kalau pandangan ganda, pelo, lemah sebelah, segera ke RS."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPASIEN: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Betahistin mesilat tab 6 mg No. XXX", "   S 3 dd tab II p.c.", "   ———————————— paraf", "R/ Dimenhidrinat tab 50 mg No. VI", "   S 3 dd tab I p.r.n. mual/pusing hebat", "   ———————————— paraf", "Pro: Ny. V., 55 tahun", "Alamat: ……"], "catatanObat": "[UPDATE GUIDELINE — AAO-HNS BPPV 2017] Obat penekan vestibuler tidak dianjurkan rutin; terapi utama manuver reposisi (Epley/Semont). [CEKLIS INGENIO] ucapkan 15° dan 10–15 detik, tetapi tunggu nistagmus yang muncul sebelum mendudukkan. Kanal lateral: supine roll test + Lempert.", "jebakan": ["Dix-Hallpike tanpa izin/tidak memegang kepala/tidak tanya leher.", "Tidak mengamati latensi, arah, durasi nistagmus; satu sisi saja.", "Tidak menyingkirkan vertigo sentral.", "Hanya betahistin tanpa Epley."], "soal": [{"station": "Neuro-9", "skenario": "Perempuan 55 tahun, pusing berputar setiap bangun tidur dan berbalik ke kanan, berlangsung sebentar, disertai mual.", "tugas": ["**Lakukan** anamnesis", "**Lakukan** pemeriksaan neurologis dan **Dix-Hallpik
