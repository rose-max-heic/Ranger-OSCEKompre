e**", "**Sampaikan** diagnosis & DD", "**Lakukan** manuver terapi dan **edukasi**"], "kunci": ["Posisional, detik, telinga normal, 5D (−)", "Koordinasi normal, D-H kanan + latensi, torsional", "BPPV kanal posterior kanan; DD Meniere, neuritis, sentral", "Epley kanan, Brandt-Daroff, cegah jatuh"]}, {"station": "Neuro-9b", "skenario": "Tn. W., 60 tahun, hipertensi, vertigo mendadak terus-menerus, bicara pelo, jalan sempoyongan, nistagmus vertikal.", "tugas": ["**Sebutkan** diagnosis kerja & tindakan"], "kunci": ["Vertigo sentral (stroke vertebrobasiler) → stabilisasi, rujuk segera CT/MRI"]}]}, {"id": "kd", "no": 10, "nama": "Kejang Demam — kasus anak", "skdi": "4A", "ringkas": {"kunci": "Anak 6 bulan–5 tahun demam (ISPA, OMA, diare), kejang seluruh tubuh, mata mendelik, kaku lalu kelojotan singkat, setelahnya sadar/menangis; keluarga riwayat kejang demam.", "khas": "IDAI 2016: kejang pada suhu >38 °C, usia 6 bln–5 th, bukan infeksi SSP/metabolik, tanpa riwayat kejang tanpa demam. SEDERHANA: <15 menit, umum, tidak berulang dalam 24 jam (ketiganya). KOMPLEKS: salah satu >15 menit/fokal/berulang.", "dd": "Meningitis/ensefalitis (kesadaran ↓, meningeal +, UUB menonjol) • Epilepsi • Gangguan elektrolit/hipoglikemia • Menggigil (rigor)", "flag": "Kejang >5 menit / tidak berhenti 2× diazepam, tidak sadar setelah kejang, berulang 24 jam, fokal/lumpuh, meningeal +, usia <6 bulan → rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya adik? Boleh saya tahu nama, usia, dan alamat adik?\nPENGHANTAR: Saya ibunya, Dok. Namanya An. Z., 2 tahun, BB 12 kg, alamat Solo."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan adik lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Kejang: berapa kali, berapa lama, bentuk, mata, setelah kejang sadar?", "DOKTER: Ibu, saya mengerti Ibu khawatir, kita tangani bersama ya. Kejangnya berapa kali, berapa lama, seluruh badan atau sebagian? Setelah kejang adik sadar?\nPENGHANTAR: Sekali, Dok, sekitar 3 menit, seluruh badan kaku lalu kelojotan, mata mendelik. Setelahnya menangis lalu sadar."], ["Demam: sejak kapan, suhu, jarak ke kejang", "DOKTER: Demam sejak kapan dan berapa?\nPENGHANTAR: Sejak tadi pagi, 39 °C, kejang 4 jam setelah demam."], ["Sumber demam: batuk-pilek, telinga, diare-muntah, BAK, ruam", "DOKTER: Ada batuk pilek, tarik-tarik telinga, mencret, muntah, rewel saat pipis, ruam?\nPENGHANTAR: Pilek dan batuk sejak kemarin."], ["Red flag SSP: muntah menyemprot, kaku leher, UUB menonjol, sangat mengantuk", "DOKTER: Muntah menyemprot, leher kaku, sangat mengantuk terus?\nPENGHANTAR: Tidak, Dok."], ["Riwayat kejang sebelumnya, keluarga, tumbuh kembang, imunisasi, obat yang diberikan", "DOKTER: Pernah kejang sebelumnya, dengan atau tanpa demam? Keluarga ada yang kejang demam? Tumbuh kembang dan imunisasi lengkap? Sudah diberi obat?\nPENGHANTAR: Baru pertama. Ayahnya dulu pernah kejang demam. Tumbuh kembang baik, imunisasi lengkap. Belum diberi obat."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa adik; Ibu boleh tetap memangku. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["BB (dosis!), kesadaran, TTV", "→ KE PENGUJI: BB 12 kg, kompos mentis (aktif menangis), suhu 39 °C, nadi 130, RR 32, SpO₂ 98%."], ["Cari fokus infeksi: faring, otoskopi, paru, abdomen, kulit, dehidrasi", "→ KE PENGUJI: Faring hiperemis, tonsil T1–T1, MT normal, paru vesikuler, tanda dehidrasi (−)."], ["Rangsang meningeal & UUB", "→ KE PENGUJI: Kaku kuduk (−), Brudzinski I–II (−), Kernig (−), UUB sudah menutup."], ["Neurologis: pupil, motorik 4 ekstremitas (paresis Todd), refleks", "→ KE PENGUJI: Pupil isokor RC +/+, gerak keempat ekstremitas aktif simetris, refleks fisiologis normal, patologis (−)."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang (indikasi pungsi lumbal)", "→ KE PENGUJI: Karena kejang singkat, umum, sekali, anak sadar penuh, dan meningeal negatif, pungsi lumbal tidak diperlukan. Saya usulkan darah lengkap mencari sumber demam."], ["Diagnosis & DD", "→ KE PENGUJI: Kejang demam sederhana e.c. ISPA (faringitis viral). DD: kejang demam kompleks, meningitis/ensefalitis, epilepsi."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Penjelasan & menenangkan orang tua", "DOKTER: Adik mengalami kejang demam sederhana. Umumnya tidak merusak otak atau kecerdasan. Bisa kambuh saat demam (sekitar 1 dari 3 anak), risiko epilepsi kecil."], ["Pertolongan pertama di rumah", "DOKTER: Kalau kejang lagi: tetap tenang, longgarkan baju, miringkan adik, jangan memasukkan sendok atau kopi ke mulut, jangan menahan gerakan, catat lamanya. Kalau lebih dari 5 menit, masukkan obat lewat dubur lalu bawa ke klinik."], ["Resep anak per BB & serahkan", "DOKTER: Obat demam bila suhu 38 ke atas; kompres air hangat, bukan alkohol atau es.\n→ KE PENGUJI: Parasetamol 15 mg × 12 kg = 180 mg = 7,5 mL sirup; diazepam rektal 10 mg (BB ≥12 kg) p.r.n. kejang. Resep saya serahkan."], ["Red flag & imunisasi tetap lanjut", "DOKTER: Segera bawa ke IGD bila kejang lebih dari 5 menit, tidak sadar setelah kejang, kejang berulang, atau leher kaku. Imunisasi tetap dilanjutkan."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Parasetamol sirup 120 mg/5 mL fl. 60 mL No. I", "   S 4 dd cth I ½ (7,5 mL = 180 mg) p.r.n. demam ≥38 °C", "   ———————————— paraf", "R/ Diazepam rektal 10 mg tube No. II", "   S p.r.n. kejang: 1 tube per rektal, boleh diulang 1× setelah 5 menit", "   ———————————— paraf", "Pro: An. Z., 2 tahun (BB 12 kg)", "Alamat: ……", "", "— Hitung BB 10 kg: parasetamol 100–150 mg = cth I (120 mg); diazepam rektal 5 mg (<12 kg) —", "— Hitung BB 20 kg: parasetamol 200–300 mg = cth II (240 mg) / tab 250 mg; diazepam rektal 10 mg —", "— Puyer bila sirup tidak ada (BB 10 kg): R/ Parasetamol 120 mg m.f. pulv. dtd No. X, S 4 dd pulv I p.r.n. demam —"], "catatanObat": "[UPDATE GUIDELINE — IDAI 2016] Diazepam IV 0,2–0,5 mg/kgBB pelan, maks 10 mg (konsensus 2006: maks 20 mg). Rektal 0,5–0,75 mg/kg: 5 mg (<12 kg), 10 mg (≥12 kg). Antipiretik tidak mencegah kejang berulang. Profilaksis intermiten diazepam oral 0,3 mg/kg/8 jam hanya pada indikasi khusus.", "jebakan": ["Dosis tanpa BB / BB tidak ditulis di resep.", "Tidak memeriksa meningeal & kesadaran pascakejang.", "Menganjurkan sendok ke mulut, kompres alkohol/es; diazepam IV cepat.", "Tidak mencari sumber demam/tidak menenangkan orang tua."], "soal": [{"station": "Neuro-10", "skenario": "An. Z., 2 tahun (BB 12 kg) dibawa ibunya setelah kejang seluruh tubuh 3 menit saat demam 39 °C, kini sadar.", "tugas": ["**Lakukan** alloanamnesis", "**Lakukan** pemeriksaan fisik & neurologis", "**Sampaikan** diagnosis & alasan tidak pungsi lumbal", "**Tuliskan** resep sesuai BB & **edukasi** orang tua"], "kunci": ["Durasi, bentuk, kesadaran pasca, sumber demam, keluarga", "BB, fokus infeksi, meningeal (−)", "KDS e.c. ISPA", "Parasetamol 180 mg + diazepam rektal 10 mg, P3K kejang"]}, {"station": "Neuro-10b", "skenario": "An. Y., 18 bulan (BB 10 kg), sedang kejang saat tiba di Puskesmas, sudah 7 menit, belum ada akses IV.", "tugas": ["**Lakukan** tatalaksana kejang pada manekin", "**Sebutkan** langkah bila tidak berhenti"], "kunci": ["Miring, jalan napas, O₂, diazepam rektal 5 mg, ulang 1× setelah 5 menit", "Tidak berhenti → tatalaksana status epileptikus, rujuk"]}]}, {"id": "meningitis", "no": 11, "nama": "Meningitis / Ensefalitis", "skdi": "3B", "ringkas": {"kunci": "Demam + NYERI KEPALA HEBAT + LEHER KAKU, muntah, fotofobia, penurunan kesadaran/kejang; ruam petekie; riwayat telinga berair, sinusitis, TB, HIV.", "khas": "Demam + RANGSANG MENINGEAL (+) (kaku kuduk, Kernig, Brudzinski) ± gangguan kesadaran; konfirmasi LCS (bakteri: keruh, PMN, glukosa ↓; virus: jernih, limfosit; TB: xantokrom, protein ↑↑, glukosa ↓).", "dd": "Ensefalitis • Meningitis TB • PSA (thunderclap, demam tidak mendahului) • Malaria serebral • Abses otak • Tetanus (sadar, trismus)", "flag": "Gawat darurat: penurunan kesadaran, kejang, syok, petekie → antibiotik tanpa menunda + rujuk SEGERA."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya pasien? Boleh saya tahu nama, usia, dan alamat pasien?\nPENGHANTAR: Saya ibunya, Dok. Anak saya Tn. L., 25 tahun, Sragen, mahasiswa."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Onset demam & nyeri kepala, muntah, fotofobia", "DOKTER: Sejak kapan demam dan sakit kepala? Muntah? Silau?\nPENGHANTAR: Demam tinggi 2 hari, sakit kepala hebat, muntah menyemprot, silau, Dok."], ["Kejang, perubahan perilaku/kesadaran", "DOKTER: Ada kejang? Bicara ngelantur atau makin mengantuk?\nPENGHANTAR: Sejak tadi pagi mengantuk dan bingung."], ["Ruam, sumber infeksi (telinga, sinus, gigi, paru), batuk lama/kontak TB", "DOKTER: Ada bintik merah di kulit? Telinga berair, pilek lama, sakit gigi, batuk lama, kontak TB?\nPENGHANTAR: Telinga kanan sering berair sejak SMP."], ["Imunokompromais, imunisasi, trauma/operasi kepala, daerah malaria", "DOKTER: Ada penyakit daya tahan tubuh, pernah operasi atau terbentur kepala, habis bepergian ke daerah malaria?\nPENGHANTAR: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa anak Ibu, termasuk menekuk leher dan kakinya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["GCS & TTV (tanda syok)", "→ KE PENGUJI: GCS E3V4M6 = 13 (apatis), TD 110/70, nadi 112, RR 22, suhu 39,5 °C."], ["Rangsang meningeal tanpa bantal: kaku kuduk, Kernig, Brudzinski I–II", "(Bantal diambil; tangan kiri di bawah kepala, kanan di dada.)\n→ KE PENGUJI: Kaku kuduk (+), Kernig (+) <135° bilateral, Brudzinski I & II (+)."], ["Saraf kranial & funduskopi (papiledema)", "→ KE PENGUJI: Pupil isokor, parese N III/VI/VII (−), funduskopi tanpa papiledema."], ["Motorik, refleks, kulit (petekie), otoskopi", "→ KE PENGUJI: Motorik simetris, refleks normal, Babinski (−), petekie (−); otoskopi AD perforasi dengan sekret purulen."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: Darah lengkap, kultur darah (tanpa menunda AB), GDS, elektrolit; CT kepala lalu pungsi lumbal di RS; foto toraks bila curiga TB."], ["Diagnosis & DD", "→ KE PENGUJI: Suspek meningitis bakterial dengan penurunan kesadaran, fokus OMSK dekstra. DD: ensefalitis, meningitis TB, abses otak."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["Stabilisasi: ABC, O₂, IV line, kepala 30°, atasi kejang & demam", "→ KE PENGUJI: ABC, O₂, infus NaCl 0,9%, kepala 30°, antipiretik, diazepam bila kejang."], ["Antibiotik pra-rujukan tanpa menunda & serahkan", "→ KE PENGUJI: Seftriakson 2 g IV segera (anak 50 mg/kg maks 2 g). Instruksi saya serahkan."], ["Rujuk SEGERA & edukasi keluarga", "DOKTER: Bu, anak Ibu kemungkinan radang selaput otak. Ini gawat dan perlu dirawat di rumah sakit sekarang. Ibu setuju dirujuk?\nPENGHANTAR: Setuju, Dok."], ["Edukasi penularan/vaksin & komplikasi", "DOKTER: Komplikasinya bisa tuli atau kejang, makanya harus cepat diobati. Keluarga yang kontak erat nanti dinilai dokter apakah perlu obat pencegahan."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Seftriakson inj 1 g vial No. II", "   S 2 g i.v. segera (pra-rujukan)", "   ———————————— paraf", "R/ Parasetamol infus 1 g/100 mL fls No. I", "   S 1 g i.v. p.r.n. demam", "   ———————————— paraf", "Pro: Tn. L., 25 tahun", "Alamat: ……"], "catatanObat": "[TAMBAHAN — NICE 2024] Seftriakson antibiotik empiris inisial, jangan menunda demi pemeriksaan. Deksametason 0,15 mg/kg IV/6 jam sebelum/bersama AB pertama (RS/spesialis). CT dulu sebelum LP bila defisit fokal, papiledema, kejang baru, imunokompromais, GCS turun. TB: OAT + steroid.", "jebakan": ["Kaku kuduk dengan bantal / tanpa Kernig-Brudzinski.", "Menunda antibiotik/rujukan.", "LP tanpa menyingkirkan TIK."], "soal": [{"station": "Neuro-11", "skenario": "Tn. L., 25 tahun, demam tinggi 2 hari, sakit kepala hebat, muntah, kini mengantuk; telinga kanan sering berair.", "tugas": ["**Lakukan** alloanamnesis", "**Lakukan** pemeriksaan rangsang meningeal & neurologis", "**Sampaikan** diagnosis & DD", "**Sebutkan** tatalaksana pra-rujukan"], "kunci": ["Onset, kesadaran, fokus infeksi", "GCS 13, kaku kuduk/Kernig/Brudzinski +", "Suspek meningitis bakterial e.c. OMSK", "ABC, seftriakson 2 g IV, rujuk segera"]}, {"station": "Neuro-11b", "skenario": "Hasil LCS: jernih-xantokrom, sel limfosit, protein sangat tinggi, glukosa rendah; parese N VI; batuk 2 bulan.", "tugas": ["**Interpretasikan** LCS", "**Sebutkan** diagnosis"], "kunci": ["Pola TB (limfosit, protein ↑↑, glukosa ↓)", "Meningitis TB → OAT + steroid, rujuk"]}]}, {"id": "se", "no": 12, "nama": "Epilepsi & Status Epileptikus", "skdi": "3B", "ringkas": {"kunci": "Kejang berulang TANPA demam, mata mendelik, lidah tergigit, mengompol, bingung setelahnya; putus obat antiepilepsi, kurang tidur, alkohol. SE: kejang >5 menit atau berulang tanpa sadar di antaranya.", "khas": "Epilepsi (ILAE 2014): ≥2 bangkitan tanpa provokasi >24 jam terpisah, atau 1 + risiko ≥60%, atau sindrom epilepsi. SE operasional: tonik-klonik ≥5 menit atau ≥2 bangkitan tanpa pemulihan kesadaran.", "dd": "Sinkop • Bangkitan psikogenik non-epileptik • Hipoglikemia • Kejang simptomatik akut (stroke, infeksi SSP, elektrolit, putus alkohol)", "flag": "Kejang >5 menit, tidak sadar di antara kejang, cedera kepala, sesak, kejang pertama, demam + kaku leher → tatalaksana SE + rujuk."}, "tabel": [{"name": "Pembukaan", "rows": [["Memberikan salam & mempersilakan duduk", "DOKTER: Selamat pagi, Bu. Silakan duduk."], ["Memperkenalkan diri", "DOKTER: Perkenalkan, saya dr. X, dokter umum yang bertugas hari ini."], ["Menanyakan identitas pasien & hubungan pengantar", "DOKTER: Ibu siapanya pasien? Boleh saya tahu nama, usia, dan alamat pasien?\nPENGHANTAR: Saya istrinya, Dok. Suami saya Tn. E., 28 tahun, Klaten, karyawan."], ["Menjelaskan tujuan & menanyakan kesediaan (sambung rasa)", "DOKTER: Saya akan menanyakan keluhan lalu memeriksa. Bersedia?\nPENGHANTAR: Iya, Dok."]]}, {"name": "Anamnesis", "rows": [["Saat kejang (saksi): bentuk, durasi, mata, busa, lidah, mengompol, sadar di antaranya", "DOKTER: Bu, kejangnya seperti apa, sudah berapa lama, sadar di antara kejang?\nPENGHANTAR: Seluruh badan kelojotan, mulut berbusa, lidah tergigit, ngompol. Sudah 2 kali sejak 10 menit lalu, tidak sadar di antaranya, Dok."], ["Sebelum: aura, pencetus (kurang tidur, alkohol)", "DOKTER: Sebelumnya ada keluhan aneh atau kurang tidur, minum alkohol?\nPENGHANTAR: Lembur 2 malam kurang tidur."], ["Riwayat epilepsi & kepatuhan obat", "DOKTER: Pernah kejang tanpa demam? Minum obat kejang rutin?\nPENGHANTAR: Epilepsi sejak SMA, obat karbamazepin, tapi seminggu ini habis tidak beli."], ["Riwayat trauma, infeksi otak, stroke, DM (hipoglikemia), demam", "DOKTER: Ada demam, terbentur kepala, kencing manis?\nPENGHANTAR: Tidak ada."]]}, {"name": "Pemeriksaan Fisik", "rows": [["Informed consent pemeriksaan fisik", "DOKTER: Saya akan memeriksa suami Ibu sambil menangani kejangnya. Tidak sakit, nanti saya jelaskan tiap langkah. Boleh?\nPENGHANTAR: Boleh, Dok."], ["Cuci tangan 6 langkah WHO", "(Cuci tangan 6 langkah WHO / handrub 20–30 detik.)"], ["Memeriksa tanda vital", "DOKTER: Saya cek tanda vital dulu.\n→ KE PENGUJI: Izin, bagaimana hasil tanda vital pasien?"], ["Stabilisasi 0–5 menit: ABC, miring, O₂, jangan masukkan benda, catat waktu", "(Posisi miring, bebaskan jalan napas, suction, O₂ NRM, longgarkan pakaian, catat waktu.)"], ["GCS, TTV, SpO₂, IV line, GDS stik", "→ KE PENGUJI: GCS E1V2M4 sedang kejang, TD 140/90, nadi 120, SpO₂ 94% → O₂; IV line terpasang; GDS 110 mg/dL."], ["Cedera akibat kejang", "→ KE PENGUJI: Lidah tergigit, tidak ada luka kepala."], ["Rangsang meningeal & defisit fokal (setelah kejang berhenti)", "→ KE PENGUJI: Rangsang meningeal (−), tidak ada lateralisasi."], ["Cuci tangan setelah pemeriksaan & menginformasikan selesai", "(Lepas sarung tangan bila dipakai, cuci tangan, disinfeksi alat.)\nDOKTER: Pemeriksaan sudah selesai."]]}, {"name": "Penunjang & Diagnosis", "rows": [["Penunjang", "→ KE PENGUJI: GDS (sudah), elektrolit Na-Ca-Mg, darah lengkap, fungsi hati-ginjal, kadar OAE; EEG & CT kepala di rujukan."], ["Diagnosis & DD", "→ KE PENGUJI: Status epileptikus konvulsif pada pasien epilepsi e.c. putus obat. DD: kejang simptomatik akut (hipoglikemia/infeksi SSP), bangkitan psikogenik."]]}, {"name": "Tatalaksana & Edukasi", "rows": [["5–20 menit: diazepam IV 0,15–0,2 mg/kg maks 10 mg, ulang 1× (tanpa IV: midazolam IM 10 mg)", "→ KE PENGUJI: Diazepam 10 mg IV pelan (BB 60 kg), boleh diulang 1× setelah 5 menit. Siapkan airway."], ["20–40 menit: fenitoin 20 mg/kg IV dalam NaCl 0,9% ≤50 mg/menit; rujuk", "→ KE PENGUJI: Bila masih kejang: fenitoin 20 mg/kg IV dalam NaCl 0,9% (bukan dekstrosa) ≤50 mg/menit, dan rujuk segera ke RS/ICU."], ["Instruksi tertulis & serahkan", "→ KE PENGUJI: Instruksi terapi saya serahkan."], ["Edukasi keluarga: kepatuhan obat, pencetus, keselamatan, P3K kejang", "DOKTER: Obat kejang tidak boleh berhenti sendiri. Hindari kurang tidur dan alkohol. Jangan berenang sendiri atau menyetir sampai dokter mengizinkan. Saat kejang: miringkan, jangan masukkan benda ke mulut."]]}, {"name": "Penutupan", "rows": [["Memberi kesempatan bertanya", "DOKTER: Ada yang ingin ditanyakan?\nPENGHANTAR: Tidak, Dok, sudah jelas."], ["Menjadwalkan kontrol & menutup dengan salam", "DOKTER: Kontrol sesuai jadwal ya, atau lebih cepat bila ada tanda bahaya tadi. Semoga lekas sembuh."]]}, {"name": "Profesionalisme", "rows": [["Empati, bahasa awam, kontak mata baik", "(Bahasa awam, tidak menghakimi, menenangkan pasien.)"], ["Menjaga keamanan pasien & higiene alat", "(Cuci tangan, sarung tangan bila menyentuh sekret/mukosa, alat didisinfeksi.)"], ["Runut & efisien waktu", "(Urutan sesuai ceklis, selesai ≤12 menit.)"]]}], "resep": ["R/ Diazepam inj 10 mg/2 mL amp No. II", "   S 10 mg i.v. pelan (2 mg/menit), ulang 1× setelah 5 menit bila kejang", "   ———————————— paraf", "R/ Fenitoin inj 50 mg/mL amp 5 mL No. V", "   S 20 mg/kgBB (1200 mg) dalam NaCl 0,9% i.v. ≤50 mg/menit", "   ———————————— paraf", "Pro: Tn. E., 28 tahun (BB 60 kg)", "Alamat: ……"], "catatanObat": "[TAMBAHAN — AES 2016, ILAE 2015] Lini kedua alternatif: valproat 40 mg/kg, levetirasetam 60 mg/kg, fenobarbital 15 mg/kg. GDS <60 → dekstrosa 40% (tiamin 100 mg dulu bila alkohol/malnutrisi). Epilepsi baru → Sp.N; karbamazepin untuk fokal, valproat untuk umum (hindari pada perempuan usia subur).", "jebakan": ["Lupa GDS.", "Diazepam IV cepat/dosis berlebih tanpa airway.", "Fenitoin dalam dekstrosa atau cepat.", "Memasukkan benda ke mulut / menahan gerakan."], "soal": [{"station": "Neuro-12", "skenario": "Laki-laki 28 tahun, penyandang epilepsi, putus obat seminggu, kejang 2 kali dalam 10 menit tanpa sadar di antaranya.", "tugas": ["**Lakukan** tatalaksana awal sesuai algoritma", "**Lakukan** alloanamnesis singkat", "**Sampaikan** diagnosis", "**Tuliskan** instruksi terapi & **edukasi**"], "kunci": ["ABC, miring, O₂, IV, GDS", "Kepatuhan obat, pencetus", "Status epileptikus konvulsif e.c. putus obat", "Diazepam IV 10 mg ulang 1×, fenitoin 20 mg/kg NaCl, rujuk"]}, {"station": "Neuro-12b", "skenario": "Nn. S., 20 tahun, 'kejang' dengan mata tertutup rapat, gerakan tidak sinkron, kepala menggeleng, durasi 15 menit, sadar fluktuatif, tanpa lidah tergigit.", "tugas": ["**Sebutkan** kecurigaan & DD"], "kunci": [['materi','📖','Materi','Rangkuman sekali lihat: kata kunci, kriteria, DD, terapi, fatal flaws'],['ceklis','📋','Ceklis','Tabel penilaian 0/1/2 + skor otomatis, resep & jebakan penguji'],['naskah','🗣️','Ceklis + Naskah','Apa yang diucapkan di tiap poin ceklis; ada mode hafalan'],['soal','📝','Contoh Soal','2 soal pintu station + kunci tersembunyi']].filter(c=>!d.materiOnly||c[0]=='materi').forEach(c=>h+='<a class="card big" href="#'+d.id+'-'+c[0]+'"><div class="ic">'+c[1]+'</div><h3>'+c[2]+'</h3><p>'+c[3]+'</p></a>');

function ringkas(d){return '<div class="box"><div style="padding:10px 12px;background:var(--blue);color:#fff;font-weight:700">SKDI '+d.skdi+'</div><div class="row k1"><b>🔑 Kata kunci</b><div>'+esc(d.ringkas.kunci)+'</div></div><div class="row k2"><b>★ Kriteria khas</b><div>'+esc(d.ringkas.khas)+'</div></div><div class="row k3"><b>Diagnosis banding</b><div>'+esc(d.ringkas.dd)+'</div></div><div class="row k4"><b>⚠️ Red flag / rujuk</b><div>'+esc(d.ringkas.flag)+'</div></div></div>'}
function tbl(h,rows){return '<table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+md(c)+'</td>').join('')+'</tr>').join('')+'</table>'}
function home(){return '<div class="top"><h2>📚 Pembuka & Template</h2><a class="btn dl" href="javascript:void(0)" onclick="pdf()">⬇️ Download PDF</a></div><div class="phead">OSCE Kompre Neurologi • Pembuka & Template</div><h3>Daftar penyakit high-yield</h3>'+tbl(['#','Penyakit','SKDI','Kata kunci','Prosedur','Rujuk?'],S.daftar)+'<h3>Keluhan utama → kemungkinan diagnosis</h3>'+tbl(['Keluhan','Pikirkan','Pembeda'],S.keluhan)+'<h3>Alokasi waktu</h3>'+tbl(['Fase','Lengkap','Sebagian'],S.waktu)+'<h3>Template pemeriksaan neurologis</h3>'+tbl(['Komponen','Isi'],S.template)+'<h3>Ringkasan obat</h3>'+tbl(['Obat','Sediaan','Dosis','Catatan'],S.obatTabel)+'<h3>💡 Masukan</h3><ul>'+S.tips.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul><p><b>🧠 Fun fact:</b> '+esc(S.funfact)+'</p>'}
function disease(d){
 const sc=scores[d.id]||(scores[d.id]={});let n=0,max=0,got=0;
 const lab={materi:'📖 Materi',ceklis:'📋 Ceklis',naskah:'🗣️ Ceklis + Naskah',soal:'📝 Contoh Soal'};
 let h='<div class="top"><h2>'+d.no+'. '+esc(name(d))+' — '+lab[tab].slice(3)+'</h2><span class="timer" id="tm">'+fmt()+'</span><button class="btn" onclick="timer()">'+(tInt?'⏸':'▶')+' 12 menit</button><button class="btn" onclick="resetT()">↺</button></div>';
 h+='<div class="secnav"><a href="#'+d.id+'">← Ringkasan</a>'+Object.keys(lab).filter(k=>!d.materiOnly||k=='materi').map(k=>'<a class="'+(tab==k?'on':'')+'" href="#'+d.id+'-'+k+'">'+lab[k]+'</a>').join('')+(tab=='naskah'?'<a href="javascript:void(0)" class="'+(hideSay?'on':'')+'" onclick="hideSay=!hideSay;render()">🙈 Mode hafalan</a>':'')+'<a href="javascript:void(0)" class="dl" onclick="pdf()">⬇️ Download PDF</a></div><div class="phead">OSCE Kompre Neurologi • '+d.no+'. '+esc(d.nama)+' • '+lab[tab].slice(3)+'</div>'+(tab=='ceklis'||tab=='naskah'?ringkas(d):'');
 if(tab=='materi')h+=materi(d);
 if(tab=='ceklis'){let rows='';d.tabel.forEach(s=>{rows+='<tr class="sec"><td colspan="3">'+esc(s.name)+'</td></tr>';s.rows.forEach(r=>{n++;max+=2;const v=sc[n];if(v!=null)got+=v;const U=/KE PENGUJI/.test(r[1]);rows+='<tr class="'+(U?'rowU':'')+'"><td class="no">'+n+'</td><td>'+esc(r[0])+(U?'<span class="badgeU">📣 ke penguji</span>':'')+'</td><td class="sc">'+[0,1,2].map(k=>'<button class="s'+k+(v===k?' on':'')+'" onclick="setS(\''+d.id+'\','+n+','+k+')">'+k+'</button>').join('')+'</td></tr>'})});
  h+='<div class="legend"><span style="background:rgba(255,143,0,.18);color:#b35c00">📣 Baris oranye = hasil/temuan yang HARUS disampaikan atau diminta ke penguji</span></div><div class="score">Skor: '+got+' / '+max+' → <span style="color:var(--wine)">'+Math.round(got/max*100)+'</span> &nbsp; <button class="btn" onclick="scores[\''+d.id+'\']={};save();render()">Reset</button></div><table><thead><tr><th>No</th><th>Kriteria</th><th>Nilai 0 / 1 / 2</th></tr></thead><tbody>'+rows+'</tbody></table>';
  h+='<h3>Resep (serahkan ke penguji)</h3><div class="resep">dr. X — SIP ……\nPraktik Dokter Umum, Surakarta   Tgl: ……\n'+esc(d.resep.join('\n'))+'</div><div class="note">'+esc(d.catatanObat)+'</div><div class="trap"><b>⚠️ Jebakan penguji</b><ol>'+d.jebakan.map(j=>'<li>'+esc(j)+'</li>').join('')+'</ol></div>'}
 if(tab=='naskah'){let rows='';d.tabel.forEach(s=>{rows+='<tr class="sec"><td colspan="5">'+esc(s.name)+'</td></tr>';s.rows.forEach(r=>{n++;const c=split(r[1]);rows+='<tr class="'+(c.U?'rowU':'')+'" onclick="this.classList.toggle(\'peek\')"><td class="no">'+n+'</td><td style="width:22%">'+esc(r[0])+'</td><td class="dk">'+c.D+'</td><td class="ps">'+c.P+'</td><td class="'+(c.U?'pj':'pe')+'">'+c.U+'</td></tr>'})});
  h+='<div class="legend"><span style="background:rgba(43,108,176,.15);color:#2b6cb0">🩺 Dokter: tanya / lakukan</span><span style="background:rgba(74,107,42,.15);color:var(--green)">🙋 Jawaban pasien / pengantar</span><span style="background:#ff8f00;color:#fff">📣 Sampaikan / minta ke penguji</span></div><div class="tw '+(hideSay?'hidden-say':'')+'"><table><thead><tr><th>No</th><th>Kriteria</th><th class="thD">🩺 Dokter'+(hideSay?' (klik baris untuk intip)':'')+'</th><th class="thP">🙋 Pasien / Pengantar</th><th class="thU">📣 Ke Penguji</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
 if(tab=='soal'){d.soal.forEach(s=>{h+='<div class="soal"><h4>INSTRUKSI PESERTA UJIAN</h4><p>Nomor Station: '+s.station+'</p><p><b>SKENARIO KLINIK</b><br>'+esc(s.skenario)+'</p><p><b>TUGAS</b></p><ol>'+s.tugas.map(t=>'<li>'+md(t)+'</li>').join('')+'</ol></div><details class="kunci"><summary>🔒 KUNCI (klik untuk buka)</summary><ul>'+s.kunci.map(k=>'<li>'+esc(k)+'</li>').join('')+'</ul></details>'})}
 return h}
function pdf(){const t=document.title,c=document.querySelector('.phead');document.title=(c?c.textContent:'OSCE Kompre Neurologi').replace(/[•/:]/g,'-');document.body.classList.add('printing');document.querySelectorAll('details').forEach(x=>x.open=true);setTimeout(()=>{window.print();document.body.classList.remove('printing');document.title=t},60)}
function setS(id,n,k){scores[id][n]=k;save();render()}
function fmt(){const m=Math.floor(Math.abs(tLeft)/60),s=Math.abs(tLeft)%60;return (tLeft<0?'-':'')+m+':'+String(s).padStart(2,'0')}
function timer(){if(tInt){clearInterval(tInt);tInt=null}else tInt=setInterval(()=>{tLeft--;const e=document.getElementById('tm');if(e){e.textContent=fmt();e.classList.toggle('warn',tLeft<=120)}},1000);render()}
function resetT(){clearInterval(tInt);tInt=null;tLeft=720;render()}

function split(t){const o={D:'',P:'',U:''};let last='D';t.split('\n').forEach(l=>{let m;
 if(m=l.match(/^DOKTER:\s?/)){o.D+='<p>'+md(l.slice(m[0].length))+'</p>';last='D'}
 else if(m=l.match(/^(PASIEN|PENGHANTAR):\s?/)){o.P+='<p>'+(m[1]=='PENGHANTAR'?'<span class="who">PENGHANTAR</span>':'')+md(l.slice(m[0].length))+'</p>';last='P'}
 else if(m=l.match(/^→\s*KE PENGUJI:\s?/)){o.U+='<p>'+md(l.slice(m[0].length))+'</p>';last='U'}
 else if(/^\(/.test(l))o.D+='<p class="act">'+md(l)+'</p>';
 else if(l.trim())o[last]+='<p>'+md(l)+'</p>'});
 return o}
function mtbl(t){return '<h3 style="margin:6px 0 8px">'+esc(t.judul)+'</h3><div class="tw">'+tbl(t.h,t.rows)+'</div>'}
function figs(a){if(!a||!a.length)return '';return '<div class="fgrid'+(a.length==1?' one':'')+'">'+a.map(g=>'<figure class="fig" onclick="zoom(this)"><img src="'+IMG[g.k]+'"><figcaption>📷 '+esc(g.cap)+'</figcaption></figure>').join('')+'</div>'}
function zoom(f){const o=document.createElement('div');o.className='lb';o.innerHTML='<img src="'+f.querySelector('img').src+'"><p>'+f.querySelector('figcaption').textContent+' — klik untuk tutup</p>';o.onclick=()=>o.remove();document.body.appendChild(o)}
function materi(d){const m=M[d.id];if(!m)return '<p>Belum ada materi.</p>';
 let h='<div class="kilat"><small>⚡ SEKALI LIHAT</small>'+md(m.kilat)+'</div>';
 h+='<div class="mgrid"><div class="mcard c-key"><h3>🔑 Kata kunci skenario</h3><div class="chips">'+m.kunci.map(k=>'<span>'+esc(k)+'</span>').join('')+'</div></div>';
 h+='<div class="mcard c-crit"><h3>★ '+esc(m.kriteria.judul)+'</h3><ul class="chk">'+m.kriteria.items.map(i=>'<li>'+md(i)+'</li>').join('')+'</ul></div></div>';
  const G=m.gambar||[],at=i=>G.filter(g=>(g.at===undefined?-1:g.at)===i);h+=figs(at(-1));
  m.tabel.forEach((t,i)=>{h+=mtbl(t);h+=figs(at(i))});
 h+='<div class="mgrid"><div class="mcard c-tx"><h3>💊 Terapi inti</h3><ul>'+m.terapi.map(i=>'<li>'+md(i)+'</li>').join('')+'</ul></div>';
 h+=(m.flaws?'<div class="mcard c-ff"><h3>⛔ Fatal flaws</h3><ol style="margin:0;padding-left:20px">'+m.flaws.map(i=>'<li>'+md(i)+'</li>').join('')+'</ol></div>':'')+'</div>';
 return h}
function materiUmum(){const u=MU,ug=p=>(u.gambar||[]).filter(g=>g.at===p);let h='<div class="top"><h2>📖 Materi Umum Neurologi</h2><a class="btn dl" href="javascript:void(0)" onclick="pdf()">⬇️ Download PDF</a></div><div class="phead">OSCE Kompre Neurologi • Materi Umum</div>';
 h+='<div class="kilat"><small>⚡ URUTAN WAJIB</small>'+u.urutan+'</div>';
 h+=mtbl({judul:'⏱️ Alur 12 menit',h:['Menit','Kegiatan'],rows:u.alur});
 h+='<div class="mgrid"><div class="mcard c-key"><h3>🧠 Kesadaran & saraf kranial</h3>'+tbl(['Komponen','Isi'],u.ldr)+'</div><div class="mcard c-crit"><h3>💪 Motorik, refleks, koordinasi</h3>'+tbl(['Pemeriksaan','Isi'],u.efl)+'</div></div>';
 h+=figs(ug('pf'));
 h+='<div class="kilat" style="background:linear-gradient(135deg,#4a6b2a,#2b6cb0)"><small>🗣️ CONTOH KALIMAT</small>'+u.contoh+'</div>';
 h+=mtbl({judul:'🧪 Penunjang sederhana',h:['Pemeriksaan','Cara / hasil'],rows:u.penunjang});h+=figs(ug('pen'));
 h+='<div class="mcard c-tx"><h3>✍️ Tips resep neuro</h3><ul>'+u.resep.map(i=>'<li>'+md(i)+'</li>').join('')+'</ul></div>';
 h+=mtbl({judul:'✏️ Koreksi catatan les [UPDATE GUIDELINE]',h:['Catatan les','Yang benar'],rows:u.koreksi});
 h+='<div class="mcard c-ff"><h3>⛔ Fatal flaws umum</h3><ol style="margin:0;padding-left:20px">'+u.flaws.map(i=>'<li>'+md(i)+'</li>').join('')+'</ol></div>';
 return h}
function render(){const d=S.diseases.find(x=>x.id==cur);let c='';
 if(cur=='materi'){c=' › Materi Umum';document.getElementById('main').innerHTML=materiUmum()}
 else if(cur=='pembuka'){c=' › Pembuka & Template';document.getElementById('main').innerHTML=home()}
 else if(d&&tab){c=' › <a href="#'+d.id+'">'+esc(name(d))+'</a> › '+tab;document.getElementById('main').innerHTML=disease(d)}
 else if(d){c=' › '+esc(name(d));document.getElementById('main').innerHTML=diseaseHome(d)}
 else document.getElementById('main').innerHTML=homeView();
 document.getElementById('crumb').innerHTML=c}
window.addEventListener('beforeprint',()=>document.querySelectorAll('details').forEach(x=>x.open=true));
route();
</script></body></html>
